<title>Negocios Cuánticos</title>
<script>
/* LA PUERTA DE ENTRADA.
   Acá vivía una app que servía a Feroz y a Smart con ?empresa=. Se cerró:
     · Smart se mudó a smart/ y es la única versión que hay.
     · Feroz quedó reemplazado por CED y su base está vacía
       (0 cotizaciones, 0 ventas). Cerrado el 7 de septiembre de 2026.
   Lo que había acá se puede recuperar del historial de Git si algún día hace
   falta: nada se borró de verdad.

   Los enlaces viejos siguen sirviendo: entran acá y salen donde deben. */
(function(){
  var emp=(new URLSearchParams(location.search).get('empresa')||'').toLowerCase();
  var destino = emp==='smart' ? 'smart/' : 'centro.html';
  location.replace(destino + location.hash);
})();
</script>
