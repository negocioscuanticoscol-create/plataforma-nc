<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Smart · Recompra</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#5d6b78;--bd:#dde3e9;--az:#1f6fb2;--ver:#1a8a4a;--rj:#c0392b;--am:#b7791f;--mes:#7b2fbf}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--tx:#e8eef3;--mu:#93a1ad;--bd:#27333e;--az:#4a9be0;--ver:#3ec17a;--rj:#e8685a;--am:#e0a84a;--mes:#c79cff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:40px}
header{background:var(--az);color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}header small{opacity:.9}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
#login{max-width:340px;margin:20vh auto;padding:0 16px;text-align:center}
input,select{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
button,a.b{font:inherit;border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:var(--az);color:#fff;font-weight:600;text-decoration:none;display:inline-block}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.tab{background:var(--card);color:var(--tx);border:2px solid var(--bd);text-align:left}
.tab b{display:block;font-size:22px}.tab span{font-size:12px;color:var(--mu);font-weight:400}.tab.on{border-color:var(--az)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card h3{margin:0;font-size:15px}.mu{color:var(--mu);font-size:13px}.card.mes{border:2px solid var(--mes)}.card.mes h3{color:var(--mes)}.pill.m{background:var(--mes);color:#fff;border-color:var(--mes)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin:2px 4px 2px 0}
.y{background:var(--ver);color:#fff;border-color:var(--ver)}.o{background:var(--am);color:#fff;border-color:var(--am)}.r{background:var(--rj);color:#fff;border-color:var(--rj)}
.msg{background:var(--bg);border-radius:8px;padding:8px;margin:8px 0;font-size:13px}
.acc{display:flex;gap:6px;flex-wrap:wrap}.acc .g{background:var(--ver)}.acc .s{background:var(--mu)}
.row{display:flex;gap:8px;margin:10px 0}#err{color:var(--rj);min-height:22px}
</style></head><body>
<div id="login"><h1>Smart · Recompra</h1><p class="mu">Escribe tu celular</p>
<input id="cl" type="tel" inputmode="numeric" placeholder="Celular" autocomplete="off"><p id="err"></p><button id="ent" style="width:100%">Entrar</button></div>
<div id="app" hidden>
<header><div class="wrap"><h1>Smart · clientes y recompra</h1><small id="sub"></small></div></header>
<div class="wrap">
<div class="tabs" id="modo" style="grid-template-columns:repeat(2,1fr)"></div>
<div class="tabs" id="tabs"></div>
<div class="row"><input id="q" type="search" placeholder="Buscar empresa o celular…"><select id="env" style="max-width:230px"><option value="">Todos (enviados o no)</option><option value="ok">Contactables: sin envío o más de 15 días</option><option value="rec">Enviados hace 15 días o menos</option></select><select id="ord" style="max-width:200px"><option value="mayor">Mayor a menor compra</option><option value="dias">Más días sin comprar</option><option value="proxima">Próxima compra</option></select></div>
<div class="grid" id="lista"></div>
</div></div>
<script>
const URL_='https://fnayedgvamxktxfvywwl.supabase.co',KEY='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv',VER='20261009-6';
let D=[],clave='',cajon='ya',modo='ped',cajonM='todas';
const FR={todas:['Todas las muestras',[0,1e9]],f0:['Menos de 10 días',[0,10]],f1:['10 a 20 días',[10,20]],f2:['20 a 30 días',[20,30]],f3:['30 a 45 días',[30,45]],f4:['Más de 45 días',[45,1e9]],perd:['Perdidos',null]};
const franjaDe=d=>d<10?'Menos de 10 días':d<20?'10 a 20 días':d<30?'20 a 30 días':d<45?'30 a 45 días':'Más de 45 días';
const MESACT=new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'}).slice(0,7);
const esteMes=p=>p.tipo!=='muestra'&&(p.ultima||'').startsWith(MESACT);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>'$'+Math.round(n).toLocaleString('es-CO');
async function rpc(fn,args){const r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null}
const CAJ={ya:['TOCA YA','Deberían comprar YA'],q15:['Toca en 15 días','Compran en 15 días'],aun:['Aún no toca','Aún no les toca'],riesgo:['Tocó hace rato (en riesgo)','En riesgo (no vuelven)'],rep:[null,'Ya repusieron'],todos:[null,'Todos'],perd:[null,'Perdidos']};
const contactable=p=>!p.veces_enviado||p.dias_enviado>15;
const enM=(p,k)=>p.tipo==='muestra'&&(k==='perd'?p.perdido:!p.perdido&&p.dias_muestra>=FR[k][1][0]&&p.dias_muestra<FR[k][1][1]);
const en=(p,k)=>p.tipo==='muestra'?false:k==='perd'?p.perdido:p.perdido?false:k==='rep'?p.compras>=2:k==='todos'?true:p.estado===CAJ[k][0];
async function entrar(c){const d=c.replace(/\D/g,'');$('err').textContent='';
  try{D=await rpc('sr_lista',{p_clave:d});clave=d;try{localStorage.sr_clave=d}catch(e){}$('login').hidden=true;$('app').hidden=false;pintar()}
  catch(e){try{localStorage.removeItem('sr_clave')}catch(_){}$('err').textContent='Ese celular no tiene acceso'}}
function pintar(){
  const nP=D.filter(p=>p.tipo!=='muestra').length,nM=D.filter(p=>p.tipo==='muestra').length;
  $('sub').textContent=`${nP} con pedido · ${nM} solo muestras · ${D.filter(p=>p.perdido).length} perdidos`;
  $('modo').innerHTML=`<button class="tab ${modo==='ped'?'on':''}" data-modo="ped"><b>${nP}</b><span>Pedidos</span></button><button class="tab ${modo==='mue'?'on':''}" data-modo="mue"><b>${nM}</b><span>Muestras</span></button>`;
  $('tabs').innerHTML=modo==='ped'?Object.keys(CAJ).map(k=>`<button class="tab ${k===cajon?'on':''}" data-k="${k}"><b>${D.filter(p=>en(p,k)).length}</b><span>${CAJ[k][1]}</span></button>`).join(''):Object.keys(FR).map(k=>`<button class="tab ${k===cajonM?'on':''}" data-k="${k}"><b>${D.filter(p=>enM(p,k)).length}</b><span>${FR[k][0]}</span></button>`).join('');
  const q=$('q').value.toLowerCase().trim(),o=$('ord').value;
  const ev=$('env').value;let L=D.filter(p=>(modo==='ped'?en(p,cajon):enM(p,cajonM))&&(!q||(p.empresa+' '+(p.celular||'')).toLowerCase().includes(q))&&(!ev||(ev==='ok')===contactable(p)));
  L.sort((a,b)=>modo==='mue'?b.dias_muestra-a.dias_muestra:o==='dias'?b.dias_sin-a.dias_sin:o==='proxima'?a.proxima.localeCompare(b.proxima):b.total-a.total);
  $('lista').innerHTML=L.map(card).join('')||'<p class="mu">Nada aquí</p>'}
function card(p){const cel=(p.celular||'').replace(/\D/g,''),cls=p.estado==='TOCA YA'?'y':p.estado.startsWith('Tocó')?'r':p.estado.startsWith('Toca en')?'o':'';
  return `<div class="card${esteMes(p)?' mes':''}" data-r="${p.rank}"><h3>#${p.rank} ${esc(p.empresa)}</h3>
  <div class="mu">${p.tipo==='muestra'?`Muestra enviada ${esc(p.fecha_muestra)} (hace ${p.dias_muestra} días) · kit ${m(p.total)}`:`${m(p.total)} · ${p.compras} compra${p.compras>1?'s':''} · última ${esc(p.ultima)} (${p.dias_sin} días) · ciclo ${p.ciclo} d`}</div>
  <div>${esteMes(p)?'<span class="pill m">Compró este mes</span>':''}${p.tipo==='muestra'?`<span class="pill ${p.dias_muestra>=45?'r':p.dias_muestra>=30?'o':p.dias_muestra>=10?'y':''}">${franjaDe(p.dias_muestra)}</span>`:`<span class="pill ${cls}">${esc(p.estado)}</span><span class="pill">próxima ${esc(p.proxima)}</span>`}${p.veces_enviado?`<span class="pill ${contactable(p)?'y':'o'}">Enviado ${esc(p.enviado)} (hace ${p.dias_enviado} d${p.veces_enviado>1?' · '+p.veces_enviado+' veces':''})</span>`:'<span class="pill">Sin enviar</span>'}</div>
  ${p.perdido?`<div class="mu"><span class="pill r">PERDIDO</span>${esc(p.motivo)}</div>`:''}${p.ultimo_pedido?`<div class="mu">${esc(p.ultimo_pedido)}</div>`:''}
  <div class="msg">${esc(p.mensaje)}</div>
  <div class="acc">${cel?`<button class="s" data-c="${cel}">📋 ${esc(cel)}</button><a class="b g" target="_blank" href="https://wa.me/57${cel}?text=${encodeURIComponent(p.mensaje)}">WhatsApp</a>`:'<span class="pill r">SIN CELULAR</span>'}<button class="s" data-m="1">📋 Mensaje</button><button class="g" data-e="1">📤 Enviado</button>${p.veces_enviado?'<button class="s" data-u="1">↩ Deshacer envío</button>':''}<button class="${p.perdido?'g':'r'} pd" data-p="1" style="${p.perdido?'':'background:var(--rj)'}">${p.perdido?'↩ Recuperar':'🚫 Perdido'}</button></div></div>`}
async function marcar(p){let mot='';
  if(!p.perdido){mot=prompt('Marcar como PERDIDO: '+p.empresa+' - Motivo (opcional):','');if(mot===null)return}
  else if(!confirm('¿Recuperar a '+p.empresa+'?'))return;
  const nuevo=!p.perdido;
  try{await rpc('sr_perdido',{p_clave:clave,p_empresa:p.empresa,p_perdido:nuevo,p_motivo:mot});p.perdido=nuevo;p.motivo=mot;pintar()}catch(e){alert('No se guardó, revisa la señal')}}
async function enviar(p,si){
  if(!si&&!confirm('¿Deshacer el último envío a '+p.empresa+'?'))return;
  try{await rpc('sr_enviado',{p_clave:clave,p_empresa:p.empresa,p_enviado:si});D=await rpc('sr_lista',{p_clave:clave});pintar()}catch(e){alert('No se guardó, revisa la señal')}}
async function copiar(t,b){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}const x=b.textContent;b.textContent='✓ Copiado';setTimeout(()=>b.textContent=x,1200)}
$('ent').onclick=()=>entrar($('cl').value);$('cl').onkeydown=e=>{if(e.key==='Enter')entrar($('cl').value)};
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){if(modo==='ped')cajon=b.dataset.k;else cajonM=b.dataset.k;pintar()}};
$('modo').onclick=e=>{const b=e.target.closest('.tab');if(b){modo=b.dataset.modo;pintar()}};
$('q').oninput=$('ord').onchange=$('env').onchange=pintar;
$('lista').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=D.find(x=>x.rank==b.closest('.card').dataset.r);if(b.dataset.c)copiar(b.dataset.c,b);if(b.dataset.m)copiar(p.mensaje,b);if(b.dataset.p)marcar(p);if(b.dataset.e)enviar(p,true);if(b.dataset.u)enviar(p,false)};
try{if(localStorage.sr_clave)entrar(localStorage.sr_clave)}catch(e){}
</script></body></html>
