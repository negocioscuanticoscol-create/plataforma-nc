<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Damián · Analítica de campañas</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#5d6b78;--bd:#dde3e9;--az:#1f2a3a;--ver:#1a8a4a;--rj:#c0392b;--am:#b7791f;--gr:#8a94a0;--vi:#5b3fb8}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--tx:#e8eef3;--mu:#93a1ad;--bd:#27333e;--az:#2a3a52;--ver:#3ec17a;--rj:#e8685a;--am:#e0a84a;--gr:#6f7b87;--vi:#9b85e6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:40px}
header{background:var(--az);color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}header small{opacity:.9}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
#login{max-width:340px;margin:20vh auto;padding:0 16px;text-align:center}
input,select{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;background:var(--az);color:#fff;font-weight:600}
#err{color:var(--rj);min-height:22px}
.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}.row select{max-width:220px}
h2{font-size:17px;margin:22px 0 8px}h2 small{color:var(--mu);font-weight:400;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mu)}.kpi i{font-style:normal;font-size:12px;font-weight:700;margin-left:6px}
.up{color:var(--ver)}.dn{color:var(--rj)}
.plan{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:10px}.plan h3{margin:0 0 6px;font-size:15px}.plan li{margin:4px 0;font-size:14px}
.grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:84px 1fr auto;gap:8px 14px;align-items:start}
.card img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--bg)}
.card h3{margin:0;font-size:16px}.mu{color:var(--mu);font-size:13px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin:3px 4px 0 0;color:var(--tx)}
.v{font-size:12px;font-weight:800;padding:4px 10px;border-radius:8px;color:#fff;display:inline-block;margin-bottom:4px}
.v.up{background:var(--ver)}.v.down{background:var(--rj)}.v.watch{background:var(--am)}.v.keep{background:var(--az)}.v.wait{background:var(--gr)}.v.off{background:var(--gr)}.v.fix{background:var(--vi)}
.why{font-size:13.5px;margin:4px 0}.tags{font-size:12.5px;color:var(--mu)}.tags div{margin:2px 0}
.nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin-top:6px}.nums b{font-size:14px}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:6px}.spark i{display:block;width:9px;background:var(--bd);border-radius:2px 2px 0 0;position:relative}.spark i.r{background:var(--az)}.spark i:hover::after{content:attr(title);position:absolute;bottom:100%;left:0;background:#000;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;z-index:2}
.acc{display:flex;flex-direction:column;gap:6px;min-width:160px}.acc button{width:100%;font-size:12.5px;padding:7px 8px}.acc .s{background:var(--mu)}.acc .g{background:var(--ver)}.acc .r{background:var(--rj)}.acc .a{background:var(--am)}
.dec{font-size:12px;color:var(--ver);font-weight:700}
.card.dim{opacity:.6}
@media(max-width:700px){.card{grid-template-columns:64px 1fr}.card img{width:64px;height:64px}.acc{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.acc button{width:auto;flex:1 1 40%}}
body.emb header{display:none}body.emb #login{margin:30px auto}body.emb{padding-bottom:10px}
#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ver);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9}#aviso.on{opacity:1;transform:translateX(-50%)}
</style></head><body>
<div id="login"><h1>Damián · Analítica de campañas</h1><p class="mu">Escribe la clave</p>
<input id="cl" type="password" placeholder="Clave" autocomplete="off"><p id="err"></p><button id="ent" style="width:100%">Entrar</button></div>
<div id="app" hidden>
<header><div class="wrap"><h1>Damián · ¿cómo va la pauta?</h1><small id="sub"></small></div></header>
<div class="wrap">
<div class="row"><select id="emp"><option value="todas">Todas las empresas</option><option value="gp">Grupo Pérez / Feroz</option><option value="nido">Colchones Nido</option><option value="smart">Smart</option><option value="kruh">Kruh</option></select>
<select id="ver"><option value="act">Solo anuncios activos</option><option value="todos">Activos y recién apagados</option></select>
<select id="ord"><option value="accion">Ordenar: primero lo que hay que tocar</option><option value="gasto">Mayor gasto 7 días</option><option value="costo">Menor costo por resultado</option></select>
<button id="rec" class="s" style="background:var(--mu)">↻ Actualizar</button></div>
<div id="out"></div>
</div></div>
<script>
/* Damián (Cuervo) · 24 nov 2026. Lee pauta_analitica(p_clave, p_empresa): por anuncio trae la serie diaria de Meta ('ayer'), el acumulado
   ('maximum') y lo real de Valentina (contactos, interesados, validados, calientes, ventas de GP). El veredicto se calcula AQUÍ para
   poder afinarlo sin tocar la base. Las decisiones (bajé, subí, apagué…) se guardan con pauta_decision en nc_pauta_anuncio. */
const URL_='https://fnayedgvamxktxfvywwl.supabase.co',KEY='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv',VER='20261124-1';
const NOM={feroz:'Grupo Pérez · Feroz',nido:'Colchones Nido',smart:'Smart Packaging',kruh:'Kruh'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $m=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const num=n=>(+n||0).toLocaleString('es-CO');
let clave='',DATA=null;
async function rpc(fn,args){const r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null}
function aviso(t){let a=$('aviso');if(!a){a=document.createElement('div');a.id='aviso';document.body.appendChild(a)}a.textContent=t;a.className='on';clearTimeout(aviso.t);aviso.t=setTimeout(()=>a.className='',1800)}
async function cargar(){DATA=await rpc('pauta_analitica',{p_clave:clave,p_empresa:$('emp').value});pintar()}
async function entrar(c){c=(c||'').trim();$('err').textContent='';try{clave=c;await cargar();try{localStorage.da_clave=c}catch(e){}$('login').hidden=true;$('app').hidden=false}catch(e){clave='';try{localStorage.removeItem('da_clave')}catch(_){}$('err').textContent='Clave incorrecta'}}

/* ---- métricas por ventana de días (calendario Bogotá) ---- */
function ventana(dias,hoy,desde,hasta){ // días entre hoy-desde y hoy-hasta (inclusive), p.ej. (7,1) = últimos 7 días completos
  const h=new Date(hoy+'T12:00:00');const a=new Date(h);a.setDate(h.getDate()-desde);const b=new Date(h);b.setDate(h.getDate()-hasta);
  const ai=a.toISOString().slice(0,10),bi=b.toISOString().slice(0,10);
  const L=(dias||[]).filter(d=>d.f>=ai&&d.f<=bi);
  const s=k=>L.reduce((t,d)=>t+(+d[k]||0),0);
  const o={n:L.length,gasto:s('g'),impr:s('i'),alc:s('a'),clics:s('c'),res:s('r')};
  o.costo=o.res?o.gasto/o.res:null;o.ctr=o.impr?o.clics/o.impr*100:null;o.cpm=o.impr?o.gasto/o.impr*1000:null;
  return o}
function veredicto(ad,obj,hoy){
  const act=ad.estado==='ACTIVE',d7=ventana(ad.dias,hoy,7,1),p7=ventana(ad.dias,hoy,14,8),v=ad.vida||{},e=ad.embudo||{};
  const fr=+(ad.dias&&ad.dias.length?ad.dias[ad.dias.length-1].fr:v.frecuencia)||0;
  const tags=[];let k,t,why;
  const base={d7,p7,fr,tags,ctr7:d7.ctr};
  if(!act){return Object.assign(base,{k:'off',t:'APAGADO',why:'No está entregando. Se muestra por si lo quieres volver a prender.',peso:5})}
  if(d7.n<3||d7.gasto<15000){return Object.assign(base,{k:'wait',t:'ESPERAR',why:`Lleva ${d7.n} día${d7.n===1?'':'s'} con datos y ${$m(d7.gasto)} en la semana: todavía no hay base para juzgarlo. Se revisa cuando pase de 3 días y $15.000.`,peso:4})}
  if(d7.res===0){
    if(d7.gasto>=3*(obj||5000)){k='down';t='BAJAR';why=`${$m(d7.gasto)} en 7 días y cero resultados. Bájale a la mitad o apágalo y pon esa plata en uno que sí responda.`}
    else{k='wait';t='ESPERAR';why=`${$m(d7.gasto)} en 7 días y todavía sin resultados; es poca plata para condenarlo.`}
  }else if(obj){
    const r=d7.costo/obj;base.ratio=r;
    if(r>=2){k='down';t='BAJAR';why=`Cada resultado cuesta ${$m(d7.costo)}, ${r.toFixed(1)} veces la meta de ${$m(obj)}. Bájale el presupuesto a la mitad; si en 3 días no mejora, apágalo.`}
    else if(r>=1.3){k='watch';t='VIGILAR';why=`Costo ${$m(d7.costo)} contra una meta de ${$m(obj)}: caro pero no para apagar. Déjalo igual y revísalo en 3 días.`}
    else if(r<=0.7&&d7.res>=5){k='up';t='SUBIR';why=`Costo ${$m(d7.costo)}, muy por debajo de la meta de ${$m(obj)}, con ${d7.res} resultados en la semana. Súbele 20% el presupuesto diario (no más: si lo duplicas Meta reinicia el aprendizaje).`}
    else{k='keep';t='MANTENER';why=`Costo ${$m(d7.costo)}, dentro de la meta de ${$m(obj)}. Está haciendo su trabajo.`}
  }else{k='keep';t='SIN META';why=`${d7.res} resultados a ${$m(d7.costo)}. Este negocio no tiene costo objetivo cargado; cárgalo para que Damián pueda juzgar.`}
  /* modificadores */
  if(fr>=2.5){tags.push(`🔁 Frecuencia ${fr.toFixed(1)}: la misma gente ya lo vio varias veces. Toca cambiar el video o abrir el público.`);if(k==='up'){k='watch';t='VIGILAR';why+=' Ojo: no le subas sin cambiar el creativo, está quemado.'}}
  if(d7.ctr!=null&&d7.ctr<0.6)tags.push(`👆 CTR ${d7.ctr.toFixed(2)}%: el video no detiene el dedo. Prueba otro gancho en los primeros 2 segundos.`);
  if(p7.costo&&d7.costo){const dif=(d7.costo-p7.costo)/p7.costo*100;if(Math.abs(dif)>=25)tags.push(`${dif>0?'📈 Se encareció':'📉 Se abarató'} ${Math.abs(dif).toFixed(0)}% frente a la semana anterior (${$m(p7.costo)} → ${$m(d7.costo)}).`)}
  if(e.c_all!=null){
    if(e.c7>0)tags.push(`💬 Valentina recibió ${e.c7} contacto${e.c7===1?'':'s'} real${e.c7===1?'':'es'} esta semana${e.inter7?`, ${e.inter7} interesado${e.inter7===1?'':'s'} (${$m(d7.gasto/e.inter7)} por interesado)`:''}.`);
    else if(d7.res>=3&&new Date(e.desde||hoy)<=new Date(hoy+'T00:00:00'))tags.push(`⚠️ Meta cuenta ${d7.res} conversaciones esta semana pero a Valentina no le llegó ninguna: revisa que el anuncio apunte al número correcto.`);
    if(e.valid)tags.push(`🪪 ${e.valid} validado${e.valid===1?'':'s'} con RUT.`);
    if(+e.ventas>0){tags.push(`💰 Ya produjo ${$m(e.ventas)} en pedidos (${e.compraron} cliente${e.compraron===1?'':'s'}).`);if(k==='down'){k='watch';t='VIGILAR';why+=' Pero ya produjo ventas: antes de apagarlo mira si el costo real por venta compensa.'}}
  }
  const peso={down:0,fix:0,up:1,watch:2,keep:3,wait:4,off:5}[k];
  return Object.assign(base,{k,t,why,peso})}

function spark(ad,hoy){const L=ventana(ad.dias,hoy,14,1);const D=(ad.dias||[]).filter(d=>d.f>=(()=>{const h=new Date(hoy+'T12:00:00');h.setDate(h.getDate()-14);return h.toISOString().slice(0,10)})());
  if(!D.length)return '';const mx=Math.max(...D.map(d=>+d.g||0),1);
  return `<div class="spark">${D.map(d=>`<i class="${+d.r>0?'r':''}" style="height:${Math.max(3,(+d.g||0)/mx*34)}px" title="${d.f}: ${$m(d.g)} · ${d.r||0} res."></i>`).join('')}</div>`}

function pintar(){
  if(!DATA)return;const hoy=DATA.hoy,ver=$('ver').value,ord=$('ord').value;let html='';
  const todos=[];
  for(const n of DATA.negocios){
    const ads=(n.anuncios||[]).map(a=>Object.assign({},a,{v:veredicto(a,n.objetivo,hoy),neg:n.negocio})).filter(a=>ver==='todos'||a.estado==='ACTIVE');
    if(!ads.length&&DATA.negocios.length>1)continue;
    todos.push(...ads);
    const s7=ads.reduce((o,a)=>{o.g+=a.v.d7.gasto;o.r+=a.v.d7.res;o.c+=(a.embudo&&a.embudo.c7)||0;o.i+=(a.embudo&&a.embudo.inter7)||0;o.vt+=+(a.embudo&&a.embudo.ventas)||0;return o},{g:0,r:0,c:0,i:0,vt:0});
    const p7=ads.reduce((o,a)=>{o.g+=a.v.p7.gasto;o.r+=a.v.p7.res;return o},{g:0,r:0});
    const c7=s7.r?s7.g/s7.r:null,cp7=p7.r?p7.g/p7.r:null;
    const dif=(a,b)=>(a!=null&&b)?`<i class="${a<=b?'up':'dn'}">${a<=b?'▼':'▲'} ${Math.abs((a-b)/b*100).toFixed(0)}%</i>`:'';
    const bajar=ads.filter(a=>a.v.k==='down'),subir=ads.filter(a=>a.v.k==='up'),vig=ads.filter(a=>a.v.k==='watch'),esp=ads.filter(a=>a.v.k==='wait');
    const libera=bajar.reduce((t,a)=>t+a.v.d7.gasto/7/2,0);
    html+=`<h2>${esc(NOM[n.negocio]||n.negocio)} <small>· meta ${n.objetivo?$m(n.objetivo)+' por resultado':'sin meta'} · ${ads.length} anuncio${ads.length===1?'':'s'}</small></h2>
    <div class="kpis">
      <div class="kpi"><b>${$m(s7.g)}${dif(s7.g,p7.g).replace('up','').replace('dn','')}</b><span>gastado últimos 7 días (antes ${$m(p7.g)})</span></div>
      <div class="kpi"><b>${num(s7.r)}</b><span>resultados Meta 7 días (antes ${num(p7.r)})</span></div>
      <div class="kpi"><b>${c7?$m(c7):'—'}${dif(c7,cp7)}</b><span>costo por resultado (antes ${cp7?$m(cp7):'—'})</span></div>
      <div class="kpi"><b>${num(s7.c)}</b><span>contactos reales en Valentina 7 d</span></div>
      <div class="kpi"><b>${num(s7.i)}</b><span>interesados reales 7 d${s7.i?' · '+$m(s7.g/s7.i)+' c/u':''}</span></div>
      ${n.negocio==='feroz'?`<div class="kpi"><b>${$m(s7.vt)}</b><span>ventas atribuidas a pauta (CED)</span></div>`:''}
    </div>
    <div class="plan"><h3>Qué hacer hoy</h3><ul style="margin:0;padding-left:18px">
      ${bajar.length?bajar.map(a=>`<li><b style="color:var(--rj)">BAJAR</b> ${esc(nombreDe(a))}: ${esc(a.v.why)}</li>`).join(''):''}
      ${subir.length?subir.map(a=>`<li><b style="color:var(--ver)">SUBIR</b> ${esc(nombreDe(a))}: ${esc(a.v.why)}</li>`).join(''):''}
      ${vig.length?`<li><b style="color:var(--am)">VIGILAR</b> ${vig.map(a=>esc(nombreDe(a))).join(', ')}: caros pero no para apagar; revisar en 3 días.</li>`:''}
      ${esp.length?`<li><b style="color:var(--gr)">ESPERAR</b> ${esp.map(a=>esc(nombreDe(a))).join(', ')}: todavía aprendiendo.</li>`:''}
      ${!bajar.length&&!subir.length&&!vig.length?'<li>Nada urgente: todo dentro de la meta.</li>':''}
      ${libera>0?`<li class="mu">Si bajas a la mitad los marcados, liberas cerca de ${$m(libera)} diarios para los que sí funcionan.</li>`:''}
    </ul></div>`;
    ads.sort((a,b)=>ord==='gasto'?b.v.d7.gasto-a.v.d7.gasto:ord==='costo'?((a.v.d7.costo??9e9)-(b.v.d7.costo??9e9)):(a.v.peso-b.v.peso)||(b.v.d7.gasto-a.v.d7.gasto));
    html+=`<div class="grid">${ads.map(a=>card(a,n,hoy)).join('')}</div>`;
  }
  $('sub').textContent=`Datos de Meta hasta ${DATA.hoy} (lectura diaria de las 6 am) · Valentina en vivo · v${VER}`;
  $('out').innerHTML=html||'<p class="mu">No hay anuncios para mostrar.</p>';
}
function nombreDe(a){const n=a.nombre||'';return /nuevo anuncio/i.test(n)?(a.conjunto||a.campana||n):n}
function card(a,n,hoy){const v=a.v,d7=v.d7,vida=a.vida||{},e=a.embudo||{};
  const fecha=s=>s?new Date(s).toLocaleDateString('es-CO',{day:'numeric',month:'short'}):'';
  return `<div class="card${v.k==='off'?' dim':''}" data-id="${esc(a.id)}">
    ${a.miniatura?`<img src="${esc(a.miniatura)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<div></div>'}
    <div>
      <span class="v ${v.k}">${v.t}</span> <span class="mu">${esc(a.estado)}${a.decision?` · <span class="dec">tú: ${esc(a.decision)} el ${fecha(a.decidido_en)}</span>`:''}</span>
      <h3>${esc(nombreDe(a))}</h3>
      <div class="mu">${esc(a.campana||'')}${a.conjunto&&a.conjunto!==a.campana?' › '+esc(a.conjunto):''}${a.creado?' · desde '+fecha(a.creado):''}</div>
      <div class="why">${esc(v.why)}</div>
      ${v.tags.length?`<div class="tags">${v.tags.map(t=>`<div>${esc(t)}</div>`).join('')}</div>`:''}
      <div class="nums"><span>7 días: <b>${$m(d7.gasto)}</b></span><span>resultados <b>${num(d7.res)}</b></span><span>costo <b>${d7.costo?$m(d7.costo):'—'}</b></span><span>CTR <b>${d7.ctr!=null?d7.ctr.toFixed(2)+'%':'—'}</b></span><span>CPM <b>${d7.cpm?$m(d7.cpm):'—'}</b></span><span>frecuencia <b>${v.fr?v.fr.toFixed(1):'—'}</b></span>
      <span class="mu">· de siempre: ${$m(vida.gasto)} · ${num(vida.resultados)} res. · ${vida.costo_resultado?$m(vida.costo_resultado):'—'} c/u${vida.video_completo?' · '+num(vida.video_completo)+' vieron el video completo':''}</span></div>
      ${spark(a,hoy)}
    </div>
    <div class="acc"><span class="mu" style="font-size:11px;text-align:center">¿Qué hiciste en Meta?</span>
      <button class="r" data-d="bajé el presupuesto">↓ Bajé</button><button class="g" data-d="subí el presupuesto">↑ Subí</button><button class="s" data-d="lo apagué">⏻ Apagué</button><button class="a" data-d="cambié el creativo">🎬 Cambié video</button><button class="s" data-d="">Sin cambios</button></div>
  </div>`}
async function decidir(id,d){try{await rpc('pauta_decision',{p_clave:clave,p_ad_id:id,p_decision:d});aviso(d?'✓ Anotado: '+d:'✓ Borrado');await cargar()}catch(e){alert('No se guardó, revisa la señal')}}
$('out').onclick=e=>{const b=e.target.closest('button[data-d]');if(!b)return;decidir(b.closest('.card').dataset.id,b.dataset.d)};
$('ent').onclick=()=>entrar($('cl').value);$('cl').onkeydown=e=>{if(e.key==='Enter')entrar($('cl').value)};
$('emp').onchange=()=>cargar().catch(()=>aviso('No se pudo cargar'));$('ver').onchange=$('ord').onchange=pintar;$('rec').onclick=()=>cargar().then(()=>aviso('Actualizado')).catch(()=>aviso('No se pudo cargar'));
const Q=new URLSearchParams(location.search);if(Q.get('emp'))$('emp').value=Q.get('emp');
try{if(localStorage.da_clave)entrar(localStorage.da_clave)}catch(e){}
/* dentro de Creador (Cuervo › Campañas): sin franja, clave por mensaje y alto avisado al marco */
