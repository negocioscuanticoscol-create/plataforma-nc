<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sole Paris</title>
<style>
  :root{
    --bg:#f7f3ef; --surface:#ffffff; --surface2:#f2ebe4; --line:#e7ded4;
    --ink:#221d19; --muted:#8a8075; --faint:#a99f93;
    --accent:#a9836a; --accent2:#8f6a53; --accent-soft:#f0e7de;
    --ok:#5a8a5e; --warn:#b1802f; --bad:#b3564b;
    --serif:Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px}
  input,select,textarea,button{font-family:inherit;font-size:16px}
  .hide{display:none!important}

  /* LOGIN */
  #login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;background:linear-gradient(170deg,#f7f3ef,#efe6dc)}
  #login .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 28px;width:100%;max-width:380px;text-align:center;box-shadow:0 18px 44px rgba(90,70,55,.12)}
  .brand{display:inline-flex;flex-direction:column;align-items:center;gap:8px}
  .brand img{height:46px;object-fit:contain}
  .brand .word{font-family:var(--serif);font-size:24px;letter-spacing:3px;font-weight:400;color:var(--ink)}
  .brand .word b{font-weight:600}
  .brand .tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--faint)}
  #login .sub{color:var(--muted);font-size:13px;margin:16px 0 18px}
  #login input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:11px;text-align:center;letter-spacing:1px}
  #login input:focus{outline:none;border-color:var(--accent)}
  .btn.gh2{background:transparent;border:1px solid var(--line,#ddd);color:var(--faint,#666)}
  .btn{width:100%;padding:15px;border:none;border-radius:11px;font-weight:600;cursor:pointer;margin-top:14px;letter-spacing:.5px}
  .btn-main{background:var(--ink);color:#fff}
  .btn-main:active{background:#000}
  #login .err{margin-top:12px;font-size:13px;color:var(--bad);display:none}

  /* SHELL */
  #app{min-height:100vh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  .topbar .brand{flex-direction:row;gap:9px}
  .topbar .brand img{height:26px}
  .topbar .brand .word{font-size:16px;letter-spacing:2px}
  .topbar .rol{display:inline-block;background:var(--accent-soft);color:var(--accent2);font-size:10px;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .logout{background:none;border:none;color:var(--faint);font-size:12px;cursor:pointer;margin-left:10px}
  #main{flex:1;padding:16px 16px 150px}
  h1{font-family:var(--serif);font-size:23px;font-weight:400;margin-bottom:4px;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}

  #nav{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;z-index:20}
  #nav button{flex:1 1 20%;min-width:64px;background:none;border:none;border-top:1px solid #f5efe8;padding:8px 2px 9px;font-size:10px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  #nav button .ic{font-size:19px}
  #nav button.active{color:var(--accent2);font-weight:700}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  .field{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .field:focus{outline:none;border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .btn-sm{padding:9px 14px;border-radius:9px;border:none;font-weight:600;font-size:13px;cursor:pointer}
  .btn-ink{background:var(--ink);color:#fff}
  .btn-line{background:#fff;color:var(--ink);border:1px solid var(--line)}

  .cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  .cat{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
  .cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .prod{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .prod .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .prod .nm{font-weight:600;font-size:14.5px;line-height:1.3}
  .prod .ct{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  .prod .pv{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--accent2);white-space:nowrap}
  .prod .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--muted)}
  .pchip{background:var(--surface2);border-radius:7px;padding:3px 9px}
  .pchip.cost{background:#f6ede4;color:var(--warn)}
  .pchip.stock{background:#eef3ee;color:var(--ok)}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .kpi b{display:block;font-family:var(--serif);font-size:28px;color:var(--ink)}
  .kpi span{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 12px;font-size:14px}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:99}

  /* starting point */
  .hero{background:linear-gradient(160deg,#2a231d,#4a3b30);color:#fff;border-radius:16px;padding:26px 22px;margin-bottom:14px;text-align:center}
  .hero img{height:40px;margin-bottom:10px}
  .hero .word{font-family:var(--serif);font-size:26px;letter-spacing:4px;display:block;margin-bottom:4px}
  .hero .tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#d8c4b2}
  .hero p{color:#e6dccf;font-size:14px;margin-top:12px;line-height:1.6}
  .step{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px}
  .step .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent2);font-family:var(--serif);font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
  .step .t{font-weight:600;font-size:14px} .step .d{font-size:12.5px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="brand">
      <img src="https://soleparis.com/cdn/shop/files/1_2_b2654e9a-7df3-46ba-88a2-3df29f21dec3.png?width=400" alt="Sole Paris" onerror="this.style.display='none'">
      <span class="word">SOLE<b> PARIS</b></span>
      <span class="tag">Dermocosmética</span>
    </div>
    <div class="sub">Plataforma de gestión · ingresa tu clave</div>
    <input id="lg" type="password" placeholder="Clave" onkeydown="if(event.key==='Enter')App.login()">
    <button class="btn btn-main" onclick="App.login()">Entrar</button>
    <div class="err" id="lgerr">Clave incorrecta</div>
    <div style="margin-top:16px"><a href="javascript:void(0)" onclick="App.entrarPublico()" style="font-size:12.5px;color:var(--muted)">Ver pendientes, sin clave →</a></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div class="topbar">
    <div class="brand"><img src="https://soleparis.com/cdn/shop/files/1_2_b2654e9a-7df3-46ba-88a2-3df29f21dec3.png?width=300" alt="" onerror="this.style.display='none'"><span class="word">SOLE PARIS</span></div>
    <div style="display:flex;align-items:center">
      <span class="rol" id="rol"></span>
      <button class="logout" onclick="App.logout()">Salir</button>
    </div>
  </div>
  <div id="main"></div>
  <div id="nav"></div>
</div>

<script>
const App = {
  // NC (admin/gerencia) ve todo + 5 claves de cliente (solo Starting Point).
  /* 'ncdemo2026' es la clave de PRESENTACIÓN: la misma en todas las apps de NC,
     para mostrarle la plataforma a un cliente sin repartir las claves reales. */
  /* 30-sep-2026, Jose: roles reservados para el equipo — gerente, doctora,
     mercadeo, ventas, administracion — TODAVÍA sin clave asignada, por eso
     no están en PASS: hoy no tienen forma de entrar. Cuando se definan,
     se agregan aquí como 'suclave':'nombre_rol' y se les da acceso en
     pintarNav()/go() como se hizo con 'publico'. */
  PASS:{ 'soleadmin2026':'admin', 'solegerencia2026':'gerencia', 'ncdemo2026':'gerencia', 'soleparis1':'cliente','soleparis2':'cliente','soleparis3':'cliente','soleparis4':'cliente','soleparis5':'cliente' },
  CATS:['Facial','Capilar','Corporal','Ojos','Labios','Kit','Tarjeta'],
  rol:'', view:'inicio', _cat:'', _editId:null,
  _diag:[], _dResp:{a:{},b:{},tools:{}},
  D_TOOLS:["ChatGPT","Gemini","Copilot","Claude","Perplexity","DeepSeek","Ninguna"],
  D_A:[
   {c:"Archivos con data",t:"¿Maneja archivos con información de su trabajo? Excel, informes, bases de datos.",
    o:[{t:"No, esa información la tiene otra persona",v:0,corta:true},{t:"Sí, pero yo solo los lleno; no los analizo",v:1},{t:"Sí, y los reviso yo mismo",v:2},{t:"Sí, y de ahí salen decisiones de mi área",v:3}]},
   {c:"Cómo los analiza",t:"¿Cómo los analiza?",
    o:[{t:"No los analizo, solo los guardo o envío",v:0},{t:"Los leo a ojo y saco conclusiones",v:1},{t:"Con fórmulas, filtros o tablas dinámicas",v:2},{t:"Con un tablero que cruza varias fuentes",v:3}]},
   {c:"Con quién los discute",t:"¿Con quién discute esos resultados?",
    o:[{t:"Con nadie, quedan en mi computador",v:0},{t:"Con mi jefe, cuando me los pide",v:1},{t:"En reunión de área, periódica",v:2},{t:"Con varias áreas, la decisión nos toca a todos",v:3}]},
   {c:"Cada cuánto deciden",t:"¿Cada cuánto se decide con base en esos resultados?",
    o:[{t:"Rara vez o nunca",v:0},{t:"Solo cuando hay un problema encima",v:1},{t:"Una vez al mes",v:2},{t:"Cada semana o más seguido",v:3}]}
  ],
  D_B:[
   {c:"Tarea repetitiva",t:"Le piden reducir a la mitad el tiempo de una tarea repetitiva. ¿Por dónde empieza?",
    o:[{t:"Redistribuyendo el trabajo o pidiendo más personal",v:0},{t:"Buscando una herramienta que lo haga más rápido",v:1},{t:"Documentando el proceso para delegarlo o repetirlo",v:2},{t:"Probando con una IA y ajustando cómo se lo pido",v:3}]},
   {c:"Confianza en cifras",t:"Una IA le entrega un informe con cifras de su empresa. ¿Qué hace primero?",
    o:[{t:"Nunca he usado una para eso",v:0},{t:"No lo usaría: se inventan los datos",v:0,f:"esceptico"},{t:"Lo uso, para eso lo pedí",v:1},{t:"Reviso contra la fuente y si cuadra, lo uso",v:2},{t:"Reviso de dónde salió cada dato; si no lo rastreo, no lo uso",v:3}]},
   {c:"Manejo de fallos",t:"Cuando le pide algo a una IA y no sirve, ¿qué pasa?",
    o:[{t:"No uso ninguna",v:0},{t:"Me pasa casi siempre, por eso dejé de intentarlo",v:1,f:"esceptico"},{t:"A veces pasa, y cambio cómo se lo pido",v:2},{t:"Casi no me pasa, le doy contexto y ejemplos desde el inicio",v:3}]},
   {c:"Dónde aportaría",t:"En su trabajo, ¿dónde ayudaría más una herramienta así?",
    o:[{t:"No le veo dónde encajaría",v:0},{t:"Redactando correos y textos",v:1},{t:"Ordenando y resumiendo información regada",v:2},{t:"Analizando lo que tenemos y diciéndonos qué decidir",v:3}]},
   {c:"Experiencia real",t:"¿Cuál frase se parece más a lo que ha hecho con una IA?",
    o:[{t:"Nunca he usado una",v:0},{t:"Le he hecho preguntas y responde",v:1},{t:"Le he dado documentos míos para que trabaje sobre ellos",v:2},{t:"He armado algo que volví a usar varias veces sin rehacerlo",v:3}]},
   {c:"Automatización actual",t:"Hoy, ¿qué tanto de su trabajo pasa sin que usted lo haga a mano?",
    o:[{t:"Nada, todo lo hago yo",v:0},{t:"Tengo plantillas o fórmulas de Excel",v:1},{t:"Hay correos o mensajes automáticos",v:2},{t:"Hay reportes o tareas que se generan solos",v:3}]}
  ],
  D_PERF:[{max:5,n:"Observador",d:"Sin contacto real con estas herramientas."},{max:10,n:"Usuario",d:"Usa IA de vez en cuando, sobre todo textos."},{max:14,n:"Aplicado",d:"Entiende contexto y límites."},{max:18,n:"Avanzado",d:"Piensa en procesos y repetición."}],
  D_MAT:{aa:"El que se la sabe. Tiene datos ordenados y entiende la herramienta. Dele un rol en la implementación.",ab:"El mejor cliente posible. Ya decide con sus datos; solo no sabe qué más se puede. Haga el demo sobre sus propios archivos.",ba:"Conoce la herramienta pero no tiene con qué alimentarla. Véndale el diagnóstico primero, no el motor.",bb:"Punto de partida en cero. Muestre resultado, no proceso: una sola cosa que hoy toma horas y sale en un minuto."},

  /* ---------- datos: Supabase (aislado) con respaldo local ---------- */
  SB:'https://fnayedgvamxktxfvywwl.supabase.co',
  KEY:'sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv',
  _online:false, _onl:{}, _prods:[], _clis:[],
  _H(){ return {apikey:this.KEY,Authorization:'Bearer '+this.KEY,'Content-Type':'application/json'}; },
  _loadLocal(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } },
  _saveLocal(k,a){ try{ localStorage.setItem(k,JSON.stringify(a)); }catch(e){} },
  async _fetchTable(t){
    try{
      
/* El servidor NUNCA devuelve mas de 1000 filas, aunque se le pida mas, y lo hace
   en silencio. Esta funcion pide de a 1000 hasta agotar. */
async function _paginar(url, headers){
  const base = url.replace(/[?&](limit|offset)=\d+/g,'');
  const sep = base.includes('?') ? '&' : '?';
  const out = []; 
  for(let i=0, off=0; i<60; i++, off+=1000){
    let r; try{ r = await fetch(base+sep+'limit=1000&offset='+off, {headers}); }catch(e){ break; }
    if(!r.ok) break;
    let b; try{ b = await r.json(); }catch(e){ break; }
    if(!Array.isArray(b) || !b.length) break;
    out.push(...b);
    if(b.length < 1000) break;
  }
  return out;
}
const d=await _paginar(this.SB+'/rest/v1/'+t+'?select=*&order=creado_en.desc',this._H());
      if(d && d.length!==undefined){ this._onl[t]=true; return await this._reconcile(t, d); }
    }catch(e){}
    this._onl[t]=false;
    return this._loadLocal(t);
  },
  // Sube a la nube lo que haya quedado guardado solo en local (y devuelve todo unido)
  async _reconcile(t, cloudArr){
    const local=this._loadLocal(t);
    const cloudIds=new Set(cloudArr.map(x=>x&&x.id));
    const missing=local.filter(x=>x&&x.id&&!cloudIds.has(x.id));
    for(const row of missing){
      try{ await fetch(this.SB+'/rest/v1/'+t+'?on_conflict=id',{method:'POST',headers:{...this._H(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)}); }catch(e){}
    }
    const merged = missing.length ? [...missing, ...cloudArr] : cloudArr;
    merged.sort((a,b)=>String((b&&b.creado_en)||'').localeCompare(String((a&&a.creado_en)||'')));
    this._saveLocal(t, merged);
    return merged;
  },
  async _sync(){
    this._prods=await this._fetchTable('soleparis_productos');
    this._clis =await this._fetchTable('soleparis_clientes');
    this._diag =await this._fetchTable('soleparis_diagnostico');
    this._online = !!(this._onl.soleparis_productos||this._onl.soleparis_clientes||this._onl.soleparis_diagnostico);
  },
  async _put(tabla,row,cacheArr){
    this._saveLocal(tabla,cacheArr);   // respaldo local SIEMPRE
    if(this._onl[tabla]){ try{ await fetch(this.SB+'/rest/v1/'+tabla+'?on_conflict=id',{method:'POST',headers:{...this._H(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)}); }catch(e){} }
  },
  /* Consultas sueltas: esta app solo tenia lectura por tabla completa. */
  async _get(q){ try{ const r=await fetch(this.SB+'/rest/v1/'+q,{headers:this._H()}); return r.ok?await r.json():[]; }catch(e){ return []; } },
  async _post(t,b){ try{ await fetch(this.SB+'/rest/v1/'+t,{method:'POST',headers:{...this._H(),Prefer:'return=minimal'},body:JSON.stringify(b)}); }catch(e){} },
  async _patch(q,b){ try{ await fetch(this.SB+'/rest/v1/'+q,{method:'PATCH',headers:{...this._H(),Prefer:'return=minimal'},body:JSON.stringify(b)}); }catch(e){} },
  async _delq(q){ try{ await fetch(this.SB+'/rest/v1/'+q,{method:'DELETE',headers:this._H()}); }catch(e){} },
  async _del(tabla,id,cacheArr){
    this._saveLocal(tabla,cacheArr);
    if(this._onl[tabla]){ try{ await fetch(this.SB+'/rest/v1/'+tabla+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:this._H()}); }catch(e){} }
  },

  /* ---------- acceso ---------- */
  /* 30-sep-2026: "público" entra sin clave y solo ve Pendientes — para el
     equipo que todavía no tiene un rol/clave asignado. */
  entrarPublico(){ this.rol='publico'; sessionStorage.setItem('sole_rol','publico'); this._start(); },
  login(){
    const p=(document.getElementById('lg').value||'').trim();
    if(!p){ this.entrarPublico(); return; }   // Entrar sin escribir clave = acceso público (solo Pendientes)
    const rol=this.PASS[p];
    if(!rol){ document.getElementById('lgerr').style.display='block'; return; }
    this.rol=rol; sessionStorage.setItem('sole_rol',rol); this._start();
  },
  logout(){ sessionStorage.removeItem('sole_rol'); this.rol=''; location.reload(); },
  esAdmin(){ return this.rol==='admin'||this.rol==='gerencia'; },
  async _start(){
    document.getElementById('login').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    document.getElementById('rol').textContent = this.rol==='admin'?'Admin':'Invitado';
    document.getElementById('main').innerHTML='<div style="text-align:center;padding:44px;color:#a99f93">Cargando…</div>';
    await this._sync();
    if(!this._prods.length){ await this._seedProductos(); }   // el catálogo aparece lleno solo, sin botón
    this.pintarNav(); this.go('inicio');
  },

  pintarNav(){
    // Cliente: SOLO Starting Point. Público: SOLO Pendientes. Admin (NC): toda la botonería.
    const TABS = this.esAdmin()
      ? [['resultados','📊','Dashboard'],['panel','📈','Panel'],['catalogo','📋','Catálogo'],['clientes','👥','Clientes'],['cotizar','🧮','Cotizar'],['ventas','💹','Ventas'],['crm','📇','CRM'],['capacitacion','🎓','Capacitación'],['casos','⭐','Seguimiento'],['fidelizacion','💛','Fidelización'],['pendientes','📋','Pendientes']]
      : this.rol==='publico' ? [['pendientes','📋','Pendientes'],['casos','⭐','Seguimiento']]   // 27-oct-2026 (José): el seguimiento del reto lo ve todo el equipo
      : [['inicio','✦','Starting Point']];
    document.getElementById('nav').innerHTML = TABS.map(([v,ic,t])=>
      `<button data-v="${v}" onclick="App.go('${v}')"><span class="ic">${ic}</span>${t}</button>`).join('');
  },
  go(view){
    if(this.rol==='publico'){ if(view!=='casos') view='pendientes'; }
    else if(!this.esAdmin() && view!=='inicio') view='inicio';
    else if(this.esAdmin() && view==='inicio') view='resultados';   // admin ya no usa Starting
    this.view=view;
    document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.v===view));
    window.scrollTo(0,0);
    ({inicio:this.vInicio, resultados:this.vResultados, panel:this.vPanel, productos:this.vProductos, catalogo:this.vCatalogo,
      stock:this.vStock, clientes:this.vClientes, cotizar:this.vCotizar, ventas:this.vVentas,
      crm:this.vCrm, capacitacion:this.vCapacitacion, casos:this.vCasos, fidelizacion:this.vFidelizacion,
      pendientes:this.vPendientes}[view]||this.vInicio).call(this);
  },
  set(html){ document.getElementById('main').innerHTML = html; },
  fmt(n){ return '$'+Math.round(+n||0).toLocaleString('es-CO'); },
  esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },
  toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); },
  _load(){ return this._prods||[]; },
  _loadCli(){ return this._clis||[]; },

  _soon(icon,title,desc){
    this.set(`<h1>${title}</h1>
      <div class="card" style="text-align:center;padding:38px 18px">
        <div style="font-size:44px">${icon}</div>
        <div style="font-weight:600;margin-top:10px;font-size:16px">${title} · Sole Paris</div>

  async avaTogg(id,aprobar){

  /* El código es consecutivo y único: es lo que se anexa a la factura para autorizar
     el descuento en caja, y lo que contabilidad revisa después. */
  async emitirCodigo(pid){
    const x=(this._pacs||[]).find(p=>p.id===pid); if(!x) return;
    const pend=(this._ava||[]).filter(a=>a.paciente_id===pid&&a.aprobado!==false&&!a.redencion_id);
    if(!pend.length){ this.toast('No tiene avances pendientes'); return; }
    const prog=(this._progs||[]).find(p=>p.id===x.programa_id)||{};
    const bruto=pend.reduce((s,a)=>s+(+a.valor||0),0);
    const tope=+prog.tope||0;
    const valor=tope?Math.min(bruto,tope):bruto;
    const aviso=(tope&&bruto>tope)?' (acumuló '+this.fmt(bruto)+' pero el tope del plan es '+this.fmt(tope)+')':'';
    if(!confirm('¿Emitir código por '+this.fmt(valor)+' para '+x.nombre+'?'+aviso)) return;
    const num=((this._red||[]).length+1);
    const cod='SP-'+String(new Date().getFullYear()).slice(2)+'-'+String(num).padStart(4,'0');
    const vence=new Date(Date.now()+60*86400000).toISOString().slice(0,10);
    const rid='rd'+Date.now();
    await this._post('soleparis_redencion',{id:rid,codigo:cod,paciente_id:pid,paciente:x.nombre,
      cedula:x.cedula,valor:valor,estado:'emitido',vence:vence,
      detalle:pend.map(a=>({id:a.id,semana:a.semana,tipo:a.tipo,valor:a.valor}))});
    for(const a of pend) await this._patch('soleparis_avance?id=eq.'+a.id,{redencion_id:rid});
    await this._patch('soleparis_paciente?id=eq.'+pid,{saldo:0});
    alert('Código '+cod+' por '+this.fmt(valor)+'. Se anexa a la factura para autorizar el descuento. Vence el '+vence+'.');
    this.vFidelizacion();
  },
  async canAdd(){

    await this._post('soleparis_canal',{id:'cn'+Date.now(),nombre:n,
      orden:((this._cans||[]).length+1),activo:true});
    this.toast('Canal agregado'); this.vFidelizacion();

      {valor_foto:+f||0,valor_video:+v||0,meses:+m||3,semanas:(+m||3)*4,tope:+t||0});

    const f=prompt('¿En qué factura se aplicó el descuento?','');
    if(f===null) return;
    await this._patch('soleparis_redencion?id=eq.'+id,
      {estado:'usado',factura:f.trim()||null,usado_en:new Date().toISOString()});
    this.vFidelizacion();
  },
  async redValidar(id){
    const q=prompt('¿Quién lo validó en contabilidad?','');
    if(q===null||!q.trim()) return;
    await this._patch('soleparis_redencion?id=eq.'+id,{validado:true,validado_por:q.trim()});
    this.toast('Validado'); this.vFidelizacion();
  },

  /* ---------- ESCUELA SOLÉ (Capacitación) ----------
     Sole no tiene problema de producto: tiene problema de transmisión. Quien formula
     sabe por qué el producto es distinto, quien lo vende no sabe explicarlo — y termina
     compitiendo por precio, que es el único argumento que domina. Esto graba una vez
     por referencia y repite esa capacitación mil veces.

     Tres cajones: se arma el programa, se ve como lo ve el estudiante, y se mira quién
     se certificó. La certificación es la que abre el precio mayorista: sin eso, esto
     es una videoteca; con eso, es el embudo de reclutamiento de distribuidores. */
  CAPS:[['L','Laboratorio','Por qué está hecho así','La ingeniera formuladora · 2 a 3 min'],
        ['U','Uso y rutina','Cómo se aplica','Asesora o esteticista · 60 a 90 seg · vertical'],
        ['R','Resultados','Qué esperar y cómo medirlo','El que se reenvía por WhatsApp · 2 min']],
  PERFILES:[['profesional','Profesional de belleza','Vende con las manos, en cabina'],
            ['mostrador','Mostrador','El cliente entra con un problema y quiere solución ya'],
            ['social','Venta social','WhatsApp, catálogo digital, Instagram'],
            ['distribuidor','Distribuidor de zona','Revende y arma su propia red']],
  BLOQUES:['Quién es tu cliente','Cómo diagnosticar','La objeción de precio','Cierre y recompra'],
  _cajon:'estructura', _capProd:'', _capPerfil:'profesional', _estSel:null,

  capCaj(c){ this._cajon=c; this._estSel=null; this.vCapacitacion(); },
  capProd(id){ this._capProd=id; this.vCapacitacion(); },
  capPerfil(p){ this._capPerfil=p; this.vCapacitacion(); },
  estAbrir(id){ this._estSel=(this._estSel===id?null:id); this.vCapacitacion(); },

  async vCapacitacion(){
    const [caps,rutas,ests,vis]=await Promise.all([
      this._get('soleparis_capsula?order=creado_en'),
      this._get('soleparis_ruta?order=perfil,bloque'),
      this._get('soleparis_estudiante?order=creado_en.desc&limit=300'),
      this._get('soleparis_visto?order=visto_en.desc&limit=2000')]);
    this._caps=caps; this._rutas=rutas; this._ests=ests; this._vistos=vis;
    const CAJ=[['estructura','🏗️','Estructurar programa'],
               ['academia','🎬','Academia'],
               ['resultados','🎓','Estudiantes']];
    const conVideo=caps.filter(c=>c.url).length;
    const prods=(this._prods||[]).filter(p=>p.activo!==false);
    this.set(`<h1>Escuela Solé</h1>
      <div class="sub">${conVideo} de ${prods.length*3} cápsulas montadas ·
        ${rutas.filter(r=>r.url).length} de 16 bloques de venta ·
        ${ests.length} estudiante${ests.length===1?'':'s'}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        ${CAJ.map(([k,ic,t])=>`<button class="btn gh2" onclick="App.capCaj('${k}')"
          style="padding:8px 14px;font-size:13px${this._cajon===k?';background:var(--accent2);color:#fff;border-color:var(--accent2)':''}">${ic} ${t}</button>`).join('')}
      </div>
      ${this._cajon==='estructura'?this.capEstructura(prods)
        :this._cajon==='academia'?this.capAcademia(prods)
        :this.capResultados()}`);
  },

  /* El enlace de la escuela es el mismo para prospectos y para el equipo: quien entra
     y se certifica queda registrado igual. Es la puerta del embudo. */
  capLink(){ return location.href.replace(/[^/]*$/,'')+'escuela.html'; },

  capEmbed(url,alto){
    if(!url) return '';
    const u=String(url);
    const yt=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
    if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen
      style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px"></iframe>`;
    const vm=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if(vm) return `<iframe src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen
      style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px"></iframe>`;
    const dr=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
    if(dr) return `<iframe src="https://drive.google.com/file/d/${dr[1]}/preview" allowfullscreen
      style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px"></iframe>`;
    return `<video src="${this.esc(u)}" controls preload="metadata"
      style="width:100%;max-height:${alto||300}px;border-radius:10px;margin-top:8px;background:#000"></video>`;
  },

  /* ---------- cajón 1 · estructurar ---------- */
  capEstructura(prods){
    const sel=this._capProd&&prods.find(p=>p.id===this._capProd);
    const mias=t=>(this._caps||[]).find(c=>c.producto_id===this._capProd&&c.tipo===t);
    const perf=this._capPerfil;
    const rt=b=>(this._rutas||[]).find(r=>r.perfil===perf&&+r.bloque===b);
    return `
      <div class="card" style="background:var(--accent-soft)">
        <div style="font-weight:600;margin-bottom:4px">Cómo se arma</div>
        <div style="font-size:12.5px;color:var(--faint)">Cada referencia lleva <b>tres cápsulas</b>,
          siempre en el mismo orden: primero el porqué, después el cómo, y al final la prueba.
          No son tres versiones del mismo video — son tres lenguajes sobre el mismo producto.</div>
        <div style="font-size:12.5px;color:var(--faint);margin-top:8px">Para el demo, sube el archivo
          y ya. Cuando esté el canal de YouTube, pega el enlace en el mismo campo: el video sale de
          Supabase y el que estaba subido se borra solo.</div>
      </div>

      ${(()=>{ const pre=this.SB+'/storage/v1/object/public/documentos/';
        const enSb=[...(this._caps||[]),...(this._rutas||[])].filter(x=>x.url&&x.url.indexOf(pre)===0).length;
        return enSb?`<div style="font-size:12.5px;color:var(--warn);margin-top:10px">
          ${enSb} video${enSb===1?'':'s'} guardado${enSb===1?'':'s'} en Supabase (el plan da 1 GB).
          Al pegar el enlace de YouTube en su lugar, el archivo se borra.</div>`:''; })()}
      <h1 style="font-size:18px;margin-top:18px">Cápsulas por referencia</h1>
      <label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)">Referencia</label>
      <select class="field" onchange="App.capProd(this.value)">
        <option value="">— elige la referencia —</option>
        ${prods.map(p=>{ const n=(this._caps||[]).filter(c=>c.producto_id===p.id&&c.url).length;
          return `<option value="${p.id}"${p.id===this._capProd?' selected':''}>${this.esc(p.nombre)} · ${n}/3</option>`;}).join('')}
      </select>

      ${sel?this.CAPS.map(([t,nom,que,quien])=>{ const c=mias(t)||{};
        return `<div class="prod" style="margin-top:10px">
        <div class="top"><div><div class="nm">${t} · ${nom}</div>
          <div class="ct">${this.esc(que)}</div></div>
          <div class="pv" style="font-size:13px"><span class="pchip ${c.url?'stock':'cost'}">${c.url?'montada':'falta'}</span></div></div>
        <div style="font-size:12px;color:var(--faint);margin-top:5px">${this.esc(quien)}</div>
        <label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:10px;display:block">Título</label>
        <input id="c_${t}_t" class="field" value="${this.esc(c.titulo||'')}" placeholder="${this.esc(que)}">
        <label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:8px;display:block">Enlace del video</label>
        <input id="c_${t}_u" class="field" value="${this.esc(c.url||'')}" placeholder="YouTube no listado, Vimeo, Drive… o sube el archivo">
        <div style="display:flex;gap:7px;align-items:center;margin-top:7px">
          <input type="file" id="c_${t}_f" accept="video/*" style="flex:1;font-size:12px">
          <input id="c_${t}_d" class="field" style="width:92px" value="${this.esc(c.duracion||'')}" placeholder="2:30">
        </div>
        <div class="sub" id="c_${t}_i" style="margin:6px 0 0;font-size:12px"></div>
        <div style="display:flex;gap:7px;margin-top:9px">
          <button class="btn" style="flex:1" id="c_${t}_b" onclick="App.capGuardar('${t}')">Guardar cápsula ${t}</button>
          ${c.id?`<button class="btn gh2" onclick="App.capBorrar('${c.id}')">✕</button>`:''}
        </div>
        ${this.capEmbed(c.url)}
      </div>`;}).join('')
      :`<div class="empty" style="margin-top:10px">Elige una referencia para montar sus tres cápsulas.</div>`}

      <h1 style="font-size:18px;margin-top:24px">Academia de ventas</h1>
      <div class="sub">La misma crema no se vende igual en una cabina que en el mostrador de
        una droguería. Cada perfil tiene su ruta, con los mismos cuatro bloques.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px">
        ${this.PERFILES.map(([k,n])=>{ const hay=(this._rutas||[]).filter(r=>r.perfil===k&&r.url).length;
          return `<button class="btn gh2" onclick="App.capPerfil('${k}')"
          style="padding:6px 12px;font-size:12.5px${perf===k?';background:var(--accent2);color:#fff;border-color:var(--accent2)':''}">${this.esc(n)} <b>${hay}/4</b></button>`;}).join('')}
      </div>
      <div style="font-size:12.5px;color:var(--faint);margin-bottom:9px">
        ${this.esc((this.PERFILES.find(p=>p[0]===perf)||[])[2]||'')}</div>
      ${this.BLOQUES.map((nom,i)=>{ const b=i+1, r=rt(b)||{};
        return `<div class="prod">
        <div class="top"><div><div class="nm">${b}. ${this.esc(nom)}</div>
          ${b===3?'<div class="ct">el bloque que más pesa</div>':''}</div>
          <div class="pv" style="font-size:13px"><span class="pchip ${r.url?'stock':'cost'}">${r.url?'montado':'falta'}</span></div></div>
        <input id="r_${b}_t" class="field" style="margin-top:9px" value="${this.esc(r.titulo||'')}" placeholder="Título del bloque">
        <input id="r_${b}_u" class="field" style="margin-top:7px" value="${this.esc(r.url||'')}" placeholder="Enlace del video">
        <div style="display:flex;gap:7px;align-items:center;margin-top:7px">
          <input type="file" id="r_${b}_f" accept="video/*" style="flex:1;font-size:12px">
          <input id="r_${b}_d" class="field" style="width:92px" value="${this.esc(r.duracion||'')}" placeholder="4:00">
        </div>
        <div class="sub" id="r_${b}_i" style="margin:6px 0 0;font-size:12px"></div>
        <button class="btn" style="margin-top:9px" id="r_${b}_b" onclick="App.capRutaGuardar(${b})">Guardar bloque ${b}</button>
        ${this.capEmbed(r.url)}
      </div>`;}).join('')}`;
  },

  /* Subir a Supabase o pegar un enlace: las dos sirven. Con 40 referencias por 3 videos
     son 120 archivos, y el plan Free da 1 GB — por eso el enlace externo es el camino
     por defecto y la subida queda para lo corto. */
  async _subirVideo(inputId,infoId,btnId){
    const inp=document.getElementById(inputId), f=inp&&inp.files[0];
    if(!f) return null;
    const info=document.getElementById(infoId), b=document.getElementById(btnId);
    if(f.size>50*1048576){ info.textContent='El archivo pesa más de 50 MB. Súbelo a YouTube no listado o a Drive y pega el enlace.'; return 'ERROR'; }
    if(b){ b.disabled=true; b.textContent='Subiendo…'; }
    const ext=(f.name.split('.').pop()||'mp4').toLowerCase();
    const ruta='soleparis/escuela/'+Date.now()+'.'+ext;
    try{
      const r=await fetch(this.SB+'/storage/v1/object/documentos/'+ruta,
        {method:'POST',headers:{apikey:this.KEY,Authorization:'Bearer '+this.KEY,
         'Content-Type':f.type||'application/octet-stream'},body:f});
      if(r.ok) return this.SB+'/storage/v1/object/public/documentos/'+ruta;
    }catch(e){}
    if(info) info.textContent='No se pudo subir. Intenta con un enlace externo.';
    if(b){ b.disabled=false; b.textContent='Reintentar'; }
    return 'ERROR';
  },

  async _borrarArchivo(url){
    const pre=this.SB+'/storage/v1/object/public/documentos/';
    if(!url||String(url).indexOf(pre)!==0) return;
    try{ await fetch(this.SB+'/storage/v1/object/documentos/'+String(url).slice(pre.length),
      {method:'DELETE',headers:{apikey:this.KEY,Authorization:'Bearer '+this.KEY}}); }catch(e){}
  },
  async capGuardar(tipo){
    if(!this._capProd){ this.toast('Elige la referencia'); return; }
    const g=id=>(document.getElementById(id).value||'').trim();
    const sub=await this._subirVideo('c_'+tipo+'_f','c_'+tipo+'_i','c_'+tipo+'_b');
    if(sub==='ERROR') return;
    const url=sub||g('c_'+tipo+'_u');
    const ex=(this._caps||[]).find(c=>c.producto_id===this._capProd&&c.tipo===tipo);
    const body={producto_id:this._capProd,tipo:tipo,titulo:g('c_'+tipo+'_t')||null,
      url:url||null,duracion:g('c_'+tipo+'_d')||null,activo:true};
    if(ex){ await this._patch('soleparis_capsula?id=eq.'+ex.id,body);
      if(ex.url&&ex.url!==url) await this._borrarArchivo(ex.url); }
    else await this._post('soleparis_capsula',{id:'cx'+Date.now(),...body});
    this.toast('Cápsula '+tipo+' guardada'); this.vCapacitacion();
  },
  async capBorrar(id){ if(!confirm('¿Quitar esta cápsula?'))return;
    const c=(this._caps||[]).find(x=>x.id===id);
    await this._delq('soleparis_capsula?id=eq.'+id);
    if(c) await this._borrarArchivo(c.url);
    this.vCapacitacion(); },

  async capRutaGuardar(b){
    const g=id=>(document.getElementById(id).value||'').trim();
    const sub=await this._subirVideo('r_'+b+'_f','r_'+b+'_i','r_'+b+'_b');
    if(sub==='ERROR') return;
    const url=sub||g('r_'+b+'_u');
    const ex=(this._rutas||[]).find(r=>r.perfil===this._capPerfil&&+r.bloque===b);
    const body={perfil:this._capPerfil,bloque:b,titulo:g('r_'+b+'_t')||this.BLOQUES[b-1],
      url:url||null,duracion:g('r_'+b+'_d')||null,activo:true};
    if(ex){ await this._patch('soleparis_ruta?id=eq.'+ex.id,body);
      if(ex.url&&ex.url!==url) await this._borrarArchivo(ex.url); }
    else await this._post('soleparis_ruta',{id:'rt'+Date.now(),...body});
    this.toast('Bloque '+b+' guardado'); this.vCapacitacion();
  },

  /* ---------- cajón 2 · academia (lo que ve el estudiante) ---------- */
  capAcademia(prods){
    const link=this.capLink();
    const conCaps=prods.filter(p=>(this._caps||[]).some(c=>c.producto_id===p.id&&c.url));
    const sel=this._capProd&&conCaps.find(p=>p.id===this._capProd);
    const perf=this._capPerfil;
    return `
      <div class="card" style="background:var(--accent-soft)">
        <div style="font-weight:600;margin-bottom:4px">El enlace para prospectos</div>
        <div style="font-size:12.5px;color:var(--faint);margin-bottom:9px">Mándaselo a quien
          quiera vender Solé. Entra con su cédula, se forma, se certifica — y solo ahí ve
          el precio mayorista.</div>
        <input class="field" readonly value="${this.esc(link)}" onclick="this.select()">
        <div style="display:flex;gap:7px;margin-top:8px">
          <button class="btn" style="flex:1" onclick="App.copiarLink('${this.esc(link)}')">Copiar enlace</button>
          <button class="btn gh2" onclick="App.abrirLink('${this.esc(link)}')">Abrir</button>
        </div>
      </div>

      <h1 style="font-size:18px;margin-top:18px">Cápsulas de producto</h1>
      ${conCaps.length?`<select class="field" onchange="App.capProd(this.value)">
        <option value="">— elige la referencia —</option>
        ${conCaps.map(p=>`<option value="${p.id}"${p.id===this._capProd?' selected':''}>${this.esc(p.nombre)}</option>`).join('')}
      </select>
      ${sel?this.CAPS.map(([t,nom])=>{ const c=(this._caps||[]).find(x=>x.producto_id===sel.id&&x.tipo===t);
        if(!c||!c.url) return `<div class="prod" style="opacity:.5"><div class="nm">${t} · ${nom}</div>
          <div class="ct">todavía sin grabar</div></div>`;
        return `<div class="prod"><div class="top"><div>
          <div class="nm">${t} · ${this.esc(c.titulo||nom)}</div>
          <div class="ct">${this.esc(c.duracion||'')}</div></div></div>
          ${this.capEmbed(c.url)}</div>`;}).join('')
        :'<div class="sub" style="margin-top:9px">Elige una referencia para ver sus cápsulas.</div>'}`
      :'<div class="empty">Todavía no hay cápsulas montadas. Móntalas en Estructurar programa.</div>'}

      <h1 style="font-size:18px;margin-top:22px">Ruta de ventas</h1>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px">
        ${this.PERFILES.map(([k,n])=>`<button class="btn gh2" onclick="App.capPerfil('${k}')"
          style="padding:6px 12px;font-size:12.5px${perf===k?';background:var(--accent2);color:#fff;border-color:var(--accent2)':''}">${this.esc(n)}</button>`).join('')}
      </div>
      ${this.BLOQUES.map((nom,i)=>{ const r=(this._rutas||[]).find(x=>x.perfil===perf&&+x.bloque===i+1);
        if(!r||!r.url) return `<div class="prod" style="opacity:.5"><div class="nm">${i+1}. ${this.esc(nom)}</div>
          <div class="ct">todavía sin grabar</div></div>`;
        return `<div class="prod"><div class="nm">${i+1}. ${this.esc(r.titulo||nom)}</div>
          <div class="ct">${this.esc(r.duracion||'')}</div>${this.capEmbed(r.url)}</div>`;}).join('')}`;
  },

  /* ---------- cajón 3 · estudiantes ---------- */
  capResultados(){
    const ests=this._ests||[], vis=this._vistos||[];
    const mios=id=>vis.filter(v=>v.estudiante_id===id);
    const cert=ests.filter(e=>e.certificado).length;
    const hoy=new Date().toISOString().slice(0,10);
    const vencidos=ests.filter(e=>e.certificado&&e.vence_en&&e.vence_en<hoy).length;
    const porPerfil={}; ests.forEach(e=>{ const k=e.perfil||'sin perfil'; porPerfil[k]=(porPerfil[k]||0)+1; });
    return `
      <div class="kpis">
        <div class="kpi"><b>${cert}</b><span>Certificados</span></div>
        <div class="kpi"><b>${ests.length-cert}</b><span>En formación</span></div>
      </div>
      ${vencidos?`<div class="prod" style="border-color:var(--warn)">
        <div class="nm">${vencidos} certificación${vencidos===1?'':'es'} vencida${vencidos===1?'':'s'}</div>
        <div class="ct">la certificación dura 12 meses — hay que recertificar</div></div>`:''}
      ${ests.length?`<div style="font-size:12.5px;color:var(--faint);margin:10px 0">
        ${Object.keys(porPerfil).map(k=>{ const n=(this.PERFILES.find(p=>p[0]===k)||[null,k])[1];
          return this.esc(n)+': '+porPerfil[k]; }).join(' · ')}</div>`:''}
      ${ests.length?ests.map(e=>{ const v=mios(e.id);
        const nc=v.filter(x=>x.clase==='capsula').length, nr=v.filter(x=>x.clase==='ruta').length;
        const venc=e.certificado&&e.vence_en&&e.vence_en<hoy;
        return `<div class="prod" style="cursor:pointer${e.id===this._estSel?';border-color:var(--accent2)':''}"
          onclick="App.estAbrir('${e.id}')">
          <div class="top"><div><div class="nm">${this.esc(e.nombre)}</div>
            <div class="ct">c.c. ${this.esc(e.cedula||'')}${e.ciudad?' · '+this.esc(e.ciudad):''}${e.tipo_negocio?' · '+this.esc(e.tipo_negocio):''}</div></div>
            <div class="pv" style="font-size:13px">
              <span class="pchip ${e.certificado&&!venc?'stock':'cost'}">${venc?'vencido':(e.certificado?'certificado':'en formación')}</span></div></div>
          <div class="meta" style="margin-top:6px">
            <span class="pchip">${nc} cápsulas · ${nr}/4 bloques</span>
            ${e.perfil?`<span class="pchip">${this.esc((this.PERFILES.find(p=>p[0]===e.perfil)||[null,e.perfil])[1])}</span>`:''}
            ${e.codigo?`<span class="pchip stock" style="font-family:monospace">${this.esc(e.codigo)}</span>`:''}
          </div>
          ${e.id===this._estSel?this.estFicha(e,v):''}
        </div>`;}).join('')
      :'<div class="empty">Todavía nadie se ha inscrito. Manda el enlace de la escuela desde Academia.</div>'}`;
  },

  estFicha(e,v){
    const nom=id=>{ const c=(this._caps||[]).find(x=>x.id===id);
      if(!c) return id;
      const p=(this._prods||[]).find(y=>y.id===c.producto_id);
      return (p?p.nombre:'—')+' · '+c.tipo; };
    const rnom=id=>{ const r=(this._rutas||[]).find(x=>x.id===id);
      return r?(r.bloque+'. '+(r.titulo||'')):id; };
    const caps=v.filter(x=>x.clase==='capsula'), rut=v.filter(x=>x.clase==='ruta');
    return `<div style="border-top:1px solid var(--line,#eee);margin-top:12px;padding-top:12px"
      onclick="event.stopPropagation()">

  /* El código es lo que se verifica cuando alguien dice "yo soy distribuidor de Solé".

  async estCertificar(id){
    const e=(this._ests||[]).find(x=>x.id===id); if(!e) return;
    if(!confirm('¿Certificar a '+e.nombre+'? Le queda habilitado el precio mayorista.')) return;
    const n=(this._ests||[]).filter(x=>x.codigo).length+1;
    const cod='ESC-'+String(new Date().getFullYear()).slice(2)+'-'+String(n).padStart(4,'0');
    const vence=new Date(Date.now()+365*86400000).toISOString().slice(0,10);
    await this._patch('soleparis_estudiante?id=eq.'+id,{certificado:true,
      certificado_en:new Date().toISOString(),vence_en:vence,codigo:e.codigo||cod});
    this.toast('Certificado '+(e.codigo||cod)); this.vCapacitacion();

  async estQuitarCert(id){
    if(!confirm('¿Quitarle la certificación? Deja de ver el precio mayorista.')) return;
    await this._patch('soleparis_estudiante?id=eq.'+id,{certificado:false});
    this.vCapacitacion();
  },

  /* ---------- SEGUIMIENTO A TU TRATAMIENTO (27-oct-2026, José) ----------
     La pestaña del reto, pensada para que la use la propia participante desde el
     celular del equipo o el suyo:
       Registrados → un CAJÓN por tratamiento (con cuántas van) → los nombres →
       toca el suyo, confirma con su celular y entra a SUS 4 SEMANAS desde la firma
       (la 1 es la de la entrega) más el VIDEO del resultado. En cada una: foto y
       cómo se ha sentido. Y ya.
     Registrada = contrato firmado + fecha de entrega. Lo demás va a "Sin registrar"
     hasta que se complete desde la ficha.
     REMUNERACIÓN: cada foto vale un porcentaje del producto (valor_foto del
     programa) y el video del resultado otro (valor_video). 4 fotos + 1 video =
     100% = el producto del mes siguiente gratis. Si aceptó que le grabemos el
     video, un producto de regalo (video_ok).
     soleparis_avance: semana 1..4 (1 = semana de la entrega), tipo foto/video, valor 0. */
  _segFil:'reg', _segCaj:null, _segSel:null, _segSem:null, _segNuevo:false, _segEdit:false,
  _lunes(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; },
  _semISO(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=x.getUTCDay()||7;
    x.setUTCDate(x.getUTCDate()+4-n); const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil((((x-y0)/86400000)+1)/7); },
  _fechaLocal(s){ if(!s) return null; const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); },
  _fCorta(d){ return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'}); },
  _reg(x){ return !!(x.consentimiento&&x.inicio); },
  _pct(x){ const p=(this._progs||[]).find(q=>q.id===x.programa_id)||{};
    const f=+p.valor_foto||0, v=+p.valor_video||0;
    return (f>100||v>100||(!f&&!v))?{foto:20,video:20}:{foto:f,video:v}; },
  /* Las 4 semanas de la participante son las SIGUIENTES a la de la entrega: si firmó
     en la semana 43, sus fotos son de las semanas 44, 45, 46 y 47 (José, 27-oct-2026). */
  _rango(l){ const f=new Date(l); f.setDate(f.getDate()+6); return this._fCorta(l)+' al '+this._fCorta(f); },
  _semanas(x,mios){
    const ini=this._fechaLocal(x.inicio), hoy=this._lunes(new Date());
    return [1,2,3,4].map(w=>{ const l=this._lunes(ini); l.setDate(l.getDate()+7*w);
      const mias=mios.filter(a=>+a.semana===w);
      return {w,l,iso:this._semISO(l),abierta:l<=hoy,
        foto:mias.some(a=>a.tipo==='foto'&&a.url),nota:mias.some(a=>(a.nota||'').trim()),mias}; });
  },
  _avanceDe(x,mios){
    const pct=this._pct(x), sems=this._semanas(x,mios);
    const fotos=sems.filter(s=>s.foto).length, video=mios.some(a=>a.tipo==='video'&&a.url);
    const p=Math.min(100,fotos*pct.foto+(video?pct.video:0));
    return {pct,sems,fotos,video,p,gana:p>=100};
  },
  _ok(id){ return this.esAdmin()||sessionStorage.getItem('sole_seg_'+id)==='1'; },

      ${cuerpo}
      <div class="hint" style="margin-top:14px;line-height:1.6"><b>Cómo se gana:</b> si acepta que le grabemos el video, un producto de regalo.
        Cada foto vale un porcentaje del producto y el video del resultado otro: 4 fotos + 1 video = 100% = el producto del mes siguiente gratis.</div>`);
  },
  segFil(k){ this._segFil=k; this._segSel=null; this._segSem=null; this._segEdit=false; this.vCasos(); },
  segCaj(id){ this._segCaj=(this._segCaj===id?null:id); this._segSel=null; this._segSem=null; this._segEdit=false; this.vCasos(); },

    const r=await fetch(this.SB+'/rest/v1/soleparis_paciente',{method:'POST',headers:{...this._H(),Prefer:'return=minimal'},body:JSON.stringify({id:'pa'+Date.now(),nombre:g('sn_nom'),cedula:g('sn_ced').replace(/\D/g,'')||null,

    const inp=(t,id,v,extra)=>`<label class="hint" style="display:block;margin-top:7px">${t}</label><input class="field" id="${id}_${x.id}" value="${this.esc(v||'')}" style="padding:9px" ${extra||''}>`;

        <div style="flex:1">${inp('Correo','sf_ema',x.email,'inputmode="email"')}</div></div>

      <select class="field" id="sf_kit_${x.id}" style="padding:9px"><option value="">— elige —</option>

      <label style="display:flex;gap:7px;align-items:center;font-size:13px;margin-top:8px;cursor:pointer">
        <input type="checkbox" id="sf_ok_${x.id}" ${x.consentimiento?'checked':''} style="width:19px;height:19px"> Contrato firmado</label>
      <label style="display:flex;gap:7px;align-items:center;font-size:13px;margin-top:6px;cursor:pointer">
        <input type="checkbox" id="sf_vid_${x.id}" ${x.video_ok?'checked':''} style="width:19px;height:19px"> Aceptó que le grabemos el video (producto de regalo)</label>
      <div class="hint" style="margin-top:6px">Se inscribió el ${this.esc(String(x.creado_en||'').slice(0,10))}</div>
      <button class="btn gh2" style="margin-top:8px;padding:9px" onclick="App.segGuardarDatos('${x.id}')">Guardar datos</button></div>`;
  },
  async segGuardarDatos(id){
    const g=k=>(document.getElementById(k+'_'+id).value||'').trim();
    if(g('sf_nom').length<3){ this.toast('El nombre no puede quedar vacío'); return; }
    const ini=g('sf_ini')||null;
    const ok=document.getElementById('sf_ok_'+id).checked;
    const x=(this._pacs||[]).find(p=>p.id===id)||{};
    const k=(this._progs||[]).find(q=>q.id===g('sf_kit'))||{};
    const b={nombre:g('sf_nom'),cedula:g('sf_ced').replace(/\D/g,'')||null,celular:g('sf_cel')||null,telefono:g('sf_tel')||null,
      email:g('sf_ema')||null,direccion:g('sf_dir')||null,programa_id:k.id||null,kit_nombre:k.kit_nombre||null,
      inicio:ini,consentimiento:ok,video_ok:document.getElementById('sf_vid_'+id).checked};
    if(ok&&!x.consentimiento){ b.consentimiento_en=new Date().toISOString(); b.consentimiento_txt='Contrato firmado en físico, registrado por el equipo de Sole Paris.'; }
    const r=await fetch(this.SB+'/rest/v1/soleparis_paciente?id=eq.'+id,{method:'PATCH',headers:{...this._H(),Prefer:'return=minimal'},body:JSON.stringify(b)}).catch(()=>null);
    if(!r||!r.ok){ this.toast(r&&r.status===409?'Esa cédula ya la tiene otra participante':'No se pudo guardar. Intenta otra vez.'); return; }
    this._segFil=(ok&&ini)?'reg':'sin'; this._segCaj=k.id||'_sin'; this._segEdit=false;
    this.toast('Guardado'); this.vCasos();
  },
  async _segArchivo(id,f){
    const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
    const ruta='soleparis/avance/'+id+'_'+Date.now()+'.'+ext;
    try{ const r=await fetch(this.SB+'/storage/v1/object/documentos/'+ruta,{method:'POST',
        headers:{apikey:this.KEY,Authorization:'Bearer '+this.KEY,'Content-Type':f.type||'application/octet-stream'},body:f});
      if(r.ok) return this.SB+'/storage/v1/object/public/documentos/'+ruta; }catch(e){}
    return null;
  },
  async segSubir(id,w,tipo){
    const b=document.getElementById('sg_b_'+id);
    const nota=(document.getElementById('sg_n_'+id).value||'').trim();
    const inp=document.getElementById(tipo==='video'?'sg_v_'+id:'sg_f_'+id);
    const f=inp&&inp.files[0];
    if(!f&&!nota){ this.toast(tipo==='video'?'Elige el video o escribe la nota':'Elige la foto o escribe la nota'); return; }
    if(f&&f.size>50*1048576){ this.toast('El archivo pesa más de 50 MB'); return; }
    b.disabled=true; b.textContent='Guardando…';
    const x=(this._pacs||[]).find(p=>p.id===id)||{};
    const l=this._lunes(this._fechaLocal(x.inicio)); l.setDate(l.getDate()+7*(w-1));
    let url=null;
    if(f){ url=await this._segArchivo(id,f); if(!url){ this.toast('No se pudo subir. Intenta otra vez.'); b.disabled=false; b.textContent='Guardar'; return; } }
    const r=await fetch(this.SB+'/rest/v1/soleparis_avance',{method:'POST',headers:{...this._H(),Prefer:'return=minimal'},
      body:JSON.stringify({id:'av'+Date.now(),paciente_id:id,semana:w,fecha:l.toISOString().slice(0,10),tipo:f?tipo:'foto',url:url,nota:nota||null,valor:0,aprobado:true})}).catch(()=>null);
    if(!r||!r.ok){ this.toast('No se pudo guardar. Intenta otra vez.'); b.disabled=false; b.textContent='Guardar'; return; }
    this.toast('Guardado'); this.vCasos();
  },

  /* ---------- PENDIENTES (lo único que ve "público", sin clave) ---------- */
  _pendCaj:'grupo',
  _pendSub:'',
  /* 30-sep-2026: en "Plan de negocio" los pendientes se agrupan por quién
     los destraba (Jose: "prefiero este sistema de grupos"). Si aparece un
     quinto frente, se agrega aquí y ya queda disponible en el selector. */
  PLAN_SUBGRUPOS:[
    "Decisiones de los dueños de Solé (agenda de la reunión)",
    "Entregas de Solé para publicar la landing",
    "Entregas de Negocios Cuánticos",
    "Cabos sueltos entre los tres documentos"
  ],
  pendCaj(c){ if(c==='plan' && !this.esAdmin()) return; this._pendCaj=c; this.vPendientes(); },
  pendSub(s){ this._pendSub=s; },
  async vPendientes(){
    const admin=this.esAdmin();
    /* 15-oct-2026: tercer cajon, "Plan de videos", para NC y para publico (el equipo de Sole lo ve y marca su checklist). */
    const CAJ=this._pendCajas();
    if(this._pendCaj==='videos') return this.vVideos(CAJ);
    if(!admin && this._pendCaj==='plan') this._pendCaj='grupo';   // "Plan de negocio" es solo de NC, no de público
    const todos=await this._get('soleparis_pendientes?order=creado_en.desc');
    this._pend=todos;
    const esPlan=this._pendCaj==='plan';
    const items=todos.filter(p=>(p.grupo||'grupo')===this._pendCaj);
    if(esPlan && !this._pendSub) this._pendSub=this.PLAN_SUBGRUPOS[0];

    const fila=p=>`<div class="prod" style="opacity:${p.hecho?.55:1}">
        <div class="top" style="align-items:flex-start">
          <div style="display:flex;gap:10px;align-items:flex-start;flex:1">
            <input type="checkbox" ${p.hecho?'checked':''} onchange="App.pendToggle('${p.id}')" style="margin-top:3px;width:18px;height:18px">
            <div>
              <div class="nm" style="text-decoration:${p.hecho?'line-through':'none'}">${this.esc(p.texto)}</div>
              <div class="ct">Creado ${new Date(p.creado_en).toLocaleDateString('es-CO')}${p.entregado_en?' · Entregado '+new Date(p.entregado_en).toLocaleDateString('es-CO'):''}</div>
            </div>
          </div>
          <button class="btn-sm btn-line" onclick="App.pendEditar('${p.id}')">✎</button>
          ${admin?`<button class="btn-sm" style="background:#fbece9;color:#b3564b" onclick="App.pendBorrar('${p.id}')">🗑</button>`:''}
        </div>
      </div>`;

    let listado;
    if(!items.length){ listado='<div class="empty">Sin pendientes todavía.</div>'; }
    else if(!esPlan){ listado=items.map(fila).join(''); }
    else{
      const SIN_CAT='Sin categoría (pendientes de antes de los cajones)';
      const grupos=[...this.PLAN_SUBGRUPOS, ...new Set(items.map(p=>p.subgrupo).filter(s=>s&&!this.PLAN_SUBGRUPOS.includes(s))), SIN_CAT];
      listado=grupos.map(sg=>{
        const deEste=items.filter(p=>(p.subgrupo||SIN_CAT)===sg)
          .sort((a,b)=>String(a.creado_en).localeCompare(String(b.creado_en)));
        if(!deEste.length) return '';
        return `<div style="font-size:12px;font-weight:700;color:var(--accent2);margin:16px 0 6px">${this.esc(sg)} · ${deEste.filter(p=>!p.hecho).length} de ${deEste.length}</div>${deEste.map(fila).join('')}`;
      }).join('');
    }

    this.set(`<h1>Pendientes</h1>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${CAJ.map(([k,ic,t])=>`<button class="btn gh2" onclick="App.pendCaj('${k}')"
          style="padding:8px 14px;font-size:13px${this._pendCaj===k?';background:var(--accent2);color:#fff;border-color:var(--accent2)':''}">${ic} ${t}</button>`).join('')}
      </div>
      <div class="sub">${items.filter(p=>!p.hecho).length} por hacer · ${items.filter(p=>p.hecho).length} entregados</div>
      <div class="card">
        ${esPlan?`<select id="pend_sub" class="field" style="margin-bottom:8px" onchange="App.pendSub(this.value)">
          ${this.PLAN_SUBGRUPOS.map(sg=>`<option ${this._pendSub===sg?'selected':''}>${this.esc(sg)}</option>`).join('')}
        </select>`:''}
        <div style="display:flex;gap:8px">
          <input id="pend_txt" class="field" placeholder="Nuevo pendiente…" style="flex:1" onkeydown="if(event.key==='Enter')App.pendAgregar()">
          <button class="btn-sm btn-ink" onclick="App.pendAgregar()">＋</button>
        </div>
      </div>
      ${listado}`);
  },
  async pendAgregar(){
    const el=document.getElementById('pend_txt'); const t=(el.value||'').trim();
    if(!t) return;
    const row={id:'pd'+Date.now(), texto:t, hecho:false, grupo:this._pendCaj, creado_en:new Date().toISOString()};
    if(this._pendCaj==='plan') row.subgrupo=this._pendSub;
    await this._post('soleparis_pendientes',row);
    this.vPendientes();
  },
  async pendToggle(id){
    const p=(this._pend||[]).find(x=>x.id===id); if(!p) return;
    const hecho=!p.hecho;
    await this._patch('soleparis_pendientes?id=eq.'+encodeURIComponent(id), {hecho, entregado_en: hecho?new Date().toISOString():null});
    this.vPendientes();
  },
  async pendEditar(id){
    const p=(this._pend||[]).find(x=>x.id===id); if(!p) return;
    const t=prompt('Editar pendiente', p.texto);
    if(t===null) return;
    const nuevo=t.trim(); if(!nuevo) return;
    await this._patch('soleparis_pendientes?id=eq.'+encodeURIComponent(id), {texto:nuevo});
    this.vPendientes();
  },
  async pendBorrar(id){
    if(!confirm('¿Borrar este pendiente?'))return;
    await this._delq('soleparis_pendientes?id=eq.'+encodeURIComponent(id));
    this.vPendientes();
  },

  /* ---------- PLAN DE VIDEOS (15-oct-2026) ----------
     Un cajon dentro de Pendientes: por producto se abre la lista de videos, cada uno con su checklist
     (storyboard entregado, autorizado, filmacion, edicion y entrega, inicio de pauta). Al marcar una casilla se guarda
     la fecha de entrega; al desmarcarla, se borra. Tambien el equipo y los pendientes del dia de filmacion. */
  PROD_VIDEOS:['Nano Péptidos Capilares','Contorno de Ojos','Poción Secante','Fitoaliv','Crema Aclarante Corporal','Vitamina C Pura'],
  _vidAbierto:null,
  vidAbrir(prod,abierto){ this._vidAbierto=this._vidAbierto||{}; this._vidAbierto[prod]=abierto; },
  _fechaC(x){ return x?new Date(x).toLocaleDateString('es-CO'):''; },
  _pendCajas(){ return this.esAdmin()?[['grupo','👥','Pendientes grupo'],['plan','📈','Plan de negocio'],['videos','🎬','Plan de videos']]:[['grupo','👥','Pendientes grupo'],['videos','🎬','Plan de videos']]; },
  async vVideos(CAJ){
    const [vids,pasos,rod]=await Promise.all([this._get('soleparis_video?order=orden'), this._get('soleparis_video_paso?order=orden'), this._get('soleparis_rodaje?order=orden')]);
    this._vidD={pasos,rod};
    if(!this._vidAbierto){ this._vidAbierto={}; this._vidAbierto[this.PROD_VIDEOS[0]]=true; }
    const fp=id=>pasos.filter(x=>x.video_id===id);
    const prodHtml=this.PROD_VIDEOS.map((prod,k)=>{
      const vs=vids.filter(v=>v.producto===prod).sort((a,b)=>a.orden-b.orden);
      const ps=vs.reduce((a,v)=>a.concat(fp(v.id)),[]);
      const hechos=ps.filter(x=>x.hecho).length;
      const cuerpo=!vs.length?'<div class="empty">Todavía no hay videos de este producto. Cuando Negocios Cuánticos entregue los storyboards, aparecen aquí.</div>'
        : vs.map((v,i)=>`<div class="prod" style="margin-top:10px">
            <div class="nm">${i+1}. ${this.esc(v.titulo)} <span class="ct" style="font-weight:400">· ${v.duracion_s||''} s</span></div>
            <div class="ct" style="margin:2px 0 6px"><b>${this.esc(v.tipo||'')}</b></div>
            <div class="sub" style="font-size:13px;margin:0 0 8px">${this.esc(v.resumen||'')}</div>
            ${fp(v.id).map(x=>`<label style="display:flex;gap:9px;align-items:center;padding:4px 0;cursor:pointer;${x.hecho?'opacity:.7':''}">
              <input type="checkbox" ${x.hecho?'checked':''} onchange="App.vidPaso('${x.id}')" style="width:18px;height:18px">
              <span style="flex:1;${x.hecho?'text-decoration:line-through':''}">${this.esc(x.paso)}${!x.hecho&&x.fecha_prevista?` <span class="ct">(${new Date(x.fecha_prevista+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'long'})})</span>`:''}</span>
              <span class="ct">${x.hecho?'✓ '+(x.entregado_en?this._fechaC(x.entregado_en):''):''}</span></label>`).join('')}
          </div>`).join('');
      return `<details class="card" style="margin-top:10px" ${this._vidAbierto[prod]?'open':''} ontoggle="App.vidAbrir(App.PROD_VIDEOS[${k}],this.open)">
        <summary style="cursor:pointer;font-weight:700;font-size:15px">${this.esc(prod)} <span class="ct" style="font-weight:400">· ${vs.length?`${vs.length} ${vs.length===1?'video':'videos'} · ${hechos} de ${ps.length} pasos`:'sin videos todavía'}</span></summary>
        ${cuerpo}</details>`;
    }).join('');
    const equipo=rod.filter(r=>r.tipo==='equipo'), pend=rod.filter(r=>r.tipo==='pendiente');
    const rodHtml=rod.length?`<details class="card" style="margin-top:10px" ${this._vidAbierto['__rodaje']?'open':''} ontoggle="App.vidAbrir('__rodaje',this.open)">
        <summary style="cursor:pointer;font-weight:700;font-size:15px">🎬 Filmación · 22 de octubre <span class="ct" style="font-weight:400">· ${pend.filter(x=>x.hecho).length} de ${pend.length} pendientes listos</span></summary>
        <div style="font-size:12px;font-weight:700;color:var(--accent2);margin:12px 0 4px">Equipo</div>
        ${equipo.map(r=>`<div style="padding:2px 0">• ${this.esc(r.texto)}</div>`).join('')}
        <div style="font-size:12px;font-weight:700;color:var(--accent2);margin:14px 0 4px">Pendientes para filmar</div>
        ${pend.map(r=>`<label style="display:flex;gap:9px;align-items:center;padding:4px 0;cursor:pointer;${r.hecho?'opacity:.7':''}">
          <input type="checkbox" ${r.hecho?'checked':''} onchange="App.rodajeToggle('${r.id}')" style="width:18px;height:18px">
          <span style="flex:1;${r.hecho?'text-decoration:line-through':''}">${this.esc(r.texto)}</span>
          <span class="ct">${r.hecho&&r.entregado_en?'✓ '+this._fechaC(r.entregado_en):''}</span></label>`).join('')}
      </details>`:'';
    const plan=`<details class="card" style="margin-top:10px" ${this._vidAbierto['__plan']?'open':''} ontoggle="App.vidAbrir('__plan',this.open)">
      <summary style="cursor:pointer;font-weight:700;font-size:15px">📖 Cómo es el plan <span class="ct" style="font-weight:400">· 6 productos, la misma serie de videos cada uno</span></summary>
      <div style="font-size:12px;font-weight:700;color:var(--accent2);margin:12px 0 4px">🔵 A cargo de Negocios Cuánticos (guion, storyboard y producción)</div>
      <div>1. <b>Realismo del dolor</b> — muestra el problema como lo vive la gente, con humor y cariño, sin burlarse de nadie.</div>
      <div>2. <b>Dolor + reto · versión A (comercial)</b> y 3. <b>versión B (genérico)</b> — el problema y la invitación al reto con la oferta: 10 cupos, 50% de descuento a cambio de compartir los avances. Dos versiones del mismo mensaje para probar en pauta (A/B) y quedarnos con la que traiga más prospectos al menor costo.</div>
      <div>4. <b>Invitación a especialistas y revendedores</b> — cosmetólogas, centros de estética, barberos y vendedoras por catálogo.</div>
      <div style="font-size:12px;font-weight:700;color:var(--accent2);margin:12px 0 4px">🟣 A cargo de Solé</div>
      <div>5. <b>Aplicación</b> (paso a paso) · 6. <b>Componentes</b> (qué tiene y para qué sirve cada ingrediente) · 7. <b>Beneficios</b> (qué resultados puede esperar) · 8. <b>Distribuidores y experiencias</b> (los videos que ya tengan).</div>
      <div style="margin-top:12px;padding:10px;border-radius:10px;background:var(--accent-soft)"><b>📌 Importante.</b> Todo video pasa por la curaduría de Solé antes de salir en pauta. Para no tener problemas con Meta ni con INVIMA no prometemos resultados seguros: decimos "ayuda a…", nunca "elimina" ni "cura".</div>
    </details>`;
    const sc=window.scrollY;
    this.set(`<h1>Pendientes</h1>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${CAJ.map(([k,ic,t])=>`<button class="btn gh2" onclick="App.pendCaj('${k}')"
          style="padding:8px 14px;font-size:13px${this._pendCaj===k?';background:var(--accent2);color:#fff;border-color:var(--accent2)':''}">${ic} ${t}</button>`).join('')}
      </div>
      <div class="sub">Plan de videos · marca cada paso cuando se entregue y queda la fecha.</div>
      ${plan}${prodHtml}${rodHtml}`);
    window.scrollTo(0,sc);
  },
  async vidPaso(id){
    const x=((this._vidD||{}).pasos||[]).find(p=>p.id===id); if(!x) return;
    const hecho=!x.hecho;
    await this._patch('soleparis_video_paso?id=eq.'+encodeURIComponent(id),{hecho, entregado_en: hecho?new Date().toISOString():null});
    this.vVideos(this._pendCajas());
  },
  async rodajeToggle(id){
    const x=((this._vidD||{}).rod||[]).find(p=>p.id===id); if(!x) return;
    const hecho=!x.hecho;
    await this._patch('soleparis_rodaje?id=eq.'+encodeURIComponent(id),{hecho, entregado_en: hecho?new Date().toISOString():null});
    this.vVideos(this._pendCajas());
  },

      <div class="hero">
        <img src="https://soleparis.com/cdn/shop/files/1_2_b2654e9a-7df3-46ba-88a2-3df29f21dec3.png?width=400" alt="" onerror="this.style.display='none'">

  async guardarDiag(){
    const g=id=>(document.getElementById(id).value||'').trim();
    const nom=g('d_nom');
    if(!nom || Object.keys(this._dResp.a).length<this.D_A.length || Object.keys(this._dResp.b).length<this.D_B.length){ document.getElementById('d_err').style.display='block'; return; }
    let pDatos=0,detA=[]; this.D_A.forEach((qq,i)=>{const o=qq.o[this._dResp.a[i]];pDatos+=o.v;detA.push({tema:qq.c,r:o.t,v:o.v});});
    let pIA=0,detB=[],esce=false; this.D_B.forEach((qq,i)=>{const o=qq.o[this._dResp.b[i]];pIA+=o.v;if(o.f==='esceptico')esce=true;detB.push({tema:qq.c,r:o.t,v:o.v});});
    let perfil=this.D_PERF[this.D_PERF.length-1]; for(const pp of this.D_PERF){if(pIA<=pp.max){perfil=pp;break;}}
    const datosAlto=pDatos>=7, iaAlto=pIA>=11;
    const rec={ id:'d'+Date.now()+Math.floor(Math.random()*999), nombre:nom, cargo:g('d_car'), area:g('d_dep'), funciones:g('d_fun'),
      preocupacion:g('d_pre'), software:{inventarios:g('sw_inv'),pedidos:g('sw_ped'),picking:g('sw_pick'),delivery:g('sw_del'),cotizaciones:g('sw_cot'),leads:g('sw_lead')},

      ventas_mes:{actual:g('va_m1'),anterior:g('va_m2'),hace2:g('va_m3')},
      puntaje_datos:pDatos, puntaje_ia:pIA, perfil:perfil.n, esceptico:esce,
      madurez:datosAlto?'Datos ordenados':'Datos dispersos', clave_lectura:this.D_MAT[(datosAlto?'a':'b')+(iaAlto?'a':'b')],
      detalle_a:detA, detalle_b:detB, creado_en:new Date().toISOString() };

        <label>Cliente</label><input id="c_cli" class="field" placeholder="Nombre del cliente">
        <label>Producto</label><select id="c_prod" class="field" onchange="App._cotCalc()">${opts}</select>
        <label>Cantidad</label><input id="c_qty" class="field" type="number" inputmode="numeric" value="1" oninput="App._cotCalc()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
          <div class="sub" style="margin:0">Total</div>
          <div id="c_total" style="font-family:var(--serif);font-size:24px;font-weight:600;color:var(--accent2)">$0</div>
        </div>
        <button class="btn-sm btn-ink" style="width:100%;padding:13px;margin-top:12px" onclick="App.cotWA()">📱 Enviar por WhatsApp</button>
      </div>`);
    this._cotCalc();
  },
  _cotProd(){ return this._prods.find(p=>p.id===document.getElementById('c_prod').value); },
  _cotCalc(){ const p=this._cotProd(); if(!p)return; const q=+document.getElementById('c_qty').value||0; document.getElementById('c_total').textContent=this.fmt(q*(p.precio_venta||0)); },
  cotWA(){
    const p=this._cotProd(); if(!p)return; const q=+document.getElementById('c_qty').value||0; if(!q){alert('Pon la cantidad.');return;}
    const cli=(document.getElementById('c_cli').value||'').trim();
    const msg=`✦ COTIZACIÓN · SOLE PARIS\n━━━━━━━━━━━━━━━\n${cli?'Cliente: '+cli+'\n':''}${p.nombre}${p.presentacion?' ('+p.presentacion+')':''}\n${q} uds × ${this.fmt(p.precio_venta)} = ${this.fmt(q*p.precio_venta)}`;
    window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
  },

  /* ---------- SEMBRAR CATÁLOGO REAL + DEMO ---------- */
  async _seedProductos(){
    const CAT=[
      ['CREMA ACLARANTE CORPORAL','Corporal','',99900],['KIT ANTIFATIGA','Kit','',419700],['KIT LONGEVIDAD','Kit','',419600],
      ['KIT ANTICASPA MEN','Kit','',279700],['KIT ANTICASPA WOMAN','Kit','',279700],['KIT ANTICAIDA MEN','Kit','',309700],
      ['KIT ANTICAIDA WOMAN','Kit','',309700],['ACEITE CORPORAL','Corporal','',99900],['CONTORNO DE OJOS SOLE PARIS','Ojos','',139900],
      ['SCALP SCRUB','Capilar','',119900],['NANOPÉPTIDOS CAPILARES','Capilar','',149900],['KIT ACNÉ CONTROL','Kit','',259600],
      ['FACIAL BUBBLES BHA + AHA','Facial','',79900],['DÚO ANTIMANCHAS · PIELES MADURAS','Facial','',239800],['DOSIST CREAM · HIDRATANTE','Facial','',69900],
      ['DÚO ANTIEDAD · RENOVACIÓN CELULAR','Facial','',279800],['KIT ANTIEDAD','Kit','',429600],['PURE VITAMIN C · SERUM ANTIARRUGAS','Facial','30 ml',139900],
      ['DÚO REPARADOR INTENSIVO PUNTAS','Capilar','',139800],['DÚO MANCHAS','Facial','',179800],['DÚO ACNÉ CONTROL','Facial','',139800],
      ['NANORETINOL ENCAPSULADO · SERUM ANTIEDAD','Facial','',139900],['Tarjeta Regalo Sole','Tarjeta','',120000],['KIT RECONSTRUCCIÓN CAPILAR','Kit','',259700],
      ['KIT PIEL MIXTA','Kit','',329500],['CERA CAPILAR','Capilar','',39900],['KIT MANCHAS','Kit','',299600],['KIT ACNÉ CONTROL AHA & BHA','Kit','',299600],
      ['AMPOLLETA CAPILAR','Capilar','',119900],['BLOQUEADOR SOLAR SPF 50','Facial','30 ml',79900],['SERUM ÁCIDO AZELAICO & TRANEXÁMICO','Facial','30 ml',99900],
      ['KIT PIEL SECA','Kit','',329500],['KIT PIEL NORMAL','Kit','',349500],['KIT PIEL GRASA','Kit','',339500],['MAGIC LIP','Labios','',69900],['MAGIC LASH & EYEBROW','Ojos','',129900]
    ];
    const stockDemo=[42,8,6,15,14,11,13,30,22,18,20,9,55,12,60,10,7,26,16,19,24,21,40,10,9,70,12,11,17,48,33,10,9,10,50,28];
    let idx=0;
    for(const [nombre,categoria,pres,pv] of CAT){
      const id='sp'+(idx+1);
      if(!this._prods.find(x=>x.id===id)){
        const tot=stockDemo[idx]||10, loc=Math.round(tot*0.35);
        const prod={id,nombre,categoria,presentacion:pres,precio_venta:pv,precio_costo:0,stock_local:loc,stock_bodega:tot-loc};
        this._prods.push(prod); await this._put('soleparis_productos',prod,this._prods);
      }
      idx++;
    }
  },
  async sembrar(){
    if(!confirm('Recargar el catálogo de Sole Paris (36 productos) y 2 clientes de prueba?')) return;
    await this._seedProductos();
    const clis=[
      {id:'sc1',nombre:'Spa Belleza Natural',tel:'3105557788',ciudad:'Bogotá',tipo:'Spa / estética'},
      {id:'sc2',nombre:'Dra. Camila Restrepo (Dermatología)',tel:'3128889900',ciudad:'Medellín',tipo:'Dermatólogo'}
    ];
    for(const c of clis){ if(!this._clis.find(x=>x.id===c.id)){ this._clis.unshift(c); await this._put('soleparis_clientes',c,this._clis); } }
    this.toast('✦ Catálogo Sole Paris cargado'); this.go('catalogo');
  },
  async limpiar(){
    if(!confirm('¿Borrar TODOS los productos y clientes de Sole Paris?')) return;
    if(this._online){ for(const t of ['soleparis_productos','soleparis_clientes']){ try{ await fetch(this.SB+'/rest/v1/'+t+'?id=neq.__none__',{method:'DELETE',headers:this._H()}); }catch(e){} } }
    this._prods=[]; this._clis=[]; this._saveLocal('soleparis_productos',[]); this._saveLocal('soleparis_clientes',[]);
    this.toast('Todo borrado'); this.go('inicio');
  }
};
(function(){ const r=sessionStorage.getItem('sole_rol'); if(r&&(r==='publico'||Object.values(App.PASS).includes(r))){ App.rol=r; App._start(); } else { setTimeout(()=>{const e=document.getElementById('lg');if(e)e.focus();},80); } })();
