<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FES · Fueling Equipment & Suppliers</title>
<style>
:root{--navy:#1b2a44;--navy2:#24364f;--acc:#f7941d;--acc2:#ffb703;--plata:#c9d1dc;--bg:#f1f3f6;--card:#fff;--tx:#1a2433;--sub:#67738a;--linea:#dfe4ec;--ok:#188a54;--rojo:#c0392b;--amar:#b7791f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14.5px}
header{background:linear-gradient(135deg,#1b2a44 0%,#2c405e 55%,#1b2a44 100%);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--acc)}
.sello{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#f4f6f9,#aeb9c6 55%,#7e8c9d);display:flex;align-items:center;justify-content:center;font-weight:900;color:#1b2a44;font-size:17px;letter-spacing:.02em;border:3px solid #55677e;box-shadow:0 2px 8px rgba(0,0,0,.35)}
header .logo{font-size:19px;font-weight:800;letter-spacing:.03em}
header .logo span{color:var(--acc)}
header .sub{font-size:11px;color:#9fb0c3;letter-spacing:.14em;text-transform:uppercase}
nav{background:var(--navy2);padding:6px 10px;display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:0;z-index:40}
nav button{background:transparent;border:none;color:#c8d3e0;padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1180px;margin:0 auto;padding:18px 14px 80px}
h1{font-size:21px;margin-bottom:2px}
.sub2{color:var(--sub);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--card);border:1px solid var(--linea);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:21px;font-weight:800}
.kpi .l{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.kpi.rojo{border-left-color:var(--rojo)} .kpi.rojo .v{color:var(--rojo)}
.kpi.ok{border-left-color:var(--ok)} .kpi.verde .v{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;padding:8px 8px;border-bottom:2px solid var(--linea)}
td{padding:9px 8px;border-bottom:1px solid #eef1f5;vertical-align:top}
tr:hover td{background:#fafbfd}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.btn{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn.sec{background:#e8ecf2;color:var(--tx)}
.btn.ok{background:var(--ok)} .btn.rojo{background:var(--rojo)} .btn.navy{background:var(--navy)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.b-ok{background:#e3f5ec;color:var(--ok)} .b-pend{background:#fdeeee;color:var(--rojo)}
.b-par{background:#fdf3e0;color:var(--amar)} .b-gris{background:#eef1f5;color:var(--sub)}
.b-acc{background:#fef0e0;color:#c05e00}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #ccd4de;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
label{font-size:11.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;display:block;margin:9px 0 3px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.modal-bg{position:fixed;inset:0;background:rgba(13,27,42,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal{background:#fff;border-radius:14px;padding:18px 20px;width:100%;max-width:760px}
.modal h3{margin-bottom:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{max-width:280px}
.empty{padding:26px;text-align:center;color:var(--sub)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;z-index:99;font-weight:600}
.chip{display:inline-block;background:#eef1f5;border-radius:14px;padding:3px 10px;font-size:12px;margin:2px 3px 2px 0}
.low{color:var(--rojo);font-weight:800}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs2 button{background:#e8ecf2;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--tx);font-size:13px}
.tabs2 button.on{background:var(--navy);color:#fff}
.fchip{background:#fff;border:1.5px solid #d3d9e2;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#48505c;cursor:pointer}
.fchip:hover{border-color:var(--navy)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mini{font-size:12px;color:var(--sub)}
@media(max-width:640px){ main{padding:12px 8px 90px} .modal{padding:14px} }
@media print{ nav,header,.no-print{display:none!important} body{background:#fff} .print-area{display:block} }
  .grid-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}
  @media(max-width:520px){ .grid-fotos{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))} }
</style>
</head>
<body>
<header>
  <div class="sello">FES</div>
  <div>
    <div class="logo">FES <span>FUELING EQUIPMENT &amp; SUPPLIERS</span></div>
    <div class="sub">NIT 902025524-8 · Repuestos para vehículos cisterna</div>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="empty">Cargando…</div></main>
<div id="modal"></div>
<script>
/* ================= FES FUELING ERP · Motor Cuántico NC =================
   BD independiente: tablas ff_* en Supabase (REGLA: nunca cruzar con otras). */
const SB='https://fnayedgvamxktxfvywwl.supabase.co', K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const fecha=d=>d?String(d).slice(0,10):'';
const hoy=()=>new Date().toISOString().slice(0,10);
const mesAct=()=>hoy().slice(0,7);

/* El servidor NUNCA devuelve mas de 1000 filas aunque se le pida mas, y lo hace
   en silencio. GETALL pide de a 1000 hasta agotar, para que ninguna pantalla
   se quede corta cuando la tabla crece. */
async function GETALL(p){
  const base=String(p).replace(/[?&](limit|offset)=\d+/g,'');
  const sep=base.includes('?')?'&':'?';
  const out=[];
  for(let i=0,off=0;i<60;i++,off+=1000){
    let r; try{ r=await fetch(SB+'/rest/v1/'+base+sep+'limit=1000&offset='+off,{headers:H}); }catch(e){ break; }
    if(!r.ok) break;
    let b; try{ b=await r.json(); }catch(e){ break; }
    if(!Array.isArray(b)||!b.length) break;
    out.push(...b);
    if(b.length<1000) break;
  }
  return out;
}
async function api(p,o={}){ try{ const r=await fetch(SB+'/rest/v1/'+p,{headers:H,...o}); const t=await r.text();
  if(!r.ok){ console.warn('API',p,t.slice(0,150)); return o.method?null:[]; }
  const d=t?JSON.parse(t):(o.method?{}:[]); return d; }catch(e){ console.warn(e); return o.method?null:[]; } }
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b),headers:{...H,Prefer:'return=representation'}});
const patch=(p,b)=>api(p,{method:'PATCH',body:JSON.stringify(b),headers:{...H,Prefer:'return=minimal'}});
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function modal(html){ $('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)cerrar()"><div class="modal">${html}</div></div>`; }
function cerrar(){ $('modal').innerHTML=''; }
function safe(fn,nom){ return async function(...a){ try{ await fn.apply(App,a); }catch(e){ console.error(e); $('main').innerHTML=`<div class="card"><b>⚠️ No pude cargar ${nom}.</b><div class="mini">${esc(e.message||e)}</div><button class="btn" style="margin-top:8px" onclick="App.go(App.vista)">Reintentar</button></div>`; } }; }

const App={
vista:'inicio',
TABS:[['inicio','🏠 Inicio'],['busqueda','🔎 Búsqueda'],['catalogo','📦 Catálogo'],['inventario','📊 Inventario'],['compras','🛒 Compras'],['facturacion','🧾 Facturación'],['cartera','💰 Cartera'],['bancos','💵 Caja'],['clientes','🏢 Clientes'],['proveedores','🚚 Proveedores'],['reportes','📈 Reportes'],['importacion','🚛 Importación']],
nav(){ $('nav').innerHTML=this.TABS.map(([v,n])=>`<button class="${v===this.vista?'on':''}" onclick="App.go('${v}')">${n}</button>`).join(''); },
go(v){ this.vista=v; this.nav(); $('main').innerHTML='<div class="empty">Cargando…</div>';
  ({inicio:this.vInicio,busqueda:this.vBusqueda,catalogo:this.vCatalogo,inventario:this.vInventario,compras:this.vCompras,
    facturacion:this.vFacturacion,cartera:this.vCartera,bancos:this.vBancos,clientes:this.vClientes,
    proveedores:this.vProveedores,reportes:this.vReportes,importacion:this.vImportacion}[v]).call(this); },
set(h){ $('main').innerHTML=h; window.scrollTo(0,0); },

/* ---------- datos base cacheados por vista ---------- */
async refs(){ this._refs=await GETALL('ff_referencias?order=codigo&limit=3000'); return this._refs; },
async clientes(){ this._cli=await GETALL('ff_clientes?order=empresa&limit=2000'); return this._cli; },
async provs(){ this._prov=await GETALL('ff_proveedores?order=razon_social&limit=2000'); return this._prov; },
async docs(){ this._docs=await GETALL('ff_documentos?order=creado_en.desc&limit=4000'); return this._docs; },
async abonos(){ this._abo=await GETALL('ff_abonos?order=fecha.desc&limit=6000'); return this._abo; },
/* La foto en la tabla. Se ve chiquita y al tocarla abre la grande: con 141
   referencias, reconocer la pieza por la imagen es mas rapido que por el codigo. */
_miniFoto(r){
  const u=r.foto_url||(r.foto?('fotos/'+r.foto):'');
  if(!u) return '<div style="width:42px;height:42px;border-radius:6px;background:#f1f3f6"></div>';
  return `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" alt="" loading="lazy"
    style="width:42px;height:42px;object-fit:contain;background:#f6f7f9;border-radius:6px;display:block"></a>`;
},
cliNom(id){ const c=(this._cli||[]).find(x=>x.id===id); return c?c.empresa:'—'; },

/* ================= BÚSQUEDA DE PROVEEDORES =================
   Cada foto de producto es una ficha. Se le anotan hasta 5 direcciones de
   proveedores candidatos, se marca cuál se ENCONTRÓ que sirve y cuál se
   ESCOGIÓ, y con el desglose de costos de importación se crea la referencia:
   ahí ya pasa a Catálogo (precio de venta) y a Inventario (compra + venta). */
FOTOS:'fotos/',
/* Categorias sacadas de los nombres reales del inventario de fotos, no
   inventadas: bombas, boquillas, mangueras, filtros, medicion, deteccion de
   agua, seguridad, valvulas, empaquetaduras, equipos y herramientas. */
CATEGORIAS:['Bombas','Boquillas y acoples','Mangueras y carretes','Filtros y separadores',
  'Medicion y control','Deteccion de agua','Seguridad y hombre muerto','Valvulas',
  'Empaquetaduras y sellos','Equipos y vehiculos','Herramientas','Otros'],
APLICACIONES:['Camion','Estacion','Mixto'],
/* Promedio de lo que cotizaron los proveedores: sirve para saber si el que
   escogiste esta caro o barato frente a los demas. */
_prom(x){
  const v=[1,2,3,4,5].map(i=>+x['precio'+i]||0).filter(n=>n>0);
  if(!v.length) return null;
  return {prom:v.reduce((a,b)=>a+b,0)/v.length, n:v.length,
          min:Math.min(...v), max:Math.max(...v)};
},
bqProm(){
  const e=$('bq_prom'); if(!e) return;
  const x={}; [1,2,3,4,5].forEach(i=>{ const t=($('bq_v'+i)||{}).value||''; x['precio'+i]=+String(t).replace(/[^0-9.]/g,'')||0; });
  const p=this._prom(x);
  e.innerHTML = p ? `Promedio <b>USD ${p.prom.toFixed(2)}</b> · ${p.n} cotizado(s) · el más bajo USD ${p.min.toFixed(2)}`
                  : 'Escribe los precios para ver el promedio.';
},
async busq(){ this._busq=await GETALL('ff_busqueda?order=nombre&limit=1000'); return this._busq; },
/* Biblioteca de fichas tecnicas, normas y proformas. Vive en fesfueling/docs y
   se anexa a la ficha del producto: la norma EN ISO 1825 sirve para todas las
   mangueras, una proforma sirve para varias valvulas. Por eso se anexan, no se
   suben una y otra vez. */
DOCS:'docs/',
async docsLib(){
  if(this._docs2) return this._docs2;
  try{ const r=await fetch(this.DOCS+'docs.json'); this._docs2=await r.json(); }catch(e){ this._docs2=[]; }
  return this._docs2;
},
_anexosDe(x){ try{ return Array.isArray(x.anexos)?x.anexos:JSON.parse(x.anexos||'[]'); }catch(e){ return []; } },
vBusqueda: safe(async function(){
  await Promise.all([this.busq(), this.docsLib()]);
  this._bqPaint();
},'la búsqueda'),
_bqPaint(){
  const B=this._busq||[];
  const f=this._bqFil||'todos';
  const q=(this._bqQ||'').trim().toLowerCase();
  const cnt={todos:B.filter(x=>x.estado!=='anulado').length,
    buscando:B.filter(x=>x.estado==='buscando').length,
    escogido:B.filter(x=>x.estado==='escogido').length,
    creado:B.filter(x=>x.estado==='creado').length,
    anulado:B.filter(x=>x.estado==='anulado').length,
    nombrar:B.filter(x=>x.por_nombrar&&x.estado!=='anulado').length};
  /* Los anulados NO se borran: salen de la vista pero quedan guardados, porque
     mañana puede volver a interesar el producto y la foto ya no estaría. */
  let L;
  if(f==='nombrar')     L=B.filter(x=>x.por_nombrar&&x.estado!=='anulado');
  else if(f==='todos')  L=B.filter(x=>x.estado!=='anulado');
  else                  L=B.filter(x=>x.estado===f);
  if(this._bqCat) L=L.filter(x=>(x.categoria||'Otros')===this._bqCat);
  if(this._bqApl) L=L.filter(x=>(x.aplicacion||'Mixto')===this._bqApl);
  if(q) L=L.filter(x=>String(x.nombre||'').toLowerCase().includes(q));
  const caj=(k,t)=>`<button class="btn ${f===k?'':'gh'}" style="padding:8px 13px" onclick="App._bqFil='${k}';App._bqPaint()">${t}</button>`;
  const badge=x=> x.estado==='anulado' ? '<span class="tag" style="background:#fde8e8;color:#b3261e">⃠ anulado</span>'
                : x.estado==='creado' ? '<span class="tag" style="background:#e7f6ec;color:#1c7a3e">✓ referencia creada</span>'
                : x.estado==='escogido' ? '<span class="tag" style="background:#fff4e5;color:#8a5300">proveedor escogido</span>'
                : '<span class="tag">buscando</span>';
  this.set(`<h2>🔎 Búsqueda de proveedores</h2>
    <div class="mini">Cada foto es un producto por cotizar. Anota hasta 5 direcciones, marca la que sirve y crea la referencia.</div>
    <div class="row" style="gap:7px;flex-wrap:wrap;margin:12px 0">
      ${caj('todos','Todos · '+cnt.todos)}${caj('buscando','Buscando · '+cnt.buscando)}
      ${caj('escogido','Escogidos · '+cnt.escogido)}${caj('creado','Creados · '+cnt.creado)}
      ${caj('nombrar','⚠️ Sin nombre · '+cnt.nombrar)}${cnt.anulado?caj('anulado','⃠ Anulados · '+cnt.anulado):''}
      <select onchange="App._bqCat=this.value;App._bqPaint()" style="min-width:150px">
        <option value="">Toda categoría</option>
        ${this.CATEGORIAS.map(c=>`<option ${c===(this._bqCat||'')?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <select onchange="App._bqApl=this.value;App._bqPaint()" style="min-width:120px">
        <option value="">Toda aplicación</option>
        ${this.APLICACIONES.map(c=>`<option ${c===(this._bqApl||'')?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <input placeholder="Buscar por nombre…" value="${esc(this._bqQ||'')}" style="flex:1;min-width:160px"
             oninput="App._bqQ=this.value;clearTimeout(App._bqT);App._bqT=setTimeout(()=>App._bqPaint(),300)">
    </div>
    <div class="grid-fotos">
      ${L.length?L.map(x=>`
        <div class="card" style="padding:10px">
          <img src="${this.FOTOS}${esc(x.archivo)}" alt="${esc(x.nombre)}" loading="lazy"
               style="width:100%;height:140px;object-fit:contain;background:#f6f7f9;border-radius:8px;cursor:pointer${x.estado==='anulado'?';opacity:.35;filter:grayscale(1)':''}"
               onclick="App.bqAbrir('${esc(x.id)}')">
          <div style="font-weight:700;font-size:13px;margin-top:7px;${x.por_nombrar?'color:#b45309':''}">${esc(x.nombre)}</div>
          ${(()=>{const p=this._prom(x); return p?`<div style="font-weight:800;font-size:14px;color:#0f6b4f;margin-top:3px">USD ${p.prom.toFixed(2)} <span style="font-weight:400;font-size:11px;color:#6b7280">promedio · ${p.n}</span></div>`:'';})()}
          <div class="mini" style="margin-top:2px">${esc(x.categoria||'Otros')} · ${esc(x.aplicacion||'Mixto')}${(()=>{const n=this._anexosDe(x).length; return n?' · 📎 '+n:'';})()}</div>
          <div style="margin-top:4px">${badge(x)}</div>
          <div class="row" style="gap:6px;margin-top:7px">
            ${x.estado==='anulado'
              ? `<button class="btn gh" style="flex:1;padding:6px" onclick="App.bqAnular('${esc(x.id)}',false)">↩︎ Reactivar</button>`
              : `<button class="btn gh" style="flex:1;padding:6px" onclick="App.bqAbrir('${esc(x.id)}')">🚚 Proveedores</button>
                 ${x.estado==='creado'
                    ? `<button class="btn" style="padding:6px 10px" title="Ver y corregir el costo" onclick="App.bqRef('${esc(x.id)}')">✎ Costos</button>`
                    : `<button class="btn" style="padding:6px 10px" onclick="App.bqRef('${esc(x.id)}')">＋ Costos</button>`}
                 <button class="btn gh" style="padding:6px 9px;color:#b3261e" title="Anular: sale de la lista pero no se borra"
                         onclick="App.bqAnular('${esc(x.id)}',true)">⃠</button>`}
          </div>
        </div>`).join('')
      :'<div class="empty">Nada con ese filtro.</div>'}
    </div>`);
},
bqAbrir(id){
  const x=(this._busq||[]).find(b=>b.id===id); if(!x) return;
  modal(`<h3>${esc(x.nombre)}</h3>
    <img src="${this.FOTOS}${esc(x.archivo)}" style="width:100%;max-height:230px;object-fit:contain;background:#f6f7f9;border-radius:9px;margin:8px 0">
    <label>Nombre del producto</label>
    <input id="bq_nom" value="${esc(x.nombre)}" placeholder="Cómo se llama de verdad">
    <div class="g2">
      <div><label>Categoría</label><select id="bq_cat">
        ${this.CATEGORIAS.map(c=>`<option ${c===(x.categoria||'Otros')?'selected':''}>${esc(c)}</option>`).join('')}
      </select></div>
      <div><label>Aplicación</label><select id="bq_apl">
        ${this.APLICACIONES.map(c=>`<option ${c===(x.aplicacion||'Mixto')?'selected':''}>${esc(c)}</option>`).join('')}
      </select></div>
    </div>
    <div class="mini" style="margin-top:9px;font-weight:700">DÓNDE PODRÍA ESTAR — hasta 5 direcciones</div>
    <div class="mini">La dirección y lo que cotizaron, en dólares.</div>
    ${[1,2,3,4,5].map(i=>`<div class="row" style="gap:6px;margin-top:5px">
      <input id="bq_p${i}" value="${esc(x['prov'+i]||'')}" placeholder="Dirección ${i}" style="flex:1;min-width:0">
      <input id="bq_v${i}" value="${x['precio'+i]!=null?x['precio'+i]:''}" placeholder="USD" inputmode="decimal"
             style="width:92px;flex:none" oninput="App.bqProm()">
    </div>`).join('')}
    <div id="bq_prom" class="mini" style="margin-top:6px;font-weight:700"></div>
    <div class="mini" style="margin-top:11px;font-weight:700">✅ LAS QUE SÍ SIRVEN — hasta 3</div>
    <input id="bq_enc"  value="${esc(x.encontrado||'')}"  placeholder="Sirve 1" style="margin-top:5px">
    <input id="bq_enc2" value="${esc(x.encontrado2||'')}" placeholder="Sirve 2" style="margin-top:5px">

async bqAnexar(id,docId){
  if(!docId) return;
  const x=(this._busq||[]).find(b=>b.id===id); if(!x) return;
  const doc=(this._docs2||[]).find(d=>d.id===docId); if(!doc) return;
  const A=this._anexosDe(x);
  if(A.some(a=>a.id===docId)){ toast('Ya estaba anexado'); return; }
  A.push({id:doc.id,nombre:doc.nombre,archivo:doc.archivo});
  x.anexos=A; this._pintaAnexos(id);
  await patch('ff_busqueda?id=eq.'+encodeURIComponent(id),{anexos:A,actualizado:new Date().toISOString()});
  toast('Anexado');
},
async bqQuitarAnexo(id,docId){
  const x=(this._busq||[]).find(b=>b.id===id); if(!x) return;
  const A=this._anexosDe(x).filter(a=>a.id!==docId);
  x.anexos=A; this._pintaAnexos(id);
  await patch('ff_busqueda?id=eq.'+encodeURIComponent(id),{anexos:A,actualizado:new Date().toISOString()});
},
async bqGuardar(id){

    escogido:v('bq_esc'), escogido2:v('bq_esc2'), principal:v('bq_ppal'),
    proveedor:v('bq_prov'), notas:v('bq_not'),
    categoria:v('bq_cat')||'Otros', aplicacion:v('bq_apl')||'Mixto',
    actualizado:new Date().toISOString()};
  [1,2,3,4,5].forEach(i=>{ const t=v('bq_v'+i); b['precio'+i]= t? (+t.replace(/[^0-9.]/g,'')||null) : null; });
  b.por_nombrar = /^por nombrar/i.test(b.nombre);
  const x=(this._busq||[]).find(z=>z.id===id)||{};
  if(x.estado!=='creado') b.estado = (b.escogido||b.escogido2||b.principal) ? 'escogido' : 'buscando';

/* Anular no borra: la ficha queda guardada con su foto y sus precios, solo sale
   de la vista. Si mañana vuelve a interesar el producto, se reactiva y no hubo
   que volver a conseguir la foto ni las cotizaciones. */
async bqAnular(id,v){
  const x=(this._busq||[]).find(b=>b.id===id); if(!x) return;
  if(v && !confirm('¿Anular "'+(x.nombre||'')+'"? Sale de la lista pero no se borra: puedes reactivarlo cuando quieras.')) return;
  const nv = v ? 'anulado' : (x.referencia_id?'creado':(x.escogido||x.escogido2||x.principal?'escogido':'buscando'));
  const r=await patch('ff_busqueda?id=eq.'+encodeURIComponent(id),{estado:nv,actualizado:new Date().toISOString()});
  if(r===null){ toast('⚠️ No se pudo'); return; }
  x.estado=nv; toast(v?'Anulado':'Reactivado'); this._bqPaint();
},
async bqBorrar(id){

  await api('ff_busqueda?id=eq.'+encodeURIComponent(id),{method:'DELETE'});

  cerrar(); toast('Quitada'); this._bqPaint();

_n(id){ return +String(($(id)||{}).value||'').replace(/[^0-9.]/g,'')||0; },
/* El IVA de importación NO es costo: se descuenta después. Por eso el precio de
   venta sale del costo SIN IVA; el IVA solo se muestra para saber cuánta plata
   hay que poner en la nacionalización. */
bqCalc(desde){
  const usd=this._n('rf_usd'), trm=this._n('rf_trm'), fle=this._n('rf_fle'), seg=this._n('rf_seg');
  const ara=this._n('rf_ara'), ivp=this._n('rf_iva'), nac=this._n('rf_nac'), tra=this._n('rf_tra');
  const cop=this._n('rf_com');
  const fob=usd*trm;
  /* La comision del comprador en China se calcula sobre el FOB, pero NO entra al
     CIF: la aduana liquida el arancel sobre CIF, y una comision de compra no es
     parte del valor de la mercancia. Meterla ahi pagaria arancel de mas. */
  const comis=fob*cop/100;
  const cif=fob+fle+seg;
  const arancel=cif*ara/100;
  const ivaImp=(cif+arancel)*ivp/100;
  const costo=cif+comis+arancel+nac+tra;       // el IVA se recupera, no suma
  /* Los dos sentidos: si escribio el margen sale el precio, y si escribio el
     precio sale el margen. Casi siempre se sabe a cuanto se puede vender y lo
     que hay que averiguar es cuanto deja, no al reves. */
  let mar=this._n('rf_mar'), venta=this._n('rf_pv');
  if(desde==='precio' && costo>0){ mar=venta>0?((venta/costo)-1)*100:0;
    const e=$('rf_mar'); if(e) e.value=mar?mar.toFixed(1):''; }
  else { venta=Math.round(costo*(1+mar/100));
    const e=$('rf_pv'); if(e) e.value=venta||''; }
  this._bqCosto=Math.round(costo); this._bqVenta=Math.round(venta); this._bqMargen=mar; this._bqIvaImp=Math.round(ivaImp);
  const fila=(t,v,x)=>`<div class="row" style="justify-content:space-between;font-size:12.5px;${x||''}"><span>${t}</span><b>${money(v)}</b></div>`;
  const d=$('rf_desglose'); if(d) d.innerHTML =
    fila('FOB en pesos ('+(usd||0)+' USD × '+(trm||0)+')',fob)
    + fila('+ Flete internacional',fle) + fila('+ Seguro',seg)
    + fila('= CIF',cif,'border-top:1px dashed #cbd5e1;padding-top:3px;margin-top:3px')
    + fila('+ Comisión comprador China '+cop+'%',comis)
    + fila('+ Arancel '+ara+'%',arancel)
    + fila('+ Nacionalización',nac) + fila('+ Transporte interno',tra)
    + fila('= COSTO PUESTO EN BODEGA',costo,'border-top:1px solid #94a3b8;padding-top:4px;margin-top:4px;font-size:14px')
    + `<div class="mini" style="margin-top:6px">IVA de importación ${money(ivaImp)} — se paga al nacionalizar y se descuenta después, por eso no entra al costo.</div>`;
  const g=costo>0?Math.round(venta-costo):0;
  const e=$('rf_venta'); if(e) e.innerHTML='Deja <span style="color:#0f6b4f">'+money(g)+'</span> por unidad'
    + (costo>0&&venta>0?' <span style="font-size:13px;color:#6b7280">· margen '+mar.toFixed(1)+'% sobre el costo</span>':'');
},
async bqRefOk(){
  const id=this._bqRefId; const x=(this._busq||[]).find(b=>b.id===id); if(!x) return;
  const cod=($('rf_cod')?$('rf_cod').value.trim():''), nom=($('rf_nom')?$('rf_nom').value.trim():'');
  if(!cod){ alert('Ponle un código a la referencia.'); return; }
  if(!nom){ alert('Falta el nombre.'); return; }
  if(!this._bqCosto){ alert('Falta el costo: al menos el FOB en dólares y la TRM.'); return; }
  const b={codigo:cod, nombre:nom, categoria:($('rf_cat')?$('rf_cat').value.trim():'')||x.categoria||'',

    seguro:this._n('rf_seg'), arancel_pct:this._n('rf_ara'), iva_pct:this._n('rf_iva'),
    nacionalizac:this._n('rf_nac'), transp_int:this._n('rf_tra'), comision_pct:this._n('rf_com'),
    costo_bodega:this._bqCosto, ultimo_costo:this._bqCosto, costo_promedio:this._bqCosto,
    margen_pct:+(this._bqMargen||0).toFixed(2), precio_venta:this._bqVenta, existencias:0};
  if(this._bqEdit&&this._bqEdit.id){
    const u=await patch('ff_referencias?id=eq.'+encodeURIComponent(this._bqEdit.id),b);
    if(u===null){ toast('⚠️ No se pudo guardar'); return; }
    cerrar(); toast('Referencia '+cod+' actualizada · venta '+money(this._bqVenta)); this._bqPaint(); return;

    {estado:'creado', referencia_id:r[0].id, actualizado:new Date().toISOString()});
  x.estado='creado'; x.referencia_id=r[0].id;
  cerrar(); toast('Referencia '+cod+' creada · venta '+money(this._bqVenta)); this._bqPaint();
},

vInicio: safe(async function(){
  const [refs,docs,abonos,compras]=await Promise.all([this.refs(),this.docs(),this.abonos(),GETALL('ff_compras?limit=2000')]);
  await this.clientes();
  const fact=docs.filter(d=>d.tipo==='factura'&&d.estado!=='anulada');
  const abPorDoc={}; abonos.forEach(a=>abPorDoc[a.documento_id]=(abPorDoc[a.documento_id]||0)+(+a.valor||0));
  const saldo=d=>Math.max(0,(+d.total||0)-(abPorDoc[d.id]||0));
  const ventasHoy=fact.filter(d=>d.fecha_emision===hoy()).reduce((s,d)=>s+(+d.total||0),0);
  const ventasMes=fact.filter(d=>(d.fecha_emision||'').slice(0,7)===mesAct()).reduce((s,d)=>s+(+d.total||0),0);
  const pend=fact.filter(d=>saldo(d)>0);
  const vencidas=pend.filter(d=>d.fecha_vencimiento&&d.fecha_vencimiento<hoy());
  const carteraVencida=vencidas.reduce((s,d)=>s+saldo(d),0);
  const bajos=refs.filter(r=>r.activo&&(+r.existencias||0)<=(+r.inv_min||0)&&(+r.inv_min||0)>0);
  const valorInv=refs.reduce((s,r)=>s+(+r.existencias||0)*(+r.costo_promedio||0),0);
  const compMes=compras.filter(c=>(c.fecha||'').slice(0,7)===mesAct()&&c.estado!=='anulada').reduce((s,c)=>s+(+c.total||0),0);
  // top vendidos del mes
  const cnt={};
  fact.filter(d=>(d.fecha_emision||'').slice(0,7)===mesAct()).forEach(d=>(d.items||[]).forEach(i=>{ cnt[i.nombre]=(cnt[i.nombre]||0)+(+i.qty||0); }));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);

  <div class="grid g4">
    <div class="kpi verde ok"><div class="v">${money(ventasHoy)}</div><div class="l">Ventas de hoy</div></div>
    <div class="kpi verde ok"><div class="v">${money(ventasMes)}</div><div class="l">Ventas del mes</div></div>
    <div class="kpi"><div class="v">${pend.length}</div><div class="l">Facturas con saldo (${money(pend.reduce((s,d)=>s+saldo(d),0))})</div></div>
    <div class="kpi rojo"><div class="v">${money(carteraVencida)}</div><div class="l">Cartera vencida (${vencidas.length} fact.)</div></div>
    <div class="kpi ${bajos.length?'rojo':''}"><div class="v">${bajos.length}</div><div class="l">Referencias en inventario bajo</div></div>
    <div class="kpi"><div class="v">${money(compMes)}</div><div class="l">Compras del mes</div></div>
    <div class="kpi"><div class="v">${money(valorInv)}</div><div class="l">Valor del inventario (a costo)</div></div>
    <div class="kpi"><div class="v">${refs.filter(r=>r.activo).length}</div><div class="l">Referencias activas</div></div>
  </div>
  <div class="card"><b>🏆 Más vendidos del mes</b>
    ${top.length?`<table><thead><tr><th>Producto</th><th class="num">Unidades</th></tr></thead><tbody>${top.map(([n,q])=>`<tr><td>${esc(n)}</td><td class="num">${q}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aún no hay ventas este mes.</div>'}
  </div>
  ${bajos.length?`<div class="card" style="border-left:4px solid var(--rojo)"><b style="color:var(--rojo)">⚠️ Inventario bajo</b>
    <table><thead><tr><th>Código</th><th>Referencia</th><th class="num">Exist.</th><th class="num">Mínimo</th></tr></thead><tbody>
    ${bajos.map(r=>`<tr><td>${esc(r.codigo)}</td><td>${esc(r.nombre)}</td><td class="num low">${+r.existencias||0}</td><td class="num">${+r.inv_min||0}</td></tr>`).join('')}</tbody></table></div>`:''}`);

/* ================= FACTURACIÓN ================= */
vFacturacion: safe(async function(){
  const [docs]=await Promise.all([this.docs(),this.clientes(),this.refs(),this.abonos()]);
  const sub=this._facTab||'factura';
  const abPorDoc={}; (this._abo||[]).forEach(a=>abPorDoc[a.documento_id]=(abPorDoc[a.documento_id]||0)+(+a.valor||0));
  /* Que remision o cotizacion ya genero factura. Sin esto no habia forma de
     saber que falta por facturar: es la pregunta que se hace todos los meses. */
  const yaFact={}; docs.filter(d=>d.tipo==='factura'&&d.estado!=='anulada'&&d.origen_id)
                       .forEach(d=>{ yaFact[d.origen_id]=d.numero; });
  const yaRem={};  docs.filter(d=>d.tipo==='remision'&&d.estado!=='anulada'&&d.origen_id)
                       .forEach(d=>{ yaRem[d.origen_id]=d.numero; });
  const tipos=[['cotizacion','Cotizaciones'],['remision','Remisiones'],['factura','Facturas'],['nota_credito','Notas crédito']];
  /* El cajon de Facturas muestra todo lo GENERADO: las facturas y ademas las
     remisiones cerradas, que son ventas terminadas aunque el documento no sea
     una factura. Si no, esa plata no aparecia por ningun lado. */
  const list = sub==='factura'
    ? docs.filter(d=>d.tipo==='factura' || (d.tipo==='remision'&&d.estado==='cerrada'))
    : docs.filter(d=>d.tipo===sub);
  /* Dos cosas distintas que antes iban en la misma columna y se confundian:
     ESTADO   = en que va el documento (facturada / por facturar)
     PAGO     = cuanta plata entro, que sale de los abonos del banco */
  const est=d=>{ if(d.estado==='anulada') return '<span class="badge b-gris">anulada</span>';
    if(d.tipo==='cotizacion'){
      if(yaFact[d.id]) return '<span class="badge b-ok">facturada · '+esc(yaFact[d.id])+'</span>';
      if(yaRem[d.id])  return '<span class="badge b-acc">remisionada · '+esc(yaRem[d.id])+'</span>';
      return '<span class="badge b-pend">POR REMISIONAR</span>'; }
    if(d.tipo==='remision'){
      /* Dentro del cajon de Facturas se muestra como lo que es: una venta
         generada, pero con remision en vez de factura. */
      if(d.estado==='cerrada'&&sub==='factura') return '<span class="badge b-ok">GENERADA (REM)</span>';
      if(yaFact[d.id]) return '<span class="badge b-ok">facturada · '+esc(yaFact[d.id])+'</span>';
      /* Estado final: se entrego y se cobro, pero no se va a facturar. Deja de
         contar como pendiente en vez de quedarse en rojo para siempre. */
      if(d.estado==='cerrada') return '<span class="badge b-acc">REMISIONADA · cerrada</span>';
      return '<span class="badge b-pend">POR FACTURAR</span>'; }
    if(d.tipo==='factura') return '<span class="badge b-ok">GENERADA</span>';
    return '<span class="badge b-acc">'+esc(d.estado||'ok')+'</span>'; };
  const pago=d=>{ if(d.tipo!=='factura'&&!(d.tipo==='remision'&&d.estado==='cerrada')) return '';
    const ab=abPorDoc[d.id]||0, t=+d.total||0;
    if(ab>=t&&t>0) return '<span class="badge b-ok">pagada</span>';
    if(ab>0) return '<span class="badge b-par">abono '+money(ab)+'<br><span style="font-weight:400">falta '+money(t-ab)+'</span></span>';
    return '<span class="badge b-pend">sin pagar</span>'; };
  this.set(`<h1>🧾 Facturación</h1><div class="sub2">Cotización → remisión → factura → nota crédito</div>
  <div class="tabs2">${tipos.map(([v,n])=>{
    const q = v==='factura'
      ? docs.filter(d=>d.tipo==='factura'||(d.tipo==='remision'&&d.estado==='cerrada')).length
      : docs.filter(d=>d.tipo===v).length;
    return `<button class="${v===sub?'on':''}" onclick="App._facTab='${v}';App.vFacturacion()">${n} (${q})</button>`;}).join('')}</div>
  ${(()=>{
    /* Lo entregado son las remisiones MAS las cotizaciones que salieron de una
       remision: la mercancia ya salio aunque el documento se haya movido. */
    const rem=docs.filter(d=>(d.tipo==='remision'||d.tipo==='cotizacion')&&d.estado!=='anulada');
    const pend=rem.filter(d=>!yaFact[d.id]&&d.estado!=='cerrada');
    const fac=docs.filter(d=>(d.tipo==='factura'||(d.tipo==='remision'&&d.estado==='cerrada'))&&d.estado!=='anulada');

},
async numDoc(tipo){
  const pref={cotizacion:'COT',remision:'REM',factura:'FAC',nota_credito:'NC'}[tipo]||'DOC';
  const r=await fetch(SB+'/rest/v1/ff_documentos?tipo=eq.'+tipo+'&select=id',{headers:{...H,Prefer:'count=exact',Range:'0-0'}});
  const n=+(r.headers.get('content-range')||'0/0').split('/')[1]||0;
  return pref+'-'+String(n+1).padStart(4,'0');
},
async docGuardar(){
  if(!this._lineasDoc.length){ toast('Agrega ítems'); return; }
  const tipo=this._docTipo, cliId=+$('dc_cli').value||null;
  if(!cliId){ toast('Falta el cliente'); return; }
  const sub=this._lineasDoc.reduce((s,l)=>s+l.qty*l.precio,0);
  const desc=+$('dc_desc').value||0;
  const iva=Math.round((sub-desc)*(+$('dc_iva').value||0)/100);
  const total=sub-desc+iva;
  const dias=+$('dc_dias').value||0;
  const venc=new Date(Date.now()+dias*86400000).toISOString().slice(0,10);
  const numero=await this.numDoc(tipo);
  const r=await post('ff_documentos',{tipo,numero,cliente_id:cliId,items:this._lineasDoc,subtotal:sub,descuento:desc,iva,total,
    estado:'pendiente',fecha_emision:hoy(),fecha_vencimiento:venc,notas:$('dc_notas').value.trim()});
  if(!r||!r[0]){ toast('⚠️ No se pudo guardar'); return; }
  if(tipo==='factura') await this.moverInvDoc(r[0],-1);          // factura: SALE inventario
  if(tipo==='nota_credito') await this.moverInvDoc(r[0],+1);     // nota crédito: DEVUELVE inventario
  cerrar(); toast('🧾 '+numero+' creada'); this.vFacturacion();
},
async moverInvDoc(doc,signo){
  const refs=await this.refs();
  for(const l of (doc.items||[])){
    const r=refs.find(x=>x.id===l.ref_id); if(!r) continue;
    const q=signo*(+l.qty||0);
    await post('ff_movimientos',{ref_id:r.id,tipo:signo<0?'venta':'devolucion',cantidad:q,costo_unit:+r.costo_promedio||0,doc:doc.numero});
    const upd={existencias:(+r.existencias||0)+q}; if(signo<0) upd.fecha_ult_venta=hoy();
    await patch('ff_referencias?id=eq.'+r.id,upd);
  }
},
/* Cotizacion aprobada -> remision. Es aqui donde sale la mercancia de bodega,
   no al facturar: la factura viene despues y ya no mueve inventario. */
/* Cerrar una remision: se entrego, se cobro y no se va a facturar. No se anula
   -la venta existio- pero deja de aparecer como pendiente por facturar. */
async cerrarRemision(id){
  if(!confirm('¿Dejar esta remisión como estado FINAL, sin factura? Deja de contar como pendiente por facturar.')) return;
  const r=await patch('ff_documentos?id=eq.'+id,{estado:'cerrada'});
  if(r===null){ toast('⚠️ No se pudo'); return; }
  toast('Remisión cerrada'); this.vFacturacion();
},
async reabrirRemision(id){
  await patch('ff_documentos?id=eq.'+id,{estado:'ok'});
  toast('Reabierta'); this.vFacturacion();
},
async docARemision(id){
  const rs=await api('ff_documentos?id=eq.'+id); const c=rs[0]; if(!c) return;
  if(!confirm('¿Convertir la cotización '+(c.numero||'')+' en REMISIÓN por '+money(c.total)+'? Sale la mercancía de bodega.')) return;
  const numero=await this.numDoc('remision');
  const r=await post('ff_documentos',{tipo:'remision',numero,cliente_id:c.cliente_id,items:c.items,
    subtotal:c.subtotal,descuento:c.descuento,iva:c.iva,total:c.total,estado:'ok',
    fecha_emision:hoy(),origen_id:c.id,notas:'De '+c.numero});
  if(r&&r[0]){ await this.moverInvDoc(r[0],-1);
    await patch('ff_documentos?id=eq.'+id,{estado:'remisionada'});
    toast('📦 '+numero+' creada desde '+c.numero); }
  this._facTab='remision'; this.vFacturacion();
},
/* Sirve para cotizacion Y para remision: las dos se aprueban y generan factura.
   La factura queda apuntando al documento del que salio (origen_id), que es lo
   que permite saber despues que remisiones faltan por facturar. */
async cotAFactura(id){
  const rs=await api('ff_documentos?id=eq.'+id); const c=rs[0]; if(!c) return;
  const esRem=c.tipo==='remision';
  const aviso = esRem
    ? ' La mercancía ya salió con la remisión, así que el inventario no se vuelve a mover.'
    : ' Saldrá inventario.';
  if(!confirm('¿Convertir '+(esRem?'la remisión ':'la cotización ')+(c.numero||'')
     +' en FACTURA por '+money(c.total)+'?'+aviso)) return;
  const numero=await this.numDoc('factura');
  const r=await post('ff_documentos',{tipo:'factura',numero,cliente_id:c.cliente_id,items:c.items,subtotal:c.subtotal,
    descuento:c.descuento,iva:c.iva,total:c.total,estado:'pendiente',fecha_emision:hoy(),
    fecha_vencimiento:new Date(Date.now()+30*86400000).toISOString().slice(0,10),
    origen_id:c.id, notas:'De '+c.numero});
  /* Si viene de remision el inventario NO se mueve otra vez: ya salio cuando se
     remisiono. Moverlo aca lo dejaria en negativo. */
  if(r&&r[0]){ if(!esRem) await this.moverInvDoc(r[0],-1);
    await patch('ff_documentos?id=eq.'+id,{estado:'facturada'});
    toast('🧾 '+numero+' creada desde '+c.numero); }
  this._facTab='factura'; this.vFacturacion();
},
async anularDoc(id){
  if(!confirm('¿Anular este documento? Si es factura, el inventario se devuelve.')) return;
  const rs=await api('ff_documentos?id=eq.'+id); const d=rs[0]; if(!d||d.estado==='anulada') return;
  if(d.tipo==='factura') await this.moverInvDoc(d,+1);
  await patch('ff_documentos?id=eq.'+id,{estado:'anulada'}); toast('✖ Anulado'); this.vFacturacion();
},

/* ================= CARTERA ================= */
/* ================= CARTERA · estado de cuenta =================
   Todo lo que se le ha entregado al cliente contra todo lo que ha pagado.
   La regla para no contar dos veces: un negocio se cuenta UNA sola vez, por el
   documento mas avanzado que tenga. Si la cotizacion ya es remision, cuenta la
   remision; si la remision ya es factura, cuenta la factura. */
vCartera: safe(async function(){
  const [docs]=await Promise.all([this.docs(),this.clientes(),this.abonos(),this.cajaMovs()]);
  const vivos=docs.filter(d=>d.estado!=='anulada');

  // de que documento salio cada uno, para saber cual quedo superado
  const superado={};
  vivos.forEach(d=>{ if(d.origen_id) superado[d.origen_id]=d.numero; });

  const cuenta=vivos.filter(d=>{
    if(superado[d.id]) return false;            // ya hay uno mas avanzado
    if(d.tipo==='nota_credito') return false;
    return ['factura','remision','cotizacion'].includes(d.tipo);
  }).sort((a,b)=>String(a.fecha_emision).localeCompare(String(b.fecha_emision)));

  // los pagos salen del extracto, no de abonos digitados a mano
  const pagos=(this._cmov||[]).filter(x=>x.clase==='Cobro de cliente')
    .sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));

  const totGen=cuenta.reduce((a,d)=>a+(+d.total||0),0);
  const totPag=pagos.reduce((a,p)=>a+(+p.valor||0),0);
  const saldo=totGen-totPag;

  const ETIQ={factura:'🧾 Factura', remision:'📦 Remisión', cotizacion:'📋 Cotización'};
  const estado=d=>{
    if(d.tipo==='factura') return '<span class="badge b-ok">generada</span>';
    if(d.tipo==='remision') return d.estado==='cerrada'
      ? '<span class="badge b-ok">generada (REM)</span>'
      : '<span class="badge b-pend">sin facturar</span>';
    return '<span class="badge b-pend">sin remisionar</span>';
  };

  // un solo movimiento por linea, en orden de fecha, con el saldo corriendo
  const lineas=[
    ...cuenta.map(d=>({f:d.fecha_emision, t:'cargo', v:+d.total||0,
      q:`${ETIQ[d.tipo]} ${d.numero}`, e:estado(d), n:d.notas||''})),
    ...pagos.map(p=>({f:p.fecha, t:'abono', v:-(+p.valor||0),
      q:'💵 Pago recibido', e:`<span class="badge b-acc">${esc(p.origen||'banco')}</span>`,
      n:p.detalle_fes||p.detalle||''})),
  ].sort((a,b)=>String(a.f).localeCompare(String(b.f)));
  let corr=0;

  this.set(`<h1>💰 Cartera · estado de cuenta</h1>
  <div class="sub2">${esc((this._cli&&this._cli[0]&&this._cli[0].empresa)||'Cliente')} · todo lo entregado contra todo lo pagado</div>
  <div class="grid g4">
    <div class="kpi"><div class="v">${money(totGen)}</div><div class="l">Entregado (${cuenta.length} documentos)</div></div>
    <div class="kpi ok verde"><div class="v">${money(totPag)}</div><div class="l">Pagado (${pagos.length} consignaciones)</div></div>
    <div class="kpi ${saldo>0?'rojo':'ok verde'}"><div class="v">${money(Math.abs(saldo))}</div>
      <div class="l">${saldo>0?'Nos deben':(saldo<0?'Pagó de más — anticipo':'Al día')}</div></div>
  </div>

  <div class="card">
    <div class="mini" style="font-weight:700;margin-bottom:6px">CÓMO SE COMPONE LO ENTREGADO</div>
    ${['factura','remision','cotizacion'].map(t=>{
      const l=cuenta.filter(d=>d.tipo===t); if(!l.length) return '';
      const v=l.reduce((a,d)=>a+(+d.total||0),0);
      return `<div class="row" style="justify-content:space-between;font-size:13px;padding:3px 0">
        <span>${ETIQ[t]} · ${l.length} — ${esc(l.map(d=>d.numero).join(', '))}</span><b>${money(v)}</b></div>`;
    }).join('')}
    <div class="mini" style="margin-top:6px">Cada negocio se cuenta una sola vez: si la cotización ya se remisionó o se facturó, solo cuenta el documento final.</div>
  </div>

  <div class="card" style="padding:0;overflow-x:auto"><table>
  <thead><tr><th>Fecha</th><th>Documento</th><th>Estado</th><th>Detalle</th><th class="num">Cargo</th><th class="num">Abono</th><th class="num">Saldo</th></tr></thead><tbody>
  ${lineas.map(x=>{ corr+=x.v; return `<tr>
    <td>${fecha(x.f)}</td><td><b>${x.q}</b></td><td>${x.e}</td>
    <td class="mini">${esc(String(x.n).slice(0,46))}</td>
    <td class="num">${x.v>0?money(x.v):''}</td>
    <td class="num" style="color:var(--ok)">${x.v<0?money(-x.v):''}</td>
    <td class="num"><b>${money(corr)}</b></td></tr>`; }).join('')
  ||'<tr><td colspan="7" class="empty">Sin movimientos</td></tr>'}
  <tr style="background:#f6f7f9"><td colspan="4"><b>SALDO</b></td>
    <td class="num"><b>${money(totGen)}</b></td>
    <td class="num" style="color:var(--ok)"><b>${money(totPag)}</b></td>
    <td class="num"><b style="color:${saldo>0?'var(--rojo)':'var(--ok)'}">${money(saldo)}</b></td></tr>
  </tbody></table></div>`);
},'la cartera'),

async abonoGuardar(docId){
  const valor=+$('ab_valor').value||0; if(valor<=0){ toast('Pon el valor'); return; }
  const bancoId=+$('ab_banco').value||null;
  await post('ff_abonos',{documento_id:docId,valor,fecha:$('ab_fecha').value||hoy(),banco_id:bancoId,notas:$('ab_notas').value.trim()});
  if(bancoId) await post('ff_banco_mov',{banco_id:bancoId,tipo:'recaudo',valor,detalle:'Abono factura #'+docId,fecha:$('ab_fecha').value||hoy()});
  // actualizar estado de la factura
  const abs=await api('ff_abonos?documento_id=eq.'+docId);
  const doc=(await api('ff_documentos?id=eq.'+docId))[0];
  const ab=abs.reduce((s,a)=>s+(+a.valor||0),0);
  await patch('ff_documentos?id=eq.'+docId,{estado: ab>=(+doc.total||0)?'pagada':'parcial'});

},

/* ================= CAJA =================

   plata, venga del banco, de efectivo o de un prestamo. Dos cajones:
     BANCOS -> la relacion de extractos, mes por mes, para abrirlos
     CAJA   -> todos los movimientos, con lo que de verdad fue cada uno

   movimiento lleva ademas un "detalle FES" y, si aplica, a que socio se carga. */

/* Lee una cifra escrita como sea. El punto puede ser separador de miles o coma
   decimal segun el caso, asi que se mira el ultimo separador: si le siguen una o
   dos cifras, es decimal; si no, es de miles. Antes se borraban todos los puntos
   y una compra de 153.983,39 se volvia de 15.398.339. */
_plata(t){
  let x=String(t||'').replace(/[^0-9.,-]/g,'');
  const neg=x.startsWith('-'); x=x.replace(/-/g,'');
  const iP=x.lastIndexOf('.'), iC=x.lastIndexOf(',');
  const i=Math.max(iP,iC);
  let ent=x, dec='';
  if(i>=0 && x.length-i-1<=2 && x.length-i-1>0){ ent=x.slice(0,i); dec=x.slice(i+1); }
  ent=ent.replace(/[.,]/g,'');
  const v=+(ent+(dec?'.'+dec:''))||0;
  return neg?-v:v;
},
async cajaGuardar(id){
  const g=i=>($(i)?$(i).value.trim():'');
  const val=Math.abs(this._plata(g('cj_val')));
  if(!val){ alert('Ponle el valor.'); return; }
  const es=g('cj_es');
  const b={fecha:g('cj_fec')||hoy(), origen:g('cj_org'), tipo:es,
    valor: es==='salida' ? -Math.abs(val) : Math.abs(val),
    detalle:g('cj_det'), detalle_fes:g('cj_fes'), clase:g('cj_cla'),
    socio:g('cj_soc')||null, mes:(g('cj_fec')||hoy()).slice(0,7), manual:true};
  if(!id){ const bk=(this._bancos&&this._bancos[0])||null;
    const bs=await api('ff_bancos?select=id&limit=1'); if(bs&&bs[0]) b.banco_id=bs[0].id; }
  const r = id ? await patch('ff_banco_mov?id=eq.'+id,b) : await post('ff_banco_mov',b);
  if(r===null){ toast('⚠️ No se pudo guardar'); return; }
  cerrar(); toast('Guardado');
  /* Si se esta completando a mano, se sigue con el siguiente que falte: asi se
     hacen de corrido sin volver a buscar en la lista. */
  await this.cajaMovs();
  if(this._cajaFalta==='detalle'){
    const sig=(this._cmov||[]).find(z=>!z.detalle_fes);
    this._cajaPaint();
    if(sig){ this.cajaForm(sig.id); return; }
    toast('¡Listo! No queda ninguno sin detalle');
    return;
  }
  this._cajaPaint();
},

  <thead><tr><th>Empresa</th><th>NIT</th><th>Contacto</th><th>Ciudad</th><th class="num">Cupo crédito</th><th class="num">Compras</th><th></th></tr></thead><tbody>
  ${cli.map(c=>{ const h=hist(c.id); return `<tr><td><b>${esc(c.empresa)}</b></td><td>${esc(c.nit||'')}</td>
  <td>${esc(c.contacto||'')}<div class="mini">${esc(c.telefono||'')} ${esc(c.correo||'')}</div></td>
  <td>${esc(c.ciudad||'')}</td><td class="num">${money(c.cupo_credito)}</td>
  <td class="num">${h.length} fact. · ${money(h.reduce((s,f)=>s+(+f.total||0),0))}</td>
  <td><button class="btn sm sec" onclick="App.clienteForm(${c.id})">✏️</button></td></tr>`; }).join('')||'<tr><td colspan="7" class="empty">Registra tu primer cliente</td></tr>'}</tbody></table></div>`);
},'clientes'),
clienteForm(id){
  const c=(this._cli||[]).find(x=>x.id===id)||{};
  const F=(k,l,tp)=>`<div><label>${l}</label><input id="cf_${k}" type="${tp||'text'}" value="${esc(c[k]==null?'':c[k])}"></div>`;
  modal(`<h3>${id?'✏️ Editar':'➕ Nuevo'} cliente</h3><div class="frm">
  ${F('empresa','Empresa')}${F('nit','NIT')}${F('contacto','Contacto')}${F('correo','Correo')}
  ${F('telefono','Teléfono/WhatsApp')}${F('ciudad','Ciudad')}${F('direccion','Dirección')}${F('cupo_credito','Cupo de crédito ($)','number')}</div>
  <label>Condiciones comerciales</label><input id="cf_condiciones" value="${esc(c.condiciones||'')}">
  <div style="display:flex;gap:8px;margin-top:14px">
  <button class="btn" style="flex:1" onclick="App.clienteGuardar(${id||'null'})">💾 Guardar</button>
  <button class="btn sec" onclick="cerrar()">Cancelar</button></div>`);
},
async clienteGuardar(id){
  const v=k=>$('cf_'+k).value.trim();
  const b={empresa:v('empresa'),nit:v('nit'),contacto:v('contacto'),correo:v('correo'),telefono:v('telefono'),
    ciudad:v('ciudad'),direccion:v('direccion'),cupo_credito:+v('cupo_credito')||0,condiciones:v('condiciones')};
  if(!b.empresa){ toast('Falta la empresa'); return; }
  id? await patch('ff_clientes?id=eq.'+id,b) : await post('ff_clientes',b);
  cerrar(); toast('🏢 Cliente guardado'); this.vClientes();
},

/* ================= PROVEEDORES ================= */
vProveedores: safe(async function(){
  const prov=await this.provs();
  this.set(`<h1>🚚 Proveedores</h1><div class="sub2">${prov.length} proveedores</div>
  <div class="tools"><button class="btn" onclick="App.provForm()">➕ Nuevo proveedor</button></div>
  <div class="card" style="padding:0;overflow-x:auto"><table>
  <thead><tr><th>Razón social</th><th>NIT</th><th>Contacto</th><th>Ciudad/País</th><th>Marcas</th><th>Entrega</th><th></th></tr></thead><tbody>
  ${prov.map(p=>`<tr><td><b>${esc(p.razon_social)}</b><div class="mini">${esc(p.nombre_comercial||'')}</div></td>
  <td>${esc(p.nit||'')}</td><td>${esc(p.contacto||'')}<div class="mini">${esc(p.celular||'')} ${esc(p.correo||'')}</div></td>
  <td>${esc(p.ciudad||'')} ${esc(p.pais||'')}</td><td>${esc(p.marcas||'')}</td><td>${esc(p.tiempo_entrega||'')}</td>
  <td><button class="btn sm sec" onclick="App.provForm(${p.id})">✏️</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Registra tu primer proveedor</td></tr>'}</tbody></table></div>`);
},'proveedores'),
provForm(id){
  const p=(this._prov||[]).find(x=>x.id===id)||{};
  const F=(k,l)=>`<div><label>${l}</label><input id="pf_${k}" value="${esc(p[k]==null?'':p[k])}"></div>`;
  modal(`<h3>${id?'✏️ Editar':'➕ Nuevo'} proveedor</h3><div class="frm">
  ${F('razon_social','Razón social')}${F('nit','NIT')}${F('nombre_comercial','Nombre comercial')}${F('contacto','Contacto')}
  ${F('cargo','Cargo')}${F('celular','Celular')}${F('whatsapp','WhatsApp')}${F('correo','Correo')}
  ${F('web','Página web')}${F('direccion','Dirección')}${F('ciudad','Ciudad')}${F('pais','País')}
  ${F('marcas','Marcas que representa')}${F('condiciones_pago','Condiciones de pago')}${F('moneda','Moneda')}${F('tiempo_entrega','Tiempo de entrega')}</div>
  <label>Observaciones</label><textarea id="pf_observaciones" rows="2">${esc(p.observaciones||'')}</textarea>
  <div style="display:flex;gap:8px;margin-top:14px">
  <button class="btn" style="flex:1" onclick="App.provGuardar(${id||'null'})">💾 Guardar</button>
  <button class="btn sec" onclick="cerrar()">Cancelar</button></div>`);
},
async provGuardar(id){
  const v=k=>$('pf_'+k).value.trim();
  const b={}; ['razon_social','nit','nombre_comercial','contacto','cargo','celular','whatsapp','correo','web','direccion','ciudad','pais','marcas','condiciones_pago','moneda','tiempo_entrega','observaciones'].forEach(k=>b[k]=v(k));
  if(!b.razon_social){ toast('Falta la razón social'); return; }
  id? await patch('ff_proveedores?id=eq.'+id,b) : await post('ff_proveedores',b);
  cerrar(); toast('🚚 Proveedor guardado'); this.vProveedores();
},

/* ================= REPORTES ================= */
vReportes: safe(async function(){
  const [refs,docs,compras]=await Promise.all([this.refs(),this.docs(),GETALL('ff_compras?limit=2000')]);
  await Promise.all([this.clientes(),this.provs(),this.abonos()]);
  const fact=docs.filter(d=>d.tipo==='factura'&&d.estado!=='anulada');
  // ventas por mes (últimos 6)
  const meses={}; fact.forEach(f=>{ const m=(f.fecha_emision||'').slice(0,7); if(m) meses[m]=(meses[m]||0)+(+f.total||0); });
  const mesesArr=Object.entries(meses).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
  // utilidad por producto (ventas del histórico)
  const util={};
  fact.forEach(f=>(f.items||[]).forEach(i=>{ const r=refs.find(x=>x.id===i.ref_id);
    const cp=r?(+r.costo_promedio||0):0; const u=(+i.precio-cp)*(+i.qty||0);
    const k=i.codigo+' '+i.nombre; util[k]=util[k]||{v:0,u:0,q:0}; util[k].v+=(+i.precio*(+i.qty||0)); util[k].u+=u; util[k].q+=(+i.qty||0); }));
  const utilArr=Object.entries(util).sort((a,b)=>b[1].u-a[1].u).slice(0,12);
  // sin movimiento 90 días
  const lim=new Date(Date.now()-90*86400000).toISOString().slice(0,10);
  const sinMov=refs.filter(r=>r.activo&&(+r.existencias||0)>0&&(!r.fecha_ult_venta||r.fecha_ult_venta<lim));
  // compras por proveedor
  const cxp={}; compras.filter(c=>c.estado!=='anulada').forEach(c=>{ const n=this.cliNomP(c.proveedor_id); cxp[n]=(cxp[n]||0)+(+c.total||0); });
  const valorInv=refs.reduce((s,r)=>s+(+r.existencias||0)*(+r.costo_promedio||0),0);
  this.set(`<h1>📈 Reportes</h1><div class="sub2">Indicadores comerciales y financieros</div>
  <div class="grid g4">
    <div class="kpi"><div class="v">${money(valorInv)}</div><div class="l">Inventario valorizado (a costo)</div></div>
    <div class="kpi ok verde"><div class="v">${money(utilArr.reduce((s,[,x])=>s+x.u,0))}</div><div class="l">Utilidad bruta histórica</div></div>
    <div class="kpi ${sinMov.length?'rojo':''}"><div class="v">${sinMov.length}</div><div class="l">Referencias sin venta en 90 días</div></div>
  </div>
  <div class="card"><b>📅 Ventas por mes</b>
  <table><thead><tr><th>Mes</th><th class="num">Ventas</th></tr></thead><tbody>
  ${mesesArr.map(([m,v])=>`<tr><td>${m}</td><td class="num">${money(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Sin datos</td></tr>'}</tbody></table></div>
  <div class="card"><b>💎 Utilidad por producto (top)</b>
  <table><thead><tr><th>Producto</th><th class="num">Und.</th><th class="num">Vendido</th><th class="num">Utilidad</th></tr></thead><tbody>
  ${utilArr.map(([k,x])=>`<tr><td>${esc(k)}</td><td class="num">${x.q}</td><td class="num">${money(x.v)}</td><td class="num" style="color:var(--ok);font-weight:700">${money(x.u)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Sin ventas aún</td></tr>'}</tbody></table></div>
  <div class="card"><b>🛒 Compras por proveedor</b>
  <table><thead><tr><th>Proveedor</th><th class="num">Comprado</th></tr></thead><tbody>
  ${Object.entries(cxp).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num">${money(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">Sin compras aún</td></tr>'}</tbody></table></div>
  ${sinMov.length?`<div class="card"><b>🧊 Sin movimiento (90 días, con existencias)</b>
  <table><thead><tr><th>Código</th><th>Referencia</th><th class="num">Exist.</th><th>Última venta</th></tr></thead><tbody>
  ${sinMov.map(r=>`<tr><td>${esc(r.codigo)}</td><td>${esc(r.nombre)}</td><td class="num">${+r.existencias||0}</td><td>${fecha(r.fecha_ult_venta)||'nunca'}</td></tr>`).join('')}</tbody></table></div>`:''}`);
},'reportes'),

/* ================= 🚛 IMPORTACIÓN (estudio de viabilidad camión cisterna China) ================= */
vImportacion: safe(async function(){
  const sub=this._impTab||'comp';
  const [items,checks,cfg]=await Promise.all([
    api('ff_import_items?order=escenario,orden&limit=200'),
    api('ff_import_check?order=orden,id&limit=300'),
    api('ff_import_cfg')]);
  this._impItems=items; this._impChecks=checks;
  this._trm=+((cfg.find(x=>x.clave==='trm')||{}).valor||4100);
  this._unidades=+((cfg.find(x=>x.clave==='unidades')||{}).valor||3);
  this._epc=+((cfg.find(x=>x.clave==='est_x_cont')||{}).valor||2);
  this.set(`<h1>🚛 Importación · camión cisterna de aviación</h1>
  <div class="sub2">Proveedor: CLW (Chengli, Suizhou-China) · 2 alternativas: camión COMPLETO vs solo ESTRUCTURA + chasis colombiano</div>
  <div class="tabs2">
    <button class="${sub==='comp'?'on':''}" onclick="App._impTab='comp';App.vImportacion()">📊 Comparativo de costos</button>
    <button class="${sub==='chk'?'on':''}" onclick="App._impTab='chk';App.vImportacion()">✅ Checklist (China + Colombia)</button>
    <button class="no-print" style="background:#e8ecf2;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer" onclick="window.print()">🖨️ Imprimir</button>
  </div>
  ${sub==='comp'?this._impComparativo():this._impChecklist()}`);
},'importación'),

_impCalc(esc){
  const it=(this._impItems||[]).filter(x=>x.escenario===esc);
  const epc=Math.max(1,this._epc||1);
  const efect=x=>{ let v=+x.valor||0; if(esc==='estructura' && x.tipo==='cif_usd' && /flete/i.test(x.concepto)) v=v/epc; return v; };
  const cif=it.filter(x=>x.tipo==='cif_usd').reduce((s,x)=>s+efect(x),0);
  const arancel=it.filter(x=>x.tipo==='pct_cif').reduce((s,x)=>s+cif*(+x.valor||0)/100,0);
  const iva=it.filter(x=>x.tipo==='pct_iva').reduce((s,x)=>s+(cif+arancel)*(+x.valor||0)/100,0);
  const usd=it.filter(x=>x.tipo==='usd').reduce((s,x)=>s+(+x.valor||0),0);
  const cop=it.filter(x=>x.tipo==='cop').reduce((s,x)=>s+(+x.valor||0),0);
  const totUsd=cif+arancel+iva+usd;
  const n=Math.max(1,this._unidades||1);
  const totCop=totUsd*this._trm+cop;
  return {it,cif,arancel,iva,usd,cop,totUsd,totCop,n,proyUsd:totUsd*n,proyCop:totCop*n};
},
_impCol(escN,titulo,color){
  const c=this._impCalc(escN);
  const fUsd=n=>'US$ '+Math.round(n).toLocaleString('es-CO');
  const linea=x=>{
    const calc=x.tipo==='pct_cif'? ' → '+fUsd(c.cif*(+x.valor||0)/100) : x.tipo==='pct_iva'? ' → '+fUsd((c.cif+c.arancel)*(+x.valor||0)/100) : '';
    return `<tr><td>${esc(x.concepto)}${x.notas?`<div class="mini">${esc(x.notas)}</div>`:''}</td>
      <td class="num" style="white-space:nowrap"><input type="number" value="${+x.valor}" style="width:95px;text-align:right;padding:5px" onchange="App.impVal(${x.id},this.value)"> <span class="mini">${x.tipo==='cop'?'COP':x.tipo.startsWith('pct')?'%':'USD'}</span>${calc?`<div class="mini">${calc}</div>`:''}</td>
      <td><select style="padding:5px;font-size:12px" onchange="App.impEst(${x.id},this.value)">
        <option value="estimado" ${x.estado==='estimado'?'selected':''}>⚠️ estimado</option>
        <option value="cotizado" ${x.estado==='cotizado'?'selected':''}>✅ cotizado</option>
        <option value="confirmado" ${x.estado==='confirmado'?'selected':''}>✅ confirmado</option></select></td></tr>`; };
  return `<div class="card" style="border-top:4px solid ${color};flex:1;min-width:330px">
    <b style="font-size:15px">${titulo}</b>
    <table style="margin-top:8px"><thead><tr><th>Concepto</th><th class="num">Valor</th><th>Estado</th></tr></thead>
    <tbody>${c.it.map(linea).join('')}
    <tr><td class="num" style="font-weight:700">CIF (FOB+flete+seguro)</td><td class="num" colspan="2"><b>${fUsd(c.cif)}</b></td></tr>
    <tr><td class="num" style="font-weight:700">TOTAL en dólares</td><td class="num" colspan="2"><b>${fUsd(c.totUsd)}</b></td></tr>
    <tr><td class="num" style="font-weight:800;font-size:15px">TOTAL POR UNIDAD puesto en Colombia</td><td class="num" colspan="2" style="font-weight:800;font-size:16px;color:${color}">${money(c.totCop)}</td></tr>
    <tr><td class="num" style="font-weight:800;font-size:15px">🚛 TOTAL PROYECTO (${c.n} unidades)</td><td class="num" colspan="2" style="font-weight:800;font-size:17px;color:${color};background:#f6f8fc">${money(c.proyCop)}</td></tr>
    </tbody></table></div>`;
},
_impComparativo(){
  const a=this._impCalc('completo'), b=this._impCalc('estructura');
  const dif=a.proyCop-b.proyCop;
  return `<div class="card" style="background:#f6f8fc">
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
      <div><label style="margin:0">TRM (COP por USD)</label>
        <input type="number" value="${this._trm}" style="width:120px" onchange="App.impTrm(this.value)"></div>
      <div><label style="margin:0">Unidades a traer</label>
        <input type="number" value="${this._unidades}" min="1" style="width:80px" onchange="App.impCfg('unidades',this.value)"></div>
      <div><label style="margin:0">Estructuras por contenedor</label>
        <input type="number" value="${this._epc}" min="1" style="width:80px" onchange="App.impCfg('est_x_cont',this.value)"></div>
      <div class="kpi" style="flex:1;min-width:200px;border-left-color:${dif>0?'var(--ok)':'var(--rojo)'}">
        <div class="v">${money(Math.abs(dif))}</div>
        <div class="l">${dif>0?'AHORRO DEL PROYECTO armando en Colombia (estructura + chasis local)':'El camión completo sale más barato en el proyecto'}</div></div>
    </div>
    <div class="mini" style="margin-top:6px">⚠️ Los valores "estimado" son de referencia para el estudio — reemplázalos con las cotizaciones reales (naviera, aduana, concesionario). Todo es editable y queda guardado.</div>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    ${this._impCol('completo','🚛 ALTERNATIVA A · Camión COMPLETO desde China','#1b2a44')}
    ${this._impCol('estructura','🔧 ALTERNATIVA B · ESTRUCTURA china + chasis colombiano','#f7941d')}
  </div>
  <div class="card"><b>📌 Lo que dijo la fábrica (base del estudio)</b>
    <ul style="margin:8px 0 0 18px;line-height:1.7;font-size:13.5px">
      <li><b>Estructura (tanque + equipos, SIN chasis): US$ 24.000</b> — mismo precio para 2–5 m³. Exige chasis con <b>toma de fuerza (PTO)</b>.</li>
      <li><b>Camión completo Dongfeng 5.000 L: US$ 35.000</b>. Falta preguntar el precio del de 3 m³.</li>
      <li>Volúmenes de fábrica: 5, 8, 12 m³ y semirremolque 45 m³. Producción ≈ <b>1 mes</b> (35 días hábiles tras anticipo).</li>
      <li>Dos tipos: <b>a presión</b> (DN65 aviación ≥1.200 L/min) y <b>convencional</b> (gravedad, carrete 15 m).</li>
      <li>Medio: queroseno de aviación (Jet) y gasolina de aviación — <b>pedir por escrito que la misma unidad sirva para ambos</b>.</li>
      <li>Certificaciones ISO9001 y CCC. Confirmar forma de pago (anticipo + saldo).</li>
    </ul></div>`;
},
async impVal(id,v){ await patch('ff_import_items?id=eq.'+id,{valor:+v||0}); const x=(this._impItems||[]).find(i=>i.id===id); if(x)x.valor=+v||0; this.vImportacion(); },
async impEst(id,v){ await patch('ff_import_items?id=eq.'+id,{estado:v}); const x=(this._impItems||[]).find(i=>i.id===id); if(x)x.estado=v; this.vImportacion(); },
async impTrm(v){ this._trm=+v||4100; await patch('ff_import_cfg?clave=eq.trm',{valor:String(this._trm)}); this.vImportacion(); },
async impCfg(k,v){ v=Math.max(1,+v||1);
  const r=await patch('ff_import_cfg?clave=eq.'+k,{valor:String(v)});
  try{ await post('ff_import_cfg',{clave:k,valor:String(v)}); }catch(e){}
  this.vImportacion(); },

_impChecklist(){
  const ch=this._impChecks||[];
  const fc=this._impFiltro||'todos';
  const list=ch.filter(x=>fc==='todos'||x.config===fc||x.config==='ambos');
  const cats=[...new Set(list.map(x=>x.categoria))];
  const EST={ofrecido:['✅ Lo ofrecen','b-ok'],por_confirmar:['⚠️ Por confirmar','b-par'],no_incluye:['❌ NO incluye','b-pend'],resuelto:['✔️ Resuelto','b-ok'],na:['— No aplica','b-gris']};
  const done=list.filter(x=>['ofrecido','resuelto','na'].includes(x.estado)).length;
  return `<div class="card" style="background:#f6f8fc;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <b>Progreso: ${done}/${list.length}</b>
    <select style="max-width:240px" onchange="App._impFiltro=this.value;App.vImportacion()">
      <option value="todos" ${fc==='todos'?'selected':''}>Ver todo</option>
      <option value="completo" ${fc==='completo'?'selected':''}>Solo alternativa COMPLETO</option>
      <option value="estructura" ${fc==='estructura'?'selected':''}>Solo alternativa ESTRUCTURA</option></select>
    <button class="btn sm navy no-print" onclick="App.impAddChk()">➕ Agregar punto</button>
    <span class="mini">Esto es lo que se revisa con China ANTES de viajar y en la visita a planta.</span></div>
  ${cats.map(cat=>`<div class="card"><b>${esc(cat)}</b>
    <table style="margin-top:6px"><tbody>
    ${list.filter(x=>x.categoria===cat).map(x=>`<tr><td style="width:46%">${esc(x.item)}${x.config!=='ambos'?` <span class="chip">${esc(x.config)}</span>`:''}</td>
      <td style="width:150px"><select style="padding:5px;font-size:12px" onchange="App.impChkEst(${x.id},this.value)">
        ${Object.entries(EST).map(([k,ar])=>`<option value="${k}" ${x.estado===k?'selected':''}>${ar[0]}</option>`).join('')}</select></td>
      <td><input value="${esc(x.notas||'')}" placeholder="notas…" style="padding:5px;font-size:12.5px" onchange="App.impChkNota(${x.id},this.value)"></td></tr>`).join('')}
    </tbody></table></div>`).join('')}`;
},
async impChkEst(id,v){ await patch('ff_import_check?id=eq.'+id,{estado:v}); const x=(this._impChecks||[]).find(i=>i.id===id); if(x)x.estado=v; this.vImportacion(); },
async impChkNota(id,v){ await patch('ff_import_check?id=eq.'+id,{notas:v}); const x=(this._impChecks||[]).find(i=>i.id===id); if(x)x.notas=v; },
async impAddChk(){
  const item=prompt('¿Qué punto quieres agregar al checklist?'); if(!item) return;
  await post('ff_import_check',{config:'ambos',categoria:'4. Puntos adicionales',item,estado:'por_confirmar',orden:90});
  toast('➕ Agregado'); this.vImportacion();
},
};
App.nav(); App.go('inicio');
</script>
