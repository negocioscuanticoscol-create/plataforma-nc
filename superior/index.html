<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colchones Nido · fábrica y almacenes</title>
<style>
  :root{
    /* NIDO COLCHONES — los colores salen del logo: el azul petróleo de la N,
       el arena del nido y el crema del fondo. Los nombres de variable se dejan
       como estaban (navy, gold) para no tocar las 600 líneas que las usan. */
    --navy:#144357; --navy2:#0e3243; --gold:#bca890; --gold2:#d9c8b6; --goldsoft:#f0e8db;
    --paper:#f4efe4; --card:#fffdf8; --ink:#14313f; --ink2:#4a6472; --mut:#8b9aa3;
    --line:#e4dccd; --line2:#f0eadd;
    --ok:#3f7a5f; --okbg:#e6f0e9; --bad:#a8443a; --badbg:#f7e6e3; --warn:#b5761f;
    --sh:0 1px 2px rgba(20,67,87,.06),0 12px 30px -18px rgba(20,67,87,.32);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .serif{font-family:Georgia,"Times New Roman",serif}
  .wrap{max-width:940px;margin:0 auto;padding:0 15px 96px}
  /* header — fondo crema, el mismo del logo, para que el símbolo no quede
     dentro de un recuadro de otro color */
  header{background:var(--goldsoft);color:var(--ink);padding:11px 0;border-bottom:1px solid var(--line)}
  .hd{max-width:940px;margin:0 auto;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mk{width:46px;height:37px;flex:none;object-fit:contain}
  .brand .tx{line-height:1}
  .brand .t1{font-family:Georgia,serif;font-weight:700;font-size:19px;letter-spacing:.06em;color:var(--navy)}
  .brand .t1 b{color:var(--navy);font-weight:700}
  .brand .t2{font-size:8.5px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;margin-top:3px}
  .quien{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:right}
  .quien a{color:var(--ink2);cursor:pointer;text-decoration:underline}
  /* nav en DOS LÍNEAS: arriba VENTAS (la fábrica), abajo DATA (los almacenes).
     Las dos barras son iguales en las dos apps: se ve como una sola aplicación. */
  nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .nvl{display:flex;align-items:stretch;border-bottom:1px solid var(--line2)}
  .nvl:last-child{border-bottom:none}
  .nvl .et{flex:0 0 auto;display:flex;align-items:center;padding:0 12px 0 15px;font-size:9.5px;
    font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
    border-right:1px solid var(--line2);background:var(--goldsoft)}
  .nvl.on .et{color:var(--navy)}
  /* justify-content:center centra las pestañas; el margin:auto del interior evita
     que se peguen a la izquierda cuando hay scroll horizontal en pantalla chica. */
  .nv{flex:1;display:flex;gap:1px;padding:0 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:center}
  .nv>*{margin:0} .nv::before,.nv::after{content:'';margin:auto}
  .nv::-webkit-scrollbar{height:0}
  nav button{flex:0 0 auto;background:none;border:none;padding:11px 12px;font-size:12.5px;font-weight:600;
    color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
  nav button:hover{color:var(--ink2)}
  nav button.on{color:var(--navy);border-bottom-color:var(--gold)}
  h1{font-family:Georgia,serif;font-size:24px;font-weight:700;margin:20px 0 2px;color:var(--navy)}
  .sub{color:var(--mut);font-size:13px;margin-bottom:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
  label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:9px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{min-height:60px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .btn{padding:12px 17px;border:none;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.gold{background:var(--gold);color:var(--navy2)}
  .btn.gh{background:transparent;border:1px solid var(--line);color:var(--ink2)}
  .btn.full{width:100%;margin-top:10px}
  .btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--sh)}
  .item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .nm{font-weight:700;font-size:15px;color:var(--navy)} .mt{font-size:12.5px;color:var(--mut);margin-top:2px}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  @media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--sh)}
  .kpi b{display:block;font-size:20px;font-family:Georgia,serif;color:var(--navy)}
  .kpi span{font-size:11px;color:var(--mut)}
  .kpi.dark{background:var(--navy);color:#fff}.kpi.dark b{color:var(--gold2)}.kpi.dark span{color:#9fb0cf}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--goldsoft);color:var(--warn)}
  .chip.tipo{background:#e8edf6;color:var(--navy)}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.bad{background:var(--badbg);color:var(--bad)}
  .et{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);cursor:pointer;background:#fff;white-space:nowrap}
  .et.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .row{display:flex;align-items:center}
  .dim{color:var(--mut)} .empty{text-align:center;color:var(--mut);padding:30px;font-size:14px}
  .hint{font-size:11.5px;color:var(--mut);margin-top:6px}
  .hide{display:none!important}
  /* login — azul petróleo de la marca; el logo va dentro de un óvalo crema,
     como un huevo en el nido, porque su trazo es azul y sobre fondo oscuro
     desaparecería. */
  #login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px;background:radial-gradient(120% 90% at 50% 0%,#1b5670 0%,#144357 45%,#0e3243 100%)}
  #login .card{width:100%;max-width:372px;text-align:center;padding:0;border:none;background:none;box-shadow:none}
  #login .sello{width:132px;height:132px;margin:0 auto 20px;border-radius:50%;background:var(--goldsoft);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 44px -18px rgba(0,0,0,.55),0 0 0 1px rgba(217,200,182,.35)}
  #login .mk{width:92px;height:74px;object-fit:contain;display:block}
  #login h2{font-family:Georgia,serif;color:#fff;font-size:31px;letter-spacing:.16em;font-weight:700;line-height:1}
  #login .t2{font-size:9.5px;letter-spacing:.44em;color:var(--gold2);text-transform:uppercase;margin:8px 0 26px}
  #login .caja{background:rgba(0,0,0,.18);border:1px solid rgba(217,200,182,.22);border-radius:14px;padding:22px 20px}
  #login input{text-align:center;letter-spacing:3px;font-size:16px;background:rgba(255,253,248,.06);
    border-color:rgba(217,200,182,.3);color:#fff}
  #login input::placeholder{color:#9fb5bf;letter-spacing:1px}
  #login input:focus{border-color:var(--gold2);background:rgba(255,253,248,.1)}
  #login .btn{margin-top:12px}
  #login .err{color:#ffb0a6;font-size:13px;margin-top:10px;display:none}
  #login .pie{margin-top:20px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7d9aa8}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(11,28,61,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
  #modal.hide{display:none}
  #modal .box{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px;max-height:92vh;overflow:auto}
  @media(min-width:560px){#modal{align-items:center}#modal .box{border-radius:16px}}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
</style>

<!-- marca reutilizable (cisne estilizado en dorado) -->
<!-- El cisne que se usaba como marca provisional se retiró: ahora el símbolo
     es el logo real de Nido, en assets/nido-logo.png -->


<div id="login">
  <div class="card">
    <div class="sello"><img class="mk" src="../assets/nido-logo.png" alt="Nido Colchones"></div>
    <h2 class="serif">NIDO</h2>
    <div class="t2">Colchones</div>
    <div class="caja">
      <input id="lg" type="password" placeholder="Clave" onkeydown="if(event.key==='Enter')App.login()">
      <button class="btn gold full" onclick="App.login()">Entrar</button>
      <div id="lgerr" class="err">Clave incorrecta</div>
    </div>
    <div class="pie">Ventas · Data</div>
  </div>
</div>

<div id="app" class="hide">
  <header><div class="hd">
    <div class="brand"><img class="mk" src="../assets/nido-logo.png" alt="Nido">
      <div class="tx"><div class="t1">NIDO</div><div class="t2">Colchones</div></div></div>
    <div class="quien" id="rol"></div>
  </div></header>
  <nav>
    <div class="nvl on"><span class="et">Ventas</span><div class="nv" id="nav"></div></div>
    <div class="nvl" id="fila-data" style="display:none"><span class="et">Data</span><div class="nv" id="navdata"></div></div>
  </nav>
  <div class="wrap"><div id="main"></div></div>
</div>

<div id="modal" class="hide"><div class="box" id="modalbox"></div></div>

<script>
const $=id=>document.getElementById(id);
function modal(h){ $('modalbox').innerHTML=h; $('modal').classList.remove('hide'); }
function cerrar(){ $('modal').classList.add('hide'); }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal')cerrar(); });

const App={
  SB:'https://fnayedgvamxktxfvywwl.supabase.co',
  KEY:'sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv',
  /* ---------- QUIÉN ENTRA Y QUÉ VE ----------
     Tres llaves. La sesión se guarda en localStorage (no en sessionStorage)
     a propósito: así al abrir DATA en otra pestaña del navegador no vuelve a
     pedir la clave, y con una sola salida se cierran las dos. */
  PASS:{ 'superioradmin2026':'admin', 'gloria2026':'facturacion', 'diana2026':'ventas' },
  /* editarPed: corregir un pedido ya tomado. Es de facturación (Gloria) y del
     administrador; ventas toma pedidos pero no los reescribe. */
  ROLES:{
    admin:      {nombre:'Administrador', quien:'',       data:true,  usuarios:true,  editarPed:true},
    facturacion:{nombre:'Facturación',   quien:'Gloria', data:true,  usuarios:false, editarPed:true},
    ventas:     {nombre:'Ventas',        quien:'Diana',  data:false, usuarios:false, editarPed:false},
  },
  puede(q){ const r=this.ROLES[this.rol]||{}; return !!r[q]; },
  TIPOS:['Cliente final','Local','Distribuidor'],
  TRANSPORTE:['Transporte propio','Yango','Transportadora','Recoge en fábrica','Domicilio'],
  PAGO:['Efectivo','Transferencia','Tarjeta crédito','Nequi','Crédito'],
  TAMANOS:['Sencilla 100x190','Semidoble 120x190','Doble 140x190','Queen 160x190','King 200x200','Especial (a medida)'],
  TIPOCOL:['Resortado','Espuma','Híbrido','Ortopédico','Pillow top'],
  FIRMEZA:['Suave','Medio','Firme','Extra firme'],
  /* Variables que se usan de verdad en la programación (del Excel y del grupo de WhatsApp) */
  ACOLCHADO:['Sencillo','Doble','Triple acolchado'],
  PRIORIDAD:['Alta','Media','Baja'],
  TALLERES:['—','El Rey','Nuevo Amanecer','Cerradora','Leidy Flex','Zamir'],
  TIPOPROD:['Especial','Stop'],
  /* De dónde llegó el cliente. El CRM agrupa por esto para ver qué canal trae más. */
  /* De dónde llega cada contacto. «Marcador» es el que sale de llamar la base
     de Lupe; los otros tres entran por su cuenta. */
  ORIGEN:['Marcador','Digital','Página web','Orgánico','Local'],
  ORIGICO:{'Marcador':'📞','Digital':'📱','Página web':'🌐','Orgánico':'🌱','Local':'🏪'},
  /* «Lupe marca y gana»: el pozo de bases. Ahí se sube la base de
     distribuidores de Nido y ahí se marca; el CRM nace al marcar. */
  MARCADOR:'../callprospector/lupe.html',
  _telKey(t){ const d=String(t||'').replace(/\D/g,''); return d.length>10?d.slice(-10):d; },
  /* al escribir el teléfono se busca en el directorio y se rellena lo que ya exista */
  pedTelLookup(v){ const k=this._telKey(v), e=$('p_found');
    const c=k.length>=7?(this._cli||[]).find(x=>this._telKey(x.telefono)===k):null;
    if(!c){ if(e){ e.style.display=k.length>=7?'block':'none'; e.textContent='＋ No está en el directorio — se registra al guardar'; e.style.color='var(--gold)'; } return; }
    this._pedCliId=c.id;
    const set=(id,val)=>{ const x=$(id); if(x)x.value=val||''; };
    set('p_nom',c.nombre); set('p_dir',c.direccion); set('p_ciu',c.ciudad);
    if($('p_tcli')&&c.tipo)$('p_tcli').value=c.tipo;
    if($('p_org')&&c.origen)$('p_org').value=c.origen;
    if(e){ e.style.display='block'; e.textContent='✓ '+(c.nombre||'')+' — ya está en el directorio'; e.style.color='var(--ok)'; } },
  ESTPROG:['pendiente','en proceso','terminado','entregado'],
  rol:'', view:'dash',
  _online:false,_onl:{}, _cli:[],_inv:[],_ped:[],_prog:[],_leads:[],_lin:[],_loc:[],_vend:[],

  _H(){ return {apikey:this.KEY,Authorization:'Bearer '+this.KEY,'Content-Type':'application/json'}; },
  _loadLocal(k){ try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return [];} },
  _saveLocal(k,a){ try{localStorage.setItem(k,JSON.stringify(a));}catch(e){} },
  async _fetch(t){
    try{ 
/* El servidor NUNCA devuelve mas de 1000 filas, aunque se le pida mas, y lo hace
   en silencio. Esta funcion pide de a 1000 hasta agotar. */
async function _paginar(url, headers){
  const base = url.replace(/[?&](limit|offset)=\d+/g,'');
  const sep = base.includes('?') ? '&' : '?';
  const out = []; 
  for(let i=0, off=0; i<60; i++, off+=1000){
    let r; try{ r = await fetch(base+sep+'limit=1000&offset='+off, {headers}); }catch(e){ break; }
    if(!r.ok) break;
    let b; try{ b = await r.json(); }catch(e){ break; }
    if(!Array.isArray(b) || !b.length) break;
    out.push(...b);
    if(b.length < 1000) break;
  }
  return out;
}
const d=await _paginar(this.SB+'/rest/v1/'+t+'?select=*&order=creado_en.desc',this._H());
      if(d && d.length!==undefined){ this._onl[t]=true; return await this._recon(t, d); } }catch(e){}
    this._onl[t]=false; return this._loadLocal(t);
  },
  /* Sube lo que quedó guardado en el equipo y todavía no está en la nube.
     OJO: las referencias que ya no son del catálogo NO se vuelven a subir —
     si no, las que se borran reaparecen solas en cada arranque. */
  async _recon(t,cloud){ const local=this._loadLocal(t); const ids=new Set(cloud.map(x=>x&&x.id));
    let miss=local.filter(x=>x&&x.id&&!ids.has(x.id));
    if(t==='superior_inventario'){
      const fuera=miss.filter(x=>!this._seccion(x.referencia||x.nombre));
      if(fuera.length){ miss=miss.filter(x=>this._seccion(x.referencia||x.nombre));
        this._saveLocal(t,local.filter(x=>this._seccion(x.referencia||x.nombre)||ids.has(x.id))); }
    }
    for(const row of miss){ try{ await fetch(this.SB+'/rest/v1/'+t+'?on_conflict=id',{method:'POST',headers:{...this._H(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)});}catch(e){} }
    const merged=miss.length?[...miss,...cloud]:cloud; merged.sort((a,b)=>String((b&&b.creado_en)||'').localeCompare(String((a&&a.creado_en)||''))); this._saveLocal(t,merged); return merged; },
  async _sync(){
    this._cli=await this._fetch('superior_clientes');
    this._inv=this._decPrecios(await this._fetch('superior_inventario'));
    this._ped=this._decPedidos(await this._fetch('superior_pedidos'));
    this._prog=await this._fetch('superior_programacion');
    this._leads=await this._fetch('superior_leads');
    this._lin=await this._fetch('superior_lineas');
    this._loc=await this._fetch('superior_locales');
    this._vend=await this._fetch('superior_vendedores');
    this._online=Object.values(this._onl).some(Boolean);
  },
  /* Guarda en la nube. Si una columna todavía no existe en la base (por ejemplo
     precio_dist antes de correr el SQL), el servidor rechaza TODA la fila y antes
     eso se perdía en silencio. Ahora se quita esa columna y se reintenta, y se
     deja anotado para poder avisarlo en pantalla. */
  async _put(t,row,arr){ this._saveLocal(t,arr);
    if(!this._onl[t]) return {ok:false,motivo:'sin conexión'};
    let cuerpo={...row}, quitadas=[];
    for(let i=0;i<6;i++){
      let r; try{ r=await fetch(this.SB+'/rest/v1/'+t+'?on_conflict=id',
        {method:'POST',headers:{...this._H(),Prefer:'resolution=merge-duplicates,return=minimal'},
         body:JSON.stringify(cuerpo)}); }catch(e){ return {ok:false,motivo:'sin conexión'}; }
      if(r.ok){ if(quitadas.length){ this._colFaltan=[...new Set([...(this._colFaltan||[]),...quitadas])]; }
        return {ok:true,quitadas}; }
      const txt=await r.text();
      const m=txt.match(/'([a-z_]+)' column/i)||txt.match(/column "?([a-z_]+)"?/i);
      const col=m&&m[1];
      if(col&&Object.prototype.hasOwnProperty.call(cuerpo,col)){ delete cuerpo[col]; quitadas.push(col); continue; }
      return {ok:false,motivo:txt.slice(0,140)};
    }
    return {ok:false,motivo:'no se pudo guardar'}; },
  async _del(t,id,arr){ this._saveLocal(t,arr); if(this._onl[t]){ try{ await fetch(this.SB+'/rest/v1/'+t+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:this._H()});}catch(e){} } },

  login(){ const p=($('lg').value||'').trim(); const rol=this.PASS[p]||this._rolExtra(p);
    if(!rol){$('lgerr').style.display='block';return;}
    this.rol=rol; localStorage.setItem('nido_rol',rol); this._start(); },
  logout(){ localStorage.removeItem('nido_rol'); location.reload(); },
  /* Usuarios que se agregaron desde la pantalla de Usuarios y accesos */
  _extra(){ try{ return JSON.parse(localStorage.getItem('nido_usuarios')||'[]'); }catch(e){ return []; } },
  _rolExtra(clave){ const u=this._extra().find(x=>x.clave===clave&&x.activo!==false); return u?u.rol:null; },
  async _start(){ $('login').classList.add('hide'); $('app').classList.remove('hide');
    const r=this.ROLES[this.rol]||{nombre:this.rol};
    $('rol').innerHTML=this.esc(r.nombre)+(r.quien?' · '+this.esc(r.quien):'')+' · <a onclick="App.logout()">salir</a>';
    $('main').innerHTML='<div class="empty">Cargando…</div>';
    await this._sync();
    await this._chequearColumnas();   // hay que saberlo ANTES de guardar nada
    this.pintarNav(); this.go('dash'); },
  pintarNav(){ const T=[['dash','Dashboard'],['ref','Referencias'],['cat','Catálogo'],['cli','Cliente'],['crm','CRM'],['ped','Pedidos']];
    if(this.puede('usuarios')) T.push(['usuarios','Usuarios y accesos']);
    $('nav').innerHTML=T.map(([v,t])=>`<button data-v="${v}" onclick="App.go('${v}')">${t}</button>`).join('');
    /* Línea DATA: la información de los almacenes. Se abre en OTRA PESTAÑA del
       navegador, para no perder lo que se esté haciendo en ventas. Diana (rol
       ventas) no la ve: la línea entera no se pinta. */
    const filaData=document.getElementById('fila-data');
    if(!this.puede('data')){ if(filaData) filaData.style.display='none'; return; }
    if(filaData) filaData.style.display='';
    const D=[['dash','Resumen'],['dias','Qué día se vende más'],['meses','Mes a mes'],
             ['prod','Productos'],['clien','Clientes']];
    const nd=$('navdata');
    if(nd) nd.innerHTML=D.map(([v,t])=>
      `<button onclick="window.open('../colchones/index.html#${v}','nido_data')">${t} ↗</button>`).join(''); },
  go(v){ this.view=v; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); window.scrollTo(0,0);
    /* 'equipo' ya no está en el menú, pero se deja en el enrutador: el selector
       de Vendedor del pedido se alimenta de ahí, así que la pantalla sigue
       alcanzable desde Pedidos mientras se use ese campo. */

  /* ---------- INVENTARIOS ---------- */

  invModal(id,ref,tam){ const p=this._inv.find(x=>x.id===id)||{};

      <div id="i_med" style="display:${medida||mm?'block':'none'};border:1px dashed var(--gold);border-radius:10px;
        padding:10px;margin-top:8px;background:var(--goldsoft)">

        <div class="g3">
          <div><label>Ancho (cm)</label><input id="i_an" type="number" value="${an}" placeholder="70" oninput="App.invSugerir()"></div>
          <div><label>Largo (cm)</label><input id="i_la" type="number" value="${la}" placeholder="130" oninput="App.invSugerir()"></div>

        <div class="hint" style="color:var(--warn)">Se guarda como <b>ancho × largo × alto</b>.</div>

    this.invCalc(); this.invSugerir(); },

  /* Precio de una medida especial: el del tamaño más parecido, con su recargo.
     Se muestra como sugerencia con un botón; nunca se pisa lo que ya escribió
     la persona sin que lo acepte. */
  invSugerir(){
    const c=$('i_sug'); if(!c) return;
    const ref=($('i_ref')||{}).value, tipo=(($('i_tipo')||{}).value)||'';
    const an=(($('i_an')||{}).value)||0, la=(($('i_la')||{}).value)||0;
    const d=this._refDef(ref);
    if(!d){ c.innerHTML=''; return; }
    if(!d.recargo){ c.innerHTML='<div class="hint" style="color:var(--warn)">El precio de esta referencia lo pone fábrica: escríbelo abajo.</div>'; return; }
    if(!an||!la){ c.innerHTML='<div class="hint" style="color:var(--warn)">Pon ancho y largo para calcular el precio.</div>'; return; }
    const s=this.precioSugerido(ref,tipo,an,la);
    if(!s){ c.innerHTML=`<div class="hint" style="color:var(--warn)">Todavía no hay precios cargados en
      ${this.esc((d.baseDe&&tipo&&d.baseDe[tipo])||d.ref)} para poder calcular. Cárgalos primero.</div>`; return; }
    this._sug=s;
    c.innerHTML=`<div style="background:var(--card);border:1px solid var(--gold);border-radius:9px;padding:9px 11px">
      <div style="font-size:12px;font-weight:700;color:var(--navy)">Precio sugerido · ${s.recargo}% sobre ${this.esc(s.base)} ${this.esc(s.desde)}</div>
      <div style="font-size:12.5px;margin-top:3px">Costo ${this.money(s.costo)} ·
        distribuidor <b>${this.money(s.precio_dist)}</b> · público <b>${this.money(s.precio)}</b></div>
      <button class="btn gold sm" style="margin-top:7px" onclick="App.invUsarSug()">Usar estos precios</button></div>`; },
  invUsarSug(){ const s=this._sug; if(!s)return;
    $('i_cos').value=s.costo; $('i_pdi').value=s.precio_dist; $('i_pre').value=s.precio;
    if(!+$('i_cdi').value) $('i_cdi').value=s.com_dist;
    if(!+$('i_cpu').value) $('i_cpu').value=s.com_pub;
    this.invCalc(); this.toast('Precios aplicados'); },

  /* Los campos de medida solo aparecen cuando el tamaño es una medida especial */
  invMedidaToggle(){ const t=$('i_tam').value, c=$('i_med');
    if(c) c.style.display=this.esMedida(t)?'block':(/\d+\s*[×x]\s*\d+\s*[×x]\s*\d+/.test(t)?'block':'none'); },

  /* Muestra en vivo lo que queda después del costo y la comisión */
  invCalc(){
    const n=x=>+((($(x)||{}).value)||0);
    const co=n('i_cos');
    const d=n('i_pdi')-co-n('i_cdi'), u=n('i_pre')-co-n('i_cpu');
    const pinta=(el,val,precio)=>{ const e=$(el); if(!e)return;
      if(!precio){ e.innerHTML='<span class="dim">Sin precio.</span>'; return; }
      const pct=precio>0?(val/precio*100).toFixed(1).replace('.',',')+'%':'—';
      e.innerHTML=`Queda <b style="color:${val>0?'var(--ok)':'var(--bad)'}">${this.money(val)}</b> por unidad · ${pct} del precio`; };
    pinta('q_dist',d,n('i_pdi')); pinta('q_pub',u,n('i_pre')); },

  async invSave(id){ const g=x=>($(x).value||'').trim();
    let tamano=g('i_tam');
    // Si es medida especial y se llenaron las tres, el tamaño queda "Especial 70×130×15"
    if(this.esMedida(tamano)||$('i_med').style.display!=='none'){
      const an=g('i_an'), la=g('i_la'), al=g('i_al');
      if(an&&la&&al) tamano='Especial '+an+'×'+la+'×'+al;
      else if(this.esMedida(tamano)){ alert('Falta el ancho, el largo o el alto'); return; }
    }
    // En «Sobre medida», el tipo elegido (Pillow/Resorte) se guarda como material
    const tipo=($('i_tipo')||{}).value||'';
    const row={id:id||('i'+Date.now()),referencia:g('i_ref').toUpperCase(),nombre:g('i_nom'),tamano,
      material:tipo||g('i_mat'),costo:+$('i_cos').value||0,costo_min:+$('i_cos').value||0,
      precio:+$('i_pre').value||0, precio_dist:+$('i_pdi').value||0,
      com_dist:+$('i_cdi').value||0, com_pub:+$('i_cpu').value||0,
      existencias:+$('i_exi').value||0,minimo:+$('i_min').value||0,
      creado_en:(this._inv.find(x=>x.id===id)||{}).creado_en||new Date().toISOString()};
    if(!row.referencia&&!row.nombre){alert('Referencia o nombre');return;}
    const i=this._inv.findIndex(x=>x.id===row.id); if(i>=0)this._inv[i]=row; else this._inv.unshift(row);
    const res=await this._put('superior_inventario',this._codPrecios(row),this._inv);
    cerrar();
    if(res&&!res.ok) alert('No se pudo guardar en la base: '+(res.motivo||'')+
      '\n\nQuedó guardado en este equipo.');
    else this.toast('Guardado');
    this.vRef(); },
  async invMov(id,delta){ const p=this._inv.find(x=>x.id===id); if(!p)return; const v=prompt((delta>0?'Cuántas ENTRAN':'Cuántas SALEN')+':'); if(v===null)return; const q=+v||0; if(q<=0)return;
    p.existencias=(+p.existencias||0)+delta*q; await this._put('superior_inventario',p,this._inv); this.toast('Stock actualizado'); this.vRef(); },
  async invDel(id){ if(!confirm('¿Eliminar referencia?'))return; this._inv=this._inv.filter(x=>x.id!==id); await this._del('superior_inventario',id,this._inv); this.vRef(); },

  /* ---------- REFERENCIAS (creación / catálogo de precios) ---------- */
  /* ---------- CATÁLOGO NIDO ----------
     Arranca con esto, pero se puede editar desde la pantalla de Referencias:
     agregar secciones, referencias y tamaños. Lo editado se guarda en
     localStorage; si algún día se borra, vuelve a quedar como está acá.

     recargo: lo que se le suma al precio de la medida estándar más cercana
     cuando el cliente pide una medida especial. 0 = el precio lo pone fábrica.
     tipos/baseDe: para "Sobre medida", que no tiene precios propios y saca el
     precio de Pillow o de Resortado según lo que pida el cliente. */
  /* Sale tal cual del catálogo de producto (superior/catalogo.html):
     cinco líneas y un servicio a la medida. */
  CATALOGO_BASE:[
    // Línea 01 · pillowtop, garantía 5 años
    {sec:'Colchones', refs:[
      {ref:'PILLOWTOP CASSATA',   tams:['100','120','140','160']},
      {ref:'PILLOWTOP RESORTADO', tams:['100','120','140','160']},
      // «Crea tu colchón»: se fabrica con la medida del cliente
      {ref:'CREA TU COLCHÓN', tams:['Medida especial'], recargo:15,
       tipos:['Pillowtop Cassata','Pillowtop Resortado'],
       baseDe:{'Pillowtop Cassata':'PILLOWTOP CASSATA','Pillowtop Resortado':'PILLOWTOP RESORTADO'}}]},
    // Línea 02 · colchoneta de 17 cm en espuma D26, en todas las medidas
    {sec:'Sensaflex', refs:[
      {ref:'SENSAFLEX D26', tams:['100','120','140','160','Medida especial'], recargo:15}]},
    // Línea 03 · cuna, espuma D23
    {sec:'BabyNido', refs:[
      {ref:'COLCHÓN CUNA', tams:['130×70×15','Medida especial'], recargo:15}]},
    // Línea 04 · camas de mascota, cinco tallas cada una
    {sec:'Nido Mascotas', refs:[
      {ref:'CAMA ANTI-FLUIDO', tams:['Pequeña 45×40','Mediana 60×60','M 70×62','L 95×70','XL 115×69']},
      {ref:'CAMA JACQUARD',    tams:['Pequeña 45×40','Mediana 60×60','M 70×62','L 95×70','XL 115×69']}]},
    // Línea 05 · cuatro moldes de cabina. El precio lo da fábrica: sin recargo.
    {sec:'Nido Truck', refs:[
      {ref:'NIDO TRUCK', tams:['Standard 80×200','FVR Viejo','Fotón Mula','Kenworth','Medida especial'], recargo:0}]},
  ],
  get CATALOGO(){
    if(this._cat) return this._cat;
    try{ const g=JSON.parse(localStorage.getItem('nido_catalogo')||'null');
      this._cat = (g&&g.length)?g:JSON.parse(JSON.stringify(this.CATALOGO_BASE)); }
    catch(e){ this._cat=JSON.parse(JSON.stringify(this.CATALOGO_BASE)); }
    return this._cat; },
  catGuardar(){ localStorage.setItem('nido_catalogo',JSON.stringify(this._cat)); },
  catRestaurar(){ if(!confirm('¿Volver al catálogo original? Se pierden las secciones y referencias que hayas agregado.'))return;

  esMedida(t){ return /medida especial|sobre medida|a la medida/i.test(t||''); },
  _refDef(ref){ const r=(ref||'').toUpperCase().trim();
    for(const s of this.CATALOGO) for(const x of s.refs) if(x.ref===r) return x;
    return null; },
  _seccion(ref){ const r=(ref||'').toUpperCase().trim();
    for(const s of this.CATALOGO) for(const x of s.refs) if(x.ref===r) return s.sec;
    return null; },

  /* ---------- PRECIO DE UNA MEDIDA ESPECIAL ----------
     Se busca, dentro de la referencia base, el tamaño estándar de área más
     parecida a lo que pide el cliente, y se le suma el recargo (15%).
     El largo estándar de una cama es 190 cm cuando el tamaño es solo el ancho. */
  _areaTam(t){
    const s=String(t||'');
    const tres=s.match(/(\d+(?:[.,]\d+)?)\s*[×x*]\s*(\d+(?:[.,]\d+)?)\s*[×x*]\s*(\d+(?:[.,]\d+)?)/);
    if(tres) return parseFloat(tres[1].replace(',','.'))*parseFloat(tres[2].replace(',','.'));
    const dos=s.match(/(\d+(?:[.,]\d+)?)\s*[×x*]\s*(\d+(?:[.,]\d+)?)/);
    if(dos) return parseFloat(dos[1].replace(',','.'))*parseFloat(dos[2].replace(',','.'));
    const uno=s.match(/(\d{2,3})/);
    if(uno) return parseFloat(uno[1])*190;   // 140 = 140×190
    return 0; },
  /* Devuelve {base, recargo, precio, precio_dist, costo, com_dist, com_pub, desde}
     o null si todavía no hay de dónde sacar el precio. */
  precioSugerido(ref,tipo,an,la){
    const def=this._refDef(ref); if(!def) return null;
    const rec=def.recargo==null?0:+def.recargo;
    if(!rec) return null;                                  // Truck: lo pone fábrica
    const baseRef=(def.baseDe&&tipo&&def.baseDe[tipo])?def.baseDe[tipo]:def.ref;
    const cand=(this._inv||[]).filter(p=>String(p.referencia||'').toUpperCase().trim()===baseRef
      && !this.esMedida(p.tamano) && (+p.precio>0||+p.precio_dist>0));
    if(!cand.length) return null;
    const area=(+an||0)*(+la||0);
    let mejor=cand[0], dif=Infinity;
    cand.forEach(p=>{ const d=Math.abs(this._areaTam(p.tamano)-area);
      if(d<dif){dif=d; mejor=p;} });
    const f=1+rec/100;
    return {base:baseRef, recargo:rec, desde:mejor.tamano,
      costo:Math.round((+mejor.costo||0)*f),
      precio:Math.round((+mejor.precio||0)*f),
      precio_dist:Math.round((+mejor.precio_dist||0)*f),
      com_dist:Math.round(+mejor.com_dist||0),
      com_pub:Math.round(+mejor.com_pub||0)}; },

  /* ---------- PRECIO DE DISTRIBUIDOR Y COMISIONES ----------
     La tabla todavía no tiene columnas propias para esto. Mientras no las
     tenga, los tres valores se guardan pegados al campo 'material', detrás de
     una marca, y la app los vuelve a separar al leer. Así se pueden grabar hoy
     sin perder nada; cuando se corra el SQL, pasan solos a sus columnas. */
  _MARCA:' ¤',
  _decPrecios(arr){
    (arr||[]).forEach(p=>{
      const s=String(p.material||''), i=s.indexOf(this._MARCA);
      if(i<0) return;
      try{ const x=JSON.parse(s.slice(i+this._MARCA.length));
        if(p.precio_dist==null) p.precio_dist=+x.d||0;
        if(p.com_dist==null)    p.com_dist=+x.cd||0;
        if(p.com_pub==null)     p.com_pub=+x.cp||0;
        p._migrar=true;
      }catch(e){}
      p.material=s.slice(0,i);
    });
    return arr; },
  _codPrecios(row){
    if(!(this._colFaltan&&this._colFaltan.length)) return row;
    const r={...row};
    r.material=String(row.material||'').split(this._MARCA)[0]
      +this._MARCA+JSON.stringify({d:+row.precio_dist||0,cd:+row.com_dist||0,cp:+row.com_pub||0});
    return r; },
  /* Cuando las columnas ya existen, lo que quedó pegado al material se pasa a
     su sitio y el material queda limpio. Corre una sola vez, en silencio. */
  async _migrarPrecios(){
    if(this._colFaltan&&this._colFaltan.length) return;
    const pend=(this._inv||[]).filter(p=>p._migrar);
    for(const p of pend){ delete p._migrar; await this._put('superior_inventario',p,this._inv); }

  /* Pregunta a la base si ya existen las columnas. Si faltan, la pantalla lo

  async _chequearColumnas(){

  /* ---------- LO QUE SE PAGA DE COMISIÓN Y LO QUE QUEDA ---------- */
  _estadisticas(dentro){
    const con=(dentro||[]).filter(p=>+p.costo>0&&(+p.precio>0||+p.precio_dist>0));
    if(!con.length) return `<h2 style="font-family:Georgia,serif;font-size:19px;color:var(--navy);margin:26px 0 8px">Estadísticas</h2>
      <div class="card"><div class="hint" style="margin:0">Cuando cargues costo y precio en las referencias,
      acá aparece cuánto se paga de comisión y cuánto queda en cada canal.</div></div>`;
    const m=this.money.bind(this);
    const s=f=>con.reduce((a,p)=>a+f(p),0);
    const nD=con.filter(p=>+p.precio_dist>0).length, nP=con.filter(p=>+p.precio>0).length;
    const vD=s(p=>+p.precio_dist||0), cD=s(p=>+p.precio_dist>0?(+p.costo||0):0), kD=s(p=>+p.precio_dist>0?(+p.com_dist||0):0);
    const vP=s(p=>+p.precio||0),      cP=s(p=>+p.precio>0?(+p.costo||0):0),      kP=s(p=>+p.precio>0?(+p.com_pub||0):0);
    const qD=vD-cD-kD, qP=vP-cP-kP;
    const pct=(a,b)=>b>0?(a/b*100).toFixed(1).replace('.',',')+'%':'—';
    const bloque=(tit,n,v,c,k,q)=>`<div class="card" style="margin:0">
      <div class="nm" style="font-size:15px;margin-bottom:8px">${tit}
        <span class="dim" style="font-size:12px;font-weight:400">· ${n} referencias</span></div>

        <span class="dim">Costo</span><b style="color:var(--ink2)">− ${m(c)}</b></div>
      <div class="row" style="justify-content:space-between;padding:3px 0;font-size:13px">

      <div class="row" style="justify-content:space-between;border-top:2px solid var(--line);margin-top:7px;padding-top:7px">
        <b>Lo que queda</b><b style="color:${q>0?'var(--ok)':'var(--bad)'};font-size:17px">${m(q)}</b></div>
      <div class="hint">La comisión es el <b>${pct(k,v)}</b> de la venta; queda el <b>${pct(q,v)}</b>.</div>
    </div>`;
    return `<h2 style="font-family:Georgia,serif;font-size:19px;color:var(--navy);margin:26px 0 8px">Estadísticas</h2>
      <div class="hint" style="margin:-4px 0 10px">Suma <b>una unidad de cada referencia</b> para poder
        comparar los dos canales. No es la venta del mes: eso está en Data.</div>
      <div class="g2" style="gap:12px">
        ${bloque('Distribuidores',nD,vD,cD,kD,qD)}
        ${bloque('Público',nP,vP,cP,kP,qP)}
      </div>
      <div class="card" style="margin-top:12px;border-left:4px solid var(--gold)">
        <div class="row" style="justify-content:space-between"><b>Comisión total comprometida</b>

        <div class="row" style="justify-content:space-between;margin-top:5px"><b>Total que queda</b>
          <b style="color:${(qD+qP)>0?'var(--ok)':'var(--bad)'};font-size:17px">${m(qD+qP)}</b></div>
        <div class="hint">Los dos canales juntos, una unidad de cada referencia.</div>

  /* ---------- CLIENTE (ficha técnica) ---------- */
  /* Directorio de clientes. Los clientes NO se registran acá: entran solos al tomar
     el pedido. El botón queda para cargar clientes objetivo (los que aún no compran). */
  /* Los filtros por origen (Digital, Página web, Orgánico…) se quitaron de acá:
     el origen es cosa del CRM, no del directorio de quien ya compra. */
  /* Clientes = la relación de quién compra, con sus datos, cuánto lleva
     comprado y qué referencias se lleva. Todo sale de los pedidos. */
  _comprasDe(c){
    const peds=(this._ped||[]).filter(p=>
      (p.cliente_id&&p.cliente_id===c.id) ||
      (!p.cliente_id&&p.cliente&&c.nombre&&String(p.cliente).trim().toLowerCase()===String(c.nombre).trim().toLowerCase()));
    const total=peds.reduce((s,p)=>s+(+p.total||0),0);
    const refs={}; peds.forEach(p=>{ const r=p.referencia||'—'; refs[r]=(refs[r]||0)+1; });
    const fechas=peds.map(p=>p.creado_en).filter(Boolean).sort();
    return {n:peds.length, total, refs, ultima:fechas[fechas.length-1]||'',
      lista:Object.entries(refs).sort((a,b)=>b[1]-a[1])}; },
  _dia(f){ if(!f) return ''; const d=new Date(f); if(isNaN(d)) return '';
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); },

  /* ---------- PEDIDOS ---------- */
  /* ---------- EL CAMINO DE UN PEDIDO ----------
     Cinco pasos. Cada uno queda MARCADO con la fecha y la hora en que se hizo,
     así se puede ver después cuánto se demoró cada gestión. La tabla no tiene
     columna para eso, así que las fechas van pegadas al campo 'estado' detrás
     de una marca, igual que los precios; la app las separa al leer. */
  ESTPED:[
    {k:'nuevo',        t:'Tomado',               e:'📝'},
    {k:'produccion',   t:'Enviado a producción', e:'🏭'},
    {k:'pago_fabrica', t:'Pagado a fábrica',     e:'🧾'},
    {k:'pago_nido',    t:'Pagado a Nido',        e:'💰'},
    {k:'comision',     t:'Comisión pagada',      e:'🤝'},
  ],
  _decPedidos(arr){
    (arr||[]).forEach(p=>{
      const s=String(p.estado||''), i=s.indexOf(this._MARCA);
      p.hitos = {};
      if(i>=0){ try{ p.hitos=JSON.parse(s.slice(i+this._MARCA.length))||{}; }catch(e){}
        p.estado=s.slice(0,i); }
      // Los pedidos viejos no tienen hitos: el de "tomado" es su fecha de creación
      if(!p.hitos.nuevo&&p.creado_en) p.hitos.nuevo=p.creado_en;
    });
    return arr; },
  _codPedido(row){
    const r={...row};
    r.estado=String(row.estado||'nuevo').split(this._MARCA)[0]
      +this._MARCA+JSON.stringify(row.hitos||{});
    delete r.hitos;
    return r; },
  /* El estado que manda es el paso más adelantado que ya se marcó */
  _est(p){
    const h=p.hitos||{};
    let ultimo=this.ESTPED[0];
    this.ESTPED.forEach(x=>{ if(h[x.k]) ultimo=x; });
    if(!Object.keys(h).length){ const k=String(p.estado||'nuevo').split(this._MARCA)[0];
      return this.ESTPED.find(x=>x.k===k)||this.ESTPED[0]; }
    return ultimo; },
  _fechaCorta(f){ if(!f) return ''; const d=new Date(f); if(isNaN(d)) return '';
    const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return d.getDate()+' '+M[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); },
  /* Cuánto pasó entre dos momentos, en palabras */
  _tardanza(a,b){ if(!a||!b) return '';

  /* Al tomar pedido solo se ofrecen las referencias del catálogo de Nido,

  _opcionesPedido(p){
    const sel=(p||{}).referencia||'';
    const cargadas=(this._inv||[]).filter(it=>this._seccion(it.referencia||it.nombre));
    // Índice de lo que ya tiene precio, para poder cruzarlo con el catálogo
    const idx={}; cargadas.forEach(it=>
      idx[String(it.referencia||'').toUpperCase().trim()+'|'+String(it.tamano||'').trim()]=it);
    const usados=new Set();
    const opt=(lab,it,tam)=>{
      const pre=it?(+it.precio||0):0;
      // El tamaño viaja en el propio <option>: la programación lo necesita
      // aunque la referencia todavía no esté cargada con precio.
      return `<option value="${it?it.id:'__nuevo__'}" data-lab="${this.esc(lab)}" data-pre="${pre}"
        data-tam="${this.esc(it?(it.tamano||''):(tam||''))}" data-mat="${this.esc(it?(it.material||''):'')}"
        ${sel===lab?'selected':''}>${this.esc(lab)}${pre>0?'':' · sin precio'}</option>`; };

      s.refs.forEach(r=>cargadas.filter(it=>
        String(it.referencia||'').toUpperCase().trim()===r.ref && !usados.has(it.id))
        .forEach(it=>{ usados.add(it.id); ops.push(opt(r.ref+' · '+(it.tamano||''),it)); }));

  /* El bloque de medidas sale con «A la medida» y también cuando la referencia

  /* Con el ancho y el largo se busca el tamaño estándar más parecido de esa

  pedMedida(){
    const c=$('pd_precio'); if(!c) return;
    const an=+(($('pd_an')||{}).value||0), la=+(($('pd_la')||{}).value||0), al=+(($('pd_al')||{}).value||0);
    const base=(($('pd_base')||{}).value)||'';
    if($('pd_tam')&&an&&la) $('pd_tam').value='Especial '+an+'×'+la+(al?('×'+al):'');

    if(!an||!la){ c.innerHTML='<div class="hint" style="color:var(--warn);margin:0">Pon ancho y largo para calcular el precio.</div>'; return; }
    // el recargo se toma de la referencia que tenga a esta como base

  /* El cliente se graba desde el pedido, en un solo paso: si el teléfono ya está

    let c=k.length>=7?(this._cli||[]).find(x=>this._telKey(x.telefono)===k):null;

      if(ciu&&ciu!==c.ciudad)b.ciudad=ciu; if(tipo!==c.tipo)b.tipo=tipo; if(org&&org!==c.origen)b.origen=org;
      if(Object.keys(b).length){ Object.assign(c,b); await this._put('superior_clientes',c,this._cli); }
      return c; }

    await this._put('superior_programacion',row,this._prog); cerrar(); this.toast('Programado'); this.vProg(); },
  async progEstado(id,e){ const p=this._prog.find(x=>x.id===id); if(!p)return; const ahora=new Date().toISOString();
    p.estado=e; p.historial=Array.isArray(p.historial)?p.historial:[]; p.historial.push({estado:e,ts:ahora});

    await this._put('superior_programacion',p,this._prog);
    if(e==='entregado')this._avisoVendedor(p); this.vProg(); },
  _avisoVendedor(p){ const cel=(p.vendedor_cel||'').replace(/\D/g,'');

      <button class="btn gh full" onclick="cerrar()">Cerrar</button>`); }
    else this.toast('Entregado ✅ (sin celular de vendedor para avisar)'); },
  async progDel(id){ if(!confirm('¿Eliminar programación?'))return; this._prog=this._prog.filter(x=>x.id!==id); await this._del('superior_programacion',id,this._prog); this.vProg(); },
