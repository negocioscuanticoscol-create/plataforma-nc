<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Colchones Nido · informe de ventas</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    /* NIDO COLCHONES — misma paleta que la app de la fábrica: el azul petróleo
       de la N, el arena del nido y el crema del fondo del logo. */
    --paper:#f4efe4; --card:#fffdf8; --ink:#14313f; --ink2:#4a6472; --mut:#8b9aa3;
    --line:#e4dccd; --line2:#f0eadd; --acc:#144357; --acc2:#3b7086; --gold:#bca890;
    --navy:#144357; --goldsoft:#f0e8db;
    --ok:#3f7a5f; --okbg:#e6f0e9; --warn:#b5761f; --bad:#a8443a; --badbg:#f7e6e3;
    --sh:0 1px 2px rgba(20,67,87,.06),0 12px 30px -18px rgba(20,67,87,.32);
    /* Un color por almacén, fijo por nombre y nunca por puesto en la lista:
       si se filtra, el que queda conserva SU color. Trío validado para daltonismo
       (protan/deutan/tritan) contra el fondo crema. */
    --a0:#b5651d; --a1:#1b6ea8; --a2:#8e3b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:slashed-zero;font-feature-settings:'zero' 1}
  .wrap{max-width:980px;margin:0 auto;padding:0 15px 96px}
  /* header crema, el mismo del logo, igual que en la app de la fábrica */
  header{background:var(--goldsoft);color:var(--ink);padding:11px 0;border-bottom:1px solid var(--line)}
  .hd{max-width:980px;margin:0 auto;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mk{width:46px;height:37px;flex:none;object-fit:contain}
  .brand .t1{font-family:Georgia,serif;font-size:19px;font-weight:700;letter-spacing:.06em;line-height:1;color:var(--navy)}
  .brand .t2{font-size:8.5px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;margin-top:3px}
  .quien{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:right}
  /* Las dos líneas de la aplicación: VENTAS (la fábrica) y DATA (los almacenes) */
  nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .nvl{display:flex;align-items:stretch;border-bottom:1px solid var(--line2);max-width:980px;margin:0 auto}
  .nvl:last-child{border-bottom:none}
  .nvl .et{flex:0 0 auto;display:flex;align-items:center;padding:0 12px 0 15px;font-size:9.5px;
    font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
    border-right:1px solid var(--line2);background:var(--goldsoft)}
  .nvl.on .et{color:var(--navy)}
  /* pestañas centradas; los ::before/::after evitan que se peguen a la
     izquierda cuando no caben y hay que desplazarlas */
  .nv{flex:1;display:flex;gap:1px;padding:0 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:center}
  .nv::before,.nv::after{content:'';margin:auto}
  .nv::-webkit-scrollbar{height:0}
  .fl{justify-content:center}
  nav button{flex:0 0 auto;background:none;border:none;padding:11px 12px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
  nav button:hover{color:var(--ink2)}
  nav button.on{color:var(--navy);border-bottom-color:var(--gold)}
  /* La fila de filtros manda sobre TODAS las pantallas; nunca va dentro de una tarjeta. */
  .filtros{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:45px;z-index:19}
  .fl{max-width:980px;margin:0 auto;padding:9px 15px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .fl .et{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-right:2px}
  .chip{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--ink2);font-family:inherit;display:inline-flex;align-items:center;gap:6px;min-height:30px}
  .chip:hover{border-color:var(--mut)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
  .chip i.pt{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .chip select{border:none;background:transparent;font:inherit;color:inherit;padding:0;width:auto;cursor:pointer}
  h1{font-family:Fraunces,serif;font-size:25px;font-weight:600;margin:20px 0 2px}
  h2{font-family:Fraunces,serif;font-size:18px;font-weight:600;margin:24px 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--sh)}
  .kpi b{display:block;font-size:21px;font-family:Fraunces,serif;font-weight:600;font-variant-numeric:proportional-nums}
  .kpi span{font-size:11px;color:var(--mut)}
  .kpi small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
  .kpi.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .kpi.dark b{color:var(--acc2)} .kpi.dark span,.kpi.dark small{color:#b6a894}
  /* Barras: finas, extremos redondeados, ancladas al cero, separadas por el fondo. */
  .fila{display:flex;gap:9px;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line2)}
  .fila:last-child{border-bottom:none}
  .fila.cl{cursor:pointer} .fila.cl:hover{background:#fffaf0}
  .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .val{text-align:right;font-weight:700;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .dim{color:var(--mut);font-weight:400}
  .tr{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;flex:1;min-width:40px}
  .tr>i{display:block;height:100%;border-radius:4px;background:var(--acc)}
  .cab{display:flex;gap:9px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:6px}
  .ley{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:10px;align-items:center}
  .ley span{display:inline-flex;align-items:center;gap:6px}
  .ley i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .grp{padding:9px 0;border-bottom:1px solid var(--line2)}
  .grp:last-child{border-bottom:none}
  .grp .gt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;margin-bottom:5px}
  .gb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);margin-top:2px}
  .gb .tr{height:7px}
  .gb .qn{width:96px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--line2);color:var(--ink2)}
  .tag.np{background:#e7f1e6;color:var(--ok)}
  .tag.pe{background:#fdeede;color:var(--warn)}
  .hint{font-size:12px;color:var(--mut);margin-top:5px}
  .det{background:var(--paper);border-radius:9px;padding:10px 12px;margin:7px 0 3px}
  .tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);background:var(--card)}
  .tb{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px;font-variant-numeric:tabular-nums}
  .tb th,.tb td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
  .tb thead th{background:var(--paper);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);position:sticky;top:0}
  .tb td.n{text-align:right}
  .tb tbody tr:hover{background:#fffaf0}
  .tb tfoot td{background:var(--paper);font-weight:700;border-bottom:none;border-top:2px solid var(--line)}
  .btn{padding:10px 16px;border:none;border-radius:9px;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  .btn.acc{background:var(--acc)} .btn.gh{background:transparent;border:1px solid var(--line);color:var(--ink2)}
  .btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
  input[type=search]{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:14px;font-family:inherit;flex:1;min-width:160px}
  input[type=search]:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .empty{text-align:center;color:var(--mut);padding:34px 12px;font-size:14px}
  /* Globo de datos: acompaña, nunca es el único camino al número (siempre hay tabla). */
  #tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.45;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);max-width:260px;opacity:0;transition:opacity .1s}
  #tip b{color:var(--acc2)}
  @media(max-width:640px){
    .fila{font-size:12.5px} .tb{font-size:12px}
    .filtros{position:static}
  }
</style>

<header><div class="hd">
  <div class="brand"><img class="mk" src="../assets/nido-logo.png" alt="Nido">
    <div><div class="t1">NIDO</div><div class="t2">Colchones</div></div></div>
  <div class="quien" id="quien"></div>
</div></header>
<nav>
  <div class="nvl"><span class="et">Ventas</span><div class="nv" id="navventas"></div></div>
  <div class="nvl on"><span class="et">Data</span><div class="nv" id="nav"></div></div>
</nav>
<div class="filtros"><div class="fl" id="filtros"></div></div>
<div id="puerta" style="display:none;min-height:78vh;align-items:center;justify-content:center;padding:26px">
  <div style="width:100%;max-width:360px;text-align:center">
    <div style="width:118px;height:118px;margin:0 auto 18px;border-radius:50%;background:var(--goldsoft);
      display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)">
      <img src="../assets/nido-logo.png" alt="Nido" style="width:82px;height:66px;object-fit:contain"></div>
    <div style="font-family:Georgia,serif;font-size:27px;letter-spacing:.16em;color:var(--navy);font-weight:700">NIDO</div>
    <div style="font-size:9.5px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;margin:6px 0 22px">Data · almacenes</div>
    <div class="card" style="text-align:left">
      <input id="pw" type="password" placeholder="Clave" style="text-align:center;letter-spacing:3px"
        onkeydown="if(event.key==='Enter')App.entrar()">
      <button class="btn acc full" onclick="App.entrar()" style="width:100%;margin-top:10px">Entrar</button>
      <div id="pwerr" style="display:none;color:var(--bad);font-size:13px;margin-top:9px;text-align:center"></div>
    </div>
  </div>
</div>
<div class="wrap"><div id="main" class="empty">Cargando…</div></div>
<div id="tip"></div>

<script src="datos.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mon=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const num=n=>Math.round(+n||0).toLocaleString('es-CO');
/* En Colombia el decimal es coma, no punto: 59,5% y no 59.5% */
const d1=n=>(isFinite(n)?+n:0).toFixed(1).replace('.',',');
/* Cifras cortas para las etiquetas de las barras: $1.756 M cabe, $1.756.251.776 no. */
function monK(n){ n=Math.round(+n||0); const a=Math.abs(n);
  if(a>=1e9) return '$'+(n/1e9).toFixed(2).replace('.',',')+' MM';
  if(a>=1e6) return '$'+(n/1e6).toFixed(0)+' M';
  if(a>=1e3) return '$'+(n/1e3).toFixed(0)+' K';
  return '$'+n; }
const DIA=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIA3=['lun','mar','mié','jue','vie','sáb','dom'];
const MESN=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const COLA=['var(--a0)','var(--a1)','var(--a2)'];
// dow: 0=lunes … 6=domingo, igual que en el Excel
const dowDe=f=>{ const d=new Date(f+'T12:00:00'); return (d.getDay()+6)%7; };

/* Globo de datos por marca. El área sensible es la fila completa, no la barra:
   en el celular nadie acierta una barra de 8px. */
let _tip=null;
function tipOn(e){ const t=e.currentTarget.getAttribute('data-tip'); if(!t)return;
  _tip=$('tip'); _tip.innerHTML=t; _tip.style.opacity='1'; tipMov(e); }
function tipMov(e){ if(!_tip)return; const b=_tip.getBoundingClientRect();
  let x=e.clientX+14, y=e.clientY-b.height-10;
  if(x+b.width>innerWidth-8) x=e.clientX-b.width-14;
  if(y<8) y=e.clientY+18;
  _tip.style.left=x+'px'; _tip.style.top=y+'px'; }
function tipOff(){ if(_tip){_tip.style.opacity='0'; _tip=null;} }
function ligarTips(){ document.querySelectorAll('[data-tip]').forEach(el=>{
  el.onmouseenter=tipOn; el.onmousemove=tipMov; el.onmouseleave=tipOff;
  el.onfocus=tipOn; el.onblur=tipOff; }); }

const App={
  TABS:[['dash','📊 Resumen'],['dias','📅 Qué día se vende más'],['meses','🗓️ Mes a mes'],
        ['prod','🛏️ Productos'],['clien','📇 Clientes']],
  view:'dash',
  alm:-1,      // -1 = todos
  mes:'',      // '' = todos los meses
  F:[],        // filas ya filtradas

  /* ---------- QUIÉN PUEDE VER LA DATA ----------
     Las mismas claves que la app de ventas. La sesión es compartida por
     localStorage, así que si ya entró allá, acá no vuelve a pedirla. */
  PASS:{ 'superioradmin2026':'admin', 'gloria2026':'facturacion', 'diana2026':'ventas' },
  ROLES:{ admin:{nombre:'Administrador',data:true}, facturacion:{nombre:'Facturación',quien:'Gloria',data:true},
          ventas:{nombre:'Ventas',quien:'Diana',data:false} },
  _rolExtra(c){ try{ const u=JSON.parse(localStorage.getItem('nido_usuarios')||'[]')
      .find(x=>x.clave===c&&x.activo!==false); return u?u.rol:null; }catch(e){ return null; } },
  _puedeVer(rol){ const r=this.ROLES[rol]; return !!(r&&r.data); },
  puerta(){
    const rol=localStorage.getItem('nido_rol');
    if(this._puedeVer(rol)){ this.rol=rol; return true; }
    document.querySelector('nav').style.display='none';
    document.querySelector('.wrap').style.display='none';
    document.querySelector('.filtros').style.display='none';
    const p=$('puerta'); p.style.display='flex';
    if(rol&&!this._puedeVer(rol)){
      const e=$('pwerr'); e.style.display='block';
      e.textContent='Con la clave de '+((this.ROLES[rol]||{}).nombre||rol)+' no se entra a Data.';
    }
    setTimeout(()=>{const i=$('pw'); if(i)i.focus();},60);
    return false; },
  entrar(){
    const c=($('pw').value||'').trim();
    const rol=this.PASS[c]||this._rolExtra(c);
    const e=$('pwerr');
    if(!rol){ e.style.display='block'; e.textContent='Clave incorrecta.'; return; }
    if(!this._puedeVer(rol)){ e.style.display='block';
      e.textContent='Esa clave es de '+this.ROLES[rol].nombre+' y no tiene acceso a Data.'; return; }
    localStorage.setItem('nido_rol',rol);
    location.reload(); },
  salir(){ localStorage.removeItem('nido_rol'); location.reload(); },
  arranca(){
    if(!this.puerta()) return;
    const D=window.DATOS;
    if(!D){ $('main').innerHTML='<div class="empty">No se pudo leer <b>datos.js</b>.<br>Tiene que estar en la misma carpeta que este archivo.</div>'; return; }
    this.D=D;
    this.A=D.almacenes;
    this.MESES=[...new Set(D.filas.map(r=>r[1].slice(0,7)))].sort();
    // Cada pantalla tiene su propia dirección (…/index.html#dias): así se puede
    // guardar el enlace de una sola pantalla y volver ahí directo.
    // #clien/ARTURO VERA abre directo la ficha de precios de ese cliente
    const h=(location.hash||'').replace('#',''), [hv,hc,hu]=h.split('/');
    if(this.TABS.some(([k])=>k===hv)) this.view=hv;
    if(hv==='clien'&&hc){ this._cli=decodeURIComponent(hc); this._bc=this._cli;
      if(hu==='uno') this._cliUno=this._cli; }   // …/uno abre la lista compra por compra
    onhashchange=()=>{ const v=((location.hash||'').replace('#','').split('/')[0])||'dash';
      if(v!==this.view&&this.TABS.some(([k])=>k===v)){ this.view=v; this.pintaNav(); this.render(); } };
    const r=this.ROLES[this.rol]||{nombre:this.rol};
    const q=$('quien');
    if(q) q.innerHTML=esc(r.nombre)+(r.quien?' · '+esc(r.quien):'')+
      ' · <a onclick="App.salir()" style="color:var(--ink2);cursor:pointer;text-decoration:underline">salir</a>';
    this.pintaNav(); this.pintaFiltros(); this.render();
  },
  /* Línea VENTAS: las pantallas de la fábrica. Están en la otra carpeta, pero
     se entra desde acá para que las dos se sientan una sola aplicación. */
  VENTAS:[['dash','Dashboard'],['ref','Referencias'],['cat','Catálogo'],
          ['cli','Cliente'],['crm','CRM'],['ped','Pedidos']],
  pintaNav(){
    $('nav').innerHTML=this.TABS.map(([k,t])=>
      `<button class="${this.view===k?'on':''}" onclick="App.ir('${k}')">${t}</button>`).join('');
    const nv=$('navventas');
    if(nv) nv.innerHTML=this.VENTAS.map(([k,t])=>
      `<button onclick="location.href='../nido/index.html'">${t}</button>`).join(''); },
  ir(v){ this.view=v; if(location.hash!=='#'+v) history.replaceState(null,'','#'+v);
    this.pintaNav(); this.render(); scrollTo({top:0,behavior:'smooth'}); },

  pintaFiltros(){
    const c=[`<span class="et">Almacén</span>`,
      `<button class="chip ${this.alm===-1?'on':''}" onclick="App.setAlm(-1)">Todos</button>`];
    this.A.forEach((a,i)=>c.push(
      `<button class="chip ${this.alm===i?'on':''}" onclick="App.setAlm(${i})"><i class="pt" style="background:${COLA[i]}"></i>${esc(a)}</button>`));
    c.push(`<span class="et" style="margin-left:6px">Mes</span>`,
      `<span class="chip ${this.mes?'on':''}"><select onchange="App.setMes(this.value)">
         <option value="">Todos los meses</option>
         ${this.MESES.map(m=>`<option value="${m}" ${this.mes===m?'selected':''}>${MESN[+m.slice(5)]} ${m.slice(0,4)}</option>`).join('')}
       </select></span>`);
    $('filtros').innerHTML=c.join('');
  },
  setAlm(i){ this.alm=i; this.pintaFiltros(); this.render(); },
  setMes(m){ this.mes=m; this.pintaFiltros(); this.render(); },

  filtra(){ const a=this.alm, m=this.mes;
    this.F=this.D.filas.filter(r=>(a<0||r[0]===a)&&(!m||r[1].slice(0,7)===m)); },

  /* --------- cálculos que reutilizan todas las pantallas --------- */
  tot(F){ let t=0,q=0; const d=new Set();
    F.forEach(r=>{t+=r[6];q+=r[4];d.add(r[1]);});
    return {t,q,n:F.length,dias:d.size,prom:d.size?t/d.size:0,tk:F.length?t/F.length:0}; },
  agrupa(F,ki,vi){ const m=new Map();
    F.forEach(r=>{ const k=ki(r); const o=m.get(k)||{t:0,q:0,n:0,d:new Set()};
      o.t+=r[6]; o.q+=r[4]; o.n++; o.d.add(r[1]); m.set(k,o); });
    return [...m.entries()].map(([k,o])=>({k,...o,dias:o.d.size})); },
  nomAlm(i){ return this.A[i]; },

  /* Se quita la clase 'empty' del arranque: si se queda, su text-align:center
     hereda a todo el informe y las barras apiladas dejan de nacer en el cero. */
  set(h){ const m=$('main'); m.className=''; m.innerHTML=h; ligarTips(); },
  render(){ this.filtra();
    ({dash:this.vDash,dias:this.vDias,meses:this.vMeses,prod:this.vProd,
      clien:this.vClien}[this.view]||this.vDash).call(this); },
  rotulo(){ const a=this.alm<0?'los 3 almacenes':this.A[this.alm];
    const m=this.mes?(MESN[+this.mes.slice(5)]+' '+this.mes.slice(0,4)):'todo el periodo';
    return a+' · '+m; },
  leyenda(){ return `<div class="ley">${this.A.map((a,i)=>
    `<span><i style="background:${COLA[i]}"></i>${esc(a)}</span>`).join('')}</div>`; },

  /* ======================= RESUMEN ======================= */
  vDash(){
    const k=this.tot(this.F), D=this.D;
    // El comparativo de almacenes siempre muestra los 3: es su razón de ser.
    // El filtro resalta uno y atenúa los otros, no los borra ni les cambia el color.
    const baseMes=this.mes?D.filas.filter(r=>r[1].slice(0,7)===this.mes):D.filas;
    const porAlm=this.A.map((a,i)=>{ const f=baseMes.filter(r=>r[0]===i);
      return {i,a,...this.tot(f)}; });
    const gt=porAlm.reduce((s,o)=>s+o.t,0), mx=Math.max(...porAlm.map(o=>o.t),1);

    // Día de la semana (dentro del filtro): promedio por día, que es lo comparable
    const sem=this.agrupa(this.F,r=>dowDe(r[1])).sort((a,b)=>(b.t/b.dias)-(a.t/a.dias));
    const mejor=sem[0], peor=sem[sem.length-1];

    const meses=this.agrupa(this.F,r=>r[1].slice(0,7)).sort((a,b)=>a.k<b.k?-1:1);
    const mMax=Math.max(...meses.map(o=>o.t),1);
    const mejorMes=[...meses].sort((a,b)=>b.t-a.t)[0];

    const prods=this._prodAgr().sort((a,b)=>b.t-a.t);
    const pMax=prods.length?prods[0].t:1;

    this.set(`<h1>Resumen de ventas</h1>
      <div class="sub">${esc(this.rotulo())} · ${num(k.n)} ventas registradas</div>

      <div class="kpis">
        <div class="kpi dark"><b>${monK(k.t)}</b><span>Ventas</span><small>${mon(k.t)}</small></div>
        <div class="kpi"><b>${num(k.q)}</b><span>Unidades vendidas</span></div>
        <div class="kpi"><b>${num(k.dias)}</b><span>Días con venta</span></div>
        <div class="kpi"><b style="color:var(--acc)">${monK(k.prom)}</b><span>Promedio por día</span><small>${mon(k.prom)}</small></div>
        <div class="kpi"><b>${monK(k.t/k.q)}</b><span>Precio promedio por unidad</span><small>${mon(k.t/k.q)}</small></div>
        <div class="kpi"><b>${monK(k.tk)}</b><span>Promedio por venta</span><small>${mon(k.tk)}</small></div>
        ${mejor?`<div class="kpi"><b style="color:var(--ok)">${DIA[mejor.k]}</b><span>El día que más vende</span><small>${mon(mejor.t/mejor.dias)} por día</small></div>`:''}
      </div>

      <h2>Cada almacén</h2>
      <div class="sub">Lo que puso cada uno${this.mes?' en '+MESN[+this.mes.slice(5)]:''}. Toca uno para dejar solo ese en todo el informe.</div>
      <div class="card">
        ${porAlm.map(o=>{const ap=this.alm>=0&&this.alm!==o.i;
          return `<div class="fila cl" onclick="App.setAlm(${this.alm===o.i?-1:o.i})" tabindex="0"
            data-tip="<b>${esc(o.a)}</b><br>Ventas: ${mon(o.t)}<br>Participación: ${d1(o.t/gt*100)}%<br>${num(o.q)} unidades · ${num(o.n)} ventas<br>${o.dias} días con venta<br>Promedio ${mon(o.prom)} por día"
            style="opacity:${ap?'.42':'1'}">
            <span class="nm" style="flex:0 0 auto;width:132px;font-weight:${this.alm===o.i?'800':'600'}">${esc(o.a)}</span>
            <span class="tr"><i style="width:${o.t/mx*100}%;background:${COLA[o.i]}"></i></span>
            <span class="val" style="width:82px">${monK(o.t)}</span>
            <span class="val dim" style="width:48px">${d1(o.t/gt*100)}%</span></div>`;}).join('')}
        <div class="fila" style="border-top:2px solid var(--line);font-weight:700">
          <span class="nm" style="flex:0 0 auto;width:132px">TOTAL</span>
          <span class="tr" style="background:transparent"></span>
          <span class="val" style="width:82px">${monK(gt)}</span>
          <span class="val dim" style="width:48px">100%</span></div>
        ${this.leyenda().replace('class="ley"','class="ley" style="margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line2)"')}
      </div>

      ${mejor?`<h2>Qué día se vende más</h2>
      <div class="sub">Se compara el <b>promedio por día</b>, no el total: cada día de la semana ha caído distinta cantidad de veces.</div>
      <div class="card" style="border-color:var(--ok);border-width:2px">
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <div><b style="font-size:17px">${DIA[mejor.k]}</b> <span class="tag np">el mejor</span></div>
          <b style="font-size:17px;color:var(--ok)">${mon(mejor.t/mejor.dias)}</b></div>
        <div class="hint">Vende ${d1((mejor.t/mejor.dias)/(peor.t/peor.dias))} veces lo de un ${DIA[peor.k].toLowerCase()},
          que es el más flojo (${mon(peor.t/peor.dias)} por día).
          <a onclick="App.ir('dias')" style="color:var(--acc);cursor:pointer;font-weight:700">ver los 7 días →</a></div>
      </div>`:''}

      <h2>Mes a mes</h2>
      <div class="sub">${this.alm<0?'Barras apiladas: cada color es un almacén.':'Solo '+esc(this.A[this.alm])+'.'}
        Al lado del valor van las <b>unidades entre paréntesis</b>. Toca un mes para ver día por día.</div>
      ${this.alm<0?this.leyenda():''}
      <div class="card">${meses.map(o=>this._mesFila(o,mMax)).join('')||'<div class="empty">Sin datos</div>'}
        ${mejorMes?`<div class="hint" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">
          El mes más fuerte fue <b>${MESN[+mejorMes.k.slice(5)]}</b> con ${mon(mejorMes.t)}.</div>`:''}
      </div>

      <h2>Las 12 referencias que más plata dejan</h2>
      <div class="sub">Por plata vendida, con el precio promedio al que sale cada una.</div>
      <div class="card">
        <div class="cab"><span style="flex:0 0 auto;width:212px">Referencia</span>
          <span style="flex:1">&nbsp;</span>
          <span style="width:66px;text-align:right">Unid.</span>
          <span style="width:88px;text-align:right">Precio prom.</span>
          <span style="width:74px;text-align:right">Plata</span></div>
        ${prods.slice(0,12).map(o=>`<div class="fila" tabindex="0"
          data-tip="<b>${esc(o.k)}</b><br>Plata vendida: ${mon(o.t)}<br>${num(o.q)} unidades en ${num(o.n)} ventas<br>Precio promedio: <b>${mon(o.prom)}</b><br>Se vendió entre ${mon(o.min)} y ${mon(o.max)}<br>${d1(o.t/k.t*100)}% de la venta">
          <span class="nm" style="flex:0 0 auto;width:212px">${esc(o.k)}</span>
          <span class="tr"><i style="width:${o.t/pMax*100}%"></i></span>
          <span class="val dim" style="width:66px">${num(o.q)} und</span>
          <span class="val" style="width:88px">${mon(o.prom)}</span>
          <span class="val" style="width:74px">${monK(o.t)}</span></div>`).join('')}
        <div class="hint" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">
          Son ${prods.length} referencias distintas en total.
          <a onclick="App.ir('prod')" style="color:var(--acc);cursor:pointer;font-weight:700">ver todas con su precio →</a></div>
      </div>`);
  },
  _mesFila(o,mx){
    const ab=this._mesAb===o.k, ym=o.k;
    const porA=this.A.map((a,i)=>{const f=this.F.filter(r=>r[1].slice(0,7)===ym&&r[0]===i);
      return {i,a,t:f.reduce((s,r)=>s+r[6],0),q:f.reduce((s,r)=>s+r[4],0)};});

      <div class="fila cl" style="border:none;padding:2px 0" onclick="App.mesAb('${ym}')" tabindex="0"
        data-tip="<b>${MESN[+ym.slice(5)]} ${ym.slice(0,4)}</b><br>${mon(o.t)} · <b>${num(o.q)} unidades</b><br>${num(o.n)} ventas en ${o.dias} días<br>Promedio ${mon(o.t/o.dias)} por día<br>Precio promedio ${mon(o.q?o.t/o.q:0)} por unidad${this.alm<0?'<br><br>'+porA.filter(p=>p.t>0).map(p=>esc(p.a)+': '+mon(p.t)+' ('+num(p.q)+' und)').join('<br>'):''}">

          `<i style="display:inline-block;height:100%;width:calc(${p.t/mx*100}% - 2px);background:${COLA[p.i]};margin-right:2px;vertical-align:top"></i>`).join('')}</span>
        <span class="val" style="width:78px">${monK(o.t)}</span>
        <span class="val dim" style="width:80px">(${num(o.q)} und)</span>

  },
  mesAb(m){ this._mesAb=this._mesAb===m?'':m; this.render(); },
  _mesDias(ym){
    const por=this.agrupa(this.F.filter(r=>r[1].slice(0,7)===ym),r=>r[1]).sort((a,b)=>a.k<b.k?-1:1);

      ${por.map(o=>{const d=new Date(o.k+'T12:00:00');
        return `<div class="fila" style="padding:3px 0;border:none" tabindex="0"
          data-tip="<b>${d.getDate()} de ${MESN[m]}</b> (${DIA[dowDe(o.k)].toLowerCase()})<br>${mon(o.t)}<br>${num(o.q)} unidades · ${num(o.n)} ventas">
          <span class="nm" style="flex:0 0 auto;width:62px;color:var(--mut)">${String(d.getDate()).padStart(2,'0')} ${DIA3[dowDe(o.k)]}</span>
          <span class="tr" style="height:7px"><i style="width:${o.t/mx*100}%;background:var(--acc2)"></i></span>
          <span class="val dim" style="width:52px">${o.n} vta${o.n===1?'':'s'}</span>
          <span class="val" style="width:74px">${monK(o.t)}</span>
          <span class="val dim" style="width:72px">(${num(o.q)} und)</span></div>`;}).join('')}</div>`;
  },

  /* ======================= DÍA DE LA SEMANA ======================= */
  vDias(){
    const sem=this.agrupa(this.F,r=>dowDe(r[1]));
    if(!sem.length) return this.set('<div class="empty">Sin ventas con este filtro.</div>');
    sem.forEach(o=>o.prom=o.dias?o.t/o.dias:0);
    sem.sort((a,b)=>b.prom-a.prom);
    const gt=sem.reduce((s,o)=>s+o.t,0), mx=Math.max(...sem.map(o=>o.prom),1);
    const ab=this._dow;
    // Cada almacén con su propio mejor día: es distinto y eso es lo útil
    const porAlm=this.A.map((a,i)=>{ const f=this.D.filas.filter(r=>r[0]===i&&(!this.mes||r[1].slice(0,7)===this.mes));
      const s=this.agrupa(f,r=>dowDe(r[1])).map(o=>({...o,prom:o.dias?o.t/o.dias:0})).sort((x,z)=>z.prom-x.prom);
      return {i,a,top:s[0],todos:s}; }).filter(o=>o.top);

    this.set(`<h1>Qué día se vende más</h1>
      <div class="sub">${esc(this.rotulo())}. Toca un día para ver qué se vende ese día.</div>

      <div class="card">
        <div class="cab"><span style="flex:1">Día</span>
          <span style="width:112px;text-align:right">Promedio por día</span>
          <span style="width:46px;text-align:right">Días</span>
          <span style="width:52px;text-align:right">Ventas</span>
          <span style="width:74px;text-align:right">Ticket</span>
          <span style="width:46px;text-align:right">Peso</span></div>
        ${sem.map((o,ix)=>`<div>
          <div class="fila cl" style="border:none" onclick="App.dow(${o.k})" tabindex="0"
            data-tip="<b>${DIA[o.k]}</b><br>Promedio ${mon(o.prom)} por día<br>Total ${mon(o.t)}<br>${o.dias} ${DIA[o.k].toLowerCase()}s con venta<br>${num(o.n)} ventas · ticket ${mon(o.t/o.n)}">
            <span class="nm" style="font-weight:${ix===0?'800':'600'}">${ab===o.k?'▾':'▸'} ${DIA[o.k]}${ix===0?' <span class="tag np">el mejor</span>':''}${ix===sem.length-1?' <span class="tag pe">el más flojo</span>':''}</span>
            <span class="val" style="width:112px">${mon(o.prom)}</span>
            <span class="val dim" style="width:46px">${o.dias}</span>
            <span class="val dim" style="width:52px">${num(o.n)}</span>
            <span class="val dim" style="width:74px">${monK(o.t/o.n)}</span>
            <span class="val dim" style="width:46px">${d1(o.t/gt*100)}%</span></div>
          <div class="tr" style="height:7px;margin-bottom:${ab===o.k?'8px':'5px'}">
            <i style="width:${o.prom/mx*100}%;background:${ix===0?'var(--ok)':(this.alm<0?'var(--acc2)':COLA[this.alm])}"></i></div>
          ${ab===o.k?this._dowProd(o.k):''}</div>`).join('')}
        <div class="hint" style="border-top:1px solid var(--line);padding-top:8px">
          El promedio por día es lo que se compara. El total engaña: si en el periodo cayeron
          31 martes y 28 viernes, el martes acumula más aunque cada viernes venda más.</div>
      </div>

      ${this.alm<0&&porAlm.length?`<h2>El mejor día de cada almacén</h2>
      <div class="sub">No es el mismo para los tres, y ahí está el negocio.</div>
      <div class="card">
        ${porAlm.map(o=>`<div class="fila" tabindex="0"
          data-tip="<b>${esc(o.a)}</b><br>Mejor día: ${DIA[o.top.k]}<br>${mon(o.top.prom)} por día<br>Peor día: ${DIA[o.todos[o.todos.length-1].k]} (${mon(o.todos[o.todos.length-1].prom)})">
          <span class="nm" style="flex:0 0 auto;width:132px"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${COLA[o.i]};margin-right:6px"></i>${esc(o.a)}</span>
          <span style="flex:1;font-weight:700">${DIA[o.top.k]}</span>
          <span class="val" style="width:104px">${mon(o.top.prom)}</span>
          <span class="val dim" style="width:56px">por día</span></div>`).join('')}
      </div>`:''}

      <h2>Todos los días, uno por uno</h2>
      <div class="sub">La misma tabla de arriba, en números y en orden de la semana.</div>
      <div class="tbwrap"><table class="tb">
        <thead><tr><th>Día</th><th class="n">Promedio por día</th><th class="n">Total</th>
          <th class="n">Días</th><th class="n">Ventas</th><th class="n">Unidades</th>
          <th class="n">Ticket</th><th class="n">Peso</th></tr></thead>
        <tbody>${[...sem].sort((a,b)=>a.k-b.k).map(o=>`<tr>
          <td><b>${DIA[o.k]}</b></td><td class="n"><b>${num(o.prom)}</b></td><td class="n">${num(o.t)}</td>
          <td class="n">${o.dias}</td><td class="n">${num(o.n)}</td><td class="n">${num(o.q)}</td>
          <td class="n">${num(o.t/o.n)}</td><td class="n">${d1(o.t/gt*100)}%</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>TOTAL</td><td class="n">—</td><td class="n">${num(gt)}</td>
          <td class="n">${sem.reduce((s,o)=>s+o.dias,0)}</td>
          <td class="n">${num(sem.reduce((s,o)=>s+o.n,0))}</td>
          <td class="n">${num(sem.reduce((s,o)=>s+o.q,0))}</td>
          <td class="n">—</td><td class="n">100%</td></tr></tfoot>
      </table></div>`);
  },
  dow(w){ this._dow=this._dow===w?null:w; this.render(); },
  _dowProd(w){
    const f=this.F.filter(r=>dowDe(r[1])===w);
    const dias=new Set(f.map(r=>r[1])).size||1;
    const pr=this.agrupa(f,r=>this.D.productos[r[2]]).sort((a,b)=>b.q-a.q);
    if(!pr.length) return '';
    const top=pr.slice(0,10), mx=top[0].q||1;
    return `<div class="det">
      <div class="hint" style="margin:0 0 6px">Lo que más se mueve ese día, en unidades. Las unidades se dividen
        entre los ${dias} ${DIA[w].toLowerCase()}s que van y sale el <b>promedio por día</b>: eso es lo que hay que tener listo.</div>
      ${top.map(o=>`<div class="fila" style="padding:3px 0;border:none" tabindex="0"
        data-tip="<b>${esc(o.k)}</b> · ${DIA[w]}<br>${num(o.q)} unidades en ${dias} ${DIA[w].toLowerCase()}s<br>${d1(o.q/dias)} por ${DIA[w].toLowerCase()}<br>${mon(o.t)}">
        <span class="nm" style="flex:0 0 auto;width:172px">${esc(o.k)}</span>
        <span class="tr" style="height:6px"><i style="width:${o.q/mx*100}%"></i></span>
        <span class="val dim" style="width:74px">${num(o.q)} und</span>
        <span class="val" style="width:66px">${d1(o.q/dias)}/día</span></div>`).join('')}
      ${pr.length>10?`<div class="hint">y ${pr.length-10} productos más</div>`:''}</div>`;
  },


  /* ======================= MES A MES (una columna por almacén) ======================= */
  vMeses(){
    const base=this.D.filas.filter(r=>this.alm<0||r[0]===this.alm);
    const ms=[...new Set(base.map(r=>r[1].slice(0,7)))].sort();
    // Cada celda guarda plata Y unidades: las unidades van entre paréntesis al lado
    const cel={}; base.forEach(r=>{ const k=r[1].slice(0,7);
      const c=cel[k]=cel[k]||{tot:0,totq:0};
      const o=c[r[0]]=c[r[0]]||{t:0,q:0};
      o.t+=r[6]; o.q+=r[4]; c.tot+=r[6]; c.totq+=r[4]; });
    const colTot=this.A.map((a,i)=>ms.reduce((s,m)=>s+((cel[m][i]||{}).t||0),0));
    const colQ=this.A.map((a,i)=>ms.reduce((s,m)=>s+((cel[m][i]||{}).q||0),0));
    const granTot=colTot.reduce((a,b)=>a+b,0), granQ=colQ.reduce((a,b)=>a+b,0);
    const mx=Math.max(...ms.map(m=>cel[m].tot),1);
    const meses=this.agrupa(this.F,r=>r[1].slice(0,7)).sort((a,b)=>a.k<b.k?-1:1);
    this.set(`<h1>Mes a mes</h1>
      <div class="sub">Una columna por almacén. Esta tabla muestra <b>siempre todos los meses</b>
        para poder comparar; el filtro de mes de arriba manda en las barras de abajo y en las demás pantallas.</div>
      <div class="tbwrap" style="margin-bottom:14px"><table class="tb">
        <thead><tr><th>Mes</th>
          ${this.A.map((a,i)=>`<th class="n"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${COLA[i]};margin-right:5px"></span>${esc(a)}</th>`).join('')}
          <th class="n">Total del mes</th><th class="n">Peso</th></tr></thead>
        <tbody>${ms.map(m=>`<tr>
          <td><b>${MESN[+m.slice(5)]} ${m.slice(0,4)}</b></td>
          ${this.A.map((a,i)=>{const o=cel[m][i];
            return `<td class="n">${o?num(o.t)+' <span class="dim">('+num(o.q)+')</span>':'<span class="dim">—</span>'}</td>`;}).join('')}
          <td class="n"><b>${num(cel[m].tot)}</b> <span class="dim">(${num(cel[m].totq)})</span></td>
          <td class="n dim">${d1(cel[m].tot/granTot*100)}%</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>TOTAL</td>
          ${colTot.map((t,i)=>`<td class="n">${num(t)} <span class="dim">(${num(colQ[i])})</span></td>`).join('')}
          <td class="n">${num(granTot)} <span class="dim">(${num(granQ)})</span></td>
          <td class="n">100%</td></tr></tfoot>
      </table></div>
      <div class="hint" style="margin-bottom:16px">Los valores están en pesos y <b>entre paréntesis van las unidades</b>.
        Diciembre de 2025 aparece porque los archivos traen unos movimientos de cierre de ese mes.</div>

      <h2>Lo mismo, en barras</h2>
      <div class="sub">Toca un mes para abrir día por día.</div>
      ${this.alm<0?this.leyenda():''}
      <div class="card">${meses.map(o=>this._mesFila(o,mx)).join('')||'<div class="empty">Sin datos</div>'}</div>`);
  },

  /* ======================= PRODUCTOS =======================
     El precio promedio de una referencia es PONDERADO: plata vendida ÷ unidades
     vendidas. No es el promedio de los precios de la lista, porque si una
     referencia se vendió 40 veces a 400.000 y una vez a 100.000, lo que de verdad
     está entrando es casi 400.000, no 250.000. */
  _prodAgr(){
    const D=this.D, m=new Map();
    this.F.forEach(r=>{ const n=D.productos[r[2]];
      let o=m.get(n);
      if(!o){ o={k:n,t:0,q:0,n:0,d:new Set(),alm:{},min:Infinity,max:0}; m.set(n,o); }
      o.t+=r[6]; o.q+=r[4]; o.n++; o.d.add(r[1]);
      const a=o.alm[r[0]]=o.alm[r[0]]||{t:0,q:0};

    const fp=this.agrupa(this.F,r=>D.pagos[r[7]]||'(sin dato)').sort((a,b)=>b.t-a.t);
    const gt=fp.reduce((s,o)=>s+o.t,0), mx=fp.length?fp[0].t:1;
    const porAlm={}; this.F.forEach(r=>{ const n=D.pagos[r[7]]||'(sin dato)';
      (porAlm[n]=porAlm[n]||{})[r[0]]=(porAlm[n][r[0]]||0)+r[6]; });
    // Lo que no entró en caja: cruces de cuentas y deudores
    const pend=fp.filter(o=>/PENDIENTE|DEUDOR|CRUCE/i.test(o.k)).reduce((s,o)=>s+o.t,0);
    this.set(`<h1>Formas de pago</h1>
      <div class="sub">${esc(this.rotulo())} · cómo entró la plata</div>
      ${pend>0?`<div class="card" style="border-color:var(--warn);border-width:2px">
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <b>Venta que no entró como plata</b><b style="color:var(--warn);font-size:17px">${mon(pend)}</b></div>
        <div class="tr" style="height:11px;margin-top:7px"><i style="width:${pend/gt*100}%;background:var(--warn)"></i></div>
        <div class="hint">Es el <b>${d1(pend/gt*100)}%</b> de la venta, marcada como cruce de cuentas o
          cliente deudor. Es venta registrada, pero no es caja. Vale la pena revisar cuánto de eso ya se cobró.</div>
      </div>`:''}
      ${this.alm<0?this.leyenda():''}
      <div class="tbwrap"><table class="tb">
        <thead><tr><th>Forma de pago</th>
          ${this.A.map((a,i)=>`<th class="n"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${COLA[i]};margin-right:5px"></span>${esc(a)}</th>`).join('')}
          <th class="n">Total</th><th class="n">Peso</th><th style="min-width:110px">&nbsp;</th></tr></thead>
        <tbody>${fp.map(o=>`<tr>
          <td>${esc(o.k)}</td>
          ${this.A.map((a,i)=>`<td class="n">${(porAlm[o.k]||{})[i]?num(porAlm[o.k][i]):'<span class="dim">—</span>'}</td>`).join('')}
          <td class="n"><b>${num(o.t)}</b></td><td class="n dim">${d1(o.t/gt*100)}%</td>
          <td><span class="tr" style="height:7px;display:block"><i style="width:${o.t/mx*100}%"></i></span></td></tr>`).join('')}</tbody>
        <tfoot><tr><td>TOTAL</td>
          ${this.A.map((a,i)=>`<td class="n">${num(fp.reduce((s,o)=>s+((porAlm[o.k]||{})[i]||0),0))}</td>`).join('')}
          <td class="n">${num(gt)}</td><td class="n">100%</td><td></td></tr></tfoot>
      </table></div>`);
  },

  /* ======================= DETALLE ======================= */
  vTabla(){
    const D=this.D, q=(this._bt||'').toLowerCase();
    let F=this.F;
    if(q) F=F.filter(r=>(D.productos[r[2]]+' '+D.clientes[r[8]]+' '+D.pagos[r[7]]+' '+this.A[r[0]]).toLowerCase().includes(q));
    const pag=this._pg||0, x=200, tot=F.reduce((s,r)=>s+r[6],0);
    const pgs=Math.max(1,Math.ceil(F.length/x));
    const vis=F.slice(pag*x,pag*x+x);
    this.set(`<h1>Detalle de ventas</h1>
      <div class="sub">${esc(this.rotulo())} · ${num(F.length)} líneas · ${mon(tot)}</div>
      <div class="row" style="margin-bottom:12px">
        <input type="search" placeholder="Buscar producto, cliente, forma de pago, almacén…" value="${esc(this._bt||'')}"
          oninput="App._bt=this.value;App._pg=0;clearTimeout(App._t);App._t=setTimeout(()=>App.render(),250)">
        <button class="btn acc sm" onclick="App.csvDet()">⬇ Bajar a Excel (${num(F.length)} líneas)</button></div>
      <div class="tbwrap"><table class="tb">
        <thead><tr><th>Almacén</th><th>Fecha</th><th>Día</th><th>Producto</th><th>Categoría</th>
          <th class="n">Cant.</th><th class="n">Vr. unitario</th><th class="n">Total</th>
          <th>Forma de pago</th><th>Cliente</th></tr></thead>
        <tbody>${vis.map(r=>`<tr>
          <td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${COLA[r[0]]};margin-right:6px"></span>${esc(this.A[r[0]])}</td>
          <td>${r[1]}</td><td class="dim">${DIA3[dowDe(r[1])]}</td>
          <td>${esc(D.productos[r[2]])}</td><td class="dim">${esc(D.categorias[r[3]])||'—'}</td>
          <td class="n">${num(r[4])}</td><td class="n">${num(r[5])}</td><td class="n"><b>${num(r[6])}</b></td>
          <td>${esc(D.pagos[r[7]])||'—'}</td><td>${esc(D.clientes[r[8]])||'—'}</td></tr>`).join('')
          ||'<tr><td colspan="10" class="empty">Nada con esa búsqueda.</td></tr>'}</tbody>
      </table></div>
      <div class="row" style="margin-top:12px;justify-content:center">
        <button class="btn gh sm" ${pag<=0?'disabled style="opacity:.4"':''} onclick="App.pg(${pag-1})">← Anterior</button>
        <span class="hint" style="margin:0">Página ${pag+1} de ${pgs}</span>
        <button class="btn gh sm" ${pag>=pgs-1?'disabled style="opacity:.4"':''} onclick="App.pg(${pag+1})">Siguiente →</button></div>`);
  },
  pg(n){ this._pg=Math.max(0,n); this.render(); scrollTo({top:0,behavior:'smooth'}); },

  /* ======================= DESCARGAS ======================= */
  /* Punto y coma y BOM: así Excel en español abre el archivo en columnas y con tildes. */
  baja(nom,filas){
    const csv=filas.map(f=>f.map(c=>{ const s=c==null?'':String(c);
      return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n');
    const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=nom; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  },
  csvDet(){ const D=this.D, q=(this._bt||'').toLowerCase();
    let F=this.F;
    if(q) F=F.filter(r=>(D.productos[r[2]]+' '+D.clientes[r[8]]+' '+D.pagos[r[7]]+' '+this.A[r[0]]).toLowerCase().includes(q));
    const out=[['ALMACEN','FECHA','MES','DIA SEMANA','PRODUCTO','CATEGORIA','CANTIDAD','VALOR UNITARIO','TOTAL','FORMA DE PAGO','CLIENTE']];
    F.forEach(r=>out.push([this.A[r[0]],r[1],MESN[+r[1].slice(5,7)].toUpperCase(),DIA[dowDe(r[1])].toUpperCase(),
      D.productos[r[2]],D.categorias[r[3]],r[4],r[5],r[6],D.pagos[r[7]],D.clientes[r[8]]]));
    this.baja('ventas_colchones.csv',out); },
  csvProd(){
    // Sale en el mismo orden que se está viendo en pantalla
    const ord=this._ordP||{col:'t',dir:-1};
    const pr=this._prodAgr().sort((a,b)=>{ const x=this._valOrd(a,ord.col), y=this._valOrd(b,ord.col);
      return typeof x==='string'?ord.dir*x.localeCompare(y,'es'):ord.dir*(x-y); });
    const out=[['REFERENCIA',
      ...this.A.map(a=>'PLATA '+a), ...this.A.map(a=>'PRECIO PROM '+a),
      'PRECIO PROMEDIO','PRECIO MAS BAJO','PRECIO MAS ALTO',
      'UNIDADES','PLATA VENDIDA','LINEAS','DIAS CON VENTA']];
    pr.forEach(o=>out.push([o.k,
      ...this.A.map((a,i)=>Math.round((o.alm[i]||{}).t||0)),
      ...this.A.map((a,i)=>{const x=o.alm[i]; return x&&x.q>0?Math.round(x.t/x.q):'';}),
      Math.round(o.prom),Math.round(o.min),Math.round(o.max),
      o.q,Math.round(o.t),o.n,o.dias]));
    this.baja('precios_y_productos_colchones.csv',out); },
};
App.arranca();
</script>
