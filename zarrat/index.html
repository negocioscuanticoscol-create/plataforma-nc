<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZARRAT · Atelier</title>
<style>
  :root{
    --paper:#f5f2ec; --card:#fffdf9; --ink:#17150f; --ink2:#4a463c; --mut:#918a7a;
    --line:#e2dbcd; --line2:#efe9dd; --acc:#8a6a3d; --acc2:#b08c56;
    --ok:#4a7a52; --warn:#b4622e; --bad:#a33b30;
    --sh:0 1px 2px rgba(30,24,10,.04),0 10px 30px -16px rgba(30,24,10,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 90px}
  /* ---- header ---- */
  header{background:var(--ink);color:var(--paper);padding:16px 0;margin-bottom:0}
  .hd{max-width:900px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:Georgia,"Times New Roman",serif;font-size:26px;letter-spacing:.34em;font-weight:400;text-indent:.34em}
  .brand small{display:block;font-family:"Segoe UI",sans-serif;font-size:9.5px;letter-spacing:.28em;color:var(--acc2);text-indent:.28em;margin-top:2px}
  .hd .quien{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a49a86}
  /* ---- nav ---- */
  nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;overflow-x:auto}
  .nv{max-width:900px;margin:0 auto;padding:0 10px}
  .nvfila{display:flex;gap:2px;overflow-x:auto}
  .nvfila+.nvfila{border-top:1px solid var(--line2)}
  .nvfila+.nvfila button{padding:10px 12px;font-size:12px}
  nav button{flex:0 0 auto;background:none;border:none;padding:13px 12px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
  nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
  /* ---- generales ---- */
  h1{font-family:Georgia,serif;font-size:24px;font-weight:400;letter-spacing:.01em;margin:22px 0 3px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
  label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:9px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  textarea{min-height:64px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .btn{padding:12px 18px;border:none;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.acc{background:var(--acc)}
  .btn.gh{background:transparent;border:1px solid var(--line);color:var(--ink2)}
  .btn.full{width:100%;margin-top:12px}
  .btn.sm{padding:7px 12px;font-size:12px;border-radius:7px}
  /* ---- items ---- */
  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .item .nm{font-weight:700;font-size:15px}
  .item .mt{font-size:12.5px;color:var(--mut);margin-top:2px}
  .item.done{opacity:.5}
  .item.done .nm{text-decoration:line-through}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--line2);color:var(--ink2)}
  .tag.a{background:#f0e6d6;color:var(--acc)}
  .empty{text-align:center;color:var(--mut);padding:34px 12px;font-size:14px}
  /* ---- KPIs ---- */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--sh)}
  .kpi b{display:block;font-size:22px;font-family:Georgia,serif;font-weight:400;letter-spacing:-.01em}
  .kpi span{font-size:11px;color:var(--mut);letter-spacing:.05em}
  .kpi.eq{grid-column:1/-1;background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .kpi.eq b{color:var(--acc2);font-size:28px}
  .kpi.eq span{color:#a49a86}
  /* ---- catalogo ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .pz{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
  .pz .img{aspect-ratio:3/4;background:#efeae0 center/cover no-repeat;position:relative}
  .pz .img::after{content:"ZARRAT";position:absolute;bottom:6px;right:8px;font-family:Georgia,serif;font-size:9px;letter-spacing:.22em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .pz .in{padding:9px 11px}
  .pz .n{font-weight:700;font-size:13.5px;line-height:1.25}
  .pz .v{color:var(--acc);font-weight:800;font-size:14px;margin-top:2px}
  .pz .f{font-size:10.5px;color:var(--mut);margin-top:1px}
  /* ---- medidas ---- */
  .med{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
  .med .m label{margin-top:0}
  .med input{text-align:center;font-weight:700}
  /* ---- crm ---- */
  .etapas{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .et{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--mut)}
  .et.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
  .hint{font-size:12px;color:var(--mut);margin-top:5px}
  @media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}
</style>

<header><div class="hd">
  <div class="brand">ZARRAT<small>MAESTROS DEL ESTILO EN UN SOLO SITIO</small></div>
  <div class="quien">Sistema de gestión</div>
</div></header>

<nav><div class="nv" id="nav"></div></nav>

<div class="wrap"><div id="main"></div></div>

<script>
const SB='https://fnayedgvamxktxfvywwl.supabase.co', K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const $$=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const hoy=()=>new Date().toISOString().slice(0,10);
const mesAct=()=>new Date().toISOString().slice(0,7);

/* El servidor NUNCA devuelve mas de 1000 filas aunque se le pida mas, y lo hace
   en silencio. GETALL pide de a 1000 hasta agotar, para que ninguna pantalla
   se quede corta cuando la tabla crece. */
async function GETALL(p){
  const base=String(p).replace(/[?&](limit|offset)=\d+/g,'');
  const sep=base.includes('?')?'&':'?';
  const out=[];
  for(let i=0,off=0;i<60;i++,off+=1000){
    let r; try{ r=await fetch(SB+'/rest/v1/'+base+sep+'limit=1000&offset='+off,{headers:H}); }catch(e){ break; }
    if(!r.ok) break;
    let b; try{ b=await r.json(); }catch(e){ break; }
    if(!Array.isArray(b)||!b.length) break;
    out.push(...b);
    if(b.length<1000) break;
  }
  return out;
}
async function api(p,o={}){
  try{ const r=await fetch(SB+'/rest/v1/'+p,{headers:H,...o}); const t=await r.text();
    if(!r.ok){ console.warn('API',p,t.slice(0,120)); return []; }
    const d=t?JSON.parse(t):[]; return Array.isArray(d)?d:[]; }   // siempre array: nunca tumba la vista
  catch(e){ console.warn('API',p,e.message); return []; }
}
const get=p=>api(p);
// si una vista revienta, se avisa en pantalla en vez de dejarla en blanco
function safe(fn,nom){ return async()=>{ try{ await fn(); }catch(e){ console.error(nom,e);
  $('main').innerHTML=`<div class="card" style="border-left:4px solid var(--bad)"><b>No pude cargar ${nom}</b><div class="hint">${esc(e.message)}</div>
  <button class="btn gh full" onclick="go('${nom}')">Reintentar</button></div>`; } }; }
const post=(t,b,pref)=>fetch(SB+'/rest/v1/'+t,{method:'POST',headers:{...H,Prefer:pref||'return=representation'},body:JSON.stringify(b)})
  .then(async r=>{ const x=await r.text(); if(!r.ok){ alert('No se pudo guardar: '+x.slice(0,120)); throw new Error(x); } return x?JSON.parse(x):null; });
const patch=(t,q,b)=>fetch(SB+'/rest/v1/'+t+'?'+q,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(b)});
const del=(t,q)=>fetch(SB+'/rest/v1/'+t+'?'+q,{method:'DELETE',headers:H});

/* Dos filas: arriba lo que se ARMA (el taller), abajo lo que se VENDE (la calle).
   Buscar «costos» y «cotizaciones» en la misma tira era lo que hacía perder el hilo. */
const TABS_ARMA=[['pend','🏗️ Estructura'],['gastos','💰 Gastos'],['prov','🚚 Proveedores'],
                 ['costos','🧵 Costos'],['catalogo','🖼️ Catálogo'],['medidas','📐 Medidas']];
const TABS_VENDE=[['horas','⏱️ Horas'],['clientes','👥 Clientes'],['crm','📇 CRM'],
                  ['cotiz','📋 Cotizaciones'],['pedidos','🧾 Pedidos'],['ventas','🛒 Ventas']];
const TABS=[...TABS_ARMA,...TABS_VENDE];
let TAB='pend', CLI=[], PRENDAS=[], CAT=[];
const _tira=T=>'<div class="nvfila">'+T.map(([v,n])=>`<button id="t_${v}" onclick="go('${v}')">${n}</button>`).join('')+'</div>';
$('nav').innerHTML=_tira(TABS_ARMA)+_tira(TABS_VENDE);
function go(t){
  TAB=t; TABS.forEach(([v])=>{const b=$('t_'+v); if(b)b.className=(v===t?'on':'');});
  const V={pend:vPend,gastos:vGastos,clientes:vClientes,medidas:vMedidas,catalogo:vCatalogo,prov:vProv,costos:vCostos,cotiz:vCotiz,pedidos:vPedidos,horas:vHoras,ventas:vVentas,crm:vCrm}[t];
  if(V) safe(V,t)();
}

/* ═══════ HORAS · lo que NC le trabaja a este cliente ═══════
   No es el trabajo del taller: es el tiempo que le metemos nosotros a esta app. Se
   guarda en nc_hora con negocio_id, así que acá se ve lo de Zarrat y en el Centro de
   Mando se ve el consolidado de todos los clientes sin volver a registrar nada.
   Sin esto no se sabe cuál cliente sale caro ni cuánto cobrarle al siguiente. */
const NEG_ID='zarrat';
let USRS=[], HRS=[], HMES='';
const hhmm=m=>{ m=Math.round(+m||0); const h=Math.floor(m/60); return h?h+'h '+(m%60)+'m':(m%60)+'m'; };
function minsDe(i,f){ if(!i||!f) return 0;
  const [a,b]=i.split(':').map(Number), [c,d]=f.split(':').map(Number);
  let m=(c*60+d)-(a*60+b); if(m<0) m+=1440;   // pasó de medianoche
  return m; }
async function vHoras(){
  USRS=await get('nc_usuario?activo=is.true&order=nombre.asc');
  HRS=await get('nc_hora?negocio_id=eq.'+NEG_ID+'&order=fecha.desc&limit=800');
  const meses=[...new Set(HRS.map(x=>String(x.fecha||'').slice(0,7)).filter(Boolean))].sort().reverse();
  if(HMES&&!meses.includes(HMES)) HMES='';
  const vis=HMES?HRS.filter(x=>String(x.fecha||'').slice(0,7)===HMES):HRS;
  const tot=vis.reduce((s,x)=>s+(+x.minutos||0),0);
  const plata=vis.reduce((s,x)=>{ const u=USRS.find(y=>y.id===x.usuario_id);
    return s+(+x.minutos||0)/60*(+(u&&u.tarifa_hora)||0); },0);
  const porU={}; vis.forEach(x=>{ porU[x.usuario_id]=(porU[x.usuario_id]||0)+(+x.minutos||0); });
  const hoy=new Date().toISOString().slice(0,10);
  $('main').innerHTML=`<h1>Horas</h1>
    <div class="sub">El tiempo que NC le trabaja a Zarrat. En el Centro de Mando se ve junto al de los demás clientes.</div>
    <div class="card">
      <div class="g3"><div><label>Quién</label><select id="h_u">${USRS.map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join('')}</select></div>
        <div><label>Fecha</label><input type="date" id="h_f" value="${hoy}"></div>
        <div><label>Qué se hizo</label><input id="h_t" placeholder="Ej: pestaña de costos"></div></div>
      <div class="g3"><div><label>Empezó</label><input type="time" id="h_i" onchange="hCalc()"></div>
        <div><label>Terminó</label><input type="time" id="h_ff" onchange="hCalc()"></div>
        <div><label>Minutos</label><input type="number" id="h_m" placeholder="se calcula solo"></div></div>
      <div class="hint" id="h_prev"></div>
      <button class="btn acc full" onclick="hAdd()">+ Registrar tiempo</button>
    </div>
    <div class="card">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <select onchange="hMes(this.value)" style="max-width:190px">
          <option value=""${!HMES?' selected':''}>Todo</option>
          ${meses.map(x=>`<option value="${x}"${HMES===x?' selected':''}>${x}</option>`).join('')}</select>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:22px;font-weight:800;color:var(--acc)">${hhmm(tot)}</div>
          ${plata?`<div class="hint">${$$(plata)} a las tarifas cargadas</div>`:''}</div>
      </div>
      ${Object.keys(porU).length?Object.entries(porU).sort((a,b)=>b[1]-a[1]).map(([uid,mm])=>{
        const u=USRS.find(y=>y.id===+uid)||{nombre:'(usuario borrado)'};
        return `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px">
          <span>${esc(u.nombre)}</span><b>${hhmm(mm)}</b></div>`;}).join(''):''}
    </div>
    ${vis.length?vis.map(x=>{ const u=USRS.find(y=>y.id===x.usuario_id)||{};
      return `<div class="item"><div><div class="nm">${esc(x.tarea||'sin descripción')}</div>
      <div class="mt">${esc(u.nombre||'—')} · 📅 ${esc(x.fecha||'')}${x.inicio?' · '+String(x.inicio).slice(0,5)+'→'+String(x.fin||'').slice(0,5):''}</div></div>
      <div style="text-align:right"><div class="nm">${hhmm(x.minutos)}</div>
        <button class="btn sm gh" style="margin-top:5px" onclick="hDel(${x.id})">✕</button></div></div>`;}).join('')
      :'<div class="empty">Sin tiempo registrado todavía.</div>'}
    <div class="card">
      <div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--mut);margin-bottom:7px">QUIÉNES TRABAJAN</div>
      ${USRS.map(u=>`<div style="display:grid;grid-template-columns:1fr 130px 120px auto;gap:6px;align-items:center;margin-bottom:5px">
        <input value="${esc(u.nombre)}" onchange="uSet(${u.id},'nombre',this.value)">
        <input value="${esc(u.rol||'')}" placeholder="rol" onchange="uSet(${u.id},'rol',this.value)">
        <input type="number" value="${+u.tarifa_hora||0}" title="Tarifa por hora" onchange="uSet(${u.id},'tarifa_hora',this.value)">
        <button class="btn gh" style="padding:4px 9px" onclick="uDel(${u.id})">✕</button></div>`).join('')}
      <div style="display:grid;grid-template-columns:1fr 130px 120px auto;gap:6px;margin-top:8px">
        <input id="u_n" placeholder="Nombre"><input id="u_r" placeholder="Rol">
        <input id="u_t" type="number" placeholder="Tarifa/hora">
        <button class="btn gh" onclick="uAdd()">+ persona</button></div>
      <div class="hint">La tarifa es opcional: en cero solo se mide el tiempo.</div>
    </div>`;
}
function hMes(v){ HMES=v; vHoras(); }
function hCalc(){ const i=($('h_i')||{}).value, f=($('h_ff')||{}).value, m=minsDe(i,f);
  if(m&&$('h_m')) $('h_m').value=m;
  if($('h_prev')) $('h_prev').textContent=m?'Son '+hhmm(m):''; }
async function hAdd(){
  const u=($('h_u')||{}).value; if(!u){ alert('Primero agrega una persona abajo'); return; }
  const i=($('h_i')||{}).value||null, f=($('h_ff')||{}).value||null;
  const m=+($('h_m')||{}).value||minsDe(i,f);
  if(!m){ alert('Pon las horas o los minutos'); return; }
  await post('nc_hora',{usuario_id:+u,negocio_id:NEG_ID,fecha:$('h_f').value||new Date().toISOString().slice(0,10),
    inicio:i,fin:f,minutos:m,tarea:($('h_t').value||'').trim()||null},'return=minimal');
  vHoras();
}
async function hDel(id){ if(!confirm('¿Borrar este registro de tiempo?'))return;
  await del('nc_hora','id=eq.'+id); vHoras(); }
async function uAdd(){ const n=($('u_n').value||'').trim(); if(!n){ alert('Falta el nombre'); return; }
  await post('nc_usuario',{nombre:n,rol:($('u_r').value||'').trim()||null,
    tarifa_hora:+$('u_t').value||0,activo:true},'return=minimal'); vHoras(); }
async function uSet(id,campo,v){ const b={}; b[campo]=campo==='tarifa_hora'?(+v||0):v;
  await patch('nc_usuario','id=eq.'+id,b); vHoras(); }
async function uDel(id){ if(!confirm('¿Quitar a esta persona? Sus horas quedan registradas.'))return;
  await patch('nc_usuario','id=eq.'+id,{activo:false}); vHoras(); }

/* ═══════ PEDIDOS · la cotización que se volvió compromiso ═══════
   La cotización es una propuesta; el pedido es lo que hay que entregar. Se convierte
   sin volver a escribir nada y ahí mismo va la programación: a qué hora se arranca y
   a qué hora tiene que estar listo. Anular no borra: el pedido se queda con su motivo
   y deja de contar, porque saber qué se cayó y por qué vale más que la lista limpia. */
const ESTPED=['nuevo','en proceso','terminado','entregado'];
let PEDS=[], PEDEDIT=null;
const dtLocal=iso=>{ if(!iso) return ''; const d=new Date(iso), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); };
const dtTxt=iso=>{ if(!iso) return '—'; try{ return new Date(iso).toLocaleString('es-CO',
  {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return '—'; } };
/* Cuánto trabajo hay entre arrancar y entregar. Sirve para cotizar el siguiente igual. */
const dur=(a,b)=>{ if(!a||!b) return ''; const h=(new Date(b)-new Date(a))/3.6e6;
  if(h<=0) return ''; return h<24?h.toFixed(1)+' h':(h/24).toFixed(1)+' días'; };
async function aPedido(cid){
  const c=(await get('zarrat_cotizaciones?id=eq.'+cid))[0]; if(!c){ alert('No encontré la cotización'); return; }
  const ya=await get('zarrat_pedidos?cotizacion_id=eq.'+cid+'&anulado=is.false');
  if(ya.length&&!confirm('Esta cotización ya tiene un pedido. ¿Crear otro?')) return;
  await post('zarrat_pedidos',{folio:c.folio,cotizacion_id:c.id,cliente_id:c.cliente_id,
    cliente_nombre:c.cliente_nombre,tipo:c.tipo,items:c.items||[],total:+c.total||0,
    costo_interno:+c.costo_interno||0,estado:'nuevo',notas:c.notas||null},'return=minimal');
  await patch('zarrat_cotizaciones','id=eq.'+cid,{estado:'vendida'});
  go('pedidos');
}
async function vPedidos(){
  PEDS=await get('zarrat_pedidos?order=creado_en.desc&limit=300');
  if(PEDEDIT&&!PEDS.some(x=>x.id===PEDEDIT)) PEDEDIT=null;
  const vivos=PEDS.filter(x=>!x.anulado);
  const tot=vivos.reduce((s,x)=>s+(+x.total||0),0);
  const cost=vivos.reduce((s,x)=>s+(+x.costo_interno||0),0);
  const porEst=e=>vivos.filter(x=>(x.estado||'nuevo')===e).length;
  $('main').innerHTML=`<h1>Pedidos</h1>
    <div class="sub">${vivos.length} vivos · ${PEDS.length-vivos.length} anulados · lo que hay comprometido y para cuándo</div>
    <div class="card"><div class="g3">
      <div><div class="hint">COMPROMETIDO</div><div style="font-size:19px;font-weight:800;color:var(--acc)">${$$(tot)}</div></div>
      <div><div class="hint">COSTO</div><div style="font-size:19px;font-weight:800">${$$(cost)}</div></div>
      <div><div class="hint">DEJA</div><div style="font-size:19px;font-weight:800;color:var(--ok)">${$$(tot-cost)}</div></div>
    </div>
    <div class="hint" style="margin-top:8px">${ESTPED.map(e=>`${esc(e)}: <b>${porEst(e)}</b>`).join(' · ')}</div></div>
    ${PEDS.length?PEDS.map(x=>pedFila(x)).join(''):'<div class="empty">Sin pedidos todavía. Se crean desde Cotizaciones con el botón «→ Pedido».</div>'}`;
}
function pedFila(x){
  const anu=!!x.anulado, ed=PEDEDIT===x.id;
  const d=dur(x.hora_inicio,x.hora_fin);
  const tarde=!anu&&x.hora_fin&&new Date(x.hora_fin)<new Date()&&x.estado!=='entregado'&&x.estado!=='terminado';
  return `<div class="item" style="display:block${anu?';opacity:.55;border-left:4px solid var(--bad)':(tarde?';border-left:4px solid var(--warn)':'')}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:start">
      <div style="min-width:0">
        <div class="nm"${anu?' style="text-decoration:line-through"':''}>${esc(x.cliente_nombre||'—')}
          <span class="tag ${x.estado==='entregado'?'a':''}">${esc(x.estado||'nuevo')}</span>
          ${tarde?'<span class="tag" style="background:#f6e6d8;color:var(--warn)">se pasó la hora</span>':''}</div>
        <div class="mt">${esc(x.folio||'')} · ${esc(x.tipo||'')} · 📅 ${(x.creado_en||'').slice(0,10)}</div>
        <div class="mt">${(x.items||[]).map(i=>esc(i.n)+' '+$$(i.v)).join(' · ')||'sin ítems'}</div>
        <div class="mt">🕒 arranca ${dtTxt(x.hora_inicio)} → entrega ${dtTxt(x.hora_fin)}${d?' · <b>'+d+'</b>':''}</div>
        ${anu?`<div class="mt" style="color:var(--bad);font-weight:700">ANULADO${x.anulado_por?' por '+esc(x.anulado_por):''}${
          x.anulado_en?' · '+String(x.anulado_en).slice(0,10):''}${x.anulado_nota?' — '+esc(x.anulado_nota):''}</div>`:''}
      </div>
      <div style="text-align:right;flex:none"><div class="nm" style="color:var(--acc)"${anu?' style="text-decoration:line-through"':''}>${$$(x.total)}</div>
        ${anu?`<button class="btn sm gh" style="margin-top:5px" onclick="pedReact(${x.id})">reactivar</button>`
             :`<button class="btn sm gh" style="margin-top:5px" onclick="pedEdit(${ed?'null':x.id})">${ed?'cerrar':'✎ editar'}</button>`}</div>
    </div>
    ${ed?`<div style="border:1px dashed var(--acc);border-radius:9px;padding:11px;margin-top:10px;background:#faf7f1">
      <div class="g3">
        <div><label>Estado</label><select id="pd_e_${x.id}">${ESTPED.map(e=>`<option ${e===(x.estado||'nuevo')?'selected':''}>${e}</option>`).join('')}</select></div>
        <div><label>Arranca</label><input type="datetime-local" id="pd_i_${x.id}" value="${dtLocal(x.hora_inicio)}"></div>
        <div><label>Debe estar listo</label><input type="datetime-local" id="pd_f_${x.id}" value="${dtLocal(x.hora_fin)}"></div></div>
      <label>Notas</label><input id="pd_n_${x.id}" value="${esc(x.notas||'')}" placeholder="Detalles del trabajo, quién lo hace…">
      <div style="display:flex;gap:8px;margin-top:11px">
        <button class="btn acc" onclick="pedSave(${x.id})">Guardar</button>
        <button class="btn gh" onclick="pedEdit(null)">Cancelar</button>
        <button class="btn gh" style="margin-left:auto;color:var(--bad)" onclick="pedAnular(${x.id})">Anular pedido</button></div>
    </div>`:''}</div>`;
}
function pedEdit(id){ PEDEDIT=(id===null||id==='null')?null:id; vPedidos(); }
async function pedSave(id){
  const v=k=>(($('pd_'+k+'_'+id)||{}).value||'').trim();
  const iso=t=>t?new Date(t).toISOString():null;
  await patch('zarrat_pedidos','id=eq.'+id,{estado:v('e'),hora_inicio:iso(v('i')),
    hora_fin:iso(v('f')),notas:v('n')||null});
  PEDEDIT=null; vPedidos();
}
async function pedAnular(id){
  const m=prompt('¿Por qué se anula este pedido?\n(el cliente desistió, no pagó, se cambió el diseño…)','');
  if(m===null) return;
  if(!String(m).trim()){ alert('Escribe por qué se anula.'); return; }
  await patch('zarrat_pedidos','id=eq.'+id,{anulado:true,anulado_en:new Date().toISOString(),
    anulado_nota:String(m).trim(),anulado_por:'Zarrat'});
  PEDEDIT=null; vPedidos();
}
async function pedReact(id){ if(!confirm('¿Reactivar? Vuelve a contar en los totales.'))return;
  await patch('zarrat_pedidos','id=eq.'+id,{anulado:false,anulado_en:null,anulado_nota:null,anulado_por:null});
  vPedidos(); }

/* ═══════ PROVEEDORES · de aquí nace el material ═══════
   Un material escrito suelto dentro de un costo se pierde: nadie sabe a quién se le
   compró ni a cómo estaba. Acá el material vive con su proveedor, su unidad y su
   precio, y desde Costos se jala ya armado. */
let PROV=[], MATS=[], PROVEDIT=null;
async function vProv(){
  PROV=await get('zarrat_proveedores?order=nombre.asc&limit=300');
  MATS=await get('zarrat_materiales?order=nombre.asc&limit=800');
  if(PROVEDIT&&!PROV.some(x=>x.id===PROVEDIT)) PROVEDIT=null;
  const mp=id=>MATS.filter(m=>m.proveedor_id===id);
  $('main').innerHTML=`<h1>Proveedores</h1>
    <div class="sub">${PROV.length} proveedores · ${MATS.length} materiales. De acá salen los materiales de la hoja de costos.</div>
    <div class="card">
      <div class="g3"><div><label>Proveedor</label><input id="pv_n" placeholder="Ej: Marroquinero Restrepo"></div>
        <div><label>Contacto</label><input id="pv_c" placeholder="Con quién se habla"></div>
        <div><label>Teléfono</label><input id="pv_t" placeholder="310 000 0000"></div></div>
      <div class="g3"><div><label>Dirección</label><input id="pv_d"></div>
        <div><label>Ciudad</label><input id="pv_ci" placeholder="Bogotá"></div>
        <div><label>Correo</label><input id="pv_e"></div></div>
      <label>Notas</label><input id="pv_no" placeholder="Días de entrega, mínimos, formas de pago…">
      <button class="btn acc full" onclick="provAdd()">+ Agregar proveedor</button>
    </div>
    ${PROV.length?PROV.map(v=>`<div class="card">
      ${PROVEDIT===v.id?`
      <!-- Un proveedor cambia de telefono, se muda o pasa a otro contacto: si solo se
           puede borrar y volver a crear, se pierden los materiales que cuelgan de el. -->
      <div style="border:1px dashed var(--acc);border-radius:9px;padding:11px;background:#faf7f1">
        <div style="font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--acc);margin-bottom:8px">EDITANDO PROVEEDOR</div>
        <div class="g3"><div><label>Proveedor</label><input id="pe_n_${v.id}" value="${esc(v.nombre||'')}"></div>
          <div><label>Contacto</label><input id="pe_c_${v.id}" value="${esc(v.contacto||'')}"></div>
          <div><label>Teléfono</label><input id="pe_t_${v.id}" value="${esc(v.telefono||'')}"></div></div>
        <div class="g3"><div><label>Dirección</label><input id="pe_d_${v.id}" value="${esc(v.direccion||'')}"></div>
          <div><label>Ciudad</label><input id="pe_ci_${v.id}" value="${esc(v.ciudad||'')}"></div>
          <div><label>Correo</label><input id="pe_e_${v.id}" value="${esc(v.email||'')}"></div></div>
        <label>Notas</label><input id="pe_no_${v.id}" value="${esc(v.notas||'')}" placeholder="Días de entrega, mínimos, formas de pago…">
        <div style="display:flex;gap:8px;margin-top:11px">
          <button class="btn acc" onclick="provSave(${v.id})">Guardar cambios</button>
          <button class="btn gh" onclick="provEdit(null)">Cancelar</button>
          <button class="btn gh" style="margin-left:auto;color:var(--bad)" onclick="provDel(${v.id})">Quitar proveedor</button></div>
      </div>`:`
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
        <div><h2 style="margin:0">${esc(v.nombre)}</h2>
          <div class="hint">${[v.contacto,v.telefono,v.ciudad,v.direccion,v.email].filter(Boolean).map(esc).join(' · ')||'sin datos de contacto'}</div>
          ${v.notas?`<div class="hint">${esc(v.notas)}</div>`:''}</div>
        <div style="display:flex;gap:6px;flex:none">
          <button class="btn gh sm" onclick="provEdit(${v.id})">✎ editar</button>
          <button class="btn gh sm" onclick="provDel(${v.id})">✕</button></div></div>`}
      <div style="font-weight:800;color:var(--acc);font-size:11.5px;letter-spacing:.06em;margin:12px 0 6px">MATERIALES QUE VENDE</div>
      ${mp(v.id).length?`<div style="display:grid;grid-template-columns:1.2fr 78px 78px 96px 96px 92px 92px auto;gap:5px;
        font-size:9px;color:var(--mut);font-weight:700;text-transform:uppercase;padding:0 2px 3px">
        <span>Material</span><span>Calibre</span><span>Color</span><span>Ref. nuestra</span>
        <span>Unidad</span><span>Valor</span><span>Ref. prov.</span><span></span></div>`+mp(v.id).map(m=>`<div style="display:grid;grid-template-columns:1.2fr 78px 78px 96px 96px 92px 92px auto;gap:5px;align-items:center;margin-bottom:5px">
        <input value="${esc(m.nombre)}" onchange="matSet(${m.id},'nombre',this.value)">
        <input value="${esc(m.calibre||'')}" placeholder="—" onchange="matSet(${m.id},'calibre',this.value)">
        <input value="${esc(m.color||'')}" placeholder="—" onchange="matSet(${m.id},'color',this.value)">
        <input value="${esc(m.referencia||'')}" placeholder="—" onchange="matSet(${m.id},'referencia',this.value)">
        <select onchange="matSet(${m.id},'unidad',this.value)">${UNIDS.map(u=>`<option ${u===m.unidad?'selected':''}>${u}</option>`).join('')}</select>
        <input type="number" value="${+m.valor_unit||0}" title="Valor por unidad" onchange="matSet(${m.id},'valor_unit',this.value)">
        <input value="${esc(m.ref_prov||'')}" placeholder="—" onchange="matSet(${m.id},'ref_prov',this.value)">
        <button class="btn gh" style="padding:4px 9px" onclick="matDel(${m.id})">✕</button>
        ${m.notas?`<div style="grid-column:1/-1;font-size:11.5px;color:var(--mut);margin:-2px 0 4px 2px">${esc(m.notas)}</div>`:''}
        </div>`).join('')
        :'<div class="hint">Todavía no tiene materiales cargados.</div>'}
      <!-- El material se crea COMPLETO: si toca crearlo y despues editarlo fila por
           fila, se queda a medias con el precio en cero. -->
      <div style="border:1px dashed var(--line);border-radius:9px;padding:10px;margin-top:10px;background:#faf7f1">
        <div style="font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut);margin-bottom:7px">
          NUEVO MATERIAL DE ${esc((v.nombre||'').toUpperCase())}</div>
        <div class="g2"><div><label>Material</label><input id="mn_${v.id}" placeholder="Ej: Cuero natural graso"></div>
          <div><label>Tipo de material</label><select id="mc_${v.id}">${CATMAT.map(k=>`<option>${k}</option>`).join('')}</select></div></div>
        <div class="g3"><div><label>Calibre</label><input id="mca_${v.id}" placeholder="Ej: 1.4 mm"></div>
          <div><label>Color</label><input id="mco_${v.id}" placeholder="Ej: Miel"></div>
          <div><label>Referencia del material</label><input id="mrf_${v.id}" placeholder="La nuestra"></div></div>
        <div class="g3"><div><label>Unidad</label><select id="mu_${v.id}">${UNIDS.map(u=>`<option ${u==='unidad'?'selected':''}>${u}</option>`).join('')}</select></div>
          <div><label>Valor por unidad</label><input id="mv_${v.id}" type="number" placeholder="0"></div>
          <div><label>Referencia del proveedor</label><input id="mr_${v.id}" placeholder="Con qué código lo pide él"></div></div>
        <label>Notas</label><input id="mo_${v.id}" placeholder="Color, calibre, mínimo de compra…">
        <button class="btn acc full" onclick="matAdd(${v.id})">+ Agregar material</button>
      </div>
    </div>`).join(''):'<div class="card"><div class="hint">Todavía no hay proveedores. Agrega el primero arriba.</div></div>'}`;
}
async function provAdd(){
  const nom=($('pv_n').value||'').trim(); if(!nom){ alert('Falta el nombre del proveedor'); return; }
  await post('zarrat_proveedores',{nombre:nom,contacto:$('pv_c').value.trim(),telefono:$('pv_t').value.trim(),
    direccion:$('pv_d').value.trim(),ciudad:$('pv_ci').value.trim(),email:$('pv_e').value.trim(),
    notas:$('pv_no').value.trim()||null,activo:true},'return=minimal');
  vProv();
}
function provEdit(id){ PROVEDIT=id; vProv(); }
async function provSave(id){
  const g=k=>(($('pe_'+k+'_'+id)||{}).value||'').trim();
  const nom=g('n'); if(!nom){ alert('El proveedor necesita nombre'); return; }
  await patch('zarrat_proveedores','id=eq.'+id,{nombre:nom,contacto:g('c'),telefono:g('t'),
    direccion:g('d'),ciudad:g('ci'),email:g('e'),notas:g('no')||null});
  PROVEDIT=null; vProv();
}
async function provDel(id){
  const cuantos=MATS.filter(m=>m.proveedor_id===id).length;
  if(!confirm(cuantos?`Este proveedor tiene ${cuantos} material(es). ¿Quitarlo? Los materiales quedan sin proveedor.`
    :'¿Quitar este proveedor?')) return;
  await del('zarrat_proveedores','id=eq.'+id); vProv();
}
async function matAdd(pid){
  const nom=(($('mn_'+pid)||{}).value||'').trim(); if(!nom){ alert('Ponle nombre al material'); return; }
  const val=+(($('mv_'+pid)||{}).value)||0;
  if(!val&&!confirm('Este material va sin precio. ¿Guardarlo así?')) return;
  const t=k=>(($('m'+k+'_'+pid)||{}).value||'').trim()||null;
  await post('zarrat_materiales',{nombre:nom,categoria:$('mc_'+pid).value,proveedor_id:pid,
    unidad:($('mu_'+pid)||{}).value||'unidad',valor_unit:val,
    calibre:t('ca'),color:t('co'),referencia:t('rf'),ref_prov:t('r'),notas:t('o'),
    activo:true},'return=minimal');
  vProv();
}
async function matSet(id,campo,v){
  const b={}; b[campo]=(campo==='valor_unit')?(+v||0):v;
  await patch('zarrat_materiales','id=eq.'+id,b); vProv();
}
async function matDel(id){ if(!confirm('¿Quitar este material?'))return;
  await del('zarrat_materiales','id=eq.'+id); vProv(); }

/* ═══════ COSTOS · la hoja de costo de lo que se manda a hacer ═══════
   Esto NO es la prenda a la medida (esa se cotiza con las medidas del cliente). Es lo
   que se produce por referencia: maletas, calzado, marroquinería. El producto es el
   MISMO del catálogo -ahí vive su valor de venta- y aquí se le abre el despiece:
   cada materia prima y cada paso de mano de obra, con valor unitario y cantidad.
   Según la categoría salen los materiales que esa categoría suele llevar, para no
   arrancar de una hoja en blanco. Se pueden borrar y agregar los que sean. */
const MATCAT={
  'Maletas y bolsos':['Cuero','Lona','Forro (tela)','Cremallera','Argollas','Medias lunas','Hilo','Herrajes'],
  'Marroquinería'   :['Cuero','Forro','Broches','Hilo','Tinta de cantos','Herrajes'],
  'Calzado'         :['Cuero','Forro','Suela','Plantilla','Cordones','Pegante','Hilo'],
  'Confección'      :['Tela','Forro','Entretela','Cremallera','Botones','Hilo'],
};
const UNIDS=['unidad','metro','decímetro','pie cuadrado','par','juego','gramo','pliego'];
/* La categoria del MATERIAL es el tipo de material, no el producto que se va a hacer:
   un proveedor vende cueros y otro herrajes, y en la hoja de costos se busca asi. */
const CATMAT=['Cueros','Telas y forros','Herrajes','Cremalleras','Suelas y plantillas',
              'Hilos','Pegantes y químicos','Empaque','Mano de obra y maquila','Otros'];
/* La maquila entra como proveedor: es la misma relación -le encargas, te cobra- y
   cuando suba el armado se repreciar igual que el cuero, en un solo sitio. */
const CATMO='Mano de obra y maquila';
let MODS=[], MODMAT=[], REFS=[], REFMAT=[], MODSEL=null, REFSEL=null;
async function vCostos(){
  [MODS,MATS,PROV]=await Promise.all([
    get('zarrat_modelo?activo=is.true&order=id'),
    get('zarrat_materiales?order=nombre.asc&limit=800'),
    get('zarrat_proveedores?order=nombre.asc&limit=300')]);
  if(MODSEL&&!MODS.some(m=>m.id===MODSEL)) MODSEL=null;
  if(!MODSEL&&MODS.length) MODSEL=MODS[0].id;
  MODMAT = MODSEL?await get('zarrat_modelo_mat?modelo_id=eq.'+MODSEL+'&order=orden'):[];
  REFS   = MODSEL?await get('zarrat_referencia?modelo_id=eq.'+MODSEL+'&order=id'):[];
  if(REFSEL&&!REFS.some(r=>r.id===REFSEL)) REFSEL=null;
  REFMAT = REFSEL?await get('zarrat_ref_mat?referencia_id=eq.'+REFSEL+'&order=orden'):[];
  const m=MODS.find(x=>x.id===MODSEL);
  $('main').innerHTML=`<h1>Costos</h1>
    <div class="sub">El <b>modelo</b> es la receta: qué lleva y cuánto. La <b>referencia</b> es esa receta
      en un color, un forro y unos apliques concretos — y es lo que se vende.</div>
    <div class="card">
      <div class="g2">
        <div><label>Modelo</label><select onchange="modSel(this.value)">
          ${MODS.map(x=>`<option value="${x.id}" ${x.id===MODSEL?'selected':''}>${esc(x.nombre)}</option>`).join('')}
        </select></div>
        <div><label>…o crea uno nuevo</label>
          <div style="display:flex;gap:6px"><input id="mo_n" placeholder="Ej: Bolso de mano">
            <button class="btn gh" onclick="modNuevo()">+ modelo</button></div></div>
      </div>
      ${m&&m.descripcion?`<div class="hint" style="margin-top:8px">${esc(m.descripcion)}</div>`:''}
    </div>
    ${m?recetaHTML(m):''}
    ${m?refsHTML():''}
    ${REFSEL?fichaHTML():''}`;
}
function modSel(v){ MODSEL=+v||null; REFSEL=null; vCostos(); }
async function modNuevo(){
  const n=($('mo_n').value||'').trim(); if(!n){ alert('Ponle nombre al modelo'); return; }
  const r=await post('zarrat_modelo',{nombre:n,activo:true});
  MODSEL=(Array.isArray(r)?r[0]:r).id; REFSEL=null; vCostos();
}
const PAPELES=['cuerpo','correas','forro','cremallera','herraje','aplique','insumo','mo'];
function recetaHTML(m){
  const G='grid-template-columns:96px 1.3fr 130px 80px auto';
  const f=x=>`<div style="display:grid;${G};gap:6px;align-items:center;margin-bottom:5px">
    <select onchange="modMatSet(${x.id},'papel',this.value)">${PAPELES.map(p=>`<option ${p===x.papel?'selected':''}>${p}</option>`).join('')}</select>
    <input value="${esc(x.nombre)}" onchange="modMatSet(${x.id},'nombre',this.value)">
    <select onchange="modMatSet(${x.id},'unidad',this.value)">${UNIDS.map(u=>`<option ${u===x.unidad?'selected':''}>${u}</option>`).join('')}</select>
    <input type="number" step="0.01" value="${+x.cantidad||1}" onchange="modMatSet(${x.id},'cantidad',this.value)">
    <button class="btn gh" style="padding:4px 9px" onclick="modMatDel(${x.id})">✕</button></div>`;
  return `<div class="card">
    <h2 style="margin:0 0 3px">Receta de ${esc(m.nombre)}</h2>
    <div class="hint" style="margin-bottom:10px">Qué lleva y en qué cantidad, sin decir de qué color.
      Cambiar algo acá afecta a las ${REFS.length} referencias de este modelo.</div>
    <div style="display:grid;${G};gap:6px;font-size:9.5px;color:var(--mut);font-weight:700;
      text-transform:uppercase;padding:0 2px 4px">
      <span>Papel</span><span>Qué es</span><span>Unidad</span><span>Cant.</span><span></span></div>
    ${MODMAT.filter(x=>x.grupo==='material').map(f).join('')||'<div class="hint">Sin materiales.</div>'}
    <div style="font-weight:800;color:var(--acc);font-size:11.5px;letter-spacing:.06em;margin:12px 0 6px">MANO DE OBRA</div>
    ${MODMAT.filter(x=>x.grupo==='mano_obra').map(f).join('')||'<div class="hint">Sin pasos.</div>'}
    <div style="display:flex;gap:6px;margin-top:9px">
      <button class="btn gh" onclick="modMatAdd('material')">+ material</button>
      <button class="btn gh" onclick="modMatAdd('mano_obra')">+ paso</button></div>
  </div>`;
}
async function modMatAdd(g){ await post('zarrat_modelo_mat',{modelo_id:MODSEL,papel:g==='mano_obra'?'mo':'insumo',
  nombre:'',unidad:'unidad',cantidad:1,grupo:g,orden:MODMAT.length},'return=minimal'); vCostos(); }
async function modMatSet(id,c,v){ const b={}; b[c]=(c==='cantidad')?(+v||0):v;
  await patch('zarrat_modelo_mat','id=eq.'+id,b); vCostos(); }
async function modMatDel(id){ if(!confirm('¿Quitar de la receta? Se quita del modelo, no de las referencias ya hechas.'))return;
  await del('zarrat_modelo_mat','id=eq.'+id); vCostos(); }

function refsHTML(){
  return `<div class="card">
    <h2 style="margin:0 0 3px">Referencias</h2>
    <div class="hint" style="margin-bottom:10px">Cada una es este modelo en un color, un forro y unos apliques.</div>
    ${REFS.length?REFS.map(r=>`<div class="item" style="cursor:pointer${r.id===REFSEL?';border-color:var(--acc)':''}"
      onclick="refSel(${r.id})">
      <div><div class="nm">${esc(r.codigo||'')} · ${esc(r.nombre||'')}</div>
        <div class="mt">${[r.color,r.forro,r.apliques].filter(x=>x&&x!=='—').map(esc).join(' · ')||'sin definir'}</div></div>
      <div style="text-align:right"><div class="nm" style="color:var(--acc)">${$$(r.precio)}</div>
        <div class="mt">${r.id===REFSEL?'abierta':'ver ficha'}</div></div></div>`).join('')
      :'<div class="hint">Todavía sin referencias.</div>'}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-top:10px">
      <input id="rf_n" placeholder="Nombre (ej: Cuero verde)">
      <input id="rf_c" placeholder="Color / material">
      <input id="rf_f" placeholder="Forro">
      <button class="btn acc" onclick="refNueva()">+ referencia</button></div>
  </div>`;
}
function refSel(id){ REFSEL=(REFSEL===id?null:id); vCostos(); }
async function refNueva(){
  const n=($('rf_n').value||'').trim(); if(!n){ alert('Ponle nombre a la referencia'); return; }
  const m=MODS.find(x=>x.id===MODSEL)||{};
  const cod='ZR-'+(m.nombre||'M').split(' ').map(w=>w[0]).join('').toUpperCase()
    +'-'+n.replace(/[^A-Za-zÁÉÍÓÚÑ]/g,'').slice(0,3).toUpperCase();
  const r=await post('zarrat_referencia',{modelo_id:MODSEL,codigo:cod,nombre:n,
    color:($('rf_c').value||'').trim()||null,forro:($('rf_f').value||'').trim()||null,
    precio:0,activo:true});
  const nid=(Array.isArray(r)?r[0]:r).id;
  const ln=MODMAT.map((l,i)=>({referencia_id:nid,modelo_mat_id:l.id,nombre:l.nombre,unidad:l.unidad,
    cantidad:l.cantidad,valor_unit:0,grupo:l.grupo,orden:i}));
  if(ln.length) await post('zarrat_ref_mat',ln,'return=minimal');
  REFSEL=nid; vCostos();
}
function fichaHTML(){
  const r=REFS.find(x=>x.id===REFSEL); if(!r) return '';
  const sum=g=>REFMAT.filter(x=>x.grupo===g).reduce((s,x)=>s+(+x.valor_unit||0)*(+x.cantidad||0),0);
  const cm=sum('material'), co=sum('mano_obra'), tot=cm+co, venta=+r.precio||0;
  const marg=venta?((venta-tot)/venta*100):0;
  const G='grid-template-columns:1.25fr .85fr 96px 92px 66px 92px auto';
  const selMat=(x,mo)=>{
    const gr={}; (MATS||[]).filter(mm=>mo?(mm.categoria===CATMO):(mm.categoria!==CATMO))
      .forEach(mm=>{ (gr[mm.categoria||'Otros']=gr[mm.categoria||'Otros']||[]).push(mm); });
    const act=(MATS||[]).find(mm=>mm.id===x.material_id);
    let h=`<select onchange="refMat(${x.id},this.value)">`;
    h+=`<option value=""${act?'':' selected'}>${esc(x.nombre||(mo?'— elige el taller —':'— elige material —'))}</option>`;
    Object.keys(gr).sort().forEach(g=>{ h+=`<optgroup label="${esc(g)}">`;
      gr[g].forEach(mm=>{ const et=[mm.nombre,mm.calibre,mm.color].filter(Boolean).join(' · ');
        h+=`<option value="${mm.id}"${act&&act.id===mm.id?' selected':''}>${esc(et)}</option>`; });
      h+='</optgroup>'; });
    return h+'</select>'; };
  const provDe=x=>{ const mm=(MATS||[]).find(y=>y.id===x.material_id); if(!mm) return '<span class="dim">—</span>';
    const v=(PROV||[]).find(y=>y.id===mm.proveedor_id); return v?esc(v.nombre):'<span class="dim">sin proveedor</span>'; };
  const f=x=>`<div style="display:grid;${G};gap:6px;align-items:center;margin-bottom:5px">
    ${selMat(x,x.grupo==='mano_obra')}
    <span style="font-size:11.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${provDe(x)}</span>
    <select onchange="refMatSet(${x.id},'unidad',this.value)">${UNIDS.map(u=>`<option ${u===x.unidad?'selected':''}>${u}</option>`).join('')}</select>
    <input type="number" value="${+x.valor_unit||0}" onchange="refMatSet(${x.id},'valor_unit',this.value)">
    <input type="number" step="0.01" value="${+x.cantidad||1}" onchange="refMatSet(${x.id},'cantidad',this.value)">
    <b style="text-align:right">${$$((+x.valor_unit||0)*(+x.cantidad||0))}</b>
    <button class="btn gh" style="padding:4px 9px" onclick="refMatDel(${x.id})">✕</button></div>`;
  const campo=(k,t,ph)=>`<div><label>${t}</label><input value="${esc(r[k]||'')}" placeholder="${ph||''}"
      onchange="refSet('${k}',this.value)"></div>`;
  return `<div class="card" style="border-color:var(--acc)">
    <h2 style="margin:0 0 3px">Ficha técnica · ${esc(r.codigo||'')}</h2>
    <div class="hint" style="margin-bottom:10px">Lo que hace distinta a esta referencia dentro del modelo.</div>
    <div class="g3">${campo('nombre','Nombre')}${campo('codigo','Referencia')}${campo('color','Color / material')}</div>
    <div class="g3">${campo('forro','Forro')}${campo('apliques','Apliques')}${campo('personalizacion','Personalización','Iniciales, grabado…')}</div>
    <div class="g3">${campo('medidas','Medidas','largo × alto × fondo')}${campo('taller','Taller que la hizo')}
      <div><label>Precio de venta</label><input type="number" value="${+r.precio||0}" onchange="refSet('precio',this.value)"></div></div>
    <div style="font-weight:800;color:var(--acc);font-size:11.5px;letter-spacing:.06em;margin:16px 0 6px">MATERIALES</div>
    <div style="display:grid;${G};gap:6px;font-size:9.5px;color:var(--mut);font-weight:700;text-transform:uppercase;padding:0 2px 4px">
      <span>Material</span><span>Proveedor</span><span>Unidad</span><span>Vr. unit.</span><span>Cant.</span><span style="text-align:right">Total</span><span></span></div>
    ${REFMAT.filter(x=>x.grupo==='material').map(f).join('')}
    <div style="font-weight:800;color:var(--acc);font-size:11.5px;letter-spacing:.06em;margin:14px 0 6px">MANO DE OBRA</div>
    ${REFMAT.filter(x=>x.grupo==='mano_obra').map(f).join('')}
    <div style="border-top:2px solid var(--line);margin-top:14px;padding-top:11px;font-size:14px;line-height:2">
      <div>Materia prima <b>${$$(cm)}</b></div>
      <div>Mano de obra <b>${$$(co)}</b></div>
      <div style="font-size:17px;color:var(--acc)"><b>COSTO ${$$(tot)}</b></div>
      ${venta?`<div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">
        Venta <b>${$$(venta)}</b> → deja <b style="color:${venta-tot>0?'var(--ok)':'var(--bad)'}">${$$(venta-tot)}</b>
        · margen <b style="color:${marg>=50?'var(--ok)':(marg>=30?'var(--acc)':'var(--bad)')}">${marg.toFixed(0)}%</b></div>`
       :`<div class="hint" style="margin-top:8px">Ponle precio de venta arriba para ver el margen.</div>`}
    </div>
    <button class="btn gh" style="margin-top:12px" onclick="refDel(${r.id})">Quitar esta referencia</button>
  </div>`;
}
async function refSet(c,v){ const b={}; b[c]=(c==='precio')?(+v||0):(v||null);
  await patch('zarrat_referencia','id=eq.'+REFSEL,b); vCostos(); }
async function refMat(id,matId){
  if(!matId){ vCostos(); return; }
  const m=(MATS||[]).find(x=>x.id===+matId); if(!m) return;
  await patch('zarrat_ref_mat','id=eq.'+id,{material_id:m.id,
    nombre:[m.nombre,m.calibre,m.color].filter(Boolean).join(' · '),
    unidad:m.unidad||'unidad',valor_unit:+m.valor_unit||0});
  vCostos();
}
async function refMatSet(id,c,v){ const b={}; b[c]=(c==='unidad')?v:(+v||0);
  await patch('zarrat_ref_mat','id=eq.'+id,b); vCostos(); }
async function refMatDel(id){ await del('zarrat_ref_mat','id=eq.'+id); vCostos(); }
async function refDel(id){ if(!confirm('¿Quitar esta referencia y su ficha?'))return;
  await del('zarrat_ref_mat','referencia_id=eq.'+id);
  await del('zarrat_referencia','id=eq.'+id); REFSEL=null; vCostos(); }

/* ═══════ 1 · ESTRUCTURACIÓN ═══════ */

    <div class="g2"><div><label>Instagram</label><input id="p_ig" placeholder="@usuario" value="${esc(e.instagram||'')}"></div>

    <label>Dirección</label><input id="p_d" placeholder="Dónde" value="${esc(e.direccion||'')}">

function setCat(c){ FCAT=c; EDIT=null; vPend(); }
function editar(id){ EDIT=ROWS.find(x=>x.id===id)||null; vPend(); }
async function addPend(){

const togPend=(id,e)=>patch('zarrat_pendientes','id=eq.'+id,{estado:e}).then(vPend);

/* ═══════ 2 · GASTOS + PUNTO DE EQUILIBRIO ═══════ */
let EGASTO=null, GASTOS=[], HISTG=[];
async function vGastos(){
  const m=mesAct();
  const [g,cf,vt]=await Promise.all([get('zarrat_gastos?mes=eq.'+m+'&order=valor.desc'),get('zarrat_config?clave=eq.margen'),get('zarrat_ventas?limit=500')]);
  GASTOS=g; const eg=EGASTO||{};
  const metaMargen=+((cf[0]||{}).valor||40);           // la META que ella se pone
  const fijos=g.filter(x=>x.tipo==='fijo').reduce((s,x)=>s+(+x.valor||0),0);
  const varia=g.filter(x=>x.tipo!=='fijo').reduce((s,x)=>s+(+x.valor||0),0);
  const tot=fijos+varia;
  // ✦ MARGEN REAL: sale de las ventas que YA hizo (no de un número inventado)
  const vTot=vt.reduce((s,x)=>s+(+x.total||0),0);
  const vMar=vt.reduce((s,x)=>s+(+x.margen_contrib||0),0);
  const real=vTot>0?(vMar/vTot*100):0;
  const usa=real>0?real:metaMargen;                     // si aún no hay ventas, usa la meta
  const pe=usa>0?fijos/(usa/100):0;                     // punto de equilibrio con el margen REAL
  const dif=real-metaMargen;
  $('main').innerHTML=`<h1>Gastos y rentabilidad</h1><div class="sub">${m} · el % sale de tus ventas reales, no de un estimado</div>
  <div class="kpis">
    <div class="kpi"><b>${$$(fijos)}</b><span>GASTOS FIJOS</span></div>
    <div class="kpi"><b>${$$(varia)}</b><span>VARIABLES</span></div>
    <div class="kpi eq"><b>${$$(pe)}</b><span>PUNTO DE EQUILIBRIO — hay que vender esto al mes para no perder</span></div>
  </div>
  <div class="card" style="border-left:4px solid ${real>0?(dif>=0?'var(--ok)':'var(--warn)'):'var(--line)'}">
    <div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--mut)">TU RENTABILIDAD REAL</div>
    ${vTot>0?`
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:3px">
        <b style="font-family:Georgia,serif;font-size:32px;color:${dif>=0?'var(--ok)':'var(--warn)'}">${real.toFixed(1)}%</b>
        <span style="font-size:13px;color:var(--mut)">de margen de contribución</span></div>
      <div class="hint">Calculado con <b>${vt.length}</b> venta(s): aportaron <b>${$$(vMar)}</b> sobre <b>${$$(vTot)}</b> vendidos.</div>
      <div class="hint" style="color:${dif>=0?'var(--ok)':'var(--warn)'};font-weight:700">
        ${dif>=0?`✦ Vas ${dif.toFixed(1)} puntos POR ENCIMA de tu meta (${metaMargen}%).`:`⚠ Vas ${(-dif).toFixed(1)} puntos POR DEBAJO de tu meta (${metaMargen}%). Sube precios o baja costos.`}</div>
    `:`<div style="font-family:Georgia,serif;font-size:26px;color:var(--mut);margin-top:3px">— sin ventas aún —</div>
      <div class="hint">Cuando registres ventas, aquí sale tu margen REAL (no un estimado). Por ahora uso tu meta del ${metaMargen}%.</div>`}
  </div>
  <div class="card">
    <label>Meta de margen (%) — solo para comparar</label>
    <div style="display:flex;gap:8px"><input id="g_m" type="number" value="${metaMargen}" min="1" max="99" style="flex:1">
      <button class="btn acc" onclick="setMargen()">Guardar meta</button></div>
    <div class="hint">Punto de equilibrio = Gastos fijos ÷ margen real (<b>${usa.toFixed(1)}%</b>) = <b>${$$(pe)}</b> al mes.</div>
  </div>
  <div class="card" ${EGASTO?'style="border-color:var(--acc);border-width:2px"':''}>
    ${EGASTO?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <b style="color:var(--acc);font-size:13px">✎ Editando gasto</b>
      <button class="btn sm gh" onclick="EGASTO=null;vGastos()">Cancelar</button></div>`:''}
    <div class="g2">
      <div><label>Rubro</label><input id="g_r" placeholder="Ej: Arriendo local" value="${esc(eg.rubro||'')}" oninput="sugiere()"></div>
      <div><label>Tipo</label><select id="g_t"><option value="fijo" ${eg.tipo!=='variable'?'selected':''}>Fijo</option><option value="variable" ${eg.tipo==='variable'?'selected':''}>Variable</option></select></div>
    </div>
    <label>Categoría</label>
    <select id="g_c">${['Local','Taller de costura','Servicios (luz/agua)','Teléfono/Internet','Empleados','Materia prima','Transporte','Publicidad','Otros'].map(c=>`<option ${c===eg.categoria?'selected':''}>${c}</option>`).join('')}</select>
    <div class="g2" style="margin-top:4px">
      <div><label>📊 Valor estimado</label><input id="g_ve" inputmode="numeric" placeholder="0" value="${eg.valor_estimado||''}"><div class="hint" id="g_sug"></div></div>
      <div><label>🧾 Valor definitivo <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--mut)">(cuando llegue el recibo)</span></label>
        <input id="g_vd" inputmode="numeric" placeholder="—" value="${eg.valor_definitivo||''}"></div>
    </div>
    <button class="btn full ${EGASTO?'acc':''}" onclick="addGasto()">${EGASTO?'💾 Guardar cambios':'+ Agregar gasto'}</button>
  </div>
  <h1 style="font-size:18px">Gastos de ${m} · ${g.length} <span style="font-size:13px;color:var(--mut)">(total ${$$(tot)})</span></h1>
  ${g.length?g.map(x=>{const df=x.valor_definitivo!=null&&x.valor_definitivo!=='';
    return `<div class="item" style="cursor:pointer" title="Toca para editar" onclick="editGasto(${x.id})"><div>
    <div class="nm">${esc(x.rubro)}</div>
    <div class="mt"><span class="tag ${x.tipo==='fijo'?'a':''}">${esc(x.tipo)}</span> ${esc(x.categoria||'')}
      ${df?'<span class="tag" style="background:#e6f0e8;color:var(--ok)">🧾 definitivo</span>':'<span class="tag">📊 estimado</span>'}</div>
    ${df&&+x.valor_estimado?`<div class="mt">Estimaste ${$$(x.valor_estimado)} → llegó <b>${$$(x.valor_definitivo)}</b>
      <span style="color:${+x.valor_definitivo>+x.valor_estimado?'var(--bad)':'var(--ok)'};font-weight:700">
      (${+x.valor_definitivo>+x.valor_estimado?'+':''}${$$(+x.valor_definitivo-+x.valor_estimado)})</span></div>`:''}</div>
    <div style="text-align:right"><div class="nm" style="color:var(--acc)">${$$(x.valor)}</div>
    <button class="btn sm gh" style="margin-top:5px" onclick="event.stopPropagation();delRow('zarrat_gastos',${x.id},vGastos)">✕</button></div></div>`;}).join('')
    :'<div class="empty">Aún no has cargado gastos de este mes.</div>'}`;
  HISTG=await get('zarrat_gastos?valor_definitivo=not.is.null&select=rubro,valor_definitivo&limit=500');
  sugiere();
}
function editGasto(id){ EGASTO=GASTOS.find(x=>x.id===id)||null; vGastos(); }
function sugiere(){
  const el=$('g_sug'), r=$('g_r'); if(!el||!r) return;
  const rub=r.value.trim().toLowerCase();
  const h=(HISTG||[]).filter(x=>(x.rubro||'').toLowerCase()===rub && x.valor_definitivo!=null);
  if(!rub||!h.length){ el.textContent=''; return; }
  const prom=Math.round(h.reduce((s,x)=>s+(+x.valor_definitivo||0),0)/h.length);
  el.innerHTML=`✦ Según ${h.length} recibo(s) reales, el promedio es <b>${$$(prom)}</b>
    <button class="btn sm gh" style="padding:3px 9px;margin-left:5px" onclick="$('g_ve').value=${prom}">usar</button>`;
}
async function setMargen(){await post('zarrat_config?on_conflict=clave',{clave:'margen',valor:$('g_m').value},'resolution=merge-duplicates,return=minimal');vGastos();}
async function addGasto(){
  const r=$('g_r').value.trim();
  const ve=+($('g_ve').value||'').replace(/\D/g,'')||0;
  const vdRaw=($('g_vd').value||'').replace(/\D/g,'');
  const vd=vdRaw?+vdRaw:null;

// SKU automático: ZR-{3 letras del nombre}-{color 2 letras}-{consecutivo 3 dígitos}
function genSKU(nombre,color,n){
  const cl=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
  const a=(cl(nombre)+'XXX').slice(0,3), b=(cl(color)+'XX').slice(0,2);
  return `ZR-${a}-${b}-${String(n).padStart(3,'0')}`;
}

/* ---- Código de barras Code128 (dibujado a mano, sin librerías externas) ---- */
const C128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128B(txt){
  let cs=104, bars=C128[104], w=104;   // start B
  for(let i=0;i<txt.length;i++){ const v=txt.charCodeAt(i)-32; bars+=C128[v]; cs+=v*(i+1); }
  bars+=C128[cs%103]+C128[106];        // checksum + stop
  return bars;
}
function pintaBarras(){
  document.querySelectorAll('svg.bc').forEach(svg=>{
    const pat=code128B(svg.dataset.sku); let x=0, out='';
    for(let i=0;i<pat.length;i++){ const w=+pat[i]; if(i%2===0) out+=`<rect x="${x}" y="0" width="${w}" height="100" fill="#17150f"/>`; x+=w; }
    svg.setAttribute('viewBox',`0 0 ${x} 100`); svg.setAttribute('preserveAspectRatio','none'); svg.innerHTML=out;
  });
}
function etiqueta(id){
  const p=CAT.find(x=>x.id===id); if(!p) return;
  const pat=code128B(p.sku); let x=0,out='';
  for(let i=0;i<pat.length;i++){ const w=+pat[i]; if(i%2===0) out+=`<rect x="${x}" y="0" width="${w}" height="100" fill="#000"/>`; x+=w; }

    <div class="b">ZARRAT</div><div class="t">MAESTROS DEL ESTILO</div>
    <div class="n">${p.nombre}</div><div class="c">${[p.color,p.talla?'T '+p.talla:'',p.tela].filter(Boolean).join(' · ')}</div>
    <div class="v">$${Math.round(p.valor||0).toLocaleString('es-CO')}</div>
    <svg viewBox="0 0 ${x} 100" preserveAspectRatio="none">${out}</svg>

  w.document.close();
}

    ${cliente?' · <b style="color:var(--ok)">tela del cliente</b>':(f.valor_tela?` · tela <b>${$$(f.valor_tela)}</b>`:'')}</div></div>`;

function telaCot(){
  const cl=$('q_tprov').value==='cliente';

function delCat(){

function addCosto(){
  const n=$('q_cn').value.trim(), v=+($('q_cv').value||'').replace(/\D/g,'')||0;
  if(!n||!v)return alert('Escribe el concepto y el valor.');
  COSTOS.push({n,v}); $('q_cn').value=''; $('q_cv').value=''; pintaCostos(); calcMargen();

function pintaCostos(){
  const t=COSTOS.reduce((s,c)=>s+c.v,0);
  $('q_costos').innerHTML=COSTOS.length?COSTOS.map((c,k)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px;border-bottom:1px solid var(--line2)">

function editCosto(k,v){ COSTOS[k].v=+String(v).replace(/\D/g,'')||0; pintaCostos(); calcMargen(); }
async function guardarPlantilla(){
  if(!COSTOS.length) return alert('No hay costos que guardar.');
  if(!confirm('¿Guardar estos '+COSTOS.length+' costos como plantilla?\n\nLa próxima vez que cotices salen solos con estos valores.')) return;
  await del('zarrat_costos_base','id=gt.0');
  await post('zarrat_costos_base',COSTOS.map((c,i)=>({concepto:c.n,valor:c.v,orden:i+1})),'return=minimal');

}
function calcMargen(){
  const cl=$('q_tprov')?.value==='cliente';
  const tela=cl?0:(+($('q_tela')?.value||'').toString().replace(/\D/g,'')||0);
  const mo=+($('q_mo')?.value||'').toString().replace(/\D/g,'')||0;
  const ci=COSTOS.reduce((s,c)=>s+c.v,0);
  const pv=tela+mo;                       // ✦ LO QUE SE COBRA = tela + mano de obra
  const mc=pv-tela-ci;                    // margen = mano de obra − costos internos
  const pct=pv?Math.round(mc/pv*100):0;
  const p=$('q_precio');
  if(p) p.innerHTML=`<div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--mut)">LO QUE LE COBRAS AL CLIENTE</div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:4px"><span>🧵 Tela</span><span>${$$(tela)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)"><span>✂️ Mano de obra</span><span>${$$(mo)}</span></div>
    <div style="border-top:1px solid var(--line);margin-top:5px;padding-top:5px;display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:13px">PRECIO TOTAL</b><b style="font-family:Georgia,serif;font-size:23px;color:var(--acc)">${$$(pv)}</b></div>`;
  const r=$('q_res'); if(!r) return;
  r.innerHTML=`<div style="font-size:10.5px;letter-spacing:.08em;color:#a49a86">④ RESULTADO DE LA PRENDA</div>
    <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-top:6px"><span>Precio cobrado</span><b>${$$(pv)}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#c9c0ae"><span>− Tela (lo que te cuesta)</span><span>${$$(tela)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#c9c0ae"><span>− Costos internos</span><span>${$$(ci)}</span></div>
    <div style="border-top:1px solid #3a352a;margin-top:7px;padding-top:7px;display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-size:12px;letter-spacing:.06em">MARGEN DE CONTRIBUCIÓN</span>
      <b style="font-family:Georgia,serif;font-size:24px;color:${mc>0?'var(--acc2)':'#e07a6a'}">${$$(mc)} <span style="font-size:14px">(${pct}%)</span></b></div>
    <div style="font-size:11px;color:#a49a86;margin-top:4px">${mc>0?'✦ Esto APORTA a cubrir tus gastos fijos. (Mano de obra − costos internos)':'⚠ No aporta nada: los costos internos se comen la mano de obra.'}</div>`;
}
async function saveCotiz(){
  const ci=$('q_c').value; if(!ci)return alert('Elige el cliente.');
  const prenda=$('q_pn').value.trim(); if(!prenda)return alert('Escribe qué prenda es.');
  const cl=$('q_tprov').value==='cliente';
  const tela=cl?0:(+($('q_tela').value||'').replace(/\D/g,'')||0);
  const mo=+($('q_mo').value||'').replace(/\D/g,'')||0;
  if(!mo)return alert('Escribe cuánto cobras de mano de obra.');
  const cin=COSTOS.reduce((s,x)=>s+x.v,0);
  const pv=tela+mo, mc=pv-tela-cin;
  const c=CLI.find(x=>x.id==ci)||{};
  const folio='ZR-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+String(Date.now()).slice(-4);
  await post('zarrat_cotizaciones',{folio,cliente_id:+ci,cliente_nombre:c.nombre,tipo:$('q_t').value,prenda,
    items:[{n:prenda,v:pv}],subtotal:pv,total:pv,costo_tela:tela,costo_mo:mo,costo_interno:cin,costos_detalle:COSTOS,
    margen_contrib:mc,notas:$('q_n').value.trim()},'return=minimal');
  vCotiz();
}
async function aVenta(id){
  const c=(await get('zarrat_cotizaciones?id=eq.'+id))[0]; if(!c)return;
  if(!confirm('✓ APROBAR y pasar a VENTA\n\n'+c.cliente_nombre+' · '+$$(c.total)+'\nAporta a gastos fijos: '+$$(c.margen_contrib)+'\n\nEn Ventas registras la forma de pago.'))return;
  await post('zarrat_ventas',{folio:c.folio,cliente_id:c.cliente_id,cliente_nombre:c.cliente_nombre,total:c.total,

  await patch('zarrat_cotizaciones','id=eq.'+id,{estado:'aprobada'});
  go('ventas');
}

const MPAGO={'Nequi':'📲','Consignación':'🏦','Efectivo':'💵','Tarjeta de crédito':'💳'};
let PAGOS=[];
function vch(id){ const t=$('pm_'+id).value==='Tarjeta de crédito'; $('pn_'+id).style.display=t?'block':'none'; }
async function addPago(id){
  const met=$('pm_'+id).value, val=+($('pv_'+id).value||'').replace(/\D/g,'')||0;
  const vou=($('pn_'+id).value||'').trim();
  if(!val) return alert('Escribe el valor del pago.');
  if(met==='Tarjeta de crédito' && !vou) return alert('La tarjeta necesita el N° de voucher.');
  await post('zarrat_pagos',{venta_id:id,metodo:met,valor:val,voucher:vou||null},'return=minimal');
  const pg=await get('zarrat_pagos?venta_id=eq.'+id);
  const vt=(await get('zarrat_ventas?id=eq.'+id))[0]||{};
  const pagado=pg.reduce((s,p)=>s+(+p.valor||0),0);
  await patch('zarrat_ventas','id=eq.'+id,{pagado, estado_pago: pagado>=(+vt.total||0)?'pagado':'parcial'});
  vVentas();
}

  </div>
  <div class="card" style="padding:12px 15px">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px">
      <span>APORTES ${$$(aportes)}</span><span>GASTOS FIJOS ${$$(fijos)}</span></div>
    <div style="height:14px;background:var(--line2);border-radius:7px;overflow:hidden">

    <div class="hint">${pct}% de tus gastos fijos cubiertos con el margen de las piezas vendidas este mes.</div>

  </div>
  ${v.length?v.map(x=>{const mc=+x.margen_contrib||0; const pg=PAGOS.filter(p=>p.venta_id===x.id);
    const pagado=pg.reduce((s,p)=>s+(+p.valor||0),0); const saldo=(+x.total||0)-pagado;

    </div>
    ${pg.length?`<div style="margin-top:8px;border-top:1px solid var(--line2);padding-top:7px">

    </div>`:''}

      <div class="g2"><div><label>Nombre *</label><input id="r_n" placeholder="Nombre completo"></div>
        <div><label>Teléfono / WhatsApp</label><input id="r_t" inputmode="tel"></div></div>
      <div class="g2"><div><label>Instagram</label><input id="r_i" placeholder="@usuario"></div>
        <div><label>${FCAN==='referido'?'¿Quién lo refirió?':'Cómo nos conoció'}</label><input id="r_r" placeholder="${FCAN==='referido'?'Nombre de quien lo recomendó':'Vitrina, voz a voz…'}"></div></div>
      <label>Qué busca / notas</label><textarea id="r_no" placeholder="Prenda, ocasión, fecha…"></textarea>
      <button class="btn acc full" onclick="addLead()">+ Registrar en ${FCAN==='referido'?'Referidos':'Local'}</button>
      <div class="hint">Queda también en <b>Clientes</b>, listo para tomarle medidas y cotizar.</div>
    </div>`}
  <h1 style="font-size:18px">${(CANALES.find(x=>x[0]===FCAN)||[])[1]} · ${arr.length}</h1>
  ${arr.length?arr.map(c=>{const et=map[c.id]||'contacto';
    return `<div class="item" style="display:block"><div class="nm">${esc(c.nombre)}</div>
      <div class="mt">${c.telefono?'📱 '+esc(c.telefono):''}${c.instagram?' · 📷 '+esc(c.instagram):''}${c.referido_por?' · ⭐ por '+esc(c.referido_por):''}</div>
      ${c.notas?`<div class="mt">📝 ${esc(c.notas)}</div>`:''}
      <div class="etapas">${ETAPAS.map(e=>`<span class="et ${e===et?'on':''}" onclick="setEtapa(${c.id},'${e}')">${e}</span>`).join('')}</div></div>`;}).join('')
    :`<div class="empty">Sin personas en este canal aún.</div>`}`;
}
async function addLead(){
  const n=$('r_n').value.trim(); if(!n)return alert('El nombre es obligatorio.');
  const c=await post('zarrat_clientes',{nombre:n,telefono:$('r_t').value.trim(),whatsapp:$('r_t').value.trim(),
    instagram:$('r_i').value.trim(),referido_por:$('r_r').value.trim()||null,notas:$('r_no').value.trim(),canal:FCAN});
  if(c&&c[0]) await post('zarrat_crm?on_conflict=cliente_id',{cliente_id:c[0].id,etapa:'contacto'},'resolution=merge-duplicates,return=minimal');
  vCrm();
}
async function setEtapa(id,e){await post('zarrat_crm?on_conflict=cliente_id',{cliente_id:id,etapa:e},'resolution=merge-duplicates,return=minimal');vCrm();}

go('pend');
</script>
