<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZARRAT · Marroquinería</title>
<!-- ZARRAT v2 (24-sep-2026). Rehecha desde cero para maletas y carteras de cuero.
     La línea es una sola y va en el orden de las pestañas:
       Producto → Ficha técnica (costos) → Precios → Pedidos
     y las dos pestañas que la ficha "jala": Proveedores (materia prima, con sus
     materiales y precios) y Manufactureros (quien lo hace y cuánto cobra).
     La versión anterior quedó copiada en _PLAYBOOK/copia-zarrat-para-dias/. -->
<style>
  :root{
    --paper:#f5f2ec; --card:#fffdf9; --ink:#17150f; --ink2:#4a463c; --mut:#918a7a;
    --line:#e2dbcd; --line2:#efe9dd; --acc:#8a6a3d; --acc2:#b08c56;
    --ok:#4a7a52; --warn:#b4622e; --bad:#a33b30;
    --sh:0 1px 2px rgba(30,24,10,.04),0 10px 30px -16px rgba(30,24,10,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 90px}
  header{background:var(--ink);color:var(--paper);padding:16px 0}
  .hd{max-width:960px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:Georgia,"Times New Roman",serif;font-size:26px;letter-spacing:.34em;font-weight:400;text-indent:.34em}
  .brand small{display:block;font-family:"Segoe UI",sans-serif;font-size:9.5px;letter-spacing:.28em;color:var(--acc2);text-indent:.28em;margin-top:2px}
  .hd .quien{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a49a86;text-align:right}
  .hd .quien a{color:var(--acc2);text-decoration:none}
  nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;overflow-x:auto}
  .nv{max-width:960px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
  nav button{flex:0 0 auto;background:none;border:none;padding:13px 12px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
  nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
  h1{font-family:Georgia,serif;font-size:24px;font-weight:400;margin:22px 0 3px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
  .card h3{font-family:Georgia,serif;font-weight:400;font-size:17px;margin-bottom:10px}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc2)}
  textarea{min-height:64px;resize:vertical}
  input.n{text-align:right;font-variant-numeric:tabular-nums}
  input.mini{padding:6px 8px;font-size:13px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
  @media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}
  .btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.gh{background:transparent;color:var(--acc);border:1px solid var(--acc2)}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .btn.bad{background:var(--bad)} .btn.ok{background:var(--ok)}
  .btn.full{width:100%;margin-top:12px}
  .fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .buscar{max-width:280px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh);cursor:pointer}
  .p .img{aspect-ratio:1;background:#eee8dc center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--line)}
  .p .b{padding:10px 12px}
  .p .cat{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
  .p .n{font-family:Georgia,serif;font-size:16px;line-height:1.25}
  .p .m{font-size:12px;color:var(--mut);margin-top:4px}
  .p .pr{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
  .p .pr b{font-size:15px}
  .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--line2);color:var(--ink2);margin-right:4px}
  .tag.web{background:#e2efe4;color:var(--ok)} .tag.off{background:#f3e3e0;color:var(--bad)} .tag.warn{background:#f7e7d8;color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:7px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
  .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
  .item:last-child{border-bottom:none}
  .item .nm{font-weight:600} .item .dt{font-size:12.5px;color:var(--mut)}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kpi span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
  .kpi b{font-size:19px;font-variant-numeric:tabular-nums}
  .hint{font-size:12.5px;color:var(--mut)}
  .vacio{text-align:center;color:var(--mut);padding:30px 10px}
  .est{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
  .est.nuevo{background:#e8e2f3;color:#5a4a8a} .est.proceso{background:#f7e7d8;color:var(--warn)} .est.terminado{background:#e2efe4;color:var(--ok)} .est.entregado{background:var(--line2);color:var(--mut)} .est.anulado{background:#f3e3e0;color:var(--bad)}
  .x{background:none;border:none;color:var(--bad);cursor:pointer;font-size:16px;padding:2px 6px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
  #toast.on{opacity:1}
  footer{text-align:center;color:var(--mut);font-size:11px;padding:20px}
</style>
</head>
<body>
<header><div class="hd">
  <div class="brand">ZARRAT<small>MARROQUINERÍA · MALETAS Y CARTERAS</small></div>
  <div class="quien"><a href="catalogo.html" target="_blank">Ver catálogo web ↗</a></div>
</div></header>
<nav><div class="nv" id="nav"></div></nav>
<div class="wrap"><div id="main"><div class="vacio">Cargando…</div></div></div>
<div id="toast"></div>
<footer>ZARRAT · v<span id="ver"></span></footer>

<script>
const VER='20260924-v2';
document.getElementById('ver').textContent=VER;
const SB='https://fnayedgvamxktxfvywwl.supabase.co', K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const $$=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const num=s=>+String(s??'').replace(/[^\d.-]/g,'')||0;
const r100=n=>Math.round((+n||0)/100)*100;
const hoy=()=>new Date().toISOString().slice(0,10);
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

/* El servidor corta en 1.000 filas sin avisar: se pide de a 1.000 hasta agotar. */
async function GETALL(p){
  const base=String(p).replace(/[?&](limit|offset)=\d+/g,''), sep=base.includes('?')?'&':'?', out=[];
  for(let i=0,off=0;i<60;i++,off+=1000){
    let r; try{ r=await fetch(SB+'/rest/v1/'+base+sep+'limit=1000&offset='+off,{headers:H}); }catch(e){ break; }
    if(!r.ok) break; let b; try{ b=await r.json(); }catch(e){ break; }
    if(!Array.isArray(b)||!b.length) break; out.push(...b); if(b.length<1000) break;
  }
  return out;
}
const post=(t,b,pref)=>fetch(SB+'/rest/v1/'+t,{method:'POST',headers:{...H,Prefer:pref||'return=representation'},body:JSON.stringify(b)})
  .then(async r=>{ const x=await r.text(); if(!r.ok){ alert('No se pudo guardar: '+x.slice(0,140)); throw new Error(x); } return x?JSON.parse(x):null; });
const patch=(t,q,b)=>fetch(SB+'/rest/v1/'+t+'?'+q,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(b)})
  .then(async r=>{ if(!r.ok){ alert('No se pudo guardar: '+(await r.text()).slice(0,140)); throw new Error('patch'); } });
const del=(t,q)=>fetch(SB+'/rest/v1/'+t+'?'+q,{method:'DELETE',headers:H});
function safe(fn,nom){ return async()=>{ try{ await fn(); }catch(e){ console.error(nom,e);
  $('main').innerHTML=`<div class="card" style="border-left:4px solid var(--bad)"><b>No pude cargar ${nom}</b><div class="hint">${esc(e.message)}</div>
  <button class="btn gh full" onclick="go('${nom}')">Reintentar</button></div>`; } }; }

/* ═══════ DATOS ═══════ todo cabe en memoria: son decenas de filas, no miles */
let PROV=[], MAT=[], MANU=[], PROD=[], FICHA=[], CLI=[], PED=[], CFG={margen:100};
const CATS=['Maleta','Cartera','Bolso','Billetera','Morral','Cinturón','Otro'];
const CATMAT=['Cuero','Forro','Herrajes','Hilos y pegantes','Cierres','Empaque','Otro'];
const UNID=['unidad','dm²','m','m²','cm','par','juego','gramo','kilo'];
async function cargar(){
  const [pr,ma,mn,pd,fi,cl,pe,cf]=await Promise.all([
    GETALL('zarrat_proveedores?select=*&order=nombre'), GETALL('zarrat_materiales?select=*&order=nombre'),
    GETALL('zarrat_manufactureros?select=*&order=nombre'), GETALL('zarrat_producto?select=*&order=categoria,nombre'),
    GETALL('zarrat_ficha?select=*&order=orden,id'), GETALL('zarrat_clientes?select=*&order=nombre'),
    GETALL('zarrat_pedidos?select=*&order=creado_en.desc'), GETALL('zarrat_config?select=*')]);
  PROV=pr; MAT=ma; MANU=mn; PROD=pd; FICHA=fi; CLI=cl; PED=pe;
  const m=cf.find(x=>x.clave==='margen'); if(m) CFG.margen=+m.valor||100;
}
const provDe=id=>PROV.find(p=>p.id===id), matDe=id=>MAT.find(m=>m.id===id), manuDe=id=>MANU.find(m=>m.id===id), prodDe=id=>PROD.find(p=>p.id===id);
const nomProv=id=>(provDe(id)||{}).nombre||'—', nomManu=id=>(manuDe(id)||{}).nombre||'—';

/* ═══════ COSTOS ═══════ una sola forma de calcular, usada en todas las pestañas.
   Una línea de la ficha vale cantidad × precio VIVO del material (lo que hoy
   cobra el proveedor). Solo si la línea trae valor_unit se usa ese, congelado. */
const vUnit=l=>l.valor_unit!=null?+l.valor_unit:+((matDe(l.material_id)||{}).valor_unit||0);
const lineas=pid=>FICHA.filter(l=>l.producto_id===pid);
const costoMat=p=>lineas(p.id).reduce((s,l)=>s+(+l.cantidad||0)*vUnit(l),0);
const costo=p=>costoMat(p)+(+p.mano_obra||0)+(+p.otros_costos||0);
const margenDe=p=>p.margen!=null&&p.margen!==''?+p.margen:CFG.margen;
const precioSug=p=>r100(costo(p)*(1+margenDe(p)/100));
const precio=p=>p.precio_venta!=null&&+p.precio_venta>0?+p.precio_venta:precioSug(p);
const utilidad=p=>precio(p)-costo(p);
const margenReal=p=>costo(p)>0?Math.round((precio(p)/costo(p)-1)*100):0;

/* ═══════ NAVEGACIÓN ═══════ en el orden de la línea de producción */
const TABS=[['prod','🧳 Productos'],['ficha','🧵 Ficha técnica'],['precios','🏷️ Precios'],['pedidos','🧾 Pedidos'],
            ['prov','🚚 Proveedores'],['manu','✂️ Manufactureros'],['clientes','👥 Clientes']];
let TAB='prod';
$('nav').innerHTML=TABS.map(([v,n])=>`<button id="t_${v}" onclick="go('${v}')">${n}</button>`).join('');
function go(t,arg){
  TAB=t; TABS.forEach(([v])=>{ const b=$('t_'+v); if(b) b.className=(v===t?'on':''); });
  const V={prod:vProd,ficha:()=>vFicha(arg),precios:vPrecios,pedidos:vPedidos,prov:vProv,manu:vManu,clientes:vClientes}[t];
  if(V) safe(V,t)(); window.scrollTo(0,0);
}

/* ═══════ 1 · PRODUCTOS ═══════ */
let EDIT=null;
async function vProd(){
  const act=PROD.filter(p=>p.activo!==false);
  $('main').innerHTML=`<h1>Productos</h1><div class="sub">Lo que ZARRAT vende. Cada producto tiene su ficha técnica, y de ahí salen el costo y el precio.</div>
  <div class="kpi"><div><span>Productos</span><b>${act.length}</b></div><div><span>En la web</span><b>${act.filter(p=>p.publicar_web).length}</b></div>
    <div><span>Sin ficha</span><b>${act.filter(p=>!lineas(p.id).length).length}</b></div><div><span>Sin precio</span><b>${act.filter(p=>!(+p.precio_venta>0)).length}</b></div></div>
  <div class="top"><input class="buscar" id="q" placeholder="Buscar producto…" oninput="pintarProd()"><button class="btn" onclick="formProd()">+ Nuevo producto</button></div>
  <div id="fp"></div><div class="grid" id="lp"></div>`;
  pintarProd();
}
function pintarProd(){
  const q=($('q')||{}).value||'', l=PROD.filter(p=>p.activo!==false&&(!q||((p.nombre||'')+' '+(p.sku||'')+' '+(p.categoria||'')).toLowerCase().includes(q.toLowerCase())));
  $('lp').innerHTML=l.length?l.map(p=>`<div class="p" onclick="formProd(${p.id})">
    <div class="img" style="${p.foto_url?`background-image:url('${esc(p.foto_url)}')`:''}">${p.foto_url?'':'👜'}</div>
    <div class="b"><div class="cat">${esc(p.categoria||'')}${p.sku?' · '+esc(p.sku):''}</div><div class="n">${esc(p.nombre)}</div>
    <div class="m">${p.manufacturero_id?'✂️ '+esc(nomManu(p.manufacturero_id)):'<span class="tag warn">sin manufacturero</span>'} ${lineas(p.id).length?'':'<span class="tag warn">sin ficha</span>'}</div>
    <div class="pr"><span class="hint">costo ${$$(costo(p))}</span><b>${$$(precio(p))}</b></div>
    <div style="margin-top:6px">${p.publicar_web?'<span class="tag web">🌐 en la web</span>':'<span class="tag">no publicado</span>'}<span class="tag">margen ${margenReal(p)}%</span></div></div></div>`).join('')
    :'<div class="vacio">Todavía no hay productos. Crea el primero con el botón de arriba.</div>';
}
function formProd(id){
  const p=id?prodDe(id):{};
  EDIT=id||null;
  const opc=(arr,v,libre)=>arr.map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('')+(libre&&v&&!arr.includes(v)?`<option selected>${esc(v)}</option>`:'');
  $('fp').innerHTML=`<div class="card"><h3>${id?'Editar producto':'Nuevo producto'}</h3>
    <div class="g2"><div><label>Nombre</label><input id="f_n" value="${esc(p.nombre||'')}" placeholder="Ej: Cartera Amelia"></div>
      <div><label>Categoría</label><select id="f_c">${opc(CATS,p.categoria||'Cartera',true)}</select></div></div>
    <div class="g2"><div><label>SKU / código</label><input id="f_s" value="${esc(p.sku||'')}" placeholder="Ej: CAR-001"></div>
      <div><label>Manufacturero (quien lo hace)</label><select id="f_m"><option value="">— sin asignar —</option>${MANU.filter(m=>m.activo!==false).map(m=>`<option value="${m.id}" ${m.id===p.manufacturero_id?'selected':''}>${esc(m.nombre)}</option>`).join('')}</select></div></div>
    <label>Descripción (sale en la web)</label><textarea id="f_d">${esc(p.descripcion||'')}</textarea>
    <div class="g2"><div><label>Foto</label><input type="file" id="f_f" accept="image/*"></div>
      <div><label>Foto actual</label><div class="hint">${p.foto_url?`<a href="${esc(p.foto_url)}" target="_blank">ver foto</a>`:'ninguna'}</div></div></div>
    <div class="fila" style="margin-top:12px"><label style="margin:0"><input type="checkbox" id="f_w" ${p.publicar_web?'checked':''} style="width:auto;margin-right:6px">Publicar en la web</label></div>
    <div class="fila" style="margin-top:14px"><button class="btn" onclick="guardarProd()">Guardar</button><button class="btn gh" onclick="$('fp').innerHTML=''">Cancelar</button>
      ${id?`<button class="btn gh" onclick="go('ficha',${id})">🧵 Ir a la ficha técnica</button><button class="btn gh" style="margin-left:auto;color:var(--bad);border-color:var(--bad)" onclick="borrarProd(${id})">Retirar</button>`:''}</div>
    <div class="hint" style="margin-top:8px">Los costos, la mano de obra y el precio se trabajan en la Ficha técnica y en Precios.</div></div>`;
  $('fp').scrollIntoView({behavior:'smooth',block:'start'});
}
async function subirFoto(f){
  if(!f) return null;
  const ext=(f.name.split('.').pop()||'jpg').toLowerCase(), path='zarrat/'+Date.now()+'.'+ext;
  const r=await fetch(SB+'/storage/v1/object/documentos/'+path,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':f.type||'image/jpeg'},body:f});
  if(!r.ok){ alert('No se pudo subir la foto'); return null; }
  return SB+'/storage/v1/object/public/documentos/'+path;
}
async function guardarProd(){
  const n=$('f_n').value.trim(); if(!n){ alert('Falta el nombre'); return; }
  const foto=await subirFoto($('f_f').files[0]);
  const b={nombre:n, categoria:$('f_c').value, sku:$('f_s').value.trim()||null, descripcion:$('f_d').value.trim()||null,
    manufacturero_id:$('f_m').value?+$('f_m').value:null, publicar_web:$('f_w').checked};
  if(foto) b.foto_url=foto;
  if(EDIT){ await patch('zarrat_producto','id=eq.'+EDIT,b); Object.assign(prodDe(EDIT),b); toast('Producto guardado'); }
  else{ const r=await post('zarrat_producto',b); PROD.push(r[0]); toast('Producto creado · ahora arma su ficha'); await vProd(); go('ficha',r[0].id); return; }
  $('fp').innerHTML=''; pintarProd();
}
async function borrarProd(id){
  if(!confirm('¿Retirar este producto? No se borra: queda inactivo y sale de la web.')) return;
  await patch('zarrat_producto','id=eq.'+id,{activo:false,publicar_web:false}); prodDe(id).activo=false; prodDe(id).publicar_web=false;
  $('fp').innerHTML=''; pintarProd(); toast('Producto retirado');
}

/* ═══════ 2 · FICHA TÉCNICA ═══════ el producto jala materiales (con su
   proveedor y precio) y al manufacturero; de ahí sale el costo. */
let FP=null;
async function vFicha(pid){
  const act=PROD.filter(p=>p.activo!==false);
  if(pid) FP=pid; if(!FP&&act.length) FP=act[0].id;
  $('main').innerHTML=`<h1>Ficha técnica</h1><div class="sub">Qué lleva cada producto, de qué proveedor, cuánto, y quién lo fabrica. El costo se calcula solo.</div>
    <div class="card"><label>Producto</label><select id="fs" onchange="FP=+this.value;vFicha()"><option value="">— escoge —</option>${act.map(p=>`<option value="${p.id}" ${p.id===FP?'selected':''}>${esc(p.nombre)}${p.sku?' · '+esc(p.sku):''}</option>`).join('')}</select></div>
    <div id="fx"></div>`;
  if(!FP){ $('fx').innerHTML='<div class="vacio">Primero crea un producto en la pestaña Productos.</div>'; return; }
  pintarFicha();
}
function pintarFicha(){
  const p=prodDe(FP); if(!p) return;
  const L=lineas(p.id);
  const optMat=MAT.filter(m=>m.activo!==false).length?PROV.map(pr=>{ const ms=MAT.filter(m=>m.proveedor_id===pr.id&&m.activo!==false); return ms.length?`<optgroup label="${esc(pr.nombre)}">${ms.map(m=>`<option value="${m.id}">${esc(m.nombre)}${m.color?' · '+esc(m.color):''} — ${$$(m.valor_unit)}/${esc(m.unidad||'u')}</option>`).join('')}</optgroup>`:''; }).join('')
    +(MAT.some(m=>!m.proveedor_id)?`<optgroup label="Sin proveedor">${MAT.filter(m=>!m.proveedor_id&&m.activo!==false).map(m=>`<option value="${m.id}">${esc(m.nombre)} — ${$$(m.valor_unit)}</option>`).join('')}</optgroup>`:'')
    :'';
  $('fx').innerHTML=`<div class="card"><h3>${esc(p.nombre)} <span class="hint">· ${esc(p.categoria||'')}</span></h3>
    <table><tr><th>Material</th><th>Proveedor</th><th class="n">Cant.</th><th>Unidad</th><th class="n">Precio unit.</th><th class="n">Subtotal</th><th></th></tr>
    ${L.map(l=>{ const m=matDe(l.material_id)||{}; return `<tr>
      <td>${esc(l.nombre||m.nombre||'—')}</td><td class="hint">${esc(m.proveedor_id?nomProv(m.proveedor_id):'—')}</td>
      <td class="n" style="width:84px"><input class="n mini" value="${+l.cantidad||0}" onchange="cambiarLinea(${l.id},'cantidad',this.value)"></td>
      <td>${esc(l.unidad||m.unidad||'')}</td>
      <td class="n" style="width:120px"><input class="n mini" value="${l.valor_unit!=null?+l.valor_unit:''}" placeholder="${Math.round(+m.valor_unit||0)}" title="Vacío = precio vivo del proveedor" onchange="cambiarLinea(${l.id},'valor_unit',this.value)"></td>
      <td class="n">${$$((+l.cantidad||0)*vUnit(l))}</td><td><button class="x" onclick="quitarLinea(${l.id})" title="Quitar">✕</button></td></tr>`; }).join('')}
    ${L.length?'':'<tr><td colspan="7" class="vacio">Esta ficha no tiene materiales todavía.</td></tr>'}
    <tr><td colspan="7" style="padding-top:12px"><div class="fila">
      <select id="fm" style="flex:1;min-width:220px"><option value="">+ agregar material…</option>${optMat}</select>
      <input id="fq" class="n" placeholder="cant." style="width:90px" value="1">
      <button class="btn sm" onclick="agregarLinea()">Agregar</button></div>
      ${MAT.length?'':'<div class="hint" style="margin-top:6px">No hay materiales: créalos en Proveedores, dentro de cada proveedor.</div>'}</td></tr>
    <tr class="tot"><td colspan="5">Materiales</td><td class="n">${$$(costoMat(p))}</td><td></td></tr></table></div>

    <div class="card"><h3>Mano de obra y otros</h3>
    <div class="g3"><div><label>Manufacturero</label><select id="fmn" onchange="guardarCostos()"><option value="">— sin asignar —</option>${MANU.filter(m=>m.activo!==false).map(m=>`<option value="${m.id}" ${m.id===p.manufacturero_id?'selected':''}>${esc(m.nombre)}</option>`).join('')}</select></div>
      <div><label>Mano de obra por unidad</label><input id="fmo" class="n" value="${+p.mano_obra||0}" onchange="guardarCostos()"></div>
      <div><label>Otros costos (empaque, transporte…)</label><input id="foc" class="n" value="${+p.otros_costos||0}" onchange="guardarCostos()"></div></div>
    <table style="margin-top:12px"><tr><td>Materiales</td><td class="n">${$$(costoMat(p))}</td></tr><tr><td>Mano de obra</td><td class="n">${$$(p.mano_obra)}</td></tr><tr><td>Otros</td><td class="n">${$$(p.otros_costos)}</td></tr>
      <tr class="tot"><td>COSTO TOTAL</td><td class="n">${$$(costo(p))}</td></tr>
      <tr><td class="hint">Precio sugerido con margen ${margenDe(p)}%</td><td class="n">${$$(precioSug(p))}</td></tr>
      <tr><td class="hint">Precio de venta actual</td><td class="n"><b>${$$(precio(p))}</b> <span class="hint">(${margenReal(p)}%)</span></td></tr></table>
    <div class="fila" style="margin-top:12px"><button class="btn gh" onclick="go('precios')">🏷️ Ir a Precios</button><button class="btn gh" onclick="copiarFicha()">Copiar la ficha de otro producto</button></div></div>`;
}
async function agregarLinea(){
  const mid=+$('fm').value, q=num($('fq').value)||1; if(!mid){ alert('Escoge un material'); return; }
  const m=matDe(mid); const r=await post('zarrat_ficha',{producto_id:FP,material_id:mid,nombre:m.nombre,unidad:m.unidad,cantidad:q,orden:lineas(FP).length});
  FICHA.push(r[0]); pintarFicha();
}
async function cambiarLinea(id,campo,v){
  const l=FICHA.find(x=>x.id===id); const val=campo==='valor_unit'?(String(v).trim()===''?null:num(v)):num(v);
  await patch('zarrat_ficha','id=eq.'+id,{[campo]:val}); l[campo]=val; pintarFicha();
}
async function quitarLinea(id){ await del('zarrat_ficha','id=eq.'+id); FICHA=FICHA.filter(x=>x.id!==id); pintarFicha(); }
async function guardarCostos(){
  const p=prodDe(FP); const b={manufacturero_id:$('fmn').value?+$('fmn').value:null, mano_obra:num($('fmo').value), otros_costos:num($('foc').value)};
  await patch('zarrat_producto','id=eq.'+FP,b); Object.assign(p,b); pintarFicha(); toast('Costos guardados');
}
async function copiarFicha(){
  const otros=PROD.filter(p=>p.id!==FP&&lineas(p.id).length); if(!otros.length){ alert('Ningún otro producto tiene ficha.'); return; }
  const n=prompt('¿De cuál producto? Escribe el número:\n'+otros.map((p,i)=>(i+1)+'. '+p.nombre).join('\n')); const o=otros[(+n||0)-1]; if(!o) return;
  for(const l of lineas(o.id)){ const r=await post('zarrat_ficha',{producto_id:FP,material_id:l.material_id,nombre:l.nombre,unidad:l.unidad,cantidad:l.cantidad,valor_unit:l.valor_unit,orden:l.orden}); FICHA.push(r[0]); }
  const p=prodDe(FP), b={mano_obra:o.mano_obra,otros_costos:o.otros_costos,manufacturero_id:p.manufacturero_id||o.manufacturero_id};
  await patch('zarrat_producto','id=eq.'+FP,b); Object.assign(p,b); pintarFicha(); toast('Ficha copiada de '+o.nombre);
}

/* ═══════ 3 · PRECIOS ═══════ costo → margen → precio. Se edita en la misma tabla. */
async function vPrecios(){
  const act=PROD.filter(p=>p.activo!==false);
  $('main').innerHTML=`<h1>Lista de precios</h1><div class="sub">El costo viene de la ficha. El margen general aplica a todos; cada producto puede tener el suyo. El precio de venta se puede fijar a mano.</div>
    <div class="card"><div class="fila"><div><label>Margen general sobre el costo (%)</label><input id="mg" class="n" value="${CFG.margen}" style="width:120px" onchange="guardarMargen(this.value)"></div>
      <div class="hint" style="align-self:flex-end;padding-bottom:12px">Ej: costo $100.000 con margen 100% → precio sugerido $200.000. Se redondea a la centena.</div></div></div>
    <div class="card" style="overflow-x:auto"><table><tr><th>Producto</th><th class="n">Costo</th><th class="n">Margen %</th><th class="n">Sugerido</th><th class="n">Precio venta</th><th class="n">Mayorista</th><th class="n">Utilidad</th><th>Web</th></tr>
    ${act.map(p=>`<tr><td><b>${esc(p.nombre)}</b><div class="hint">${esc(p.categoria||'')}${lineas(p.id).length?'':' · <span style="color:var(--warn)">sin ficha</span>'}</div></td>
      <td class="n">${$$(costo(p))}</td>
      <td class="n" style="width:90px"><input class="n mini" value="${p.margen!=null?p.margen:''}" placeholder="${CFG.margen}" onchange="guardarPrecio(${p.id},'margen',this.value)"></td>
      <td class="n">${$$(precioSug(p))}</td>
      <td class="n" style="width:120px"><input class="n mini" value="${p.precio_venta!=null?Math.round(p.precio_venta):''}" placeholder="${precioSug(p)}" onchange="guardarPrecio(${p.id},'precio_venta',this.value)"></td>
      <td class="n" style="width:120px"><input class="n mini" value="${p.precio_mayor!=null?Math.round(p.precio_mayor):''}" onchange="guardarPrecio(${p.id},'precio_mayor',this.value)"></td>
      <td class="n" style="color:${utilidad(p)>0?'var(--ok)':'var(--bad)'}">${$$(utilidad(p))}<div class="hint">${margenReal(p)}%</div></td>
      <td><input type="checkbox" ${p.publicar_web?'checked':''} style="width:auto" onchange="guardarPrecio(${p.id},'publicar_web',this.checked)"></td></tr>`).join('')}
    ${act.length?'':'<tr><td colspan="8" class="vacio">Sin productos.</td></tr>'}</table></div>
    <div class="fila"><a class="btn gh" href="catalogo.html" target="_blank">🌐 Ver el catálogo web</a><button class="btn gh" onclick="usarSugeridos()">Poner el precio sugerido a los que no tienen precio</button></div>`;
}
async function guardarMargen(v){ CFG.margen=num(v)||0; await post('zarrat_config?on_conflict=clave',{clave:'margen',valor:String(CFG.margen)},'resolution=merge-duplicates,return=minimal'); vPrecios(); toast('Margen general guardado'); }
async function guardarPrecio(id,campo,v){
  const val=campo==='publicar_web'?!!v:(String(v).trim()===''?null:num(v));
  await patch('zarrat_producto','id=eq.'+id,{[campo]:val}); prodDe(id)[campo]=val; vPrecios();
}
async function usarSugeridos(){
  const l=PROD.filter(p=>p.activo!==false&&!(+p.precio_venta>0)&&costo(p)>0);
  for(const p of l){ await patch('zarrat_producto','id=eq.'+p.id,{precio_venta:precioSug(p)}); p.precio_venta=precioSug(p); }
  vPrecios(); toast(l.length+' precio(s) puestos');
}

/* ═══════ 4 · PEDIDOS ═══════ lo que hay que fabricar y entregar. Se toma
   escogiendo productos de la lista de precios; el costo interno queda guardado
   para saber la utilidad real de cada pedido. */
const ESTADOS=['nuevo','en proceso','terminado','entregado'];
let PL=[];
async function vPedidos(){
  const vivos=PED.filter(p=>!p.anulado);
  const mes=hoy().slice(0,7), delMes=vivos.filter(p=>String(p.creado_en||'').startsWith(mes));
  $('main').innerHTML=`<h1>Pedidos</h1><div class="sub">Se toma el pedido con los precios de la lista. Anular no borra: queda con su motivo.</div>
    <div class="kpi"><div><span>Pedidos del mes</span><b>${delMes.length}</b></div><div><span>Vendido el mes</span><b>${$$(delMes.reduce((s,p)=>s+(+p.total||0),0))}</b></div>
      <div><span>Utilidad del mes</span><b>${$$(delMes.reduce((s,p)=>s+(+p.total||0)-(+p.costo_interno||0),0))}</b></div><div><span>Por entregar</span><b>${vivos.filter(p=>p.estado!=='entregado').length}</b></div></div>
    <div class="top"><span></span><button class="btn" onclick="formPedido()">+ Tomar pedido</button></div><div id="fpd"></div>
    <div class="card">${PED.length?PED.map(p=>`<div class="item"><div><div class="nm">${esc(p.folio||'')} · ${esc(p.cliente_nombre||'Sin cliente')}</div>
      <div class="dt">${(p.creado_en||'').slice(0,10)} · ${(p.items||[]).map(i=>(i.cantidad??1)+'× '+(i.nombre??i.n??'?')).join(', ')}${p.notas?' · '+esc(p.notas):''}</div>
      ${p.anulado?`<div class="dt" style="color:var(--bad)">Anulado: ${esc(p.anulado_nota||'')}</div>`:''}</div>
      <div style="text-align:right"><b>${$$(p.total)}</b><div class="hint">utilidad ${$$((+p.total||0)-(+p.costo_interno||0))}</div>
      ${p.anulado?'<span class="est anulado">anulado</span>':`<span class="est ${p.estado==='en proceso'?'proceso':esc(p.estado||'nuevo')}">${esc(p.estado||'nuevo')}</span>
        ${p.estado!=='entregado'?`<button class="btn sm gh" onclick="avanzar(${p.id})">→ ${ESTADOS[Math.min(ESTADOS.indexOf(p.estado||'nuevo')+1,3)]}</button>`:''}
        <button class="x" title="Anular" onclick="anular(${p.id})">✕</button>`}</div></div>`).join(''):'<div class="vacio">Todavía no hay pedidos.</div>'}</div>`;
}
function formPedido(){
  PL=[];
  $('fpd').innerHTML=`<div class="card"><h3>Nuevo pedido</h3>
    <div class="g2"><div><label>Cliente</label><select id="pc"><option value="">— nuevo cliente —</option>${CLI.map(c=>`<option value="${c.id}">${esc(c.nombre)}${c.telefono?' · '+esc(c.telefono):''}</option>`).join('')}</select></div>
      <div><label>Si es nuevo: nombre y teléfono</label><div class="fila"><input id="pn" placeholder="Nombre"><input id="pt" placeholder="Celular" style="max-width:140px"></div></div></div>
    <label>Productos</label><div class="fila"><select id="pp" style="flex:1;min-width:200px"><option value="">+ agregar producto…</option>${PROD.filter(p=>p.activo!==false).map(p=>`<option value="${p.id}">${esc(p.nombre)} — ${$$(precio(p))}</option>`).join('')}</select>
      <input id="pq" class="n" value="1" style="width:80px"><button class="btn sm" onclick="addPL()">Agregar</button></div>
    <div id="pl"></div>
    <label>Notas (color, personalización, fecha de entrega…)</label><textarea id="pno"></textarea>
    <div class="fila" style="margin-top:12px"><button class="btn" onclick="guardarPedido()">Guardar pedido</button><button class="btn gh" onclick="$('fpd').innerHTML=''">Cancelar</button></div></div>`;
}
function addPL(){ const p=prodDe(+$('pp').value); if(!p) return; const q=num($('pq').value)||1;
  const e=PL.find(x=>x.producto_id===p.id); if(e) e.cantidad+=q; else PL.push({producto_id:p.id,nombre:p.nombre,cantidad:q,precio:precio(p),costo:costo(p)}); pintarPL(); }
function pintarPL(){
  $('pl').innerHTML=`<table><tr><th>Producto</th><th class="n">Cant.</th><th class="n">Precio</th><th class="n">Subtotal</th><th></th></tr>
    ${PL.map((l,i)=>`<tr><td>${esc(l.nombre)}</td><td class="n" style="width:80px"><input class="n mini" value="${l.cantidad}" onchange="PL[${i}].cantidad=num(this.value)||1;pintarPL()"></td>
      <td class="n" style="width:120px"><input class="n mini" value="${Math.round(l.precio)}" onchange="PL[${i}].precio=num(this.value);pintarPL()"></td>
      <td class="n">${$$(l.cantidad*l.precio)}</td><td><button class="x" onclick="PL.splice(${i},1);pintarPL()">✕</button></td></tr>`).join('')}
    <tr class="tot"><td colspan="3">Total</td><td class="n">${$$(PL.reduce((s,l)=>s+l.cantidad*l.precio,0))}</td><td></td></tr></table>`;
}
async function guardarPedido(){
  if(!PL.length){ alert('Agrega al menos un producto'); return; }
  let cid=$('pc').value?+$('pc').value:null, cnom=cid?(CLI.find(c=>c.id===cid)||{}).nombre:$('pn').value.trim();
  if(!cid){ if(!cnom){ alert('Escribe el nombre del cliente'); return; } const r=await post('zarrat_clientes',{nombre:cnom,telefono:$('pt').value.trim()||null}); CLI.push(r[0]); cid=r[0].id; }
  const d=hoy().replace(/-/g,''), n=PED.filter(p=>(p.folio||'').startsWith('Z'+d)).length+1, folio='Z'+d+'-'+String(n).padStart(2,'0');
  const total=PL.reduce((s,l)=>s+l.cantidad*l.precio,0), ci=PL.reduce((s,l)=>s+l.cantidad*l.costo,0);
  const r=await post('zarrat_pedidos',{folio,cliente_id:cid,cliente_nombre:cnom,tipo:'venta',items:PL,total,costo_interno:ci,estado:'nuevo',notas:$('pno').value.trim()||null});
  PED.unshift(r[0]); toast('Pedido '+folio+' guardado'); vPedidos();
}
async function avanzar(id){ const p=PED.find(x=>x.id===id), e=ESTADOS[Math.min(ESTADOS.indexOf(p.estado||'nuevo')+1,3)];
  const b={estado:e}; if(e==='en proceso'&&!p.hora_inicio) b.hora_inicio=new Date().toISOString(); if(e==='terminado') b.hora_fin=new Date().toISOString();
  await patch('zarrat_pedidos','id=eq.'+id,b); Object.assign(p,b); vPedidos(); }
async function anular(id){ const m=prompt('¿Por qué se anula este pedido?'); if(m===null) return;
  const b={anulado:true,anulado_en:new Date().toISOString(),anulado_nota:m||null}; await patch('zarrat_pedidos','id=eq.'+id,b); Object.assign(PED.find(x=>x.id===id),b); vPedidos(); }

/* ═══════ 5 · PROVEEDORES ═══════ de materia prima, cada uno con sus materiales
   y precios. Ese precio es el que jala la ficha técnica. */
let PV=null;
async function vProv(){
  $('main').innerHTML=`<h1>Proveedores</h1><div class="sub">Quién vende la materia prima y a cuánto. Cambiar un precio aquí recalcula todas las fichas que lo usan.</div>
    <div class="top"><span></span><button class="btn" onclick="formProv()">+ Nuevo proveedor</button></div><div id="fpv"></div>
    <div id="lpv">${PROV.filter(p=>p.activo!==false).map(p=>{ const ms=MAT.filter(m=>m.proveedor_id===p.id&&m.activo!==false); return `<div class="card">
      <div class="item" style="border:none;padding:0"><div><div class="nm">${esc(p.nombre)} <span class="hint">· ${ms.length} material${ms.length===1?'':'es'}</span></div>
        <div class="dt">${[p.contacto,p.telefono,p.ciudad].filter(Boolean).map(esc).join(' · ')}${p.notas?' · '+esc(p.notas):''}</div></div>
        <div class="fila"><button class="btn sm gh" onclick="formProv(${p.id})">Editar</button><button class="btn sm gh" onclick="PV=PV===${p.id}?null:${p.id};vProv()">${PV===p.id?'Cerrar':'Materiales'}</button></div></div>
      ${PV===p.id?`<table style="margin-top:12px"><tr><th>Material</th><th>Categoría</th><th>Unidad</th><th class="n">Precio</th><th></th></tr>
        ${ms.map(m=>`<tr><td>${esc(m.nombre)}${m.color?' <span class="hint">· '+esc(m.color)+'</span>':''}${m.ref_prov?' <span class="hint">· ref '+esc(m.ref_prov)+'</span>':''}</td><td class="hint">${esc(m.categoria||'')}</td><td>${esc(m.unidad||'')}</td>
          <td class="n" style="width:130px"><input class="n mini" value="${Math.round(+m.valor_unit||0)}" onchange="precioMat(${m.id},this.value)"></td>
          <td><button class="x" onclick="quitarMat(${m.id})">✕</button></td></tr>`).join('')}
        <tr><td colspan="5" style="padding-top:10px"><div class="fila"><input id="mn" placeholder="Nuevo material (ej: Cuero vacuno napa)" style="flex:2;min-width:180px"><input id="mc" placeholder="color" style="max-width:110px">
          <select id="mk" style="max-width:150px">${CATMAT.map(c=>`<option>${c}</option>`).join('')}</select><select id="mu" style="max-width:100px">${UNID.map(u=>`<option>${u}</option>`).join('')}</select>
          <input id="mv" class="n" placeholder="precio" style="max-width:110px"><button class="btn sm" onclick="nuevoMat(${p.id})">Agregar</button></div></td></tr></table>`:''}</div>`; }).join('')||'<div class="vacio">Sin proveedores todavía.</div>'}</div>`;
}
function formProv(id){
  const p=id?provDe(id):{};
  $('fpv').innerHTML=`<div class="card"><h3>${id?'Editar':'Nuevo'} proveedor</h3>
    <div class="g2"><div><label>Nombre</label><input id="v_n" value="${esc(p.nombre||'')}"></div><div><label>Contacto</label><input id="v_c" value="${esc(p.contacto||'')}"></div></div>
    <div class="g3"><div><label>Teléfono</label><input id="v_t" value="${esc(p.telefono||'')}"></div><div><label>Ciudad</label><input id="v_ci" value="${esc(p.ciudad||'')}"></div><div><label>Correo</label><input id="v_e" value="${esc(p.email||'')}"></div></div>
    <label>Notas</label><textarea id="v_no">${esc(p.notas||'')}</textarea>
    <div class="fila" style="margin-top:12px"><button class="btn" onclick="guardarProv(${id||0})">Guardar</button><button class="btn gh" onclick="$('fpv').innerHTML=''">Cancelar</button>
      ${id?`<button class="btn gh" style="margin-left:auto;color:var(--bad);border-color:var(--bad)" onclick="retirar('zarrat_proveedores',${id},PROV,vProv)">Retirar</button>`:''}</div></div>`;
}
async function guardarProv(id){
  const b={nombre:$('v_n').value.trim(),contacto:$('v_c').value.trim()||null,telefono:$('v_t').value.trim()||null,ciudad:$('v_ci').value.trim()||null,email:$('v_e').value.trim()||null,notas:$('v_no').value.trim()||null,tipo:'materia prima'};
  if(!b.nombre){ alert('Falta el nombre'); return; }
  if(id){ await patch('zarrat_proveedores','id=eq.'+id,b); Object.assign(provDe(id),b); } else { const r=await post('zarrat_proveedores',b); PROV.push(r[0]); PV=r[0].id; }
  toast('Proveedor guardado'); vProv();
}
async function nuevoMat(pid){
  const n=$('mn').value.trim(); if(!n){ alert('Escribe el nombre del material'); return; }
  const r=await post('zarrat_materiales',{nombre:n,color:$('mc').value.trim()||null,categoria:$('mk').value,unidad:$('mu').value,valor_unit:num($('mv').value),proveedor_id:pid,activo:true});
  MAT.push(r[0]); vProv();
}
async function precioMat(id,v){ const m=matDe(id); await patch('zarrat_materiales','id=eq.'+id,{valor_unit:num(v)}); m.valor_unit=num(v); toast('Precio guardado · las fichas ya lo usan'); }
async function quitarMat(id){ if(!confirm('¿Retirar este material? Las fichas que lo usan se quedan con la cantidad pero sin precio.')) return;
  await patch('zarrat_materiales','id=eq.'+id,{activo:false}); matDe(id).activo=false; vProv(); }
async function retirar(tabla,id,arr,vista){ if(!confirm('¿Retirar? Queda inactivo, no se borra.')) return; await patch(tabla,'id=eq.'+id,{activo:false}); arr.find(x=>x.id===id).activo=false; $('fpv')&&($('fpv').innerHTML=''); vista(); }

/* ═══════ 6 · MANUFACTUREROS ═══════ quien fabrica. La ficha lo jala y le pone
   la mano de obra por unidad. */
async function vManu(){
  $('main').innerHTML=`<h1>Manufactureros</h1><div class="sub">Los talleres o personas que fabrican. Cada producto tiene el suyo y su valor de mano de obra en la ficha.</div>
    <div class="top"><span></span><button class="btn" onclick="formManu()">+ Nuevo manufacturero</button></div><div id="fmu"></div>
    <div class="card">${MANU.filter(m=>m.activo!==false).map(m=>{ const ps=PROD.filter(p=>p.manufacturero_id===m.id&&p.activo!==false); return `<div class="item"><div>
      <div class="nm">${esc(m.nombre)}${m.especialidad?' <span class="tag">'+esc(m.especialidad)+'</span>':''}</div>
      <div class="dt">${[m.contacto,m.telefono,m.ciudad].filter(Boolean).map(esc).join(' · ')}${m.notas?' · '+esc(m.notas):''}</div>
      <div class="dt">${ps.length?'Hace: '+ps.map(p=>esc(p.nombre)+' ('+$$(p.mano_obra)+')').join(', '):'Todavía sin productos asignados'}</div></div>
      <button class="btn sm gh" onclick="formManu(${m.id})">Editar</button></div>`; }).join('')||'<div class="vacio">Sin manufactureros todavía.</div>'}</div>`;
}
function formManu(id){
  const m=id?manuDe(id):{};
  $('fmu').innerHTML=`<div class="card"><h3>${id?'Editar':'Nuevo'} manufacturero</h3>
    <div class="g2"><div><label>Nombre / taller</label><input id="m_n" value="${esc(m.nombre||'')}"></div><div><label>Especialidad</label><input id="m_e" value="${esc(m.especialidad||'')}" placeholder="maletas, carteras, billeteras…"></div></div>
    <div class="g3"><div><label>Contacto</label><input id="m_c" value="${esc(m.contacto||'')}"></div><div><label>Teléfono</label><input id="m_t" value="${esc(m.telefono||'')}"></div><div><label>Ciudad</label><input id="m_ci" value="${esc(m.ciudad||'')}"></div></div>
    <label>Notas (tiempos, mínimos, cómo cobra)</label><textarea id="m_no">${esc(m.notas||'')}</textarea>
    <div class="fila" style="margin-top:12px"><button class="btn" onclick="guardarManu(${id||0})">Guardar</button><button class="btn gh" onclick="$('fmu').innerHTML=''">Cancelar</button>
      ${id?`<button class="btn gh" style="margin-left:auto;color:var(--bad);border-color:var(--bad)" onclick="retirar('zarrat_manufactureros',${id},MANU,vManu)">Retirar</button>`:''}</div></div>`;
}
async function guardarManu(id){
  const b={nombre:$('m_n').value.trim(),especialidad:$('m_e').value.trim()||null,contacto:$('m_c').value.trim()||null,telefono:$('m_t').value.trim()||null,ciudad:$('m_ci').value.trim()||null,notas:$('m_no').value.trim()||null};
  if(!b.nombre){ alert('Falta el nombre'); return; }
  if(id){ await patch('zarrat_manufactureros','id=eq.'+id,b); Object.assign(manuDe(id),b); } else { const r=await post('zarrat_manufactureros',b); MANU.push(r[0]); }
  toast('Manufacturero guardado'); vManu();
}

/* ═══════ 7 · CLIENTES ═══════ */
async function vClientes(){
  $('main').innerHTML=`<h1>Clientes</h1><div class="sub">Quién compra. Desde el pedido también se crean.</div>
    <div class="top"><input class="buscar" id="cq" placeholder="Buscar…" oninput="pintarCli()"><button class="btn" onclick="formCli()">+ Nuevo cliente</button></div><div id="fcl"></div><div class="card" id="lcl"></div>`;
  pintarCli();
}
function pintarCli(){
  const q=($('cq')||{}).value||'', l=CLI.filter(c=>!q||((c.nombre||'')+' '+(c.telefono||'')+' '+(c.instagram||'')).toLowerCase().includes(q.toLowerCase()));
  $('lcl').innerHTML=l.map(c=>{ const ps=PED.filter(p=>p.cliente_id===c.id&&!p.anulado); return `<div class="item"><div><div class="nm">${esc(c.nombre)}</div>
    <div class="dt">${[c.telefono,c.instagram,c.direccion].filter(Boolean).map(esc).join(' · ')}</div><div class="dt">${ps.length} pedido${ps.length===1?'':'s'} · ${$$(ps.reduce((s,p)=>s+(+p.total||0),0))}</div></div>
    <button class="btn sm gh" onclick="formCli(${c.id})">Editar</button></div>`; }).join('')||'<div class="vacio">Sin clientes todavía.</div>';
}
function formCli(id){
  const c=id?CLI.find(x=>x.id===id):{};
  $('fcl').innerHTML=`<div class="card"><h3>${id?'Editar':'Nuevo'} cliente</h3>
    <div class="g2"><div><label>Nombre</label><input id="c_n" value="${esc(c.nombre||'')}"></div><div><label>Celular / WhatsApp</label><input id="c_t" value="${esc(c.telefono||'')}"></div></div>
    <div class="g2"><div><label>Instagram</label><input id="c_i" value="${esc(c.instagram||'')}"></div><div><label>Correo</label><input id="c_e" value="${esc(c.email||'')}"></div></div>
    <label>Dirección</label><input id="c_d" value="${esc(c.direccion||'')}"><label>Notas</label><textarea id="c_no">${esc(c.notas||'')}</textarea>
    <div class="fila" style="margin-top:12px"><button class="btn" onclick="guardarCli(${id||0})">Guardar</button><button class="btn gh" onclick="$('fcl').innerHTML=''">Cancelar</button></div></div>`;
}
async function guardarCli(id){
  const b={nombre:$('c_n').value.trim(),telefono:$('c_t').value.trim()||null,instagram:$('c_i').value.trim()||null,email:$('c_e').value.trim()||null,direccion:$('c_d').value.trim()||null,notas:$('c_no').value.trim()||null};
  if(!b.nombre){ alert('Falta el nombre'); return; }
  if(id){ await patch('zarrat_clientes','id=eq.'+id,b); Object.assign(CLI.find(x=>x.id===id),b); } else { const r=await post('zarrat_clientes',b); CLI.push(r[0]); }
  $('fcl').innerHTML=''; toast('Cliente guardado'); pintarCli();
}
