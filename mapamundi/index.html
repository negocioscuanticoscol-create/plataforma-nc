<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mapamundi — el mapa del mercado</title>
<style>
:root{
  --naranja:#ea580c; --naranja-d:#c2410c; --azul:#2563eb; --verde:#16a34a; --rojo:#dc2626;
  --gris:#64748b; --linea:#e2e8f0; --fondo:#f8fafc; --texto:#1e293b; --suave:#94a3b8;
  --e-existe:#94a3b8; --e-no_tocable:#7c3aed; --e-sin_trabajar:#64748b; --e-en_trabajo:#2563eb;
  --e-aplica:#16a34a; --e-no_aplica:#dc2626; --e-cliente:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:14px}
header{background:#fff;border-bottom:1px solid var(--linea);padding:10px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;color:var(--naranja-d)}
header .sub{font-size:11px;color:var(--suave)}
select#clienteNc{margin-left:auto;padding:6px 10px;border:1px solid var(--linea);border-radius:8px;font-weight:700}
.layout{display:flex;gap:0;align-items:flex-start}
.panel-arbol{width:340px;min-width:280px;max-width:420px;background:#fff;border-right:1px solid var(--linea);height:calc(100vh - 49px);overflow:auto;padding:10px}
.panel-central{flex:1;padding:14px;min-width:0}
.nodo{border-radius:8px;margin-bottom:2px}
.nodo-fila{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;border-radius:8px}
.nodo-fila:hover{background:#f1f5f9}
.nodo-fila.activo{background:#fff7ed;outline:1px solid var(--naranja)}
.nodo-caret{width:14px;text-align:center;color:var(--suave);font-size:10px;flex:none}
.nodo-nombre{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nodo-n{font-size:11px;color:var(--suave);flex:none}
.nodo-peso{color:var(--naranja);font-weight:800}
.barra{height:5px;border-radius:3px;overflow:hidden;display:flex;margin:2px 8px 6px 22px;background:#f1f5f9}
.barra span{height:100%}
.hijos{margin-left:14px;display:none}
.hijos.abierto{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:5px 11px;border-radius:16px;border:1px solid var(--linea);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--gris);user-select:none}
.chip.on{background:var(--naranja);border-color:var(--naranja);color:#fff}
.chip .pt{opacity:.75;font-weight:400}
.barra-cabecera{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.barra-cabecera .titulo{font-weight:800;font-size:16px;margin-bottom:2px}
.barra-cabecera .ruta{font-size:12px;color:var(--suave)}
.stats{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.stat{min-width:70px}
.stat b{display:block;font-size:19px}
.stat span{font-size:11px;color:var(--suave)}
.grupo-titulo{font-size:11px;font-weight:800;color:var(--suave);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.card{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:10px 12px;cursor:pointer}
.card:hover{border-color:var(--naranja)}
.card .fila1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .nombre{font-weight:700;font-size:13.5px;line-height:1.25}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;color:#fff;white-space:nowrap}
.card .meta{font-size:11.5px;color:var(--gris);margin-top:5px;display:flex;flex-wrap:wrap;gap:8px}
.card .meta span{white-space:nowrap}
.calidad{display:inline-block;width:26px;height:5px;border-radius:3px;background:#e2e8f0;position:relative;overflow:hidden;vertical-align:middle;margin-left:4px}
.calidad i{position:absolute;left:0;top:0;bottom:0;background:var(--verde)}
.vacio{color:var(--suave);text-align:center;padding:40px 0}
.mas{display:block;margin:14px auto;padding:8px 18px;border-radius:8px;border:1px solid var(--linea);background:#fff;cursor:pointer;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px}
.modal h2{margin:0 0 2px;font-size:17px}
.modal .sub{font-size:12px;color:var(--suave);margin-bottom:14px}
.campo{margin-bottom:10px}
.campo label{display:block;font-size:11px;color:var(--suave);font-weight:700;text-transform:uppercase;margin-bottom:2px}
.campo .val{font-size:14px}
.campo .val.vacio-campo{color:var(--suave);font-style:italic}
.filagrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.etapas-botones{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.eb{padding:6px 10px;border-radius:8px;border:1px solid var(--linea);background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.eb.on{color:#fff;border-color:transparent}
.cerrar{position:absolute;top:14px;right:16px;cursor:pointer;font-size:20px;color:var(--suave);background:none;border:none}
.modal{position:relative}
.buscador{width:100%;padding:9px 12px;border:1px solid var(--linea);border-radius:8px;margin-bottom:10px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--suave)}
.card{position:relative}
.card .chk{position:absolute;top:9px;right:9px;width:17px;height:17px;accent-color:var(--naranja);z-index:2}
.card .fila1{padding-right:20px}
.barra-seleccion{position:sticky;bottom:0;left:0;right:0;background:var(--naranja-d);color:#fff;padding:11px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;margin-top:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.barra-seleccion b{font-size:14px}
.barra-seleccion button{padding:7px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-size:12.5px}
.btn-enviar{background:#fff;color:var(--naranja-d)}
.btn-vaciar{background:rgba(255,255,255,.18);color:#fff}
.btn-actualizar{background:transparent;border:1px solid var(--linea);color:var(--gris);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:60;max-width:90vw}
@media(max-width:820px){.layout{flex-direction:column}.panel-arbol{width:100%;max-width:none;height:auto;max-height:280px;border-right:none;border-bottom:1px solid var(--linea)}}
</style>
</head>
<body>
<header>
  <h1>🗺️ Mapamundi</h1>
  <div class="sub">el mapa del mercado, departamento por departamento</div>
  <select id="clienteNc" onchange="App.cambiarCliente(this.value)">
    <option value="smart">Smart Envases</option>
  </select>
  <button class="btn-actualizar" onclick="App.actualizarDesdeLupe()">🔄 Actualizar desde Lupe</button>
</header>
<div style="text-align:center;font-size:10px;color:#cbd5e1;padding-top:2px">VER 20260925-v4-todas-ciudades</div>
<div class="layout">
  <div class="panel-arbol" id="arbol"><div class="loading">Cargando el mapa…</div></div>
  <div class="panel-central" id="central"></div>
</div>
<div id="modalRoot"></div>

<script src="municipios-colombia.js"></script>
<script>
const SB='https://fnayedgvamxktxfvywwl.supabase.co';
const K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};

const ETAPAS=[
  {v:'existe',      t:'Existe',        color:'var(--e-existe)'},
  {v:'sin_trabajar',t:'Sin trabajar',  color:'var(--e-sin_trabajar)'},
  {v:'en_trabajo',  t:'En trabajo',    color:'var(--e-en_trabajo)'},
  {v:'aplica',      t:'Aplica',        color:'var(--e-aplica)'},
  {v:'no_aplica',   t:'No aplica',     color:'var(--e-no_aplica)'},
  {v:'cliente',     t:'Cliente',       color:'var(--e-cliente)'},
  {v:'no_tocable',  t:'No tocable',    color:'var(--e-no_tocable)'},
];
const COLOR=Object.fromEntries(ETAPAS.map(e=>[e.v,e.color]));
const NOMBRE_ETAPA=Object.fromEntries(ETAPAS.map(e=>[e.v,e.t]));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $=id=>document.getElementById(id);
const normDepto=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
// Universo OFICIAL de los 1.104 municipios de Colombia (municipios-colombia.js), para que
// ningun municipio quede sin investigar aunque todavia no tenga ni un negocio mapeado.
const MUNICIPIOS_POR_DEPTO={};
(MUNICIPIOS_COLOMBIA||[]).forEach(([nombre,depto,poblacion])=>{
  const k=normDepto(depto); (MUNICIPIOS_POR_DEPTO[k]=MUNICIPIOS_POR_DEPTO[k]||[]).push({nombre,poblacion});
});
const fmtPob=n=>n?n.toLocaleString('es-CO')+' hab':null;

const App={
  datos:[],           // todas las filas de nc_mercado del cliente_nc activo
  clienteNc:'smart',
  seleccion:{depto:null, municipio:null},
  filtros:{etapas:new Set(), celular:false, categoria:false, calidadMin:0},
  visibles:60,
  abiertos:new Set(),
  buscar:'',
  seleccionados:new Set(),
  enviando:false,

  async init(){
    await this.cargar();
  },

  async cargar(){
    $('arbol').innerHTML='<div class="loading">Cargando el mapa…</div>';
    $('central').innerHTML='';
    // PostgREST corta en 1.000 filas por página aunque se pida limit=10000: hay que paginar con Range.
    const COLS='id,depto,municipio,localidad,barrio,direccion,nombre,razon_social,nit,celular,telefono,email,web,instagram,producto,categoria,envase,tamano,etapa,etapa_motivo,etapa_canal,etapa_fecha,etapa_quien,total_comprado,ultima_compra,cliente_desde,calidad,notas,no_tocable,lupe_base_id';
    const url=SB+'/rest/v1/nc_mercado?cliente_nc=eq.'+encodeURIComponent(this.clienteNc)+'&select='+COLS+'&order=id.asc';
    let todo=[], desde=0;
    while(true){
      const r=await fetch(url,{headers:{...H,Range:desde+'-'+(desde+999)}});
      const pag=await r.json();
      if(!Array.isArray(pag)||!pag.length) break;
      todo=todo.concat(pag);
      if(pag.length<1000) break;
      desde+=1000;
    }
    this.datos=todo;
    this.seleccion={depto:null,municipio:null};
    this.visibles=60;
    this.renderArbol();
    this.renderCentral();
  },

  cambiarCliente(v){ this.clienteNc=v; this.cargar(); },

  // ---------- ARBOL ----------
  construirArbol(){
    const raiz={};
    for(const f of this.datos){
      const d=f.depto||'(sin departamento)', m=f.municipio||'(sin municipio)';
      raiz[d]=raiz[d]||{n:0,por:{}, hijos:{}};
      raiz[d].n++; raiz[d].por[f.etapa]=(raiz[d].por[f.etapa]||0)+1;
      raiz[d].hijos[m]=raiz[d].hijos[m]||{n:0,por:{}};
      raiz[d].hijos[m].n++; raiz[d].hijos[m].por[f.etapa]=(raiz[d].hijos[m].por[f.etapa]||0)+1;
    }
    return raiz;
  },

  barraHtml(por,total){
    if(!total) return '';
    return `<div class="barra">${ETAPAS.map(e=>{
      const n=por[e.v]||0; if(!n) return '';
      const pct=(n*100/total).toFixed(1);
      return `<span style="width:${pct}%;background:${e.color}" title="${e.t}: ${n}"></span>`;
    }).join('')}</div>`;
  },

  pct(n,total){ return total?(n*100/total).toFixed(1).replace('.',','):'0'; },

  renderArbol(){
    const arbol=this.construirArbol();
    const total=this.datos.length;
    const deptos=Object.entries(arbol).sort((a,b)=>b[1].n-a[1].n);
    let html=`<div style="padding:4px 6px 10px;font-size:11px;color:var(--suave);font-weight:700;text-transform:uppercase">
      ${total.toLocaleString('es-CO')} negocios mapeados</div>`;
    for(const [depto,d] of deptos){
      const abierto=this.abiertos.has(depto);
      const activo=this.seleccion.depto===depto && !this.seleccion.municipio;
      html+=`<div class="nodo">
        <div class="nodo-fila ${activo?'activo':''}" onclick="App.toggleDepto('${esc(depto).replace(/'/g,"\\'")}')">
          <span class="nodo-caret" onclick="event.stopPropagation();App.toggleAbierto('${esc(depto).replace(/'/g,"\\'")}')">${abierto?'▾':'▸'}</span>
          <span class="nodo-nombre">${esc(depto)}</span>
          <span class="nodo-n">${d.n} <span class="nodo-peso">${this.pct(d.n,total)}%</span></span>
        </div>
        ${this.barraHtml(d.por,d.n)}
        <div class="hijos ${abierto?'abierto':''}">
          ${Object.entries(d.hijos).sort((a,b)=>b[1].n-a[1].n).map(([mun,m])=>{
            const act2=this.seleccion.depto===depto && this.seleccion.municipio===mun;
            return `<div class="nodo-fila ${act2?'activo':''}" onclick="event.stopPropagation();App.elegirMunicipio('${esc(depto).replace(/'/g,"\\'")}','${esc(mun).replace(/'/g,"\\'")}')">
              <span class="nodo-caret"></span>
              <span class="nodo-nombre">${esc(mun)}</span>
              <span class="nodo-n">${m.n} <span class="nodo-peso">${this.pct(m.n,d.n)}%</span></span>
            </div>${this.barraHtml(m.por,m.n)}`;
          }).join('')}
        </div>
      </div>`;
    }
    $('arbol').innerHTML=html;
  },
  toggleAbierto(depto){ if(this.abiertos.has(depto)) this.abiertos.delete(depto); else this.abiertos.add(depto); this.renderArbol(); },
  toggleDepto(depto){ this.seleccion={depto,municipio:null}; this.abiertos.add(depto); this.visibles=60; this.renderArbol(); this.renderCentral(); },
  elegirMunicipio(depto,mun){ this.seleccion={depto,municipio:mun}; this.visibles=60; this.renderArbol(); this.renderCentral(); },
  limpiarSeleccion(){ this.seleccion={depto:null,municipio:null}; this.visibles=60; this.renderArbol(); this.renderCentral(); },

  // ---------- FILTRO + LISTA ----------
  filasFiltradas(){
    let f=this.datos;
    if(this.seleccion.depto) f=f.filter(x=>(x.depto||'(sin departamento)')===this.seleccion.depto);
    if(this.seleccion.municipio) f=f.filter(x=>(x.municipio||'(sin municipio)')===this.seleccion.municipio);
    if(this.filtros.etapas.size) f=f.filter(x=>this.filtros.etapas.has(x.etapa));
    if(this.filtros.celular) f=f.filter(x=>x.celular);
    if(this.filtros.categoria) f=f.filter(x=>x.categoria);
    if(this.filtros.calidadMin) f=f.filter(x=>(x.calidad||0)>=this.filtros.calidadMin);
    if(this.buscar.trim()){
      const b=this.buscar.trim().toLowerCase();
      f=f.filter(x=>(x.nombre||'').toLowerCase().includes(b)||(x.razon_social||'').toLowerCase().includes(b)||(x.nit||'').includes(b)||(x.celular||'').includes(b));
    }
    return f;
  },

  toggleEtapa(v){ if(this.filtros.etapas.has(v)) this.filtros.etapas.delete(v); else this.filtros.etapas.add(v); this.visibles=60; this.renderCentral(); },
  toggleFiltro(k){ this.filtros[k]=!this.filtros[k]; this.visibles=60; this.renderCentral(); },
  onBuscar(v){ this.buscar=v; this.visibles=60; this.renderListaSolo(); },
  masVisibles(){ this.visibles+=60; this.renderListaSolo(); },

  contarPorEtapa(filas){
    const c={}; for(const f of filas) c[f.etapa]=(c[f.etapa]||0)+1; return c;
  },

  renderCentral(){
    // Con un departamento elegido y SIN ciudad todavía: primero se escoge la ciudad.
    if(this.seleccion.depto && !this.seleccion.municipio){ this.renderElegirCiudad(); return; }

    const filas=this.filasFiltradas();
    const por=this.contarPorEtapa(filas);
    const ruta=[this.seleccion.depto,this.seleccion.municipio].filter(Boolean).join(' › ')||'Todo el país';
    const enlaces=[];
    if(this.seleccion.municipio) enlaces.push(`<a href="#" onclick="App.toggleDepto('${esc(this.seleccion.depto).replace(/'/g,"\\'")}');return false" style="color:var(--naranja)">‹ elegir otra ciudad</a>`);
    if(this.seleccion.depto) enlaces.push(`<a href="#" onclick="App.limpiarSeleccion();return false" style="color:var(--naranja)">ver todo el país</a>`);
    let html=`<div class="barra-cabecera">
      <div class="fila1" style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="titulo">${esc(ruta)}</div>
          <div class="ruta">${filas.length.toLocaleString('es-CO')} negocios${enlaces.length?' · '+enlaces.join(' · '):''}</div>
        </div>
      </div>
      <div class="stats">
        ${ETAPAS.map(e=>`<div class="stat"><b style="color:${e.color}">${por[e.v]||0}</b><span>${e.t}</span></div>`).join('')}
      </div>
    </div>
    <div class="grupo-titulo">Filtrar por estado</div>
    <div class="chips">${ETAPAS.map(e=>`<div class="chip ${this.filtros.etapas.has(e.v)?'on':''}" style="${this.filtros.etapas.has(e.v)?`background:${e.color};border-color:${e.color}`:''}" onclick="App.toggleEtapa('${e.v}')">${e.t} <span class="pt">${por[e.v]||0}</span></div>`).join('')}</div>
    <div class="grupo-titulo">Otras variables</div>
    <div class="chips">
      <div class="chip ${this.filtros.celular?'on':''}" onclick="App.toggleFiltro('celular')">📱 Con celular</div>
      <div class="chip ${this.filtros.categoria?'on':''}" onclick="App.toggleFiltro('categoria')">🏷️ Con categoría</div>
    </div>
    <input class="buscador" placeholder="Buscar por nombre, NIT o celular…" oninput="App.onBuscar(this.value)" value="${esc(this.buscar)}">
    <div id="listaWrap"></div>`;
    $('central').innerHTML=html;
    this.renderListaSolo();
  },

  // ---------- ELEGIR CIUDAD (paso intermedio al entrar a un departamento) ----------
  // Aparecen TODAS las ciudades oficiales del departamento -aunque no tengan ni un
  // negocio mapeado todavia-, para que ninguna quede sin investigar. Ordenadas de
  // mayor a menor poblacion; las que no tienen dato de poblacion quedan al final.
  renderElegirCiudad(){
    const depto=this.seleccion.depto;
    const arbol=this.construirArbol();
    const d=arbol[depto]||{n:0,por:{},hijos:{}};
    const total=this.datos.length;
    const oficiales=MUNICIPIOS_POR_DEPTO[normDepto(depto)]||[];
    // union: las oficiales del depto + cualquier municipio que aparezca en los datos
    // pero no en el listado oficial (nombre raro, error de tipeo, etc. - no se pierde).
    // "Ubaté" (como lo escriben las camaras de comercio) y "Villa de San Diego de
    // Ubaté" (nombre oficial largo de Wikipedia) son la MISMA ciudad: si no hay
    // coincidencia exacta se busca una parcial antes de darla por no mapeada.
    const hijosUsados=new Set(); let ciudades=[];
    oficiales.forEach(o=>{
      const no=normDepto(o.nombre);
      let clave=Object.keys(d.hijos).find(mun=>normDepto(mun)===no);
      if(!clave) clave=Object.keys(d.hijos).find(mun=>{ const nm=normDepto(mun); return nm.length>3 && no.length>3 && (nm.includes(no)||no.includes(nm)); });
      if(clave) hijosUsados.add(clave);
      ciudades.push({nombre:o.nombre, poblacion:o.poblacion, m:clave?d.hijos[clave]:null});
    });
    Object.entries(d.hijos).forEach(([mun,m])=>{ if(!hijosUsados.has(mun)) ciudades.push({nombre:mun, poblacion:null, m}); });
    const buscarCiudad=(this._buscarCiudad||'').trim().toLowerCase();
    if(buscarCiudad) ciudades=ciudades.filter(c=>c.nombre.toLowerCase().includes(buscarCiudad));
    ciudades.sort((a,b)=> (b.poblacion||-1)-(a.poblacion||-1) || a.nombre.localeCompare(b.nombre,'es'));
    const sinMapear=ciudades.filter(c=>!c.m).length;
    let html=`<div class="barra-cabecera">
      <div class="titulo">${esc(depto)}</div>
      <div class="ruta">${d.n.toLocaleString('es-CO')} negocios mapeados · ${this.pct(d.n,total)}% de todo el mapa
        ${sinMapear?` · <b style="color:var(--rojo)">${sinMapear} ciudades sin ningún negocio mapeado todavía</b>`:''} ·
        <a href="#" onclick="App.limpiarSeleccion();return false" style="color:var(--naranja)">ver todo el país</a></div>
      <div class="stats">${ETAPAS.map(e=>`<div class="stat"><b style="color:${e.color}">${d.por[e.v]||0}</b><span>${e.t}</span></div>`).join('')}</div>
    </div>
    <div class="grupo-titulo">Elige la ciudad de ${esc(depto)} <span style="font-weight:400;text-transform:none;color:var(--suave)">(${ciudades.length} en total, de mayor a menor población)</span></div>
    <input class="buscador" placeholder="Buscar ciudad…" oninput="App.onBuscarCiudad(this.value)" value="${esc(this._buscarCiudad||'')}">
    <div class="lista">${ciudades.map(c=>{
      const m=c.m; const n=m?m.n:0; const pob=fmtPob(c.poblacion);
      return `<div class="card" onclick="App.elegirMunicipio('${esc(depto).replace(/'/g,"\\'")}','${esc(c.nombre).replace(/'/g,"\\'")}')">
        <div class="fila1"><div class="nombre">📍 ${esc(c.nombre)}${pob?` <span style="color:var(--suave);font-weight:400">(${pob})</span>`:''}</div>
          <span class="badge" style="background:${n?'var(--naranja)':'var(--suave)'}">${n}</span></div>
        <div class="meta">${n?`<span>${this.pct(n,d.n)}% de los negocios de ${esc(depto)}</span>`:'<span style="color:var(--rojo)">sin negocios mapeados — oportunidad sin explorar</span>'}</div>
        ${n?this.barraHtml(m.por,n):''}
      </div>`;
    }).join('')}</div>
    ${!ciudades.length?'<div class="vacio">Ninguna ciudad coincide con la búsqueda.</div>':''}`;
    $('central').innerHTML=html;
  },
  onBuscarCiudad(v){ this._buscarCiudad=v; this.renderElegirCiudad(); },

  renderListaSolo(){
    const filas=this.filasFiltradas();
    const mostrar=filas.slice(0,this.visibles);
    let html;
    if(!filas.length){
      html='<div class="vacio">No hay negocios con estos filtros.</div>';
    }else{
      const seleccionablesAqui=filas.filter(f=>this.puedeEnviarse(f));
      html=`<div style="margin-bottom:8px">
        <a href="#" onclick="App.seleccionarFiltrados();return false" style="font-size:12px;color:var(--naranja);font-weight:700">
          ☑️ Seleccionar los ${filas.length.toLocaleString('es-CO')} de este filtro${seleccionablesAqui.length<filas.length?` (${seleccionablesAqui.length} se pueden mandar a Lupe)`:''}</a>
      </div>
      <div class="lista">${mostrar.map(f=>this.cardHtml(f)).join('')}</div>`;
      if(filas.length>mostrar.length) html+=`<button class="mas" onclick="App.masVisibles()">Ver más (${filas.length-mostrar.length} restantes)</button>`;
    }
    html+=this.barraSeleccionHtml();
    $('listaWrap').innerHTML=html;
  },

  // Solo se manda a Lupe lo que aun no esta en trabajo, no es cliente y no es no_tocable,
  // y tiene con que llamar. Si ya esta en_trabajo es porque ya se mando (o vino de pauta/visita).
  puedeEnviarse(f){
    return !f.no_tocable && !['cliente','en_trabajo','no_tocable'].includes(f.etapa) && (f.celular||f.telefono);
  },

  cardHtml(f){
    const color=COLOR[f.etapa]||'var(--gris)';
    const meta=[];
    if(f.celular) meta.push('📱 '+esc(f.celular));
    if(f.categoria) meta.push('🏷️ '+esc(f.categoria));
    if(f.tamano) meta.push(esc(f.tamano));
    if(f.municipio && !this.seleccion.municipio) meta.push('📍 '+esc(f.municipio));
    const marcado=this.seleccionados.has(f.id);
    const puede=this.puedeEnviarse(f);
    return `<div class="card" onclick="App.abrirFicha('${f.id}')">
      ${puede?`<input type="checkbox" class="chk" ${marcado?'checked':''} onclick="event.stopPropagation();App.toggleSeleccion('${f.id}')">`:''}
      <div class="fila1">
        <div class="nombre">${esc(f.nombre)}</div>
        <span class="badge" style="background:${color}">${NOMBRE_ETAPA[f.etapa]||f.etapa}</span>
      </div>
      <div class="meta">${meta.map(m=>`<span>${m}</span>`).join('')}
        <span title="calidad del dato: ${f.calidad||0}">calidad<span class="calidad"><i style="width:${f.calidad||0}%"></i></span></span>
      </div>
    </div>`;
  },

  toggleSeleccion(id){ if(this.seleccionados.has(id)) this.seleccionados.delete(id); else this.seleccionados.add(id); this.renderListaSolo(); },
  seleccionarFiltrados(){
    const filas=this.filasFiltradas().filter(f=>this.puedeEnviarse(f));
    filas.forEach(f=>this.seleccionados.add(f.id));
    this.renderListaSolo();
  },
  vaciarSeleccion(){ this.seleccionados.clear(); this.renderListaSolo(); },

  barraSeleccionHtml(){
    const n=this.seleccionados.size;
    if(!n) return '';
    return `<div class="barra-seleccion">
      <b>${n} seleccionado${n===1?'':'s'}</b>
      <button class="btn-enviar" onclick="App.enviarALupe()" ${this.enviando?'disabled':''}>${this.enviando?'Enviando…':'📤 Enviar a Lupe'}</button>
      <button class="btn-vaciar" onclick="App.vaciarSeleccion()">Vaciar selección</button>
    </div>`;
  },

  // ---------- ENVIAR A LUPE ----------
  async enviarALupe(){
    if(this.enviando||!this.seleccionados.size) return;
    const filas=this.datos.filter(f=>this.seleccionados.has(f.id));
    const nombreSugerido=(this.seleccion.municipio||this.seleccion.depto||'Mapamundi')+' · '+new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
    const nombreBase=prompt('¿Con qué nombre queda esta base en Lupe?',nombreSugerido);
    if(!nombreBase) return;
    this.enviando=true; this.renderListaSolo();
    try{
      const deptos=[...new Set(filas.map(f=>f.depto).filter(Boolean))];
      const rBase=await fetch(SB+'/rest/v1/mkr_bases',{method:'POST',headers:{...H,Prefer:'return=representation'},
        body:JSON.stringify([{nombre:nombreBase, descripcion:'Enviada desde Mapamundi · '+filas.length+' negocios', origen:'Mapamundi',
          depto:deptos.length===1?deptos[0]:null, nivel:'todos', activa:true, cliente:this.clienteNc, rubro:'envases'}])});
      const base=(await rBase.json())[0];
      if(!base||!base.id) throw new Error('no se pudo crear la base en Lupe');
      const filasEmpresa=filas.map(f=>({
        base_id:base.id, nc_mercado_id:f.id, razon_social:f.razon_social||f.nombre, nit:f.nit||null,
        municipio:f.municipio||null, depto:f.depto||null, direccion:f.direccion||null,
        telefono:f.telefono||null, celular:f.celular||null,
        tel_marcar:f.celular||f.telefono||null, tipo_tel:f.celular?'celular':(f.telefono?'fijo':null),
        email:f.email||null, web:f.web||null, sector:f.categoria||null, estado:'nuevo'}));
      // en tandas de 300 para no mandar un body gigante
      for(let i=0;i<filasEmpresa.length;i+=300){
        const r=await fetch(SB+'/rest/v1/mkr_empresas',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(filasEmpresa.slice(i,i+300))});
        if(!r.ok) throw new Error('error cargando empresas a Lupe: '+await r.text());
      }
      const ids=filas.map(f=>'"'+f.id+'"').join(',');
      await fetch(SB+'/rest/v1/nc_mercado?id=in.('+ids+')',{method:'PATCH',headers:{...H,Prefer:'return=minimal'},
        body:JSON.stringify({etapa:'en_trabajo', etapa_motivo:null, etapa_canal:'llamada', etapa_quien:'mapamundi', etapa_fecha:new Date().toISOString(), lupe_base_id:base.id})});
      filas.forEach(f=>{ f.etapa='en_trabajo'; f.etapa_motivo=null; f.etapa_canal='llamada'; f.lupe_base_id=base.id; });
      this.seleccionados.clear();
      this.toast('✅ '+filasEmpresa.length+' negocios enviados a Lupe, en la base «'+nombreBase+'».');
    }catch(e){
      this.toast('❌ '+e.message);
    }
    this.enviando=false;
    this.renderArbol(); this.renderCentral();
  },

  async actualizarDesdeLupe(){
    this.toast('Consultando lo que ha pasado en Lupe…');
    try{
      const r=await fetch(SB+'/rest/v1/rpc/nc_mercado_sync_lupe',{method:'POST',headers:H,body:JSON.stringify({p_cliente_nc:this.clienteNc})});
      const cambios=await r.json();
      if(!r.ok) throw new Error((cambios&&cambios.message)||'no se pudo actualizar');
      await this.cargar();
      this.toast(Array.isArray(cambios)&&cambios.length ? '🔄 '+cambios.length+' negocios cambiaron de estado por resultados de Lupe.' : 'Sin novedades: nada cambió desde la última vez.');
    }catch(e){ this.toast('❌ '+e.message); }
  },

  toast(msg){
    const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),4500);
  },

  // ---------- FICHA ----------
  abrirFicha(id){
    const f=this.datos.find(x=>x.id===id); if(!f) return;
    const campo=(label,val,vacioTxt)=>`<div class="campo"><label>${label}</label><div class="val ${val?'':'vacio-campo'}">${val?esc(val):(vacioTxt||'sin dato')}</div></div>`;
    const html=`<div class="overlay" onclick="if(event.target===this) App.cerrarFicha()">
      <div class="modal">
        <button class="cerrar" onclick="App.cerrarFicha()">×</button>
        <h2>${esc(f.nombre)}</h2>
        <div class="sub">${esc([f.municipio,f.depto].filter(Boolean).join(', ')||'sin ubicación')}</div>
        <div class="grupo-titulo">Estado</div>
        <div class="etapas-botones">${ETAPAS.map(e=>`<div class="eb ${f.etapa===e.v?'on':''}" style="${f.etapa===e.v?`background:${e.color}`:''}" onclick="App.cambiarEtapa('${f.id}','${e.v}')">${e.t}</div>`).join('')}</div>
        ${f.etapa_motivo?`<div class="campo" style="margin-top:8px"><label>Motivo</label><div class="val">${esc(f.etapa_motivo)}</div></div>`:''}
        ${f.etapa==='en_trabajo' && f.lupe_base_id?`<div class="campo" style="margin-top:4px"><label>En Lupe</label><div class="val">Enviado a una base de llamadas · <a href="#" onclick="App.actualizarDesdeLupe();return false" style="color:var(--naranja)">actualizar resultado</a></div></div>`:''}
        <div class="grupo-titulo">Localización</div>
        <div class="filagrid">${campo('Departamento',f.depto)}${campo('Municipio',f.municipio)}</div>
        ${f.localidad||f.barrio?`<div class="filagrid">${campo('Localidad',f.localidad)}${campo('Barrio',f.barrio)}</div>`:''}
        <div class="grupo-titulo">Cliente</div>
        <div class="filagrid">${campo('NIT',f.nit)}${campo('Razón social',f.razon_social)}</div>
        <div class="filagrid">${campo('Celular',f.celular)}${campo('Teléfono',f.telefono)}</div>
        <div class="filagrid">${campo('Email',f.email)}${campo('Web',f.web)}</div>
        <div class="grupo-titulo">Qué envasa</div>
        <div class="filagrid">${campo('Producto',f.producto)}${campo('Categoría',f.categoria)}</div>
        <div class="filagrid">${campo('Envase',f.envase)}${campo('Tamaño',f.tamano)}</div>
        ${f.etapa==='cliente'?`<div class="grupo-titulo">Compras</div><div class="filagrid">${campo('Cliente desde',f.cliente_desde)}${campo('Última compra',f.ultima_compra)}</div>${campo('Total comprado',f.total_comprado?('$'+Number(f.total_comprado).toLocaleString('es-CO')):null)}`:''}
        ${f.notas?`<div class="grupo-titulo">Notas</div><div class="campo"><div class="val">${esc(f.notas)}</div></div>`:''}
      </div>
    </div>`;
    $('modalRoot').innerHTML=html;
  },
  cerrarFicha(){ $('modalRoot').innerHTML=''; },

  async cambiarEtapa(id,etapa){
    const f=this.datos.find(x=>x.id===id); if(!f) return;
    let motivo=null;
    if(etapa==='no_aplica'){ motivo=prompt('¿Por qué no aplica? (ej: ya tiene proveedor, cerró, no usa tarrina)')||''; if(motivo===null) return; }
    await fetch(SB+'/rest/v1/nc_mercado?id=eq.'+id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},
      body:JSON.stringify({etapa, etapa_motivo:motivo, etapa_canal:'mapamundi', etapa_fecha:new Date().toISOString()})});
    f.etapa=etapa; f.etapa_motivo=motivo;
    this.renderArbol(); this.renderCentral(); this.abrirFicha(id);
  },
};
App.init();
</script>
</body>
</html>
