<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3A6B">
<link rel="icon" href="raton-chico.png">
<title>Lupe Control · CallProspector</title>
<style>
:root{
  --azul:#1B3A6B; --azul2:#142C52;
  --naranja:#E8621A; --naranja2:#FF7A33;
  --bg:#0B1830; --card:#14294A; --card2:#1B3559; --line:#2A4676;
  --tx:#EAF1FB; --dim:#93AAC9; --faint:#6A83A6;
  --ok:#25C08A; --warn:#F0A73C; --bad:#F0604D; --azulc:#4A9BE8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);
  max-width:640px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

header{background:linear-gradient(160deg,var(--azul),var(--azul2));padding:12px 15px 14px;
  position:sticky;top:0;z-index:20;border-bottom:2px solid var(--naranja);
  padding-top:calc(12px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px}
.back{background:rgba(255,255,255,.12);color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;
  padding:6px 12px;border-radius:20px;white-space:nowrap;border:none;cursor:pointer;font-family:inherit}
.tit{font-size:15.5px;font-weight:800;letter-spacing:-.02em;min-width:0}
.tit small{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#9DB7DA;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.res2 div{background:rgba(0,0,0,.24);border-radius:11px;padding:9px 7px;text-align:center}
.res2 b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.res2 span{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#9DB7DA;font-weight:600}

main{padding:15px}
h2{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:18px 0 9px}
h2:first-child{margin-top:0}

/* ---- cajón (cliente) ---- */
.cj{background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:10px;overflow:hidden}
.cj>.cab{display:flex;align-items:center;gap:11px;padding:14px 15px;cursor:pointer}
.cj>.cab:active{filter:brightness(1.1)}
.cj>.cab .fl{font-size:12px;color:var(--faint);transition:transform .15s;flex:none;width:10px}
.cj.ab>.cab .fl{transform:rotate(90deg)}
.cj>.cab .nm{font-size:15.5px;font-weight:800;letter-spacing:-.01em;min-width:0}
.cj>.cab .nm small{display:block;font-size:11px;color:var(--faint);font-weight:500;margin-top:2px}
.cj>.cab .ct{margin-left:auto;text-align:right;flex:none}
.cj>.cab .ct b{display:block;font-size:17px;font-weight:800;color:var(--naranja2)}
.cj>.cab .ct span{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600}
.cj .bs{border-top:1px solid var(--line);background:rgba(0,0,0,.17)}

/* ---- base dentro del cajón ---- */
.bi{display:flex;align-items:center;gap:10px;padding:12px 15px 12px 32px;cursor:pointer;
  border-bottom:1px solid rgba(42,70,118,.55)}
.bi:last-child{border-bottom:none}
.bi:active{filter:brightness(1.15)}
.bi .bn{font-size:13.5px;font-weight:600;line-height:1.35;min-width:0}
.bi .bn small{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:2px}
.bi .bq{margin-left:auto;text-align:right;flex:none}
.bi .bq b{display:block;font-size:14px;font-weight:800}
.bi .bq span{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600}
.bi.muerta .bn,.bi.muerta .bq b{color:var(--faint)}

/* ---- ciudad ---- */
.cd{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden}
.cd>.cab{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer}
.cd>.cab:active{filter:brightness(1.1)}
.cd.ab{border-color:var(--naranja)}
.cd>.cab .fl{font-size:11px;color:var(--faint);transition:transform .15s;flex:none;width:10px}
.cd.ab>.cab .fl{transform:rotate(90deg)}
.cd .cn{font-size:14px;font-weight:700;min-width:0}
.cd .cn small{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
.cd .cq{margin-left:auto;text-align:right;flex:none}
.cd .cq b{display:block;font-size:15px;font-weight:800;color:var(--naranja2)}
.cd .cq span{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600}
.cd.tomada .cq b{color:var(--ok)}
.cd .quien{padding:0 14px 12px 35px;display:flex;flex-wrap:wrap;gap:5px}
.cd .quien span{font-size:11px;background:rgba(37,192,138,.15);border:1px solid rgba(37,192,138,.42);
  color:#7FE3BE;padding:3px 10px;border-radius:20px;font-weight:600}
.cd .pers{border-top:1px solid var(--line);background:rgba(0,0,0,.2);padding:11px 14px}

.ag{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--card2);
  border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.ag:last-child{margin-bottom:0}
.ag .an{flex:1;font-size:13.5px;font-weight:600;min-width:0}
.ag .an small{display:block;font-size:11px;color:var(--faint);font-weight:400}
.ag.on{border-color:rgba(37,192,138,.5)}
.ag.ocupada{opacity:.55}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
  color:var(--faint);flex:none;cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06281C}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px}
label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  font-weight:700;margin:12px 0 5px}
label:first-child{margin-top:0}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:11px;font-size:14.5px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--naranja)}
.busca{margin-bottom:10px}

.btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:14.5px;font-weight:800;
  cursor:pointer;font-family:inherit;background:var(--naranja);color:#fff;margin-top:12px}
.btn:active{filter:brightness(.88)}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:700;font-size:13.5px;padding:12px}

.vacio{text-align:center;color:var(--faint);font-size:13.5px;padding:34px 20px;line-height:1.65}
.nota{font-size:12px;color:var(--faint);line-height:1.55;padding:2px 2px 0}
.aviso{background:rgba(240,96,77,.12);border:1px solid rgba(240,96,77,.4);border-radius:12px;
  padding:13px 15px;font-size:13px;color:#FF9A8B;line-height:1.55;margin-bottom:12px}
.aviso b{color:#fff}
.pie{text-align:center;color:var(--faint);font-size:11px;padding:18px 4px 6px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-140%);top:calc(12px + env(safe-area-inset-top));
  background:var(--card2);border:1px solid var(--naranja);color:var(--tx);padding:11px 17px;border-radius:12px;
  font-size:13px;z-index:60;transition:transform .3s ease;max-width:88vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}.cj>.cab .fl,.cd>.cab .fl{transition:none}}
</style>
</head>
<body>

<header><div class="hrow">
  <button class="back" id="btnAtras" onclick="A.atras()">‹ Volver</button>
  <div class="tit" id="titulo">Lupe Control<small>Cajones, bases y quién llama qué</small></div>
</div>
<div id="cabExtra"></div>
</header>

<main id="main"><div class="vacio">Cargando…</div></main>
<div id="toast"></div>

<script>
const VER='2026-09-15 · 1';
const SB='https://fnayedgvamxktxfvywwl.supabase.co';
const K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};

const $=s=>document.getElementById(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(+n||0).toLocaleString('es-CO');
/* para meter un texto dentro de un onclick="...('aquí')" sin que lo parta una comilla */
const js=s=>esc(String(s==null?'':s)).replace(/\\/g,'\\\\').replace(/'/g,'\\u0027');

/* El servidor NUNCA devuelve mas de 1000 filas aunque se le pida mas, y lo hace
   en silencio. GETALL pide de a 1000 hasta agotar. */
async function GETALL(p){
  const base=String(p).replace(/[?&](limit|offset)=\d+/g,'');
  const sep=base.includes('?')?'&':'?';
  const out=[];
  for(let i=0,off=0;i<60;i++,off+=1000){
    let r; try{ r=await fetch(SB+'/rest/v1/'+base+sep+'limit=1000&offset='+off,{headers:H}); }catch(e){ break; }
    if(!r.ok) break;
    let b; try{ b=await r.json(); }catch(e){ break; }
    if(!Array.isArray(b)||!b.length) break;
    out.push(...b); if(b.length<1000) break;
  }
  return out;
}
async function GET(p){ try{ const r=await fetch(SB+'/rest/v1/'+p,{headers:H}); return r.ok?await r.json():null; }catch(e){ return null; } }
async function POST(t,b){ try{ const r=await fetch(SB+'/rest/v1/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(b)}); return r.ok?await r.json():null; }catch(e){ return null; } }
async function PATCH(t,b){ try{ const r=await fetch(SB+'/rest/v1/'+t,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(b)}); return r.ok; }catch(e){ return false; } }
async function DEL(t){ try{ const r=await fetch(SB+'/rest/v1/'+t,{method:'DELETE',headers:H}); return r.ok; }catch(e){ return false; } }
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

const A={
  cajones:[], mapa:[], agentes:[], asign:[],
  vista:'cajones',        // cajones | base | editar
  cjAbierto:'',           // qué cajón está desplegado
  base:null,              // base abierta
  ciudades:[], cdAbierta:'', filtro:'',
  ed:null,

  async init(){
    const [cj,mp,ag,as]=await Promise.all([
      GET('mkr_clientes?select=*&order=orden&limit=100'),
      GET('mkr_mapa_bases?select=*&order=cajon_orden,por_llamar.desc&limit=400'),
      GET('mkr_agentes?select=*&order=nombre&limit=300'),
      GETALL('mkr_asignaciones?select=*&limit=5000')
    ]);
    if(mp===null||cj===null){
      $('main').innerHTML=`<div class="aviso"><b>Faltan las vistas.</b><br>
        Esta pantalla necesita <b>mkr_clientes</b> y <b>mkr_mapa_bases</b> en Supabase.
        Todavía no se ha corrido el SQL.</div>`;
      return;
    }
    this.cajones=cj||[]; this.mapa=mp||[]; this.agentes=ag||[]; this.asign=as||[];
    this.pintar();
  },

  /* ---------- navegación ---------- */
  atras(){
    if(this.vista==='editar'){ this.vista='base'; this.ed=null; this.pintar(); return; }
    if(this.vista==='base'){ this.vista='cajones'; this.base=null; this.ciudades=[];
      this.cdAbierta=''; this.filtro=''; this.pintar(); window.scrollTo(0,0); return; }
    location.href='index.html';
  },
  cab(){
    const t=$('titulo'), b=$('btnAtras'), x=$('cabExtra');
    if(this.vista==='cajones'){
      t.innerHTML=`Lupe Control<small>Cajones, bases y quién llama qué</small>`;
      b.textContent='‹ Volver';
      const tot=this.mapa.reduce((s,m)=>s+(+m.por_llamar||0),0);
      x.innerHTML=`<div class="res2">
        <div><b class="mono">${num(tot)}</b><span>Por llamar</span></div>
        <div><b class="mono">${num(this.agentes.filter(a=>a.activo!==false).length)}</b><span>Personas</span></div></div>`;
      return;
    }
    const m=this.mapa.find(x=>x.base_id===(this.base||{}).base_id)||{};
    t.innerHTML=`${esc(m.base||'')}<small>${esc(m.cajon||'Sin cajón')}</small>`;
    b.textContent='‹ Cajones';
    if(this.vista==='editar'){ x.innerHTML=''; return; }
    const conCiudad=this.asign.filter(a=>a.base_id===m.base_id).length;
    x.innerHTML=`<div class="res2">
      <div><b class="mono">${num(m.por_llamar)}</b><span>Por llamar</span></div>
      <div><b class="mono">${num(conCiudad)}</b><span>Asignaciones</span></div></div>`;
  },

  pintar(){
    this.cab();
    if(this.vista==='editar') return this.vEditar();
    if(this.vista==='base')   return this.vBase();
    return this.vCajones();
  },

  /* ---------- 1. cajones ---------- */
  vCajones(){
    /* Se recorren los cajones en su orden y no las bases: así un cajón vacío
       también se ve, que es como se sabe que le falta cargarle el barrido. */
    const cajones=[...this.cajones];
    if(this.mapa.some(m=>!m.cajon_slug)) cajones.push({slug:'',nombre:'Sin cajón',orden:999});

    const html=cajones.map(c=>{
      const bs=this.mapa.filter(m=>(m.cajon_slug||'')===(c.slug||''));
      const tot=bs.reduce((s,m)=>s+(+m.por_llamar||0),0);
      const ab=this.cjAbierto===(c.slug||'');
      const lista=bs.map(m=>{
        const nAs=this.asign.filter(a=>a.base_id===m.base_id).length;
        const muerta=!m.por_llamar;
        return `<div class="bi ${muerta?'muerta':''}" onclick="A.abrirBase('${js(m.base_id)}')">
          <div class="bn">${esc(m.base)}${m.activa?'':' · <span style="color:var(--bad)">apagada</span>'}
            <small>${muerta?'⚠️ sin nadie a quién llamar'
                   :(nAs?nAs+(nAs===1?' asignación':' asignaciones'):'sin asignar')}</small></div>
          <div class="bq"><b class="mono">${num(m.por_llamar)}</b><span>por llamar</span></div>
        </div>`;
      }).join('')||'<div class="vacio" style="padding:20px">Este cajón no tiene bases.</div>';

      return `<div class="cj ${ab?'ab':''}">
        <div class="cab" onclick="A.toggleCajon('${js(c.slug||'')}')">
          <div class="fl">▶</div>
          <div class="nm">${esc(c.nombre)}<small>${bs.length} ${bs.length===1?'base':'bases'}</small></div>
          <div class="ct"><b class="mono">${num(tot)}</b><span>por llamar</span></div>
        </div>
        ${ab?`<div class="bs">${lista}</div>`:''}
      </div>`;
    }).join('');

    $('main').innerHTML=`<h2>Cajones</h2>${html}
      <div class="nota">Abre un cajón para ver sus bases. Al entrar a una base salen
        sus ciudades, y ahí es donde se le asigna la telemercaderista.</div>
      <div class="pie">Lupe Control · ${VER}</div>`;
  },
  toggleCajon(slug){ this.cjAbierto=(this.cjAbierto===slug)?'':slug; this.pintar(); },

  /* ---------- 2. base: sus ciudades ---------- */
  async abrirBase(id){
    const m=this.mapa.find(x=>x.base_id===id); if(!m)return;
    this.base=m; this.vista='base'; this.ciudades=[]; this.cdAbierta=''; this.filtro='';
    $('main').innerHTML='<div class="vacio">Contando las ciudades…</div>';
    this.cab(); window.scrollTo(0,0);
    const cs=await GETALL('mkr_ciudades_base?select=*&base_id=eq.'+encodeURIComponent(id)+'&order=por_llamar.desc');
    this.ciudades=Array.isArray(cs)?cs:[];
    this.pintar();
  },

  vBase(){
    const b=this.base;
    let cs=this.ciudades;
    const f=this.filtro.trim().toLowerCase();
    if(f) cs=cs.filter(c=>String(c.ciudad||'').toLowerCase().includes(f)
                       || String(c.departamento||'').toLowerCase().includes(f));

    /* Quien tenga la base entera (municipio nulo) manda sobre todas las ciudades:
       se muestra aparte para que no parezca que la base no tiene dueño. */
    const dueños=this.asign.filter(a=>a.base_id===b.base_id&&!a.municipio)
      .map(a=>(this.agentes.find(g=>g.id===a.agente_id)||{}).nombre).filter(Boolean);

    const filas=cs.map(c=>{
      const ab=this.cdAbierta===c.ciudad;
      const mun=c.ciudad==='(sin ciudad)'?'':c.ciudad;
      const asigCd=this.asign.filter(a=>a.base_id===b.base_id&&(a.municipio||'')===mun);
      const nom=asigCd.map(a=>(this.agentes.find(g=>g.id===a.agente_id)||{}).nombre).filter(Boolean);
      return `<div class="cd ${ab?'ab':''} ${nom.length?'tomada':''}">
        <div class="cab" onclick="A.toggleCiudad('${js(c.ciudad)}')">
          <div class="fl">▶</div>
          <div class="cn">${esc(c.ciudad)}<small>${esc(c.departamento||'—')}</small></div>
          <div class="cq"><b class="mono">${num(c.por_llamar)}</b><span>por llamar</span></div>
        </div>
        ${nom.length&&!ab?`<div class="quien">${nom.map(n=>`<span>${esc(n)}</span>`).join('')}</div>`:''}
        ${ab?`<div class="pers">${this.personas(mun)}</div>`:''}
      </div>`;
    }).join('')||'<div class="vacio">Ninguna ciudad coincide.</div>';

    $('main').innerHTML=`
      ${dueños.length?`<div class="card" style="border-color:rgba(37,192,138,.45)">
        <div style="font-size:13px;line-height:1.5">
          <b>${esc(dueños.join(', '))}</b> ${dueños.length===1?'tiene':'tienen'} la base
          <b>entera</b>, sin ciudad. Eso pisa el reparto por ciudad.</div>
        <button class="btn gh" onclick="A.toggleCiudad('__toda__')">Ver quién tiene la base entera</button>
      </div>`:''}
      ${this.cdAbierta==='__toda__'?`<div class="card">
        <h2 style="margin:0 0 9px">Toda la base, sin ciudad</h2>${this.personas('')}</div>`:''}

      <h2>Ciudades · de más a menos</h2>
      <input class="busca" placeholder="Buscar ciudad o departamento…"
        value="${esc(this.filtro)}" oninput="A.filtro=this.value;A.vBase()">
      ${filas}
      <button class="btn gh" onclick="A.editar()">Editar nombre y cajón de esta base</button>
      <div class="nota" style="margin-top:12px">Se arranca por una ciudad pequeña para probar,
        y cuando funciona se le abre la siguiente. Cada quien con su ciudad no se pisa con nadie.</div>
      <div class="pie">Lupe Control · ${VER}</div>`;
  },
  toggleCiudad(c){ this.cdAbierta=(this.cdAbierta===c)?'':c; this.pintar(); },

  /* ---------- 3. quién llama esa ciudad ---------- */
  personas(mun){
    const b=this.base;
    return this.agentes.map(a=>{
      const mia=this.asign.some(x=>x.base_id===b.base_id&&x.agente_id===a.id&&(x.municipio||'')===mun);
      /* Otras ciudades que ya tiene esta persona EN ESTA base: no lo impide,
         pero hay que verlo antes de cargarle una más. */
      const otras=this.asign.filter(x=>x.base_id===b.base_id&&x.agente_id===a.id&&(x.municipio||'')!==mun)
        .map(x=>x.municipio||'toda la base');
      return `<div class="ag ${mia?'on':''} ${a.activo===false?'ocupada':''}">
        <div class="chk ${mia?'on':''}" onclick="A.asignar('${js(a.id)}','${js(mun)}',${mia?'true':'false'})">${mia?'✓':''}</div>
        <div class="an">${esc(a.nombre)}<small>${esc(a.nivel||'—')}${a.celular?' · '+esc(a.celular):''}${
          a.activo===false?' · inactiva':''}${otras.length?' · ya tiene '+esc(otras.join(', ')):''}</small></div>
      </div>`;
    }).join('')||'<div class="vacio" style="padding:18px">No hay personas registradas.</div>';
  },

  async asignar(agenteId, mun, quitar){
    const b=this.base;
    const q='mkr_asignaciones?base_id=eq.'+encodeURIComponent(b.base_id)
           +'&agente_id=eq.'+encodeURIComponent(agenteId)
           +'&municipio='+(mun?('eq.'+encodeURIComponent(mun)):'is.null');
    if(quitar){
      if(!await DEL(q)){ toast('No se pudo quitar'); return; }
      this.asign=this.asign.filter(x=>!(x.base_id===b.base_id&&x.agente_id===agenteId&&(x.municipio||'')===mun));
      toast('Quitada de '+(mun||'la base'));
    }else{
      const r=await POST('mkr_asignaciones',[{base_id:b.base_id,agente_id:agenteId,municipio:mun||null}]);
      if(!r||!r.length){ toast('No se pudo asignar'); return; }
      this.asign.push(r[0]);
      toast('Asignada a '+(mun||'toda la base'));
    }
    this.pintar();
  },

  /* ---------- editar la base ---------- */
  editar(){ this.ed={...this.base}; this.vista='editar'; this.pintar(); window.scrollTo(0,0); },
  vEditar(){
    const f=this.ed;
    const ops=this.cajones.map(c=>`<option value="${esc(c.slug)}"${
      f.cajon_slug===c.slug?' selected':''}>${esc(c.nombre)}</option>`).join('');
    $('main').innerHTML=`
      <div class="card">
        <label>Nombre de la base</label>
        <input id="e_nom" value="${esc(f.base||'')}" oninput="A.ed.base=this.value">
        <label>Cajón · de quién es esta base</label>
        <select onchange="A.ed.cajon_slug=this.value">${ops}</select>
        <label>Descripción · lo que ve la telemercaderista</label>
        <input id="e_des" value="${esc(f.descripcion||'')}" oninput="A.ed.descripcion=this.value">
        <label>Estado</label>
        <select onchange="A.ed.activa=(this.value==='1')">
          <option value="1"${f.activa?' selected':''}>Encendida · se ve en Lupe</option>
          <option value="0"${f.activa?'':' selected'}>Apagada · no se ve</option>
        </select>
      </div>
      <button class="btn" onclick="A.guardar()">Guardar</button>
      <button class="btn gh" onclick="A.atras()">Cancelar</button>
      <div class="nota" style="margin-top:12px">Los cajones se crean desde Supabase,
        en la tabla <b>mkr_clientes</b>.</div>`;
  },
  async guardar(){
    const f=this.ed;
    if(!String(f.base||'').trim()){ toast('Ponle nombre a la base'); return; }
    const ok=await PATCH('mkr_bases?id=eq.'+encodeURIComponent(f.base_id),{
      nombre:String(f.base).trim(), cliente:f.cajon_slug||null,
      descripcion:f.descripcion||null, activa:f.activa!==false});
    if(!ok){ toast('No se pudo guardar'); return; }
    toast('Base guardada');
    const id=f.base_id;
    this.vista='cajones'; this.ed=null; this.base=null;
    await this.init();
    const m=this.mapa.find(x=>x.base_id===id);
    if(m){ this.cjAbierto=m.cajon_slug||''; this.abrirBase(id); }
  }
};
A.init();
</script>
</body>
</html>
