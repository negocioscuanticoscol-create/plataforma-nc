<style>
:root{
  --azul:#1B3A6B; --azul2:#142C52;
  --naranja:#E8621A; --naranja2:#FF7A33;
  --bg:#0B1830; --card:#14294A; --card2:#1B3559; --line:#2A4676;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- ENTRADA ---------- */
#gate{position:fixed;inset:0;background:radial-gradient(120% 85% at 50% 0%,#FFFFFF,#EDF2F9 62%,#DFE8F4);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:26px;overflow-y:auto}
/* el que centra de verdad es este: si no, las etiquetas se van en línea */
#gateBody{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;width:100%;max-width:330px;margin:auto}
#gate .lupe{width:100%;max-width:215px;height:auto;animation:entrar .55s cubic-bezier(.2,.75,.3,1) both}
#gate .lema{font-size:23px;font-weight:800;color:var(--azul);letter-spacing:-.025em;
  margin:0 0 4px;text-align:center;line-height:1.2}
#gate .lema b{color:var(--naranja)}
#gate .logo{width:100%;max-width:330px;height:auto;margin-bottom:7px;
  animation:entrar .55s cubic-bezier(.2,.75,.3,1) both}
@media(prefers-reduced-motion:reduce){#gate .logo{animation:none}}
#gate .slogan{font-size:12.5px;color:#5B7A9C;text-align:center;max-width:320px;
  margin-bottom:20px;line-height:1.5;font-weight:600}
@keyframes entrar{from{opacity:0;transform:translateX(-26px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#gate .lupe{animation:none}}
#gate label{display:block;align-self:flex-start;width:100%;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:#5B7A9C;margin-bottom:6px;font-weight:700}
#gate input{width:100%;max-width:330px;background:#fff;border:1.5px solid #C6D4E6;
  color:var(--azul);border-radius:13px;padding:15px;font-size:16.5px;text-align:center;font-weight:700}
#gate input::placeholder{color:#9FB2C9;font-weight:400}
#gate input:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(232,98,26,.16)}
#gate button{width:100%;max-width:330px;background:var(--naranja);color:#fff;border:none;border-radius:13px;
  padding:16px;font-size:16.5px;font-weight:800;margin-top:13px;cursor:pointer;
  box-shadow:0 6px 18px rgba(232,98,26,.3);font-family:inherit}
#gate button:active{background:#D05514;box-shadow:none}
#gate button.gh{background:transparent;border:1.5px solid #C6D4E6;color:var(--azul);
  box-shadow:none;margin-top:9px;font-size:15px}
#gate button.gh:active{background:#E4EBF4}
#gate .hint{color:#6F84A0;font-size:12px;margin-top:18px;text-align:center;line-height:1.55;max-width:330px}
#gate .link{margin-top:15px;font-size:12.5px;color:var(--naranja);font-weight:700;cursor:pointer}
#gate .err{color:#C0362C;font-size:12.5px;margin-top:10px;text-align:center;max-width:330px;font-weight:600;line-height:1.5}
#gate .buscando{color:#8FA4BE;font-size:12.5px;margin-top:11px;text-align:center;font-weight:600}
#gate .bien{font-size:13px;color:#5B7A9C;font-weight:600;letter-spacing:.03em}
#gate .ced1{font-size:52px;font-weight:800;color:var(--azul);letter-spacing:-.04em;line-height:1}
#gate .ced2{font-size:16px;font-weight:700;color:var(--naranja);letter-spacing:.02em;margin-bottom:20px}
#gate .marcas{display:flex;align-items:center;justify-content:center;gap:16px;
  margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid #D4DFEC;width:100%}
#gate .marcas img{height:34px;width:auto;object-fit:contain}
#gate .marcas .wm{font-size:19px;font-weight:800;color:var(--azul);letter-spacing:.06em}
#gate .marcas .sep{width:1px;height:26px;background:#C6D4E6;flex:none}
#gate select{width:100%;background:#fff;border:1.5px solid #C6D4E6;color:var(--azul);
  border-radius:13px;padding:14px;font-size:15.5px;font-weight:700;font-family:inherit}
#gate select:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(232,98,26,.16)}
#gate .hallado{margin-top:11px;background:#E6F4EC;border:1.5px solid #A8D8BF;border-radius:12px;

.bcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;

.bcard:active{filter:brightness(1.12)}
.bcard .n{font-size:16px;font-weight:800;letter-spacing:-.01em}
.bcard .d{font-size:12px;color:var(--dim);margin-top:3px}

/* ---------- CABECERA ---------- */
header{background:linear-gradient(160deg,var(--azul),var(--azul2));padding:12px 15px 14px;
  position:sticky;top:0;z-index:20;border-bottom:2px solid var(--naranja);

.hrow{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.brand{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand .p{color:var(--naranja2)}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.09em;

.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.7s infinite}

.yo{font-size:11.5px;color:#9DB7DA;background:rgba(255,255,255,.1);padding:3px 9px;border-radius:20px;cursor:pointer}
.plata{text-align:center}
.plata .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#9DB7DA;font-weight:600}
.plata .val{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:2px 0 3px;

@media(prefers-reduced-motion:reduce){.plata .val{transition:none}}
.pend{font-size:11px;color:var(--warn);margin-top:2px}
.baseTag{font-size:11px;color:#9DB7DA;margin-top:7px;background:rgba(0,0,0,.22);
  padding:4px 10px;border-radius:20px;display:inline-block;cursor:pointer}

/* ---------- TARJETA ---------- */
main{flex:1;padding:13px 15px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:19px 17px;text-align:center}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:11px}
.tg{font-size:10.5px;padding:3px 10px;border-radius:12px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.tg.ciu{background:rgba(74,155,232,.15);color:#8FC4F5;border-color:rgba(74,155,232,.4)}
.empw{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:5px;text-align:left}
.empw .rat{width:56px;height:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.emp{font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.02em;min-width:0}
@media(max-width:360px){.empw .rat{width:44px} .emp{font-size:19px}}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:2px}
.cont{color:var(--naranja2);font-size:13.5px;font-weight:600}

/* La extensión NO se pega al número: si va en el enlace, el celular marca 14

.ext b{font-size:16px;letter-spacing:.5px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
.res button{border:none;border-radius:11px;padding:14px 6px;font-size:13px;font-weight:700;cursor:pointer;
  color:#fff;font-family:inherit;line-height:1.25;display:flex;flex-direction:column;gap:3px;align-items:center}
.res button:active{filter:brightness(.88)}
.res button small{font-size:10.5px;opacity:.82;font-weight:600}
.res button[disabled]{opacity:.5}
.b-Interesado{background:var(--ok);color:#03291D}
.b-Competencia{background:#8B5CF6}
.b-Nointeresado{background:#475C7A}
.b-Nocontesta{background:#5A6E8C}
.b-Equivocado{background:#6B7A94}
.b-Nocontactar{background:#3D4E68}
/* Los tres nuevos NO tenian color: el .res button no trae fondo propio, asi que
   salian en blanco con letra blanca — invisibles. Cada resultado necesita su clase. */
.b-Datonegativo{background:#78716C}
.b-Habeasdata{background:#1E40AF}
.b-Yaescliente{background:#0F766E}
.b-InfoWhatsApp{background:#166534}
.pan .cat{width:100%;margin-top:9px;border:none;border-radius:11px;padding:13px;

.pan .cat:active{filter:brightness(.88)}
.nav{display:flex;gap:8px;margin-top:11px}
.nav button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:10px;
  padding:11px;font-size:13px;cursor:pointer;font-family:inherit}
/* El desplegable de "va en otra base" se ve igual que los botones de al lado a
   proposito: es una correccion de dato, no una accion destacada. */
.nav select{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:10px;
  padding:11px 9px;font-size:13px;cursor:pointer;font-family:inherit;appearance:none;text-align:center}
.nav select:disabled{opacity:.5}
.prog{text-align:center;font-size:11.5px;color:var(--faint);margin-top:10px}

/* panel del interesado */
#panel{margin-top:12px}
.pan{background:var(--card2);border:1.5px solid var(--naranja);border-radius:13px;padding:14px;text-align:left}
.pan h5{font-size:12.5px;color:var(--naranja2);margin-bottom:3px;font-weight:700}
.pan .ps{font-size:11.5px;color:var(--dim);margin-bottom:10px;line-height:1.45}
.pan .ps b{color:var(--tx)}
.pan input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);
  border-radius:9px;padding:11px;font-size:14px;font-family:inherit;margin-bottom:7px}

.pan .pb{display:flex;gap:7px;margin-top:4px}
.pan .pb button{flex:1;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit}
.pan .pb .g{background:var(--ok);color:#03291D}
.pan .pb .s{background:var(--card);color:var(--faint);border:1px solid var(--line)}

/* ---------- RANKING ---------- */
.rank{margin:18px 15px 0;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden}
.rank h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--naranja2);
  padding:14px 16px 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.rank h3 span{margin-left:auto;color:var(--faint);letter-spacing:0;text-transform:none;font-size:11px;font-weight:500}
.rw{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;
  padding:11px 16px;border-top:1px solid var(--line)}
.rw .pos{font-size:14px;font-weight:800;color:var(--faint);text-align:center}
.rw:nth-child(2) .pos{color:#F5C542}

.tarifas{margin:15px 15px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px}
.tarifas h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;font-weight:700}
.tarifas .t{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--dim)}
.tarifas .t b{color:var(--tx);font-weight:600}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-140%);top:calc(12px + env(safe-area-inset-top));
  background:var(--card2);border:1px solid var(--naranja);color:var(--tx);padding:11px 17px;border-radius:12px;
  font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .3s ease;
  max-width:88vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.mal{border-color:var(--bad)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
footer{padding:16px 15px calc(20px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:var(--faint);line-height:1.6}
.vacio{text-align:center;color:var(--faint);font-size:13.5px;padding:40px 18px;line-height:1.65}

<div id="toast"></div>

<script>
const SB='https://fnayedgvamxktxfvywwl.supabase.co';
const K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};

const $=s=>document.getElementById(s);
/* TODO lo que venga de la base pasa por aquí antes de pintarse */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const num=n=>(+n||0).toLocaleString('es-CO');
const soloNum=s=>String(s||'').replace(/\D/g,'');
const SINTILDE=new RegExp('[\\u0300-\\u036f]','g');
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(SINTILDE,'').replace(/\s+/g,' ');

/* guarda el último código de respuesta para poder decir QUÉ falló, no un "sin conexión" genérico */

/* El servidor NUNCA devuelve mas de 1000 filas aunque se le pida mas, y lo hace
   en silencio. GETALL pide de a 1000 hasta agotar, para que ninguna pantalla
   se quede corta cuando la tabla crece. */
async function GETALL(p){
  const base=String(p).replace(/[?&](limit|offset)=\d+/g,'');
  const sep=base.includes('?')?'&':'?';
  const out=[];
  for(let i=0,off=0;i<60;i++,off+=1000){
    let r; try{ r=await fetch(SB+'/rest/v1/'+base+sep+'limit=1000&offset='+off,{headers:H}); }catch(e){ break; }
    if(!r.ok) break;
    let b; try{ b=await r.json(); }catch(e){ break; }
    if(!Array.isArray(b)||!b.length) break;
    out.push(...b);
    if(b.length<1000) break;
  }
  return out;
}
async function GET(p){
  try{ const r=await fetch(SB+'/rest/v1/'+p,{headers:H});
    GET.estado=r.status;
    return r.ok?await r.json():null;
  }catch(e){ GET.estado=0; return null; }
}
function porQueFallo(){
  if(GET.estado===404||GET.estado===400) return 'La base de datos todavía no está creada. Avísale al administrador.';
  if(GET.estado===0) return 'Sin señal. Revisa tu internet e intenta de nuevo.';
  return 'No se pudo conectar (error '+GET.estado+'). Intenta de nuevo.';
}

let tt; function toast(m,mal){ const t=$('toast'); t.textContent=m;
  t.classList.toggle('mal',!!mal); t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),mal?3400:2200); }

const NIVELES=['principiante','intermedio','avanzado','asesor'];
const SEG=['cliente','marca','canal','sector','subsector','departamento','ciudad','barrio','ced'];
/* Los botones son los MISMOS en toda base, a proposito: si cambiaran por base,
   dos agentes marcarian cosas distintas y el informe no se podria comparar.
   Antes salian de BASE.botones — una columna que no existe en mkr_bases, asi que
   aqui no aparecia NINGUN boton. */
const RESULTADOS=['Interesado','Competencia','No interesado','No contesta','Equivocado','No contactar','Dato negativo','Habeas data','Ya es cliente','Info WhatsApp'];
const TARIFA_DEF={'Interesado':2500,'Competencia':600,'No interesado':350,'No contesta':150,'Equivocado':150,'No contactar':250,'Dato negativo':150,'Habeas data':150,'Ya es cliente':50,'Info WhatsApp':350};
const ICONO={'Interesado':'🔥','Competencia':'🏭','No interesado':'❌','No contesta':'☎️','Equivocado':'⛔','No contactar':'🚫','Dato negativo':'🗑️','Habeas data':'🛡️','Ya es cliente':'🤝','Info WhatsApp':'💬'};

let YO=null, BASE=null, misBases=[], leads=[], idx=0, miPlata=0, pendientes=0, misLlamadas=0;
let PASO='inicio', ERR='', HALLADO=null, buscando=null;

/* ==================== ENTRADA ==================== */
function gate(p,e){ PASO=p; ERR=e||''; pintarGate(); }

function pintarGate(){
  if(PASO==='inicio'){
    HALLADO=null;
    $('gateBody').innerHTML=`
      <img class="lupe" src="raton.png" alt="Lupe">
      <div class="lema">Lupe <b>marca y gana</b></div>
      <div class="slogan">El pozo de bases de la red. Ninguna base es de nadie hasta que la marcas.</div>
      <label for="gCed">Tu centro</label>
      <select id="gCed"><option value="">Cargando centros…</option></select>

/* los centros salen de la base, no escritos a mano */
async function cargarCeds(){
  const s=$('gCed'); if(!s)return;
  const cs=await GET('mkr_ceds?select=nombre,cliente,ciudad&activo=is.true&order=nombre&limit=200');
  if(!Array.isArray(cs)||!cs.length){
    s.innerHTML='<option value="todos">Todos los centros</option>'; return; }
  s.innerHTML='<option value="todos">Todos los centros</option>'+
    cs.map(c=>`<option value="${esc(c.nombre)}">${esc(c.nombre)}${c.ciudad?' · '+esc(c.ciudad):''}</option>`).join('');
  const ult=localStorage.getItem('cp_ced'); if(ult) s.value=ult;
}

function errGate(m){ const h=$('gHallado'); if(h) h.innerHTML=`<div class="err">${esc(m)}</div>`; }

async function hacerEntrar(){
  const u=(($('gU')||{}).value||'').trim(), p=(($('gP')||{}).value||'').trim();
  const ced=($('gCed')||{}).value||'todos';
  if(!u){ errGate('Escribe tu usuario'); return; }
  if(!p){ errGate('Escribe tu clave'); return; }

  /* La tabla usa 'usuario' + 'clave'. Antes se pedian 'celular' y 'password',
     que no existen ahi: la consulta fallaba entera y no entraba nadie. */
  const ags=await GET('mkr_agentes?select=id,nombre,usuario,clave,nivel,ced,activo&limit=500');
  if(!Array.isArray(ags)){ errGate(porQueFallo()); return; }

  const a=ags.find(x=>norm(x.usuario)===norm(u));
  if(!a){ errGate('Ese usuario no está inscrito. Toca abajo para inscribirte.'); return; }
  if(String(a.clave||'')!==p){ errGate('La clave no es correcta.'); return; }
  if(a.activo===false){ errGate('Hola '+a.nombre+'. Todavía no estás habilitado: falta la capacitación y la prueba.'); return; }
  if(ced!=='todos' && a.ced && a.ced!=='todos' && a.ced!==ced){
    errGate('No perteneces a ese centro. El tuyo es '+a.ced+'.'); return; }

  localStorage.setItem('cp_ced',ced);
  YO=a; localStorage.setItem('cp_yo',JSON.stringify({id:a.id,slug:a.usuario}));
  await entrarApp();
}

async function hacerInscribir(){
  const n=($('iN')||{}).value||'', c=soloNum(($('iC')||{}).value||''), q=soloNum(($('iQ')||{}).value||'');
  if(norm(n).length<3){ gate('inscribir','Escribe tu nombre completo'); return; }
  if(c.length<7){ gate('inscribir','Falta tu celular'); return; }
  try{
    const r=await fetch(SB+'/rest/v1/mkr_agentes',{method:'POST',headers:{...H,Prefer:'return=minimal'},
      /* usuario = el nombre normalizado · clave = el celular, como dice la pantalla.
         Queda activo:false hasta que pase la capacitacion y la prueba. */
      body:JSON.stringify({usuario:norm(n),clave:c,nombre:n.trim(),
        nivel:'principiante',ced:'todos',activo:false})});
    if(!r.ok){ const t=await r.text();
      gate('inscribir',
        /duplicate|unique/i.test(t) ? 'Ya hay alguien inscrito con ese nombre.'
        : (r.status===404||r.status===400) ? 'La base de datos todavía no está creada. Avísale al administrador.'
        : 'No se pudo enviar (error '+r.status+'). Intenta de nuevo.');
      return; }
  }catch(e){ gate('inscribir','Sin señal. Intenta de nuevo.'); return; }
  gate('espera');
}

function salir(){ if(!confirm('¿Salir de tu cuenta?'))return;
  localStorage.removeItem('cp_yo'); location.reload(); }

/* ==================== ESCOGER BASE ==================== */
async function entrarApp(){
  $('gate').style.display='none';
  $('bases').style.display='block';
  $('bases').innerHTML='<div class="vacio">Buscando tus bases…</div>';

  const [bases,asign]=await Promise.all([
    GET('mkr_bases?select=*&activa=eq.true&order=nombre&limit=200'),
    GET('mkr_asignaciones?select=base_id,agente_id&agente_id=eq.'+YO.id+'&limit=500')
  ]);
  if(!Array.isArray(bases)){ $('bases').innerHTML='<div class="vacio">'+esc(porQueFallo())+'</div>'; return; }

  const mias=new Set((asign||[]).map(a=>a.base_id));
  const miNivel=NIVELES.indexOf(YO.nivel||'principiante');
  const miCed=YO.ced||'todos';
  misBases=bases.filter(b=>{
    /* el CED manda: si a la persona le asignaron un centro, solo ve las bases
       de ese centro. Las bases abiertas a 'todos' las ve cualquiera. */
    const bCed=b.ced||'todos';
    if(miCed!=='todos' && bCed!=='todos' && bCed!==miCed) return false;
    // después: si te la asignaron, es tuya. Si nadie asignó nada, se abre por nivel.
    if(mias.size) return mias.has(b.id);
    const req=(!b.nivel||b.nivel==='todos')?-1:NIVELES.indexOf(b.nivel);
    return miNivel>=req;
  });

  if(!misBases.length){
    $('bases').innerHTML=`<h4>Hola, ${esc(YO.nombre)}</h4>
      <div class="s">Todavía no tienes ninguna base asignada.</div>
      <div class="vacio">El supervisor te tiene que asignar una desde la<br>hoja de configuración de bases.</div>`;
    return;
  }
  if(misBases.length===1){ abrirBase(misBases[0]); return; }

  $('bases').innerHTML=`<h4>Hola, ${esc(YO.nombre)}</h4>
    <div class="s">Escoge con cuál base vas a trabajar hoy.</div>
    ${misBases.map((b,i)=>`<div class="bcard" onclick="abrirBase(misBases[${i}])">
      <div class="n">${esc(b.nombre)}</div>
      <div class="d">${esc(b.descripcion||'')}</div>
      <div class="q"><span id="cnt_${esc(b.id)}">contando…</span><b>Entrar ›</b></div>
    </div>`).join('')}`;
  /* Cuantos trae cada una. Sin esto el paso de escoger base es a ciegas: se
     escoge un nombre y no hay como saber si abrio la correcta. */
  misBases.forEach(async b=>{
    try{
      const r=await fetch(SB+'/rest/v1/mkr_leads?select=id&aplica=is.true&base_id=eq.'+b.id,
        {headers:{...H,Prefer:'count=exact',Range:'0-0'}});
      const c=(r.headers.get('content-range')||'').split('/').pop();
      const e=$('cnt_'+b.id); if(e) e.textContent=(+c||0).toLocaleString('es-CO')+' por llamar';
    }catch(err){ const e=$('cnt_'+b.id); if(e) e.textContent=''; }
  });
}
function volverBases(){ if(misBases.length>1){ $('bases').style.display='block'; window.scrollTo(0,0); } }

async function abrirBase(b){
  BASE=b;
  $('bases').innerHTML='<div class="vacio">Cargando prospectos…</div>';

  // el filtro de la base, traducido a la consulta
  /* La vista mkr_leads ya deja por fuera a los que no tienen número marcable:
     el que no se puede llamar no aparece en el marcador. */
  /* base_id PRIMERO. Sin esto la consulta no filtraba NADA: los campos de SEG
     (cliente, sector, ciudad…) no existen como columnas en mkr_bases —solo `ced`,
     y en todas dice 'todos'— asi que cualquier base cargaba los prospectos de
     TODAS. Se abria "Lacteos" y salia una ferreteria del Tolima. */
  let q='mkr_leads?select=id,nombre,contacto,cel,extension,tipo_tel,ciudad,departamento,barrio,sector,direccion&aplica=is.true'
        +'&base_id=eq.'+encodeURIComponent(b.id);
  SEG.forEach(k=>{ const v=b[k]; if(v&&v!=='todos') q+='&'+k+'=eq.'+encodeURIComponent(v); });
  /* Por prioridad: los mejores primero. Sin orden, PostgREST los devuelve como
     le quede comodo y el mejor prospecto podia quedar en la fila 900. */
  q+='&order=prioridad.asc,nombre.asc&limit=20000';

  const [ls,ya]=await Promise.all([
    GET(q),
    GETALL('mkr_llamadas?select=lead_id&base_id=eq.'+b.id+'&limit=20000')
  ]);
  if(!Array.isArray(ls)){ $('bases').innerHTML='<div class="vacio">No se pudieron cargar los prospectos.</div>'; return; }

  // los ya marcados NO vuelven a salir, aunque se recargue la página
  const hechos=new Set((ya||[]).map(x=>x.lead_id).filter(Boolean));
  leads=ls.filter(l=>l.cel && !hechos.has(l.id));
  idx=0;

  $('bases').style.display='none';
  ['hd','main','rank','tarifas','ft'].forEach(id=>$(id).style.display='');
  $('yo').textContent=YO.nombre;
  $('baseTag').textContent='📁 '+b.nombre+' · '+leads.length.toLocaleString('es-CO')+(misBases.length>1?' · cambiar':'');
  pintarTarifas();
  render();
  sincronizar(); setInterval(sincronizar,4000);
}

function pintarTarifas(){
  const t=Object.assign({},TARIFA_DEF,BASE.tarifas||{});
  $('tarBody').innerHTML=RESULTADOS.map(k=>
    `<div class="t"><span>${ICONO[k]||''} ${esc(k)}</span><b>${cop(t[k])}</b></div>`).join('');
}

/* ==================== MARCAR ==================== */
function render(){
  if(!leads.length){
    $('main').innerHTML=`<div class="card"><div class="emp">No quedan prospectos</div>
      <div class="sub" style="margin-top:8px">Ya trabajaste toda esta base.</div>
      ${misBases.length>1?'<div class="nav"><button onclick="volverBases()">Escoger otra base</button></div>':''}</div>`;
    return;
  }
  if(idx>=leads.length) idx=0;
  if(idx<0) idx=leads.length-1;
  const l=leads[idx], cel=soloNum(l.cel);
  const t=Object.assign({},TARIFA_DEF,BASE.tarifas||{});
  const botones=RESULTADOS.map(k=>
    `<button class="b-${k.replace(/\s/g,'')}" onclick="marcar('${esc(k).replace(/'/g,'')}')">
      ${ICONO[k]||''} ${esc(k)}<small>${cop(t[k])}</small></button>`).join('');

  $('main').innerHTML=`<div class="card">
    <div class="tags">
      ${l.ciudad&&l.ciudad!=='todos'?`<span class="tg ciu">${esc(l.ciudad)}</span>`:''}
      ${l.sector&&l.sector!=='todos'?`<span class="tg">${esc(l.sector)}</span>`:''}
    </div>
    <div class="empw"><img class="rat" src="raton-chico.png" alt=""><div class="emp">${esc(l.nombre||'Sin nombre')}</div></div>
    ${l.departamento&&l.departamento!=='todos'?`<div class="sub">${esc(l.departamento)}</div>`:''}
    ${l.contacto?`<div class="cont">${esc(l.contacto)}</div>`:''}
    <div class="num mono">${esc(cel.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3'))}</div>
    <a class="call" href="tel:+57${esc(cel)}">📞 LLAMAR</a>
    ${l.extension?`<div class="ext">Al contestar, marca la extensión <b>${esc(l.extension)}</b></div>`:''}
    <div class="res">${botones}</div>
    <div id="panel"></div>
    <!-- Volver al anterior: si uno se pasa de largo o quiere retomar al que
         acaba de dejar, sin tener que recorrer toda la lista otra vez. -->
    <div class="nav"><button onclick="mover(-1)">⏮ Anterior</button><button onclick="mover(1)">Saltar sin marcar ⏭</button></div>
    <!-- Corregir el rubro NO es un resultado de llamada: no paga ni cuenta como
         marcacion, y por eso NO va en el teclado de arriba (ese tiene que seguir
         igual en toda base). Sirve para el caso de "aparece en Distribuidores
         pero en realidad es una empresa que consume dotacion". -->
    ${misBases.length>1?`<div class="nav"><select id="destBase" onchange="moverDeBase(this.value)">
      <option value="">🏢 Está en la base equivocada…</option>
      ${misBases.filter(b=>b.id!==BASE.id).map(b=>`<option value="${esc(b.id)}">Pasar a ${esc(b.nombre)}</option>`).join('')}
    </select></div>`:''}
    <div class="prog">${num(idx+1)} de ${num(leads.length)} por llamar</div>
  </div>`;
}
function mover(d){ idx+=d; render(); window.scrollTo(0,0); }

/* Pasa el prospecto a otra base. Escribe en mkr_empresas y NO en mkr_leads,
   porque mkr_leads es una vista y no se puede actualizar.
   Lee las notas antes de escribir: si se sobreescriben, se pierde de que rubro
   venia (DOTACION, Metalmecanica...) y ya no habria como devolverlo. */
async function moverDeBase(destino){
  const sel=$('destBase');
  if(!destino) return;
  const l=leads[idx], dest=misBases.find(b=>b.id===destino);
  if(!l||!dest){ if(sel) sel.value=''; return; }
  if(sel) sel.disabled=true;
  try{
    let antes='';
    const p=await fetch(SB+'/rest/v1/mkr_empresas?select=notas&id=eq.'+encodeURIComponent(l.id),{headers:H});
    if(p.ok) antes=((await p.json())[0]||{}).notas||'';
    const sello='Movida desde "'+BASE.nombre+'" por '+YO.nombre;
    const r=await fetch(SB+'/rest/v1/mkr_empresas?id=eq.'+encodeURIComponent(l.id),
      {method:'PATCH',headers:{...H,'Content-Type':'application/json',Prefer:'return=minimal'},
       body:JSON.stringify({base_id:destino, notas:(antes?antes+' · ':'')+sello})});
    if(!r.ok) throw new Error(r.status);
    leads.splice(idx,1);                      // se va de esta lista, no se vuelve a ver
    toast('🏢 Pasó a '+dest.nombre);
    render(); window.scrollTo(0,0);
  }catch(e){
    if(sel){ sel.disabled=false; sel.value=''; }
    toast('⚠️ No se pudo mover. Revisa la señal.',true);
  }
}

async function marcar(resultado){
  const l=leads[idx]; if(!l||!BASE) return;
  const tarifa=+Object.assign({},TARIFA_DEF,BASE.tarifas||{})[resultado]||0;
  const esInteresado = resultado==='Interesado';

  // El interesado NO paga hasta que tenga contacto. Lo demás paga de una.
  const body={sala:BASE.cliente||'general', agente:YO.nombre, base_id:BASE.id, lead_id:l.id,
    lead_fila:String(l.id), lead_nombre:l.nombre||null, lead_ciudad:l.ciudad||null,
    resultado, valor: esInteresado?0:tarifa, datos:false,
    validado: !esInteresado, estado_venta:'nuevo'};

  // GUARDA PRIMERO. Si falla, no se toca el contador ni se pasa de prospecto.
  let fila=null;
  try{
    const r=await fetch(SB+'/rest/v1/mkr_llamadas',{method:'POST',
      headers:{...H,Prefer:'return=representation'},body:JSON.stringify(body)});
    if(r.ok) fila=(await r.json())[0];
  }catch(e){ fila=null; }

  if(!fila){
    toast('⚠️ No se guardó. Revisa la señal y vuelve a marcar.',true);
    return;                                  // el prospecto se queda ahí
  }

  /* Habeas data: la persona ejercio un derecho. No basta con quitarla de esta
     base — se bloquea el telefono y la vista mkr_leads deja de mostrarlo en
     cualquier base. Se hace DESPUES de guardar la llamada, para no perder el
     registro si esto falla. */
  if(resultado==='Habeas data'){
    try{
      await fetch(SB+'/rest/v1/mkr_no_llamar?on_conflict=telefono',{method:'POST',
        headers:{...H,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({telefono:soloNum(l.cel), motivo:'habeas data',
          nombre:l.nombre||null, base_id:BASE.id, agente:YO.nombre})});
      toast('🛡️ Queda bloqueado en todas las bases');
    }catch(e){ toast('⚠️ Se guardó la llamada, pero no el bloqueo. Avisa.',true); }
  }

  if(esInteresado){ abrirPanel(fila,l,tarifa); return; }
  miPlata+=tarifa; misLlamadas++; pintarPlata(true);
  leads.splice(idx,1); render(); window.scrollTo(0,0);
}

/* ---------- panel del interesado: aquí SÍ se guarda el contacto ---------- */
function abrirPanel(fila,l,tarifa){
  pendientes++; pintarPlata(false);
  const c=$('panel'); if(!c) return;
  c.innerHTML=`<div class="pan">
    <h5>📋 Datos del interesado</h5>
    <div class="ps">Sin contacto no se puede vender, y por eso <b>este resultado todavía no paga</b>.
      Guarda los datos y se te abonan ${cop(tarifa)}.</div>
    <input id="pC" placeholder="Nombre de quien contestó" value="${esc(l.contacto||'')}">
    <input id="pW" inputmode="tel" placeholder="WhatsApp de compras">
    <input id="pM" inputmode="email" placeholder="Correo">
    <div class="pb">
      <button class="g" onclick="guardarPanel('${fila.id}',${tarifa})">Guardar y cobrar</button>
      <button class="s" onclick="cerrarPanel()">No los dio</button>
    </div>
    <!-- Guarda igual que arriba, pero ademas deja anotado que ya se le mando el
         catalogo. Asi el seguimiento sabe que a este ya se le enviO material y
         no se le vuelve a mandar lo mismo. -->
    <button class="cat" onclick="guardarPanel('${fila.id}',${tarifa},true)">📄 Catálogo enviado
      <small style="display:block;font-weight:500;opacity:.8;font-size:11px">se guarda al ${esc(soloNum(l.cel))} y pasa al siguiente</small></button>
    </div>`;
  setTimeout(()=>{ const w=$('pW'); if(w)w.focus(); },60);
}

async function guardarPanel(id,tarifa,catalogo){
  const c=($('pC')||{}).value||'', m=($('pM')||{}).value||'';
  let w=($('pW')||{}).value||'';
  /* Si mando el catalogo y no escribio otro WhatsApp, es al numero que tiene en
     pantalla: se lo acaba de mandar a ese. Pedirselo de nuevo es hacerlo teclear
     lo que ya esta ahi. */
  if(catalogo && !w.trim() && !m.trim()){
    const l=leads[idx]; if(l && l.cel) w=soloNum(l.cel);
  }
  if(!w.trim() && !m.trim()){ toast('Falta el WhatsApp o el correo',true); return; }
  try{
    const r=await fetch(SB+'/rest/v1/mkr_llamadas?id=eq.'+id,{method:'PATCH',
      headers:{...H,Prefer:'return=minimal'},
      body:JSON.stringify({contacto:c.trim()||null, whatsapp:soloNum(w)||null, correo:m.trim()||null,
        datos:true, validado:true, valor:tarifa, actualizado:new Date().toISOString(),
        estado_venta: catalogo?'catalogo_enviado':'nuevo'})});
    if(!r.ok){ toast('No se pudo guardar. Intenta otra vez.',true); return; }
  }catch(e){ toast('Sin señal. Intenta otra vez.',true); return; }
  pendientes=Math.max(0,pendientes-1);
  miPlata+=tarifa; pintarPlata(true);
  toast((catalogo?'📄 Catálogo enviado y guardado · siguiente · +':'✅ Contacto guardado · siguiente · +')+cop(tarifa));
  cerrarPanel();
}
function cerrarPanel(){
  const c=$('panel'); if(c) c.innerHTML='';
  leads.splice(idx,1); render(); window.scrollTo(0,0);
}

function pintarPlata(bump){
  /* El numero de marcaciones al lado de la plata: sin el, uno no sabe si el
     dia rindio poco porque llamo poco o porque los resultados pagaron poco. */
  const e=$('plata'); e.textContent=cop(miPlata)+(misLlamadas?'  ('+num(misLlamadas)+')':'');
  if(bump){ e.classList.add('bump'); setTimeout(()=>e.classList.remove('bump'),190); }
  $('pend').textContent = pendientes ? ('⏳ '+pendientes+' interesado(s) sin datos — no pagan todavía') : '';
}

/* ==================== TABLERO REAL ==================== */
async function sincronizar(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const filas=await GETALL('mkr_llamadas?select=agente,valor,validado,creado_en'+
    '&creado_en=gte.'+hoy.toISOString()+'&order=creado_en.desc&limit=5000');
  if(!Array.isArray(filas)){ $('live').classList.add('off'); $('liveTx').textContent='sin señal'; return; }
  $('live').classList.remove('off'); $('liveTx').textContent='en vivo';

  const real={};
  filas.forEach(f=>{
    const a=real[f.agente]=real[f.agente]||{agente:f.agente,llamadas:0,plata:0};
    a.llamadas++; if(f.validado) a.plata+=(+f.valor||0);
  });
  if(real[YO.nombre]){ miPlata=real[YO.nombre].plata; misLlamadas=real[YO.nombre].llamadas; }
  pintarPlata(false);

  const todos=Object.values(real).sort((a,b)=>b.plata-a.plata);
  $('rkBody').innerHTML=todos.map((a,i)=>`<div class="rw ${a.agente===YO.nombre?'yo':''}">
      <div class="pos">${i+1}</div>
      <div class="nm">${esc(a.agente)}<small>${a.agente===YO.nombre?'tú':'en línea hoy'}</small></div>
      <div class="ll">${num(a.llamadas)} ll.</div>
      <div class="pl mono">${cop(a.plata)}</div>
    </div>`).join('')||'<div class="vacio" style="padding:22px">Nadie ha marcado hoy.</div>';
  $('rkInfo').textContent=todos.length+(todos.length===1?' persona hoy':' personas hoy');
  $('rkTot').innerHTML='Solo cuenta lo validado · total del día <b style="color:var(--dim)">'+
    cop(todos.reduce((s,a)=>s+a.plata,0))+'</b>';
}

/* ==================== ARRANQUE ==================== */
(async()=>{
  const g=localStorage.getItem('cp_yo');
  if(g){
    try{
      const {id}=JSON.parse(g);
      const ags=await GET('mkr_agentes?select=id,nombre,usuario,clave,nivel,ced,activo&id=eq.'+encodeURIComponent(id)+'&limit=1');
      if(Array.isArray(ags)&&ags[0]&&ags[0].activo!==false){ YO=ags[0]; await entrarApp(); return; }
    }catch(e){}
    localStorage.removeItem('cp_yo');
  }
  pintarGate();
})();
</script>
