  pendientes++; pintarPlata(false);
  const c=$('panel'); if(!c) return;
  c.innerHTML=`<div class="pan">
    <h5>📋 Datos del interesado</h5>
    <div class="ps">Sin contacto no se puede vender, y por eso <b>este resultado todavía no paga</b>.
      Guarda los datos y se te abonan ${cop(tarifa)}.</div>
    <input id="pC" placeholder="Nombre de quien contestó" value="${esc(l.contacto||'')}">
    <!-- El WhatsApp viene puesto con el numero que se acaba de marcar: es al que
         se llamo, y hacerla teclear lo que ya esta en pantalla cuesta tiempo que
         en la llamada no hay. Si dan otro, va en la casilla de abajo. -->
    <input id="pW" inputmode="tel" placeholder="WhatsApp" value="${esc(soloNum(l.cel))}">
    <input id="pW2" inputmode="tel" placeholder="Otro celular (si dan uno distinto)">
    <input id="pM" inputmode="email" placeholder="Correo">
    <!-- UN solo boton. Antes eran tres —Enviar info, Pendiente y Catalogo
         enviado— y en mitad de una llamada hay que decidir cual, sin que la
         diferencia entre ellos se vea en pantalla. Aqui solo se guarda lo que
         dieron; mandar la informacion es el paso siguiente y lo hace quien
         corresponda desde la lista de Interesados. -->
    <button class="cat" onclick="guardarPanel('${fila.id}',${tarifa})">💾 Guardar
      <small style="display:block;font-weight:500;opacity:.85;font-size:11px">se abonan ${cop(tarifa)} y pasa al siguiente</small></button>
    <!-- Salida para cuando no dieron nada: sin esto la tarjeta queda trabada y
         no se puede seguir llamando. -->
    <button class="s" style="width:100%;margin-top:7px;background:transparent;border:1px solid var(--line);
      color:var(--dim);border-radius:10px;padding:10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit"
      onclick="cerrarPanel()">No dieron datos · seguir</button>
    </div>`;
  /* El panel sale DEBAJO de los botones: si la pantalla no baja sola, parece
     que el boton no hizo nada. */
  setTimeout(()=>{ c.scrollIntoView({behavior:'smooth',block:'center'});
                   const w=$('pW'); if(w)w.focus(); },60);
  toast('👇 Llena los datos abajo para pasar al siguiente');
}

async function guardarPanel(id,tarifa,catalogo){
  const c=($('pC')||{}).value||'', m=($('pM')||{}).value||'';
  const w2=($('pW2')||{}).value||'';
  let w=($('pW')||{}).value||'';
  /* Si mando el catalogo y no escribio otro WhatsApp, es al numero que tiene en
     pantalla: se lo acaba de mandar a ese. Pedirselo de nuevo es hacerlo teclear
     lo que ya esta ahi. */
  if(catalogo && !w.trim() && !m.trim()){
    const l=leads[idx]; if(l && l.cel) w=soloNum(l.cel);
  }
  if(!w.trim() && !m.trim()){ toast('Falta el WhatsApp o el correo',true); return; }
  try{
    const r=await fetch(SB+'/rest/v1/mkr_llamadas?id=eq.'+id,{method:'PATCH',
      headers:{...H,Prefer:'return=minimal'},
      body:JSON.stringify({contacto:c.trim()||null, whatsapp:soloNum(w)||null,
        whatsapp2:soloNum(w2)||null, correo:m.trim()||null,
        datos:true, validado:true, valor:tarifa, actualizado:new Date().toISOString(),
        estado_venta: catalogo?'catalogo_enviado':'nuevo'})});
    if(!r.ok){ toast('No se pudo guardar. Intenta otra vez.',true); return; }
  }catch(e){ toast('Sin señal. Intenta otra vez.',true); return; }
  pendientes=Math.max(0,pendientes-1);
  miPlata+=tarifa; pintarPlata(true);
  toast((catalogo?'📄 Catálogo enviado y guardado · siguiente · +':'✅ Contacto guardado · siguiente · +')+cop(tarifa));
  cerrarPanel();
}
function cerrarPanel(){
  const c=$('panel'); if(c) c.innerHTML='';
  sacarActual(); render(); window.scrollTo(0,0);
}

function pintarPlata(bump){
  /* El numero de marcaciones al lado de la plata: sin el, uno no sabe si el
     dia rindio poco porque llamo poco o porque los resultados pagaron poco. */
  const e=$('plata'); e.textContent=cop(miPlata)+(misLlamadas?'  ('+num(misLlamadas)+')':'');
  if(bump){ e.classList.add('bump'); setTimeout(()=>e.classList.remove('bump'),190); }
  $('pend').textContent = pendientes ? ('⏳ '+pendientes+' interesado(s) sin datos — no pagan todavía') : '';
}

/* ==================== TABLERO REAL ==================== */
/* Las ciudades que me asignaron se leian UNA sola vez, al entrar. Si el
   supervisor le abria una ciudad desde Lupe Control, la telemercaderista
   seguia con la lista vieja hasta cerrar y volver a entrar — y como nadie le
   avisaba, lo que veia era "no quedan prospectos" sin razon aparente. */
async function releerMisCiudades(){
  if(!YO||!YO.id||!BASE) return;
  const as=await GET('mkr_asignaciones?select=base_id,agente_id,municipio&agente_id=eq.'
    +encodeURIComponent(YO.id)+'&limit=2000');
  if(!Array.isArray(as)) return;
  const nuevo={};
  as.filter(a=>a.municipio).forEach(a=>{
    (nuevo[a.base_id]=nuevo[a.base_id]||[]).push(String(a.municipio).trim());
  });
  MIS_BASES=new Set(as.map(a=>a.base_id));
  const antes=JSON.stringify((MIS_CIUDADES[BASE.id]||[]).slice().sort());
  const ahora=JSON.stringify((nuevo[BASE.id]||[]).slice().sort());
  MIS_CIUDADES=nuevo;
  if(antes!==ahora){
    toast('🗺️ Te cambiaron las ciudades · recargando tu lista');
    await abrirBase(BASE);
  }
}

/* ---------- presencia: quien esta marcando AHORA ---------- */

/* El latido dice "sigo aca, en esta base, en esta ciudad". Sin esto el reparto
   se hacia sobre los ASIGNADOS estuvieran o no: con tres asignadas y una sola
   conectada, esa una trabajaba su tercio y los otros dos tercios no los
   llamaba nadie. */
/* Mi territorio no es UNA ciudad: es el conjunto que me dieron. Sara tiene 132.
   Dos personas solo se reparten la misma lista si su conjunto es idéntico; si
   no, cada una ya trabaja lo suyo y partírsela le quitaría la mitad de su
   propio territorio a cada una. */
function miTerritorio(){
  /* Manda la ASIGNACION, no el cargo. Si el supervisor tiene ciudades en esta
     base, trabaja como cualquiera y se reparte con quien coincida. Si abrio una
     base que no es suya, entro a mirar: con una firma propia no le quita lista
     a quien si la tiene repartida. Antes bastaba con que tuviera la misma base
     abierta para que a Sara le quedaran 1.400 de 2.802 sin saber por que. */
  if(!BASE) return '';
  if(!MIS_BASES.has(BASE.id)) return 'mirando:'+YO.id;
  const mias=MIS_CIUDADES[BASE.id]||[];
  return mias.length ? mias.slice().sort().join('|') : '';
}
async function latir(){
  if(!YO||!YO.id) return;
  const mias=(BASE&&MIS_CIUDADES[BASE.id])||[];
  try{
    await fetch(SB+'/rest/v1/mkr_presencia',{method:'POST',
      headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify([{agente_id:YO.id, base_id:BASE?BASE.id:null,
        municipio:mias.length===1?mias[0]:null, territorio:miTerritorio(),
        visto_en:new Date().toISOString()}])});
  }catch(e){}
}

/* Mi puesto entre los que estan conectados en MI MISMO territorio.
   Territorio = la misma base y la misma ciudad. Quien esta en otra ciudad de
   la misma base no me pisa, asi que no cuenta para repartir la mia. */
async function calcularReparto(){
  if(!BASE||!YO||!YO.id){ VIVOS=[]; return {puesto:0,cuantos:1}; }
  /* El territorio de los demas se saca de las ASIGNACIONES, no de lo que
     reporte su navegador. Si se confia en el latido, basta con que alguien
     tenga abierta una version vieja de esta pagina para que diga "base entera"
     y le parta la lista al que si esta trabajando: a Sara le quedaban 1.400 de
     2.799 porque Jose tenia Lupe abierto con la version de antes, cuando aun
     figuraba asignado. La base es la que manda, y esta igual para todos. */
  const [v,asig]=await Promise.all([
    GET('mkr_conectados?select=agente_id&base_id=eq.'+encodeURIComponent(BASE.id)),
    GET('mkr_asignaciones?select=agente_id,municipio&base_id=eq.'+encodeURIComponent(BASE.id)+'&limit=3000')
  ]);
  const ciudadesDe={};
  (Array.isArray(asig)?asig:[]).forEach(a=>{
    (ciudadesDe[a.agente_id]=ciudadesDe[a.agente_id]||[]).push(a.municipio||null);
  });
  /* Solo entran al reparto los que estan conectados Y tienen esta base
     asignada. Quien la abrio sin tenerla asignada entro a mirar. */
  VIVOS=(Array.isArray(v)?v:[])
    .filter(x=>ciudadesDe[x.agente_id])
    .map(x=>({agente_id:x.agente_id,
              territorio:(ciudadesDe[x.agente_id].some(c=>!c)
                          ? ''                                   // base entera
                          : ciudadesDe[x.agente_id].slice().sort().join('|'))}));
  const conmigo=VIVOS.filter(x=>compartimos(x.territorio)).map(x=>x.agente_id);
  const eq=[...new Set(conmigo.concat(MIS_BASES.has(BASE.id)?[YO.id]:[]))].sort();
  return {puesto:Math.max(0,eq.indexOf(YO.id)), cuantos:Math.max(1,eq.length)};
}

/* Dos territorios se cruzan si comparten al menos una ciudad. Base entera
   (territorio vacio) se cruza con todos: esa persona llama toda la base. */
function compartimos(ter){
  const miT=miTerritorio();
  if(miT.startsWith('mirando:')) return false;
  const a=miT?miT.split('|'):[], b=String(ter||'')?String(ter).split('|'):[];
  if(!a.length||!b.length) return true;
  const sb=new Set(b.map(x=>x.toLowerCase()));
  return a.some(x=>sb.has(x.toLowerCase()));
}

/* Reparte ORDEN entre los conectados, CIUDAD POR CIUDAD, y conserva en que
   prospecto iba.
   Por que por ciudad y no por la lista entera: Sara puede tener Yumbo y Cali,
   y Jose Cali y Duitama. En Cali son dos y hay que partirla; en Yumbo Sara esta
   sola y le toca completa. Repartiendo la lista global, a Sara le quitarian la
   mitad de Yumbo —donde no la acompaña nadie— y los dos seguirian llamando a
   los mismos de Cali. */
function aplicarReparto(){
  const actual=leads[idx]?leads[idx].id:null;
  const yoMirando=miTerritorio().startsWith('mirando:');
  let l;
  if(yoMirando){
    l=ORDEN.slice();                       // entro a mirar: veo todo, no reparto
  }else{
    /* Para cada ciudad, quienes la tienen ademas de mi. El orden es por
       agente_id, que no cambia, asi que las dos partes coinciden sin hablarse. */
    const equipoDe={};
    const equipo=c=>{
      const k=String(c||'').toLowerCase();
      if(equipoDe[k]) return equipoDe[k];
      const ids=VIVOS.filter(v=>{
        const t=String(v.territorio||'');
        if(!t) return true;                            // base entera: llama todo
        return t.split('|').some(x=>x.toLowerCase()===k);
      }).map(v=>v.agente_id);
      return equipoDe[k]=[...new Set(ids.concat([YO.id]))].sort();
    };
    const cuenta={};
    l=ORDEN.filter(x=>{
      const c=String(x.ciudad||'').trim();
      const eq=equipo(c);
      if(eq.length<2) return true;                     // solo yo: toda la ciudad
      const k=c.toLowerCase();
      const i=(cuenta[k]=(cuenta[k]||0)+1)-1;
      return (i % eq.length)===eq.indexOf(YO.id);      // uno para cada una, en orden
    });
  }
  TODOS=l; leads=TODOS.slice();
  if(typeof PORQUE==='object'&&PORQUE) PORQUE.trasReparto=leads.length;
  /* No se reinicia en cero: si estaba hablando con alguien, ese sigue enfrente. */
  const i=actual?leads.findIndex(x=>x.id===actual):-1;
  idx=i>=0?i:0;
}

async function sincronizar(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  /* El latido y el reparto van en el mismo ciclo que ya estaba corriendo. */
  if(BASE){
    if(!sincronizar.ultLat||Date.now()-sincronizar.ultLat>55000){
      sincronizar.ultLat=Date.now(); await latir();
      /* Y se vuelven a leer las ciudades que me asignaron. Antes esto se leia
         UNA sola vez, al entrar: si el supervisor le abria una ciudad desde
         Lupe Control, la telemercaderista seguia viendo la lista vieja hasta
         que cerrara y volviera a entrar — y como nadie le avisaba, lo que veia
         era "no quedan prospectos" sin razon aparente. */
      await releerMisCiudades();
    }
    const r=await calcularReparto();
    if(r.cuantos!==REPARTO.cuantos||r.puesto!==REPARTO.puesto){
      const antes=REPARTO.cuantos; REPARTO=r; aplicarReparto(); render();
      toast(r.cuantos>antes
        ? '👥 Entró alguien más: ahora son '+r.cuantos+' en esta lista'
        : '👤 Quedaron '+r.cuantos+' · te tocó más lista');
    }
  }
  /* Sin filtro de base a proposito: el tablero es de TODA la red. Da igual que
     una este en Ibague y otra en calzado — compiten entre si, y eso es lo que
     empuja a marcar. */
  /* sala=neq.pruebas: lo que se marca en la base de pruebas no entra al
     tablero ni a la plata del dia. La llamada guarda en 'sala' el cajon de su
     base, asi que la de pruebas viene marcada de fabrica. */
  const filas=await GETALL('mkr_llamadas?select=agente,agente_id,valor,validado,creado_en'+
    '&creado_en=gte.'+hoy.toISOString()+'&sala=neq.pruebas&order=creado_en.desc&limit=5000');
  if(!Array.isArray(filas)){ $('live').classList.add('off'); $('liveTx').textContent='sin señal'; return; }
  $('live').classList.remove('off'); $('liveTx').textContent='en vivo';

  /* Se agrupa por agente_id, no por el nombre: el nombre se escribe libre y la
     misma persona quedaba partida en varias filas del tablero. */
  const real={};
  filas.forEach(f=>{
    const k=f.agente_id||('n:'+f.agente);
    const a=real[k]=real[k]||{id:f.agente_id||null,agente:f.agente,llamadas:0,plata:0};
    a.llamadas++; if(f.validado) a.plata+=(+f.valor||0);
  });
  /* Y entran TODAS las habilitadas, aunque todavia no hayan marcado. Si solo
     aparece quien ya marco, el primero del dia no tiene contra quien competir. */
  if(!sincronizar.agentes){
    sincronizar.agentes = await GET('mkr_agentes?select=id,nombre&activo=is.true&limit=200') || [];
  }
  sincronizar.agentes.forEach(g=>{
    if(!real[g.id]) real[g.id]={id:g.id, agente:g.nombre, llamadas:0, plata:0};
  });
  const yoKey = YO.id||('n:'+YO.nombre);
  if(real[yoKey]){ miPlata=real[yoKey].plata; misLlamadas=real[yoKey].llamadas; }
  pintarPlata(false);

  /* Y lo que de verdad importa cuando hay DOS trabajando la misma base: sacar
     de la lista lo que la otra ya marco. Antes esto solo se leia al entrar, asi
     que las dos trabajaban sobre la foto que bajaron al abrir y terminaban
     llamando a la misma empresa. No se toca la pantalla si hay un panel de
     interesado abierto, para no borrarle lo que esta escribiendo. */
  if(BASE && !($('panel')||{}).innerHTML){
    const ya=await GETALL('mkr_llamadas?select=lead_id&base_id=eq.'+BASE.id);
    if(Array.isArray(ya) && ya.length){
      const hechos=new Set(ya.map(x=>x.lead_id).filter(Boolean));
      const antes=leads.length, actual=leads[idx] && leads[idx].id;
      TODOS=TODOS.filter(l=>!hechos.has(l.id));
      leads=leads.filter(l=>!hechos.has(l.id));
      /* ORDEN tambien: es de donde se rehace la lista cada vez que entra o sale
         alguien. Si no se limpia aqui, lo que la otra ya marco REAPARECE en el
         siguiente reparto y se llama dos veces a la misma empresa. */
      ORDEN=ORDEN.filter(l=>!hechos.has(l.id));
      if(leads.length!==antes){
        const i=leads.findIndex(l=>l.id===actual);      // quedarse en el mismo si sigue
        idx = i>=0 ? i : Math.min(idx, Math.max(0, leads.length-1));
        pintarTag(); render();
      }
    }
  }

  mirarVersion();                                   // se vigila sola, sin molestar
  cargarInteresados();                              // los que quedaron por trabajar

  const todos=Object.values(real).sort((a,b)=>b.plata-a.plata||b.llamadas-a.llamadas);
  $('rkBody').innerHTML=todos.map((a,i)=>{
    const soyYo=(a.id&&YO.id&&a.id===YO.id)||a.agente===YO.nombre;
    return `<div class="rw ${soyYo?'yo':''}" style="cursor:pointer" onclick="verSemanas('${a.id||''}','${esc(a.agente).replace(/'/g,'')}')" title="Toca para ver semana por semana">
      <div class="pos">${i+1}</div>
      <div class="nm">${esc(a.agente)}<small>${soyYo?'tú':(a.llamadas?'marcando':'todavía no marca')} · toca para ver tus semanas</small></div>
      <div class="ll">${num(a.llamadas)} ll.</div>
      <div class="pl mono">${cop(a.plata)}</div>
    </div>`;}).join('')||'<div class="vacio" style="padding:22px">Nadie ha marcado hoy.</div>';
  const activas=todos.filter(a=>a.llamadas>0).length;
  $('rkInfo').textContent=todos.length+' en la red · '+activas+(activas===1?' marcando':' marcando');
  $('rkTot').innerHTML='Solo cuenta lo validado · total del día <b style="color:var(--dim)">'+
    cop(todos.reduce((s,a)=>s+a.plata,0))+'</b>';
}

/* ==================== SEMANA POR SEMANA ====================
   El tablero se reinicia cada dia, asi que la persona no tenia forma de ver
   cuanto lleva hecho ni que ya le pagaron. Tocando el nombre se abre esto:
   una fila por semana con lo producido, lo pagado y lo que queda debiendo.
   La semana se calcula ISO (lunes a domingo), la misma que usa mkr_pagos. */
function semanaISO(f){
  const t=new Date(Date.UTC(f.getFullYear(),f.getMonth(),f.getDate()));
  const dia=t.getUTCDay()||7;                       // domingo=7, no 0
  t.setUTCDate(t.getUTCDate()+4-dia);               // al jueves de esa semana
  const ene1=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const n=Math.ceil(((t-ene1)/86400000+1)/7);
  return t.getUTCFullYear()+'-W'+String(n).padStart(2,'0');
}
let semAbierta=null, semAg={id:null,nombre:''};
/* Solo el dueño de la red liquida. No es una barrera de seguridad -la llave es
   publica-, es para que a una telemercaderista no le salga un boton que le
   dejaria marcarse a si misma como pagada. */
const JEFES=['jose'];
function esJefe(){ return !!(YO && JEFES.indexOf(String(YO.usuario||'').toLowerCase())>=0); }
async function verSemanas(id,nombre){
  const cont=$('semanas'); if(!cont) return;
  if(semAbierta===(id||nombre)){ cont.innerHTML=''; semAbierta=null; return; }   // segundo toque, cierra
  semAbierta=id||nombre; semAg={id:id||null,nombre:nombre||''};
  cont.innerHTML='<div style="padding:14px;text-align:center;color:var(--dim)">cargando…</div>';
  const filtro = id ? 'agente_id=eq.'+encodeURIComponent(id)
                    : 'agente=eq.'+encodeURIComponent(nombre);
  const [ll,pg]=await Promise.all([
    GETALL('mkr_llamadas?select=valor,validado,creado_en&'+filtro+'&order=creado_en.desc&limit=20000'),
    id ? GETALL('mkr_pagos?select=semana,valor,fecha_pago,medio&agente_id=eq.'+encodeURIComponent(id)) : []
  ]);
  if(!Array.isArray(ll)){ cont.innerHTML='<div class="foot">No se pudo leer el historial.</div>'; return; }
  const pagado={}; (Array.isArray(pg)?pg:[]).forEach(p=>{ pagado[p.semana]=(pagado[p.semana]||0)+(+p.valor||0); });
  const sem={};
  ll.forEach(f=>{
    const k=semanaISO(new Date(f.creado_en));
    const s=sem[k]=sem[k]||{ll:0,plata:0};
    s.ll++; if(f.validado) s.plata+=(+f.valor||0);
  });
  Object.keys(pagado).forEach(k=>{ if(!sem[k]) sem[k]={ll:0,plata:0}; });   // semanas pagadas sin marcaciones
  const claves=Object.keys(sem).sort().reverse();
  if(!claves.length){ cont.innerHTML='<div class="foot">'+esc(nombre)+' todavía no tiene semanas registradas.</div>'; return; }
  const actual=semanaISO(new Date());
  const jefe=esJefe() && !!id;      // sin ficha de agente no hay a quien cargarle el pago
  let tp=0,tg=0,debeTot=0,nDebe=0;
  const G = jefe ? '26px 86px 1fr auto auto' : '86px 1fr auto auto';
  const filas=claves.map(k=>{
    const s=sem[k], pa=pagado[k]||0, debe=s.plata-pa;
    tp+=s.plata; tg+=pa;
    const puede = debe>0;                 // solo se puede pagar lo que se debe
    if(puede){ debeTot+=debe; nDebe++; }
    const nSem=+k.slice(6), esta=k===actual;
    /* La casilla va con el valor pegado: al liquidar se escribe EXACTAMENTE lo
       que falta de esa semana, no un numero escrito a mano. */
    const ck = !jefe ? '' : (puede
      ? `<input type="checkbox" data-sem="${k}" data-debe="${debe}" style="width:18px;height:18px;cursor:pointer;accent-color:#22c55e">`
      : '<span style="opacity:.25;font-size:15px">✔</span>');
    return `<div style="display:grid;grid-template-columns:${G};gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07)${esta?';background:rgba(255,255,255,.05)':''}">
      ${jefe?ck:''}
      <div style="font-weight:800">Semana ${nSem}${esta?' <small style="opacity:.7">· esta</small>':''}<br><small style="opacity:.55">${k.slice(0,4)}</small></div>
      <div style="font-size:12px;opacity:.7">${num(s.ll)} llamada${s.ll===1?'':'s'}</div>
      <div class="mono" style="font-weight:800;text-align:right">${cop(s.plata)}</div>
      <div class="mono" style="text-align:right;font-size:12px;min-width:96px">${
        pa>=s.plata && s.plata>0 ? '<span style="color:#22c55e">✔ pagada</span>'
        : pa>0 ? '<span style="color:#f59e0b">abonado '+cop(pa)+'<br><small>falta '+cop(debe)+'</small></span>'
        : (s.plata>0?'<span style="opacity:.6">por pagar</span>':'<span style="opacity:.35">—</span>')}</div>
    </div>`;}).join('');
  /* La barra de liquidacion. Solo sale si hay algo que deber. */
  const barra = (!jefe || !nDebe) ? '' : `
    <div style="margin-top:10px;border-top:1px dashed rgba(255,255,255,.18);padding-top:10px">
      <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;opacity:.7;cursor:pointer;text-decoration:underline" onclick="marcarTodas(true)">marcar todas</span>
        <span style="font-size:12px;opacity:.7;cursor:pointer;text-decoration:underline" onclick="marcarTodas(false)">ninguna</span>
        <select id="pgMedio" style="margin-left:auto;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px">
          <option>Nequi</option><option>Efectivo</option><option>Transferencia</option><option>Daviplata</option>
        </select>
      </div>
      <button onclick="pagarSemanas()" style="width:100%;margin-top:8px;padding:11px;border:none;border-radius:10px;
        background:#22c55e;color:#04220f;font-weight:800;font-size:14px;cursor:pointer">
        ✔ Marcar como pagado</button>
      <div style="font-size:11px;opacity:.55;margin-top:5px;text-align:center">
        Escoge las semanas y quedan como cuentas canceladas. Debe ${cop(debeTot)} en ${nDebe} semana${nDebe===1?'':'s'}.</div>
    </div>`;
  cont.innerHTML=`<div style="margin-top:12px;border-top:2px solid rgba(255,255,255,.14);padding-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <b>📅 ${esc(nombre)} · semana por semana</b>
      <span style="font-size:12px;opacity:.6;cursor:pointer" onclick="verSemanas('${id||''}','${esc(nombre).replace(/'/g,'')}')">cerrar ✕</span>
    </div>
    ${filas}
    <div class="foot" style="margin-top:8px">Producido <b class="mono">${cop(tp)}</b> · pagado <b class="mono" style="color:#22c55e">${cop(tg)}</b>${
      tp-tg>0?' · <b class="mono" style="color:#f59e0b">le deben '+cop(tp-tg)+'</b>':''}</div>
    ${barra}
  </div>`;
}
function marcarTodas(v){
  document.querySelectorAll('#semanas input[data-sem]').forEach(c=>{ c.checked=!!v; });
}
/* Liquidar: por cada semana marcada queda una fila en mkr_pagos con lo que
   faltaba de ESA semana. No se toca mkr_llamadas: lo producido es historia y no
   se reescribe; el pago es un hecho aparte que se le suma encima. */
async function pagarSemanas(){
  if(!esJefe()) return;
  if(!semAg.id){ toast('Esa persona no tiene ficha de agente: no hay a quién cargarle el pago.',true); return; }
  const cks=[].slice.call(document.querySelectorAll('#semanas input[data-sem]')).filter(c=>c.checked);
  if(!cks.length){ toast('Marca las semanas que le vas a pagar.',true); return; }
  const medio=($('pgMedio')||{}).value||'Nequi';
  const hoy=new Date().toISOString().slice(0,10);
  const filas=cks.map(c=>({agente_id:semAg.id, semana:c.dataset.sem, valor:+c.dataset.debe||0,
    fecha_pago:hoy, medio:medio, nota:'Liquidado en Lupe'}));
  const total=filas.reduce((a,f)=>a+f.valor,0);
  if(!confirm('¿Registrar el pago de '+filas.length+' semana(s) a '+semAg.nombre+' por '+cop(total)+'?\n\n'
    +'Queda escrito como pagado y desde acá no se puede deshacer.')) return;
  try{
    const r=await fetch(SB+'/rest/v1/mkr_pagos',{method:'POST',
      headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify(filas)});
    if(!r.ok) throw new Error(r.status);
    toast('✅ '+cop(total)+' registrado a '+semAg.nombre);
    const id=semAg.id, nom=semAg.nombre; semAbierta=null;
    verSemanas(id,nom);
  }catch(e){ toast('⚠️ No se pudo registrar el pago. Revisa la señal.',true); }
}

/* ==================== ARRANQUE ==================== */
(async()=>{
  const g=localStorage.getItem('cp_yo');
  if(g){
    try{
      const {id}=JSON.parse(g);
      const ags=await GET('mkr_agentes?select=id,nombre,usuario,celular,nivel,ced,activo&id=eq.'+encodeURIComponent(id)+'&limit=1');
      if(Array.isArray(ags)&&ags[0]&&ags[0].activo!==false){ YO=ags[0]; await entrarApp(); return; }
    }catch(e){}
    localStorage.removeItem('cp_yo');
  }
  pintarGate();
  /* Tambien antes de entrar, y cada minuto: si alguien quedo con la pagina vieja
     abierta en el celular, no puede entrar y no se entera. El aviso tiene que
     alcanzarlo en la pantalla de ingreso, no despues. */
  mirarVersion(); setInterval(mirarVersion, 60000);
})();
</script>
