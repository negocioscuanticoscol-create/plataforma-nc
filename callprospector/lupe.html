<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1B3A6B">
<link rel="icon" href="raton-chico.png">
<link rel="apple-touch-icon" href="raton-chico.png">
<title>Lupe marca y gana · CallProspector</title>
<style>
:root{
  --azul:#1B3A6B; --azul2:#142C52;
  --naranja:#E8621A; --naranja2:#FF7A33;
  --bg:#0B1830; --card:#14294A; --card2:#1B3559; --line:#2A4676;
  --tx:#EAF1FB; --dim:#93AAC9; --faint:#6A83A6;
  --ok:#25C08A; --warn:#F0A73C; --bad:#F0604D; --azulc:#4A9BE8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);
  max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- ENTRADA ---------- */
#gate{position:fixed;inset:0;background:radial-gradient(120% 85% at 50% 0%,#FFFFFF,#EDF2F9 62%,#DFE8F4);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:26px;overflow-y:auto}
/* el que centra de verdad es este: si no, las etiquetas se van en línea */
#gateBody{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;width:100%;max-width:330px;margin:auto}
#gate .lupe{width:100%;max-width:215px;height:auto;animation:entrar .55s cubic-bezier(.2,.75,.3,1) both}
#gate .lema{font-size:23px;font-weight:800;color:var(--azul);letter-spacing:-.025em;
  margin:0 0 4px;text-align:center;line-height:1.2}
#gate .lema b{color:var(--naranja)}
#gate .logo{width:100%;max-width:330px;height:auto;margin-bottom:7px;
  animation:entrar .55s cubic-bezier(.2,.75,.3,1) both}
@media(prefers-reduced-motion:reduce){#gate .logo{animation:none}}
#gate .slogan{font-size:12.5px;color:#5B7A9C;text-align:center;max-width:320px;
  margin-bottom:20px;line-height:1.5;font-weight:600}
@keyframes entrar{from{opacity:0;transform:translateX(-26px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#gate .lupe{animation:none}}
#gate label{display:block;align-self:flex-start;width:100%;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:#5B7A9C;margin-bottom:6px;font-weight:700}
#gate input{width:100%;max-width:330px;background:#fff;border:1.5px solid #C6D4E6;
  color:var(--azul);border-radius:13px;padding:15px;font-size:16.5px;text-align:center;font-weight:700}
#gate input::placeholder{color:#9FB2C9;font-weight:400}
#gate input:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(232,98,26,.16)}
#gate button{width:100%;max-width:330px;background:var(--naranja);color:#fff;border:none;border-radius:13px;
  padding:16px;font-size:16.5px;font-weight:800;margin-top:13px;cursor:pointer;
  box-shadow:0 6px 18px rgba(232,98,26,.3);font-family:inherit}
#gate button:active{background:#D05514;box-shadow:none}
#gate button.gh{background:transparent;border:1.5px solid #C6D4E6;color:var(--azul);
  box-shadow:none;margin-top:9px;font-size:15px}
#gate button.gh:active{background:#E4EBF4}
#gate .hint{color:#6F84A0;font-size:12px;margin-top:18px;text-align:center;line-height:1.55;max-width:330px}
#gate .link{margin-top:15px;font-size:12.5px;color:var(--naranja);font-weight:700;cursor:pointer}
#gate .err{color:#C0362C;font-size:12.5px;margin-top:10px;text-align:center;max-width:330px;font-weight:600;line-height:1.5}
#gate .buscando{color:#8FA4BE;font-size:12.5px;margin-top:11px;text-align:center;font-weight:600}
#gate .bien{font-size:13px;color:#5B7A9C;font-weight:600;letter-spacing:.03em}
#gate .ced1{font-size:52px;font-weight:800;color:var(--azul);letter-spacing:-.04em;line-height:1}
#gate .ced2{font-size:16px;font-weight:700;color:var(--naranja);letter-spacing:.02em;margin-bottom:20px}
#gate .marcas{display:flex;align-items:center;justify-content:center;gap:16px;
  margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid #D4DFEC;width:100%}
#gate .marcas img{height:34px;width:auto;object-fit:contain}
#gate .marcas .wm{font-size:19px;font-weight:800;color:var(--azul);letter-spacing:.06em}
#gate .marcas .sep{width:1px;height:26px;background:#C6D4E6;flex:none}
#gate select{width:100%;background:#fff;border:1.5px solid #C6D4E6;color:var(--azul);
  border-radius:13px;padding:14px;font-size:15.5px;font-weight:700;font-family:inherit}
#gate select:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(232,98,26,.16)}
#gate .hallado{margin-top:11px;background:#E6F4EC;border:1.5px solid #A8D8BF;border-radius:12px;
  padding:11px 15px;text-align:center;color:#0F6B4E;font-size:14px;font-weight:700;width:100%}
#gate .hallado b{display:block;font-size:17px;color:#0B4A36;margin-top:1px}
#gate .hallado small{display:block;font-size:11.5px;color:#4C8A70;font-weight:600;
  text-transform:capitalize;margin-top:2px}
#gate .volver{align-self:flex-start;width:100%;max-width:330px;font-size:12.5px;color:#5B7A9C;
  font-weight:700;cursor:pointer;margin-bottom:12px}
#gate h4{font-size:20px;font-weight:800;color:var(--azul);margin:4px 0 3px;letter-spacing:-.02em}
#gate .sub2{font-size:12.5px;color:#6F84A0;margin-bottom:14px;text-align:center;max-width:320px;line-height:1.5}

/* ---------- ESCOGER BASE ---------- */
#bases{position:fixed;inset:0;background:var(--bg);z-index:90;overflow-y:auto;padding:24px 16px 40px}
#bases h4{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
#bases .s{font-size:13px;color:var(--dim);margin-bottom:18px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;
  margin-bottom:10px;cursor:pointer}
.bcard:active{filter:brightness(1.12)}
.bcard .n{font-size:16px;font-weight:800;letter-spacing:-.01em}
.bcard .d{font-size:12px;color:var(--dim);margin-top:3px}
.bcard .q{margin-top:9px;display:flex;justify-content:space-between;align-items:center}
.bcard .q b{font-size:20px;font-weight:800;color:var(--naranja2)}
.bcard .q span{font-size:11px;color:var(--faint)}

/* ---------- CABECERA ---------- */
header{background:linear-gradient(160deg,var(--azul),var(--azul2));padding:12px 15px 14px;
  position:sticky;top:0;z-index:20;border-bottom:2px solid var(--naranja);
  padding-top:calc(12px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.brand{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand .p{color:var(--naranja2)}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:#9DB7DA;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.7s infinite}
.live.off i{background:var(--bad);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
@media(prefers-reduced-motion:reduce){.live i{animation:none}}
.yo{font-size:11.5px;color:#9DB7DA;background:rgba(255,255,255,.1);padding:3px 9px;border-radius:20px;cursor:pointer}
.plata{text-align:center}
.plata .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#9DB7DA;font-weight:600}
.plata .val{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:2px 0 3px;
  color:#fff;transition:transform .18s}
.plata .val.bump{transform:scale(1.09)}
@media(prefers-reduced-motion:reduce){.plata .val{transition:none}}
.pend{font-size:11px;color:var(--warn);margin-top:2px}
.baseTag{font-size:11px;color:#9DB7DA;margin-top:7px;background:rgba(0,0,0,.22);
  padding:4px 10px;border-radius:20px;display:inline-block;cursor:pointer}

/* ---------- TARJETA ---------- */
main{flex:1;padding:13px 15px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:19px 17px;text-align:center}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:11px}
.tg{font-size:10.5px;padding:3px 10px;border-radius:12px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.tg.ciu{background:rgba(74,155,232,.15);color:#8FC4F5;border-color:rgba(74,155,232,.4)}
.empw{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:5px;text-align:left}
.empw .rat{width:56px;height:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.emp{font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.02em;min-width:0}
@media(max-width:360px){.empw .rat{width:44px} .emp{font-size:19px}}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:2px}
.cont{color:var(--naranja2);font-size:13.5px;font-weight:600}
.num{font-size:28px;font-weight:800;letter-spacing:.5px;margin:13px 0 3px}
.call{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--ok);color:#03291D;
  text-decoration:none;font-size:20px;font-weight:800;padding:17px;border-radius:14px;margin:15px 0 4px}
.call:active{filter:brightness(.9)}
/* La extensión NO se pega al número: si va en el enlace, el celular marca 14
   dígitos y la llamada no entra. Va como nota, para marcarla al contestar. */
.ext{margin:6px 0 2px;font-size:13.5px;text-align:center;padding:8px 10px;border-radius:10px;
  background:rgba(255,193,84,.14);border:1px solid rgba(255,193,84,.35)}
.ext b{font-size:16px;letter-spacing:.5px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
.res button{border:none;border-radius:11px;padding:14px 6px;font-size:13px;font-weight:700;cursor:pointer;
  color:#fff;font-family:inherit;line-height:1.25;display:flex;flex-direction:column;gap:3px;align-items:center}
.res button:active{filter:brightness(.88)}
.res button small{font-size:10.5px;opacity:.82;font-weight:600}
.res button[disabled]{opacity:.5}
.b-Interesado{background:var(--ok);color:#03291D}
.b-Competencia{background:#8B5CF6}
.b-Nointeresado{background:#475C7A}
.b-Nocontesta{background:#5A6E8C}
.b-Equivocado{background:#6B7A94}
.b-Nocontactar{background:#3D4E68}
/* Los tres nuevos NO tenian color: el .res button no trae fondo propio, asi que
   salian en blanco con letra blanca — invisibles. Cada resultado necesita su clase. */
.b-Datonegativo{background:#78716C}
.b-Habeasdata{background:#1E40AF}
.b-Yaescliente{background:#0F766E}
.b-InfoWhatsApp{background:#166534}
.pan .cat{width:100%;margin-top:9px;border:none;border-radius:11px;padding:13px;
  background:#166534;color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.pan .cat:active{filter:brightness(.88)}
.nav{display:flex;gap:8px;margin-top:11px}
.nav button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:10px;
  padding:11px;font-size:13px;cursor:pointer;font-family:inherit}
/* El desplegable de "va en otra base" se ve igual que los botones de al lado a
   proposito: es una correccion de dato, no una accion destacada. */
.nav select{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:10px;
  padding:11px 9px;font-size:13px;cursor:pointer;font-family:inherit;appearance:none;text-align:center}
.nav select:disabled{opacity:.5}
.prog{text-align:center;font-size:11.5px;color:var(--faint);margin-top:10px}

/* panel del interesado */
#panel{margin-top:12px}
.pan{background:var(--card2);border:1.5px solid var(--naranja);border-radius:13px;padding:14px;text-align:left}
.pan h5{font-size:12.5px;color:var(--naranja2);margin-bottom:3px;font-weight:700}
.pan .ps{font-size:11.5px;color:var(--dim);margin-bottom:10px;line-height:1.45}
.pan .ps b{color:var(--tx)}
.pan input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);
  border-radius:9px;padding:11px;font-size:14px;font-family:inherit;margin-bottom:7px}
.pan input:focus{outline:none;border-color:var(--naranja)}
.pan .pb{display:flex;gap:7px;margin-top:4px}
.pan .pb button{flex:1;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit}
.pan .pb .g{background:var(--ok);color:#03291D}
.pan .pb .s{background:var(--card);color:var(--faint);border:1px solid var(--line)}

/* ---------- RANKING ---------- */
.rank{margin:18px 15px 0;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden}
.rank h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--naranja2);
  padding:14px 16px 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.rank h3 span{margin-left:auto;color:var(--faint);letter-spacing:0;text-transform:none;font-size:11px;font-weight:500}
.rw{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;
  padding:11px 16px;border-top:1px solid var(--line)}
.rw .pos{font-size:14px;font-weight:800;color:var(--faint);text-align:center}
.rw:nth-child(2) .pos{color:#F5C542}
.rw .nm{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .nm small{display:block;font-size:10.5px;color:var(--faint);font-weight:400}
.rw .ll{font-size:11.5px;color:var(--dim);text-align:right}
.rw .pl{font-size:14.5px;font-weight:800;text-align:right;color:var(--ok);min-width:74px}
.rw.yo{background:linear-gradient(90deg,rgba(232,98,26,.16),transparent)}
.rw.yo .nm{color:var(--naranja2)}
.rank .foot{padding:11px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}

.tarifas{margin:15px 15px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px}
.tarifas h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;font-weight:700}
.tarifas .t{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--dim)}
.tarifas .t b{color:var(--tx);font-weight:600}
/* La fila del interesado NO usa .rw: esa es del tablero y lleva nowrap con
   ellipsis, asi que cortaba el nombre de la empresa y el boton de WhatsApp se le
   montaba encima. Aca el nombre manda y los botones bajan a su propia linea. */
.iw{padding:10px 0;border-top:1px solid var(--line)}
.iw .ie{font-size:13.5px;font-weight:600;color:var(--tx);line-height:1.3}
.iw .id{font-size:11px;color:var(--faint);margin-top:2px;line-height:1.45}
.iw .ib{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:8px}
/* El celular va como TEXTO, no como boton de WhatsApp: se copia y se escribe
   despues, cuando haya con que. Con el enlace se salia de la app en mitad de la
   jornada. user-select:all = un toque selecciona el numero entero. */
.iw .inum{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap;letter-spacing:.02em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  -webkit-user-select:all;user-select:all;cursor:text}
.iw .ick{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
.iw .ick input{width:19px;height:19px}
.iw.hecho{opacity:.5}
.iw .falta{color:#f0a04b}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-140%);top:calc(12px + env(safe-area-inset-top));
  background:var(--card2);border:1px solid var(--naranja);color:var(--tx);padding:11px 17px;border-radius:12px;
  font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .3s ease;
  max-width:88vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.mal{border-color:var(--bad)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
footer{padding:16px 15px calc(20px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:var(--faint);line-height:1.6}
.vacio{text-align:center;color:var(--faint);font-size:13.5px;padding:40px 18px;line-height:1.65}
</style>
</head>
<body>

<div id="gate"><div id="gateBody"></div></div>
<div id="bases" style="display:none"></div>

<header id="hd" style="display:none">
  <div class="hrow">
    <div class="brand">Call<span class="p">Prospector</span></div>
    <span class="yo" id="yo" onclick="salir()">—</span>
    <div class="live" id="live"><i></i><span id="liveTx">en vivo</span></div>
  </div>
  <div class="plata">
    <div class="lbl">Ganado hoy</div>
    <div class="val mono" id="plata">$0</div>
    <div class="pend" id="pend"></div>
    <div><span class="baseTag" id="baseTag" onclick="volverBases()">—</span></div>
  </div>
</header>

<main id="main" style="display:none"></main>
<div class="rank" id="rank" style="display:none"><h3>🏆 Tablero <span id="rkInfo">—</span></h3><div id="rkBody"></div><div class="foot" id="rkTot">—</div><div id="semanas"></div></div>
<!-- Entre el tablero y la tabla de pagos: en la llamada no hay tiempo de escribir
     los datos del interesado, asi que aqui quedan todos a la mano para mandarles
     la informacion despues. Se van de la lista al marcar la casilla. -->
<div class="rank" id="inter" style="display:none">
  <h3>🔥 Interesados <span id="inInfo">—</span></h3>
  <div id="inBody"></div>
</div>
<div class="tarifas" id="tarifas" style="display:none"><h4>Lo que paga esta base</h4><div id="tarBody"></div></div>
<footer id="ft" style="display:none">CallProspector · Negocios Cuánticos · Bogotá</footer>

<div id="toast"></div>

<script>
/* Version de esta pagina. Se sube cada vez que se publica un cambio.
   En el celular no existe Ctrl+F5 y nadie va a recargar a media jornada, asi
   que la app se vigila sola: cada 5 minutos se pide a si misma sin cache y
   compara. Si cambio, avisa — no recarga sola, porque recargar en mitad de una
   llamada le borraria el panel del interesado a quien esta escribiendo. */
const VER='20260903-jefe-ve-equipo';
const SB='https://fnayedgvamxktxfvywwl.supabase.co';
const K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};

const $=s=>document.getElementById(s);
/* TODO lo que venga de la base pasa por aquí antes de pintarse */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const num=n=>(+n||0).toLocaleString('es-CO');
const soloNum=s=>String(s||'').replace(/\D/g,'');
const SINTILDE=new RegExp('[\\u0300-\\u036f]','g');
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(SINTILDE,'').replace(/\s+/g,' ');

/* guarda el último código de respuesta para poder decir QUÉ falló, no un "sin conexión" genérico */

/* El servidor NUNCA devuelve mas de 1000 filas aunque se le pida mas, y lo hace
   en silencio. GETALL pide de a 1000 hasta agotar, para que ninguna pantalla
   se quede corta cuando la tabla crece. */
async function GETALL(p){
  const base=String(p).replace(/[?&](limit|offset)=\d+/g,'');
  const sep=base.includes('?')?'&':'?';
  const out=[];
  for(let i=0,off=0;i<60;i++,off+=1000){
    let r; try{ r=await fetch(SB+'/rest/v1/'+base+sep+'limit=1000&offset='+off,{headers:H}); }catch(e){ break; }
    if(!r.ok) break;
    let b; try{ b=await r.json(); }catch(e){ break; }
    if(!Array.isArray(b)||!b.length) break;
    out.push(...b);
    if(b.length<1000) break;
  }
  return out;
}
async function GET(p){
  try{ const r=await fetch(SB+'/rest/v1/'+p,{headers:H});
    GET.estado=r.status;
    return r.ok?await r.json():null;
  }catch(e){ GET.estado=0; return null; }
}
/* Las claves ya NO viajan al navegador. Antes se traia la lista completa de
   agentes con su clave en texto plano; ahora la base valida y devuelve solo la
   ficha. Ver _PLAYBOOK/agentes_clave_fuera.sql */
async function RPC(fn, args){
  try{ const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(args)});
    RPC.estado=r.status; GET.estado=r.status;
    return r.ok ? await r.json() : null;
  }catch(e){ RPC.estado=0; GET.estado=0; return null; }
}
function porQueFallo(){
  if(GET.estado===404||GET.estado===400) return 'La base de datos todavía no está creada. Avísale al administrador.';
  if(GET.estado===0) return 'Sin señal. Revisa tu internet e intenta de nuevo.';
  return 'No se pudo conectar (error '+GET.estado+'). Intenta de nuevo.';
}

let tt; function toast(m,mal){ const t=$('toast'); t.textContent=m;
  t.classList.toggle('mal',!!mal); t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),mal?3400:2200); }

const NIVELES=['principiante','intermedio','avanzado','asesor'];
/* 'ced' NO va aca. En mkr_bases el ced dice QUIEN PUEDE trabajar la base, no es
   un dato de cada prospecto: en mkr_leads viene vacio siempre. Al meterlo como
   filtro, la consulta pedia ced=eq.nido contra 313 filas con ced nulo y devolvia
   CERO — la base de colchones se veia como "ya la trabajaste toda".
   El permiso por CED ya se resuelve arriba, al escoger que bases se muestran. */
const SEG=['cliente','marca','canal','sector','subsector','departamento','ciudad','barrio'];
/* Los botones son los MISMOS en toda base, a proposito: si cambiaran por base,
   dos agentes marcarian cosas distintas y el informe no se podria comparar.
   Antes salian de BASE.botones — una columna que no existe en mkr_bases, asi que
   aqui no aparecia NINGUN boton. */
const RESULTADOS=['Interesado','Competencia','No interesado','No contesta','Equivocado','No contactar','Dato negativo','Habeas data','Ya es cliente','Info WhatsApp'];
const TARIFA_DEF={'Interesado':2500,'Competencia':600,'No interesado':350,'No contesta':150,'Equivocado':150,'No contactar':250,'Dato negativo':150,'Habeas data':150,'Ya es cliente':50,'Info WhatsApp':350};
const ICONO={'Interesado':'🔥','Competencia':'🏭','No interesado':'❌','No contesta':'☎️','Equivocado':'⛔','No contactar':'🚫','Dato negativo':'🗑️','Habeas data':'🛡️','Ya es cliente':'🤝','Info WhatsApp':'💬'};

/* TODOS es la base completa; leads es lo que se esta viendo. Se separan porque
   al filtrar por ciudad hay que poder volver a "todas" sin recargar, y porque al
   marcar un prospecto tiene que salir de las DOS listas o reaparece al quitar el
   filtro. */
let YO=null, BASE=null, misBases=[], leads=[], TODOS=[], CIUDAD='', SENTIDO={}, idx=0, miPlata=0, pendientes=0, misLlamadas=0;
/* Tarjeta trabada: mientras se guarda una marcacion —y mientras el panel del
   interesado esta abierto— no se puede volver a marcar. Sin esto la tarjeta se
   quedaba en pantalla con los diez botones vivos y cada toque de mas guardaba
   OTRA llamada de la misma empresa: el 28-ago quedaron 13 filas seguidas de

/* los centros salen de la base, no escritos a mano */
async function cargarCeds(){
  const s=$('gCed'); if(!s)return;
  const cs=await GET('mkr_ceds?select=nombre,cliente,ciudad&activo=is.true&order=nombre&limit=200');
  if(!Array.isArray(cs)||!cs.length){
    s.innerHTML='<option value="todos">Todos los centros</option>'; return; }
  s.innerHTML='<option value="todos">Todos los centros</option>'+
    cs.map(c=>`<option value="${esc(c.nombre)}">${esc(c.nombre)}${c.ciudad?' · '+esc(c.ciudad):''}</option>`).join('');
  const ult=localStorage.getItem('cp_ced'); if(ult) s.value=ult;
}

function errGate(m){ const h=$('gHallado'); if(h) h.innerHTML=`<div class="err">${esc(m)}</div>`; }

async function hacerEntrar(){
  const u=(($('gU')||{}).value||'').trim(), p=(($('gP')||{}).value||'').trim();
  const ced=($('gCed')||{}).value||'todos';
  if(!u){ errGate('Escribe tu usuario'); return; }
  if(!p){ errGate('Escribe tu clave'); return; }

  /* La base valida y devuelve la ficha. Sirve el celular o el usuario: el
     celular es el que de verdad identifica, porque el nombre se escribe libre
     y la misma persona terminaba partida en varios agentes. */
  const res=await RPC('mkr_entrar',{p_quien:u, p_clave:p});
  if(!Array.isArray(res)){
    /* Si el servidor contesta 400/404, casi siempre es una version vieja
       guardada en el celular pidiendo algo que ya no existe. */
    errGate(porQueFallo()+' Si sigue igual, cierra y vuelve a abrir el enlace.');
    mirarVersion(); return;
  }
  const a=res[0];
  if(!a){ errGate('El celular o la clave no coinciden. Si no estás inscrito, toca abajo.'); return; }
  if(a.activo===false){ errGate('Hola '+a.nombre+'. Todavía no estás habilitado: falta la capacitación y la prueba.'); return; }
  if(ced!=='todos' && a.ced && a.ced!=='todos' && a.ced!==ced){
    errGate('No perteneces a ese centro. El tuyo es '+a.ced+'.'); return; }

  localStorage.setItem('cp_ced',ced);
  YO=a; localStorage.setItem('cp_yo',JSON.stringify({id:a.id,slug:a.usuario}));
  await entrarApp();
}

async function hacerInscribir(){
  const n=($('iN')||{}).value||'', c=soloNum(($('iC')||{}).value||''), q=soloNum(($('iQ')||{}).value||'');
  if(norm(n).length<3){ gate('inscribir','Escribe tu nombre completo'); return; }
  if(c.length<10){ gate('inscribir','El celular debe tener 10 números'); return; }
  try{
    /* La inscripcion la hace la base: el CELULAR es la llave, no el nombre.
       Antes el usuario salia del nombre normalizado, asi que la misma persona
       escribiendo distinto creaba varios agentes. Queda activo:false hasta la
       capacitacion y la prueba. */
    const r0=await RPC('mkr_inscribir',{p_nombre:n.trim(), p_celular:c, p_nequi:q});
    const est = Array.isArray(r0)?r0[0]:r0;
    const r = { ok: est==='ok', status: RPC.estado };
    if(!r.ok){
      gate('inscribir',
        est==='repetido' ? 'Ese celular ya está inscrito. Entra con él y tu clave.'
        : est==='datos'  ? 'Revisa el nombre y el celular.'
        : (RPC.estado===404||RPC.estado===400) ? 'La base de datos todavía no está creada. Avísale al administrador.'
        : 'No se pudo enviar (error '+RPC.estado+'). Intenta de nuevo.');
      return; }
  }catch(e){ gate('inscribir','Sin señal. Intenta de nuevo.'); return; }
  gate('espera');
}

function salir(){ if(!confirm('¿Salir de tu cuenta?'))return;
  localStorage.removeItem('cp_yo'); location.reload(); }

/* ==================== ESCOGER BASE ==================== */
async function entrarApp(){
  $('gate').style.display='none';
  $('bases').style.display='block';
  $('bases').innerHTML='<div class="vacio">Buscando tus bases…</div>';

  const [bases,asign]=await Promise.all([
    GET('mkr_bases?select=*&activa=eq.true&order=nombre&limit=200'),
    GET('mkr_asignaciones?select=base_id,agente_id,sentido&limit=2000')
  ]);
  if(!Array.isArray(bases)){ $('bases').innerHTML='<div class="vacio">'+esc(porQueFallo())+'</div>'; return; }

  /* Se traen TODAS las asignaciones, no solo las mias: para saber en que punto
     arranco necesito saber cuantas somos en esa base. */
  const todasAsig = Array.isArray(asign)?asign:[];
  const mias=new Set(todasAsig.filter(a=>a.agente_id===YO.id).map(a=>a.base_id));

  /* PUNTO DE ARRANQUE, repartido parejo.
     Antes eran tres nombres fijos -inicio, medio, fin- y con una cuarta persona
     se acababan. Ahora la base se parte en tantos puntos como gente asignada
     haya: con 4 personas y 1.200 empresas, cada una arranca 300 mas adelante que
     la anterior. Sirve para cualquier numero y se reacomoda solo al agregar a
     alguien. El orden es por agente_id, que no cambia. */
  SENTIDO={};
  const porBase={};
  todasAsig.forEach(a=>{ (porBase[a.base_id]=porBase[a.base_id]||[]).push(a.agente_id); });
  Object.keys(porBase).forEach(bid=>{
    const eq=[...new Set(porBase[bid])].sort();
    SENTIDO[bid]={ puesto: Math.max(0, eq.indexOf(YO.id)), cuantos: eq.length || 1 };
  });
  /* Cuando Lupe se abre desde una app (nido/index.html?…&app=nido) solo se
     muestran las bases que le pertenecen a esa app. Asi la persona no ve el
     pozo entero cuando entro a trabajar un cliente puntual. */
  const APP=(new URLSearchParams(location.search).get('app')||'').trim().toLowerCase();
  const miNivel=NIVELES.indexOf(YO.nivel||'principiante');
  const miCed=YO.ced||'todos';
  misBases=bases.filter(b=>{
    // si se entro desde una app, solo las bases que van a esa app
    if(APP && String(b.destino_app||'').toLowerCase()!==APP) return false;
    /* el CED manda: si a la persona le asignaron un centro, solo ve las bases
       de ese centro. Las bases abiertas a 'todos' las ve cualquiera. */
    const bCed=b.ced||'todos';
    if(miCed!=='todos' && bCed!=='todos' && bCed!==miCed) return false;
    // después: si te la asignaron, es tuya. Si nadie asignó nada, se abre por nivel.
    if(mias.size) return mias.has(b.id);
    const req=(!b.nivel||b.nivel==='todos')?-1:NIVELES.indexOf(b.nivel);
    return miNivel>=req;
  });

  const avisoApp = APP ? `<div class="s" style="margin-top:4px">
      Viendo solo las bases de <b>${esc(APP)}</b> ·
      <a href="?" style="color:inherit">ver todas</a></div>` : '';

  if(!misBases.length){
    $('bases').innerHTML=`<h4>Hola, ${esc(YO.nombre)}</h4>
      ${APP ? `<div class="s">No hay bases de <b>${esc(APP)}</b> asignadas a ti.</div>
               <div class="vacio">Puedes <a href="?" style="color:inherit">ver todas tus bases</a>
                 o pedirle al supervisor que te asigne una.</div>`
            : `<div class="s">Todavía no tienes ninguna base asignada.</div>
               <div class="vacio">El supervisor te tiene que asignar una desde la<br>hoja de configuración de bases.</div>`}`;
    return;
  }
  if(misBases.length===1){ abrirBase(misBases[0]); return; }

  $('bases').innerHTML=`<h4>Hola, ${esc(YO.nombre)}</h4>
    <div class="s">Escoge con cuál base vas a trabajar hoy.</div>${avisoApp}
    ${misBases.map((b,i)=>`<div class="bcard" onclick="abrirBase(misBases[${i}])">
      <div class="n">${esc(b.nombre)}</div>
      <div class="d">${esc(b.descripcion||'')}</div>
      <div class="q"><span id="cnt_${esc(b.id)}">contando…</span><b>Entrar ›</b></div>
    </div>`).join('')}`;
  /* Cuantos trae cada una. Sin esto el paso de escoger base es a ciegas: se
     escoge un nombre y no hay como saber si abrio la correcta. */
  misBases.forEach(async b=>{
    try{
      const r=await fetch(SB+'/rest/v1/mkr_leads?select=id&aplica=is.true&base_id=eq.'+b.id,
        {headers:{...H,Prefer:'count=exact',Range:'0-0'}});
      const c=(r.headers.get('content-range')||'').split('/').pop();
      const e=$('cnt_'+b.id); if(e) e.textContent=(+c||0).toLocaleString('es-CO')+' por llamar';
    }catch(err){ const e=$('cnt_'+b.id); if(e) e.textContent=''; }
  });
}
function volverBases(){ if(misBases.length>1){ $('bases').style.display='block'; window.scrollTo(0,0); } }

async function abrirBase(b){
  BASE=b;
  $('bases').innerHTML='<div class="vacio">Cargando prospectos…</div>';

  // el filtro de la base, traducido a la consulta
  /* La vista mkr_leads ya deja por fuera a los que no tienen número marcable:
     el que no se puede llamar no aparece en el marcador. */
  /* base_id PRIMERO. Sin esto la consulta no filtraba NADA: los campos de SEG
     (cliente, sector, ciudad…) no existen como columnas en mkr_bases —solo `ced`,
     y en todas dice 'todos'— asi que cualquier base cargaba los prospectos de
     TODAS. Se abria "Lacteos" y salia una ferreteria del Tolima. */
  let q='mkr_leads?select=id,nombre,contacto,cel,extension,tipo_tel,ciudad,departamento,barrio,sector,direccion&aplica=is.true'
        +'&base_id=eq.'+encodeURIComponent(b.id);
  SEG.forEach(k=>{ const v=b[k]; if(v&&v!=='todos') q+='&'+k+'=eq.'+encodeURIComponent(v); });
  /* Por prioridad: los mejores primero. Sin orden, PostgREST los devuelve como
     le quede comodo y el mejor prospecto podia quedar en la fila 900. */
  /* Sin &limit: lo pone GETALL al paginar. Pedir limit=20000 NO servia — el
     servidor corta en 1.000 filas y no avisa, asi que de una base de 3.621 solo
     se veian las primeras 1.000 y el resto era inalcanzable. Pasaba en TODAS
     las bases grandes (peluquerias 7.197, Tolima 2.380). */
  q+='&order=prioridad.asc,nombre.asc';

  const [ls,ya]=await Promise.all([
    GETALL(q),
    GETALL('mkr_llamadas?select=lead_id&base_id=eq.'+b.id+'&limit=20000')
  ]);
  if(!Array.isArray(ls)){ $('bases').innerHTML='<div class="vacio">No se pudieron cargar los prospectos.</div>'; return; }

  // los ya marcados NO vuelven a salir, aunque se recargue la página
  const hechos=new Set((ya||[]).map(x=>x.lead_id).filter(Boolean));
  TODOS=ls.filter(l=>l.cel && !hechos.has(l.id));
  /* De que punta arranca cada quien. Con TRES en la misma base hacen falta tres
     puntos de partida, no dos: 'medio' corre la lista para empezar por la mitad.
     En una base de 1.223 eso deja unas 600 llamadas de distancia entre cada una
     —cuatro dias de trabajo— y si alguna alcanza a otra, la sincronizacion ya
     saca lo que la otra marco. */
  const sen = SENTIDO[b.id];
  if(sen && sen.cuantos>1 && TODOS.length){
    const salto=Math.floor(sen.puesto * TODOS.length / sen.cuantos);
    if(salto>0) TODOS=TODOS.slice(salto).concat(TODOS.slice(0,salto));
  }
  CIUDAD=''; leads=TODOS.slice(); idx=0;

  $('bases').style.display='none';
  ['hd','main','rank','inter','tarifas','ft'].forEach(id=>$(id).style.display='');
  $('yo').textContent=YO.nombre;
  pintarTag();
  pintarTarifas();
  render();
  sincronizar(); setInterval(sincronizar,4000);
}

/* Cada tarifa se puede tocar y muestra TODO lo que se ha marcado asi desde el
   primer dia. Antes esto era una tabla muerta: decia cuanto paga cada boton pero
   no dejaba ver a quien se le puso. Los interesados salen con mas detalle
   -empresa, persona, los dos celulares, casilla de enviado- porque son los
   unicos a los que hay que volver. */
let CAT_ABIERTA='';
function pintarTarifas(){
  const t=Object.assign({},TARIFA_DEF,BASE.tarifas||{});
  $('tarBody').innerHTML=RESULTADOS.map(k=>
    `<div class="t" style="cursor:pointer;align-items:center" onclick="verCategoria('${esc(k).replace(/'/g,'')}')">
       <span>${CAT_ABIERTA===k?'▾':'▸'} ${ICONO[k]||''} ${esc(k)}</span>
       <b>${cop(t[k])}<span id="cnt_cat_${esc(k).replace(/\s/g,'_')}" style="color:var(--faint);font-weight:500"></span></b>
     </div>
     <div id="cat_${esc(k).replace(/\s/g,'_')}"></div>`).join('');
  if(CAT_ABIERTA) verCategoria(CAT_ABIERTA, true);
}
async function verCategoria(k, mantener){
  const caja=$('cat_'+k.replace(/\s/g,'_')); if(!caja) return;
  if(CAT_ABIERTA===k && !mantener){ CAT_ABIERTA=''; pintarTarifas(); return; }
  CAT_ABIERTA=k;
  if(!mantener) pintarTarifas();
  const c2=$('cat_'+k.replace(/\s/g,'_')); if(!c2) return;
  c2.innerHTML='<div style="padding:8px 0;font-size:12px;color:var(--faint)">Buscando…</div>';
  /* El jefe puede mirar lo de todo el equipo; los demas solo lo suyo. El
     filtro por agente se quita SOLO cuando esJefe() lo permite, para que
     nadie vea los interesados de otro. */
  const equipo = esJefe() && VER_EQUIPO;
  const d=await GETALL('mkr_llamadas?select=id,lead_nombre,lead_ciudad,lead_cel,contacto,whatsapp,'
    +'whatsapp2,correo,creado_en,validado,trabajado,agente&resultado=eq.'+encodeURIComponent(k)
    +(equipo?'':'&agente_id=eq.'+YO.id)+'&order=creado_en.desc');
  const filas=Array.isArray(d)?d:[];
  const cnt=$('cnt_cat_'+k.replace(/\s/g,'_')); if(cnt) cnt.textContent=' · '+num(filas.length);
  const c3=$('cat_'+k.replace(/\s/g,'_')); if(!c3) return;
  /* El boton de "todo el equipo" solo se dibuja para el jefe. */
  const sw = esJefe()
    ? `<div style="padding:7px 0;border-top:1px solid var(--line)">
         <button onclick="verEquipo('${esc(k).replace(/'/g,'')}')"
           style="font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;
                  border:1px solid var(--line);background:${equipo?'#0b1f2a':'transparent'};
                  color:${equipo?'#fff':'inherit'}">
           ${equipo?'👥 Viendo todo el equipo':'👤 Solo los míos'}
         </button>
       </div>` : '';
  if(!filas.length){ c3.innerHTML=sw+'<div style="padding:8px 0;font-size:12px;color:var(--faint)">'
      +(equipo?'Nadie ha marcado ninguna así.':'Todavía no has marcado ninguna así.')+'</div>'; return; }
  c3.innerHTML = sw + ((k==='Interesado') ? filas.map(x=>filaInteresado(x,equipo)).join('')
    : filas.map(x=>`<div style="display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12px">
        <div style="flex:1;min-width:0">${esc(x.lead_nombre||'(sin nombre)')}
          <span style="color:var(--faint)">${esc(x.lead_ciudad||'')}</span>
          ${equipo&&x.agente?'<span style="color:var(--faint)"> · '+esc(x.agente)+'</span>':''}</div>
        <div style="color:var(--faint);white-space:nowrap">${esc(String(x.creado_en||'').slice(0,10))}</div>
      </div>`).join(''));
}

/* Prende y apaga la vista de todo el equipo. Solo responde si es jefe: si
   alguien la llama desde la consola sin serlo, no pasa nada. */
let VER_EQUIPO=false;
function verEquipo(k){
  if(!esJefe()) return;
  VER_EQUIPO=!VER_EQUIPO;
  verCategoria(k, true);
}

function trabarTarjeta(trabada){
  MARCANDO=trabada;
  document.querySelectorAll('#main .res button, #main .nav button, #main .nav select')
    .forEach(b=>b.disabled=trabada);
}
function render(){
  /* Cada vez que se repinta la tarjeta los botones nacen nuevos y prendidos:
     aqui se destraba, no en cada salida de marcar(). */
  MARCANDO=false;
  if(!leads.length){
    $('main').innerHTML=`<div class="card"><div class="emp">No quedan prospectos</div>
      <div class="sub" style="margin-top:8px">${CIUDAD
        ? 'Ya trabajaste todo lo de <b>'+esc(CIUDAD)+'</b>. Quedan '+num(TODOS.length)+' en las demás ciudades.'
        : 'Ya trabajaste toda esta base.'}</div>
      ${CIUDAD?`<div class="nav"><button onclick="filtrarCiudad('')">🗺️ Ver todas las ciudades</button></div>`:''}
      ${misBases.length>1?'<div class="nav"><button onclick="volverBases()">Escoger otra base</button></div>':''}</div>`;
    return;
  }
  if(idx>=leads.length) idx=0;
  if(idx<0) idx=leads.length-1;
  const l=leads[idx], cel=soloNum(l.cel);
  const t=Object.assign({},TARIFA_DEF,BASE.tarifas||{});
  const botones=RESULTADOS.map(k=>
    `<button class="b-${k.replace(/\s/g,'')}" onclick="marcar('${esc(k).replace(/'/g,'')}')">
      ${ICONO[k]||''} ${esc(k)}<small>${cop(t[k])}</small></button>`).join('');

  $('main').innerHTML=`<div class="card">
    ${selectorCiudad()}
    <div class="tags">
      ${l.ciudad&&l.ciudad!=='todos'?`<span class="tg ciu">${esc(l.ciudad)}</span>`:''}
      ${l.sector&&l.sector!=='todos'?`<span class="tg">${esc(l.sector)}</span>`:''}
    </div>
    <div class="empw"><img class="rat" src="raton-chico.png" alt=""><div class="emp">${esc(l.nombre||'Sin nombre')}</div></div>
    ${l.departamento&&l.departamento!=='todos'?`<div class="sub">${esc(l.departamento)}</div>`:''}
    ${l.contacto?`<div class="cont">${esc(l.contacto)}</div>`:''}
    <div class="num mono">${esc(cel.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3'))}</div>
    <a class="call" href="tel:+57${esc(cel)}">📞 LLAMAR</a>
    ${l.extension?`<div class="ext">Al contestar, marca la extensión <b>${esc(l.extension)}</b></div>`:''}
    <div class="res">${botones}</div>
    <div id="panel"></div>
    <!-- Volver al anterior: si uno se pasa de largo o quiere retomar al que
         acaba de dejar, sin tener que recorrer toda la lista otra vez. -->
    <div class="nav"><button onclick="mover(-1)">⏮ Anterior</button><button onclick="mover(1)">Saltar sin marcar ⏭</button></div>
    <!-- Corregir el rubro NO es un resultado de llamada: no paga ni cuenta como
         marcacion, y por eso NO va en el teclado de arriba (ese tiene que seguir
         igual en toda base). Sirve para el caso de "aparece en Distribuidores
         pero en realidad es una empresa que consume dotacion". -->
    ${misBases.length>1?`<div class="nav"><select id="destBase" onchange="moverDeBase(this.value)">
      <option value="">🏢 Está en la base equivocada…</option>
      ${misBases.filter(b=>b.id!==BASE.id).map(b=>`<option value="${esc(b.id)}">Pasar a ${esc(b.nombre)}</option>`).join('')}
    </select></div>`:''}
    <div class="prog">${num(idx+1)} de ${num(leads.length)} por llamar</div>
  </div>`;
}
function mover(d){ idx+=d; render(); window.scrollTo(0,0); }

/* Quita el prospecto de la vista Y de la base completa. Si solo se quitara de
   leads, al volver a "todas las ciudades" reaparecería el que ya se marcó. */
function sacarActual(){
  const l=leads[idx]; if(!l) return;
  const i=TODOS.indexOf(l); if(i>=0) TODOS.splice(i,1);
  leads.splice(idx,1);
}
const cSin='(sin ciudad)';
function filtrarCiudad(v){
  CIUDAD=v||'';
  leads = !CIUDAD ? TODOS.slice()
        : CIUDAD===cSin ? TODOS.filter(l=>!String(l.ciudad||'').trim())
        : TODOS.filter(l=>String(l.ciudad||'')===CIUDAD);
  idx=0; pintarTag(); render(); window.scrollTo(0,0);
}
/* ---------- interesados por trabajar ---------- */
let INTER=[];
async function cargarInteresados(){
  if(!YO) return;
  const d=await GETALL('mkr_llamadas?select=id,lead_nombre,lead_ciudad,lead_cel,contacto,whatsapp,'
    +'whatsapp2,correo,creado_en,validado,estado_venta&resultado=eq.Interesado&trabajado=is.false&base_id=not.is.null'
    +'&agente_id=eq.'+YO.id+'&order=creado_en.desc');
  INTER=Array.isArray(d)?d:[];
  pintarInteresados();
}
function pintarInteresados(){
  const b=$('inBody'), i=$('inInfo'); if(!b) return;
  i.textContent = INTER.length ? INTER.length+(INTER.length===1?' por trabajar':' por trabajar') : 'ninguno pendiente';
  if(!INTER.length){
    b.innerHTML='<div class="vacio" style="padding:18px">Todo al día. Cuando marques un interesado aparece acá para mandarle la información.</div>';
    return;
  }
  b.innerHTML=INTER.map(filaInteresado).join('');
}

/* Una sola forma de pintar el interesado, usada por la lista de arriba Y por la
   categoria desplegada: si se pintaran distinto, en un lado faltaria el segundo
   celular o la casilla, y nadie se daria cuenta. */
function filaInteresado(x, equipo){
  const lindo=t=>String(t||'').replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3');
  /* Los dos numeros, no uno: el marcado es por donde se llamo y el otro es el
     que dieron para mandar la informacion. Con uno solo toca adivinar. */
  const nums=[...new Set([soloNum(x.whatsapp||x.lead_cel||''), soloNum(x.whatsapp2||'')])].filter(n=>n.length>=10);
  const ya=!!x.trabajado;
  /* Se dice lo que FALTA, no se deja el hueco en blanco: si no se ve que falta
     el nombre, nadie lo pregunta cuando escribe. */
  const det=[x.lead_ciudad||'',
             (equipo && x.agente) ? '📞 '+esc(x.agente) : '',
             x.contacto ? '👤 '+esc(x.contacto) : '<span class="falta">sin nombre de contacto</span>',
             x.correo ? '✉️ '+esc(x.correo) : '',
             x.validado ? '' : '<span class="falta">sin datos · no ha pagado</span>',
             ya ? '<b style="color:#25D366">enviado</b>' : ''
            ].filter(Boolean).join(' · ');
  return `<div class="iw${ya?' hecho':''}">
    <div class="ie">${esc(x.lead_nombre||'(sin nombre)')}</div>
    <div class="id">${det}</div>
    <div class="ib">
      ${nums.length ? nums.map(n=>`<span class="inum">${esc(lindo(n))}</span>`).join('')
        : '<span class="falta" style="font-size:12px">sin teléfono · hay que buscarlo</span>'}
      ${ya ? '' : `<label class="ick"><input type="checkbox"
          onchange="trabajado('${esc(x.id)}')"> enviado</label>`}
    </div>
  </div>`;
}
async function trabajado(id){
  const antes=INTER.slice();
  const x=INTER.find(z=>z.id===id) || {};
  INTER=INTER.filter(z=>z.id!==id); pintarInteresados();       // se va de una, sin esperar
  try{
    const r=await fetch(SB+'/rest/v1/mkr_llamadas?id=eq.'+encodeURIComponent(id),
      {method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({trabajado:true})});
    if(!r.ok) throw new Error(r.status);
    await alEmbudo(x);
    toast('✅ Enviado · pasa al CRM'+(BASE&&BASE.destino_ced?' de '+BASE.destino_ced:''));
  }catch(e){ INTER=antes; pintarInteresados(); toast('⚠️ No se pudo guardar. Revisa la señal.',true); }
}

/* Aqui sale de Lupe y entra al CRM de la app que le corresponde.
   La llave es EL TELEFONO de 10 digitos: es el unico dato que no cambia de
   forma. Si se usara el nombre, "ACISSCO" y "Acissco Dotaciones" quedarian como
   dos clientes distintos y dos personas los llamarian.
   Va el sello de la base (base_origen): el prospecto vive UNA sola vez, pero el
   CRM tiene que poder decir de donde salio para que otro CED no se lo trabaje
   encima al que si es dueño. */
async function alEmbudo(x){
  if(!BASE || !BASE.destino_app) return;                    // base sin ruta: no se manda a ciegas
  const tel=soloNum(x.whatsapp||x.lead_cel||'');
  if(tel.length<10) return;                                  // sin telefono no hay llave
  try{
    await fetch(SB+'/rest/v1/nc_crm_embudo?on_conflict=empresa,lead_key',{method:'POST',
      headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({
        /* CED guarda su embudo con empresa='feroz' —NC_EMPRESA se quedo en
           'feroz' a proposito, ver ced/index.html— asi que si Lupe estampa
           'ced' el CRM de CED no lo encuentra nunca. Se traduce aqui, sin
           tocar el dato de la base. */
        empresa: ({ced:'feroz'})[BASE.destino_app] || BASE.destino_app,
        ced:     BASE.destino_ced || null,
        lead_key: tel,
        nombre:  x.lead_nombre || '',
        telefono: tel,
        ciudad:  x.lead_ciudad || null,
        canal:   'lupe',
        /* El primer paso del embudo ya esta hecho: esta llamada ES el
           contacto. Se estampa con la fecha de hoy para que el CRM no lo
           pida otra vez ni lo muestre vacio. */
        fechas:  {0: new Date().toISOString().slice(0,10)},
        etapa:   2,                                          // ya se le mando la informacion
        contactado_por: YO.nombre || null,
        base_origen: BASE.nombre,
        base_id: BASE.id,
        updated_at: new Date().toISOString()
      })});
  }catch(e){}
}

let ultimoChequeo=0;
async function mirarVersion(){
  if(Date.now()-ultimoChequeo < 300000) return;      // cada 5 minutos, no mas
  ultimoChequeo=Date.now();
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const t=await r.text();
    const m=t.match(/const VER='([^']+)'/);
    if(m && m[1]!==VER && !$('nuevaVer')){
      const d=document.createElement('div');
      d.id='nuevaVer';
      d.textContent='✨ Hay una versión nueva · toca aquí para actualizar';
      d.onclick=()=>location.reload();
      d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:14px;'
        +'background:#16a34a;color:#fff;text-align:center;font-weight:600;cursor:pointer;'
        +'box-shadow:0 -4px 18px rgba(0,0,0,.3)';
      document.body.appendChild(d);
    }
  }catch(e){}
}

function pintarTag(){
  if(!BASE) return;
  $('baseTag').textContent='📁 '+BASE.nombre+(CIUDAD?' · '+CIUDAD:'')+' · '
    +leads.length.toLocaleString('es-CO')
    +((SENTIDO[BASE.id]&&SENTIDO[BASE.id].cuantos>1)
        ? ' · punto '+(SENTIDO[BASE.id].puesto+1)+' de '+SENTIDO[BASE.id].cuantos : '')
    +(misBases.length>1?' · cambiar':'');
}
/* Las ciudades salen de la base en memoria, no de otra consulta: asi el numero
   de al lado es el que queda DE VERDAD por llamar, ya descontado lo marcado. */
function selectorCiudad(){
  const c={}; TODOS.forEach(l=>{ const k=String(l.ciudad||'').trim()||cSin; c[k]=(c[k]||0)+1; });
  const orden=Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b,'es'));
  if(orden.length<2) return '';
  return `<div class="nav"><select id="selCiudad" onchange="filtrarCiudad(this.value)">
    <option value="">🗺️ Todas las ciudades (${num(TODOS.length)})</option>
    ${orden.map(k=>`<option value="${esc(k)}"${k===CIUDAD?' selected':''}>${esc(k)} (${num(c[k])})</option>`).join('')}
  </select></div>`;
}

/* Pasa el prospecto a otra base. Escribe en mkr_empresas y NO en mkr_leads,
   porque mkr_leads es una vista y no se puede actualizar.
   Lee las notas antes de escribir: si se sobreescriben, se pierde de que rubro
   venia (DOTACION, Metalmecanica...) y ya no habria como devolverlo. */
async function moverDeBase(destino){
  const sel=$('destBase');
  if(!destino) return;
  const l=leads[idx], dest=misBases.find(b=>b.id===destino);
  if(!l||!dest){ if(sel) sel.value=''; return; }
  if(sel) sel.disabled=true;
  try{
    let antes='';
    const p=await fetch(SB+'/rest/v1/mkr_empresas?select=notas&id=eq.'+encodeURIComponent(l.id),{headers:H});
    if(p.ok) antes=((await p.json())[0]||{}).notas||'';
    const sello='Movida desde "'+BASE.nombre+'" por '+YO.nombre;
    const r=await fetch(SB+'/rest/v1/mkr_empresas?id=eq.'+encodeURIComponent(l.id),
      {method:'PATCH',headers:{...H,'Content-Type':'application/json',Prefer:'return=minimal'},
       body:JSON.stringify({base_id:destino, notas:(antes?antes+' · ':'')+sello})});
    if(!r.ok) throw new Error(r.status);
    sacarActual();                            // se va de las dos listas, no se vuelve a ver
    toast('🏢 Pasó a '+dest.nombre);
    render(); window.scrollTo(0,0);
  }catch(e){
    if(sel){ sel.disabled=false; sel.value=''; }
    toast('⚠️ No se pudo mover. Revisa la señal.',true);
  }
}

async function marcar(resultado){
  if(MARCANDO) return;                       // doble toque = una sola llamada
  const l=leads[idx]; if(!l||!BASE) return;
  trabarTarjeta(true);
  const tarifa=+Object.assign({},TARIFA_DEF,BASE.tarifas||{})[resultado]||0;
  const esInteresado = resultado==='Interesado';

  // El interesado NO paga hasta que tenga contacto. Lo demás paga de una.
  /* agente_id y agente_cel son los que cuentan para pagar. 'agente' queda solo
     para mostrar: escrito a mano se partia en "José", "Jose" y "JOSE". */
  const body={sala:BASE.cliente||'general', agente:YO.nombre,
    agente_id:YO.id||null, agente_cel:YO.celular||null, base_id:BASE.id, lead_id:l.id,
    lead_fila:String(l.id), lead_nombre:l.nombre||null, lead_ciudad:l.ciudad||null,
    lead_cel:soloNum(l.cel)||null,
    resultado, valor: esInteresado?0:tarifa, datos:false,
    validado: !esInteresado, estado_venta:'nuevo'};

  // GUARDA PRIMERO. Si falla, no se toca el contador ni se pasa de prospecto.
  let fila=null;
  try{
    const r=await fetch(SB+'/rest/v1/mkr_llamadas',{method:'POST',
      headers:{...H,Prefer:'return=representation'},body:JSON.stringify(body)});
    if(r.ok) fila=(await r.json())[0];
  }catch(e){ fila=null; }

  if(!fila){
    trabarTarjeta(false);                    // no se guardo: se puede volver a marcar
    toast('⚠️ No se guardó. Revisa la señal y vuelve a marcar.',true);
    return;                                  // el prospecto se queda ahí
  }

  /* Habeas data: la persona ejercio un derecho. No basta con quitarla de esta
     base — se bloquea el telefono y la vista mkr_leads deja de mostrarlo en
     cualquier base. Se hace DESPUES de guardar la llamada, para no perder el
     registro si esto falla. */
  if(resultado==='Habeas data'){
    try{
      await fetch(SB+'/rest/v1/mkr_no_llamar?on_conflict=telefono',{method:'POST',
        headers:{...H,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({telefono:soloNum(l.cel), motivo:'habeas data',
          nombre:l.nombre||null, base_id:BASE.id, agente:YO.nombre})});
      toast('🛡️ Queda bloqueado en todas las bases');
    }catch(e){ toast('⚠️ Se guardó la llamada, pero no el bloqueo. Avisa.',true); }
  }

  /* Interesado: la tarjeta QUEDA trabada. La unica salida es el panel de abajo
     —Enviar info, Pendiente o Catalogo enviado—, que es el que pasa al siguiente. */
  if(esInteresado){ abrirPanel(fila,l,tarifa); return; }
  miPlata+=tarifa; misLlamadas++; pintarPlata(true);
  sacarActual(); render(); window.scrollTo(0,0);
}

/* ---------- panel del interesado: aquí SÍ se guarda el contacto ---------- */
function abrirPanel(fila,l,tarifa){
  pendientes++; pintarPlata(false);
  const c=$('panel'); if(!c) return;
  c.innerHTML=`<div class="pan">
    <h5>📋 Datos del interesado</h5>
    <div class="ps">Sin contacto no se puede vender, y por eso <b>este resultado todavía no paga</b>.
      Guarda los datos y se te abonan ${cop(tarifa)}.</div>
    <input id="pC" placeholder="Nombre de quien contestó" value="${esc(l.contacto||'')}">
    <!-- El WhatsApp viene puesto con el numero que se acaba de marcar: es al que
         se llamo, y hacerla teclear lo que ya esta en pantalla cuesta tiempo que
         en la llamada no hay. Si dan otro, va en la casilla de abajo. -->
    <input id="pW" inputmode="tel" placeholder="WhatsApp" value="${esc(soloNum(l.cel))}">
    <input id="pW2" inputmode="tel" placeholder="Otro celular (si dan uno distinto)">
    <input id="pM" inputmode="email" placeholder="Correo">
    <div class="pb">
      <button class="g" onclick="guardarPanel('${fila.id}',${tarifa})">📤 Enviar info</button>
      <button class="s" onclick="cerrarPanel()">⏳ Pendiente</button>
    </div>
    <!-- Guarda igual que arriba, pero ademas deja anotado que ya se le mando el
         catalogo. Asi el seguimiento sabe que a este ya se le enviO material y
         no se le vuelve a mandar lo mismo. -->
    <button class="cat" onclick="guardarPanel('${fila.id}',${tarifa},true)">📄 Catálogo enviado
      <small style="display:block;font-weight:500;opacity:.8;font-size:11px">se guarda al ${esc(soloNum(l.cel))} y pasa al siguiente</small></button>
    </div>`;
  /* El panel sale DEBAJO de los botones: si la pantalla no baja sola, parece
     que el boton no hizo nada. */
  setTimeout(()=>{ c.scrollIntoView({behavior:'smooth',block:'center'});
                   const w=$('pW'); if(w)w.focus(); },60);
  toast('👇 Llena los datos abajo para pasar al siguiente');
}

async function guardarPanel(id,tarifa,catalogo){
  const c=($('pC')||{}).value||'', m=($('pM')||{}).value||'';
  const w2=($('pW2')||{}).value||'';
  let w=($('pW')||{}).value||'';
  /* Si mando el catalogo y no escribio otro WhatsApp, es al numero que tiene en
     pantalla: se lo acaba de mandar a ese. Pedirselo de nuevo es hacerlo teclear
     lo que ya esta ahi. */
  if(catalogo && !w.trim() && !m.trim()){
    const l=leads[idx]; if(l && l.cel) w=soloNum(l.cel);
  }
  if(!w.trim() && !m.trim()){ toast('Falta el WhatsApp o el correo',true); return; }
  try{
    const r=await fetch(SB+'/rest/v1/mkr_llamadas?id=eq.'+id,{method:'PATCH',
      headers:{...H,Prefer:'return=minimal'},
      body:JSON.stringify({contacto:c.trim()||null, whatsapp:soloNum(w)||null,
        whatsapp2:soloNum(w2)||null, correo:m.trim()||null,
        datos:true, validado:true, valor:tarifa, actualizado:new Date().toISOString(),
        estado_venta: catalogo?'catalogo_enviado':'nuevo'})});
    if(!r.ok){ toast('No se pudo guardar. Intenta otra vez.',true); return; }
  }catch(e){ toast('Sin señal. Intenta otra vez.',true); return; }
  pendientes=Math.max(0,pendientes-1);
  miPlata+=tarifa; pintarPlata(true);
  toast((catalogo?'📄 Catálogo enviado y guardado · siguiente · +':'✅ Contacto guardado · siguiente · +')+cop(tarifa));
  cerrarPanel();
}
function cerrarPanel(){
  const c=$('panel'); if(c) c.innerHTML='';
  sacarActual(); render(); window.scrollTo(0,0);
}

function pintarPlata(bump){
  /* El numero de marcaciones al lado de la plata: sin el, uno no sabe si el
     dia rindio poco porque llamo poco o porque los resultados pagaron poco. */
  const e=$('plata'); e.textContent=cop(miPlata)+(misLlamadas?'  ('+num(misLlamadas)+')':'');
  if(bump){ e.classList.add('bump'); setTimeout(()=>e.classList.remove('bump'),190); }
  $('pend').textContent = pendientes ? ('⏳ '+pendientes+' interesado(s) sin datos — no pagan todavía') : '';
}

/* ==================== TABLERO REAL ==================== */
async function sincronizar(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  /* Sin filtro de base a proposito: el tablero es de TODA la red. Da igual que
     una este en Ibague y otra en calzado — compiten entre si, y eso es lo que
     empuja a marcar. */
  const filas=await GETALL('mkr_llamadas?select=agente,agente_id,valor,validado,creado_en'+
    '&creado_en=gte.'+hoy.toISOString()+'&order=creado_en.desc&limit=5000');
  if(!Array.isArray(filas)){ $('live').classList.add('off'); $('liveTx').textContent='sin señal'; return; }
  $('live').classList.remove('off'); $('liveTx').textContent='en vivo';

  /* Se agrupa por agente_id, no por el nombre: el nombre se escribe libre y la
     misma persona quedaba partida en varias filas del tablero. */
  const real={};
  filas.forEach(f=>{
    const k=f.agente_id||('n:'+f.agente);
    const a=real[k]=real[k]||{id:f.agente_id||null,agente:f.agente,llamadas:0,plata:0};
    a.llamadas++; if(f.validado) a.plata+=(+f.valor||0);
  });
  /* Y entran TODAS las habilitadas, aunque todavia no hayan marcado. Si solo
     aparece quien ya marco, el primero del dia no tiene contra quien competir. */
  if(!sincronizar.agentes){
    sincronizar.agentes = await GET('mkr_agentes?select=id,nombre&activo=is.true&limit=200') || [];
  }
  sincronizar.agentes.forEach(g=>{
    if(!real[g.id]) real[g.id]={id:g.id, agente:g.nombre, llamadas:0, plata:0};
  });
  const yoKey = YO.id||('n:'+YO.nombre);
  if(real[yoKey]){ miPlata=real[yoKey].plata; misLlamadas=real[yoKey].llamadas; }
  pintarPlata(false);

  /* Y lo que de verdad importa cuando hay DOS trabajando la misma base: sacar
     de la lista lo que la otra ya marco. Antes esto solo se leia al entrar, asi
     que las dos trabajaban sobre la foto que bajaron al abrir y terminaban
     llamando a la misma empresa. No se toca la pantalla si hay un panel de
     interesado abierto, para no borrarle lo que esta escribiendo. */
  if(BASE && !($('panel')||{}).innerHTML){
    const ya=await GETALL('mkr_llamadas?select=lead_id&base_id=eq.'+BASE.id);
    if(Array.isArray(ya) && ya.length){
      const hechos=new Set(ya.map(x=>x.lead_id).filter(Boolean));
      const antes=leads.length, actual=leads[idx] && leads[idx].id;
      TODOS=TODOS.filter(l=>!hechos.has(l.id));
      leads=leads.filter(l=>!hechos.has(l.id));
      if(leads.length!==antes){
        const i=leads.findIndex(l=>l.id===actual);      // quedarse en el mismo si sigue
        idx = i>=0 ? i : Math.min(idx, Math.max(0, leads.length-1));
        pintarTag(); render();
      }
    }
  }

  mirarVersion();                                   // se vigila sola, sin molestar
  cargarInteresados();                              // los que quedaron por trabajar

  const todos=Object.values(real).sort((a,b)=>b.plata-a.plata||b.llamadas-a.llamadas);
  $('rkBody').innerHTML=todos.map((a,i)=>{
    const soyYo=(a.id&&YO.id&&a.id===YO.id)||a.agente===YO.nombre;
    return `<div class="rw ${soyYo?'yo':''}" style="cursor:pointer" onclick="verSemanas('${a.id||''}','${esc(a.agente).replace(/'/g,'')}')" title="Toca para ver semana por semana">
      <div class="pos">${i+1}</div>
      <div class="nm">${esc(a.agente)}<small>${soyYo?'tú':(a.llamadas?'marcando':'todavía no marca')} · toca para ver tus semanas</small></div>
      <div class="ll">${num(a.llamadas)} ll.</div>
      <div class="pl mono">${cop(a.plata)}</div>
    </div>`;}).join('')||'<div class="vacio" style="padding:22px">Nadie ha marcado hoy.</div>';
  const activas=todos.filter(a=>a.llamadas>0).length;
  $('rkInfo').textContent=todos.length+' en la red · '+activas+(activas===1?' marcando':' marcando');
  $('rkTot').innerHTML='Solo cuenta lo validado · total del día <b style="color:var(--dim)">'+
    cop(todos.reduce((s,a)=>s+a.plata,0))+'</b>';
}

/* ==================== SEMANA POR SEMANA ====================
   El tablero se reinicia cada dia, asi que la persona no tenia forma de ver
   cuanto lleva hecho ni que ya le pagaron. Tocando el nombre se abre esto:
   una fila por semana con lo producido, lo pagado y lo que queda debiendo.
   La semana se calcula ISO (lunes a domingo), la misma que usa mkr_pagos. */
function semanaISO(f){
  const t=new Date(Date.UTC(f.getFullYear(),f.getMonth(),f.getDate()));
  const dia=t.getUTCDay()||7;                       // domingo=7, no 0
  t.setUTCDate(t.getUTCDate()+4-dia);               // al jueves de esa semana
  const ene1=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const n=Math.ceil(((t-ene1)/86400000+1)/7);
  return t.getUTCFullYear()+'-W'+String(n).padStart(2,'0');
}
let semAbierta=null, semAg={id:null,nombre:''};
/* Solo el dueño de la red liquida. No es una barrera de seguridad -la llave es
   publica-, es para que a una telemercaderista no le salga un boton que le
   dejaria marcarse a si misma como pagada. */
const JEFES=['jose'];
function esJefe(){ return !!(YO && JEFES.indexOf(String(YO.usuario||'').toLowerCase())>=0); }
async function verSemanas(id,nombre){
  const cont=$('semanas'); if(!cont) return;
  if(semAbierta===(id||nombre)){ cont.innerHTML=''; semAbierta=null; return; }   // segundo toque, cierra
  semAbierta=id||nombre; semAg={id:id||null,nombre:nombre||''};
  cont.innerHTML='<div style="padding:14px;text-align:center;color:var(--dim)">cargando…</div>';
  const filtro = id ? 'agente_id=eq.'+encodeURIComponent(id)
                    : 'agente=eq.'+encodeURIComponent(nombre);
  const [ll,pg]=await Promise.all([
    GETALL('mkr_llamadas?select=valor,validado,creado_en&'+filtro+'&order=creado_en.desc&limit=20000'),
    id ? GETALL('mkr_pagos?select=semana,valor,fecha_pago,medio&agente_id=eq.'+encodeURIComponent(id)) : []
  ]);
  if(!Array.isArray(ll)){ cont.innerHTML='<div class="foot">No se pudo leer el historial.</div>'; return; }
  const pagado={}; (Array.isArray(pg)?pg:[]).forEach(p=>{ pagado[p.semana]=(pagado[p.semana]||0)+(+p.valor||0); });
  const sem={};
  ll.forEach(f=>{
    const k=semanaISO(new Date(f.creado_en));
    const s=sem[k]=sem[k]||{ll:0,plata:0};
    s.ll++; if(f.validado) s.plata+=(+f.valor||0);
  });
  Object.keys(pagado).forEach(k=>{ if(!sem[k]) sem[k]={ll:0,plata:0}; });   // semanas pagadas sin marcaciones
  const claves=Object.keys(sem).sort().reverse();
  if(!claves.length){ cont.innerHTML='<div class="foot">'+esc(nombre)+' todavía no tiene semanas registradas.</div>'; return; }
  const actual=semanaISO(new Date());
  const jefe=esJefe() && !!id;      // sin ficha de agente no hay a quien cargarle el pago
  let tp=0,tg=0,debeTot=0,nDebe=0;
  const G = jefe ? '26px 86px 1fr auto auto' : '86px 1fr auto auto';
  const filas=claves.map(k=>{
    const s=sem[k], pa=pagado[k]||0, debe=s.plata-pa;
    tp+=s.plata; tg+=pa;
    const puede = debe>0;                 // solo se puede pagar lo que se debe
    if(puede){ debeTot+=debe; nDebe++; }
    const nSem=+k.slice(6), esta=k===actual;
    /* La casilla va con el valor pegado: al liquidar se escribe EXACTAMENTE lo
       que falta de esa semana, no un numero escrito a mano. */
    const ck = !jefe ? '' : (puede
      ? `<input type="checkbox" data-sem="${k}" data-debe="${debe}" style="width:18px;height:18px;cursor:pointer;accent-color:#22c55e">`
      : '<span style="opacity:.25;font-size:15px">✔</span>');
    return `<div style="display:grid;grid-template-columns:${G};gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07)${esta?';background:rgba(255,255,255,.05)':''}">
      ${jefe?ck:''}
      <div style="font-weight:800">Semana ${nSem}${esta?' <small style="opacity:.7">· esta</small>':''}<br><small style="opacity:.55">${k.slice(0,4)}</small></div>
      <div style="font-size:12px;opacity:.7">${num(s.ll)} llamada${s.ll===1?'':'s'}</div>
      <div class="mono" style="font-weight:800;text-align:right">${cop(s.plata)}</div>
      <div class="mono" style="text-align:right;font-size:12px;min-width:96px">${
        pa>=s.plata && s.plata>0 ? '<span style="color:#22c55e">✔ pagada</span>'
        : pa>0 ? '<span style="color:#f59e0b">abonado '+cop(pa)+'<br><small>falta '+cop(debe)+'</small></span>'
        : (s.plata>0?'<span style="opacity:.6">por pagar</span>':'<span style="opacity:.35">—</span>')}</div>
    </div>`;}).join('');
  /* La barra de liquidacion. Solo sale si hay algo que deber. */
  const barra = (!jefe || !nDebe) ? '' : `
    <div style="margin-top:10px;border-top:1px dashed rgba(255,255,255,.18);padding-top:10px">
      <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;opacity:.7;cursor:pointer;text-decoration:underline" onclick="marcarTodas(true)">marcar todas</span>
        <span style="font-size:12px;opacity:.7;cursor:pointer;text-decoration:underline" onclick="marcarTodas(false)">ninguna</span>
        <select id="pgMedio" style="margin-left:auto;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px">
          <option>Nequi</option><option>Efectivo</option><option>Transferencia</option><option>Daviplata</option>
        </select>
      </div>
      <button onclick="pagarSemanas()" style="width:100%;margin-top:8px;padding:11px;border:none;border-radius:10px;
        background:#22c55e;color:#04220f;font-weight:800;font-size:14px;cursor:pointer">
        ✔ Marcar como pagado</button>
      <div style="font-size:11px;opacity:.55;margin-top:5px;text-align:center">
        Escoge las semanas y quedan como cuentas canceladas. Debe ${cop(debeTot)} en ${nDebe} semana${nDebe===1?'':'s'}.</div>
    </div>`;
  cont.innerHTML=`<div style="margin-top:12px;border-top:2px solid rgba(255,255,255,.14);padding-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <b>📅 ${esc(nombre)} · semana por semana</b>
      <span style="font-size:12px;opacity:.6;cursor:pointer" onclick="verSemanas('${id||''}','${esc(nombre).replace(/'/g,'')}')">cerrar ✕</span>
    </div>
    ${filas}
    <div class="foot" style="margin-top:8px">Producido <b class="mono">${cop(tp)}</b> · pagado <b class="mono" style="color:#22c55e">${cop(tg)}</b>${
      tp-tg>0?' · <b class="mono" style="color:#f59e0b">le deben '+cop(tp-tg)+'</b>':''}</div>
    ${barra}
  </div>`;
}
function marcarTodas(v){
  document.querySelectorAll('#semanas input[data-sem]').forEach(c=>{ c.checked=!!v; });
}
/* Liquidar: por cada semana marcada queda una fila en mkr_pagos con lo que
   faltaba de ESA semana. No se toca mkr_llamadas: lo producido es historia y no
   se reescribe; el pago es un hecho aparte que se le suma encima. */
async function pagarSemanas(){
  if(!esJefe()) return;
  if(!semAg.id){ toast('Esa persona no tiene ficha de agente: no hay a quién cargarle el pago.',true); return; }
  const cks=[].slice.call(document.querySelectorAll('#semanas input[data-sem]')).filter(c=>c.checked);
  if(!cks.length){ toast('Marca las semanas que le vas a pagar.',true); return; }
  const medio=($('pgMedio')||{}).value||'Nequi';
  const hoy=new Date().toISOString().slice(0,10);
  const filas=cks.map(c=>({agente_id:semAg.id, semana:c.dataset.sem, valor:+c.dataset.debe||0,
    fecha_pago:hoy, medio:medio, nota:'Liquidado en Lupe'}));
  const total=filas.reduce((a,f)=>a+f.valor,0);
  if(!confirm('¿Registrar el pago de '+filas.length+' semana(s) a '+semAg.nombre+' por '+cop(total)+'?\n\n'
    +'Queda escrito como pagado y desde acá no se puede deshacer.')) return;
  try{
    const r=await fetch(SB+'/rest/v1/mkr_pagos',{method:'POST',
      headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify(filas)});
    if(!r.ok) throw new Error(r.status);
    toast('✅ '+cop(total)+' registrado a '+semAg.nombre);
    const id=semAg.id, nom=semAg.nombre; semAbierta=null;
    verSemanas(id,nom);
  }catch(e){ toast('⚠️ No se pudo registrar el pago. Revisa la señal.',true); }
}

/* ==================== ARRANQUE ==================== */
(async()=>{
  const g=localStorage.getItem('cp_yo');
  if(g){
    try{
      const {id}=JSON.parse(g);
      const ags=await GET('mkr_agentes?select=id,nombre,usuario,celular,nivel,ced,activo&id=eq.'+encodeURIComponent(id)+'&limit=1');
      if(Array.isArray(ags)&&ags[0]&&ags[0].activo!==false){ YO=ags[0]; await entrarApp(); return; }
    }catch(e){}
    localStorage.removeItem('cp_yo');
  }
  pintarGate();
  /* Tambien antes de entrar, y cada minuto: si alguien quedo con la pagina vieja
     abierta en el celular, no puede entrar y no se entera. El aviso tiene que
     alcanzarlo en la pantalla de ingreso, no despues. */
  mirarVersion(); setInterval(mirarVersion, 60000);
})();
</script>
