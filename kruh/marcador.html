<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>kruh · marcador</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5efe4; --card:#fffdf8; --ink:#2a1f16; --ink2:#5b4d3f; --mut:#9a8b78;
    --line:#e7ddc9; --line2:#f0e9da; --acc:#b5651d; --acc2:#d98b3f; --gold:#caa23c;
    --ok:#4f7a4a; --okbg:#e6f1e2; --warn:#b4622e; --bad:#a8392c; --badbg:#f7e2dd;
    --sh:0 1px 2px rgba(40,25,10,.05),0 12px 30px -18px rgba(40,25,10,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:slashed-zero}
  header{background:var(--ink);color:var(--paper);padding:13px 0}
  .hd{max-width:560px;margin:0 auto;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:600;line-height:1}
  .brand b{color:var(--acc2)}
  .brand small{display:block;font-family:'IBM Plex Sans';font-size:9px;letter-spacing:.3em;color:var(--gold);margin-top:3px;text-transform:uppercase}
  .quien{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#b6a894;text-align:right}
  .wrap{max-width:560px;margin:0 auto;padding:0 15px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:12px;box-shadow:var(--sh)}
  label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:9px 0 4px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  .btn{padding:12px 16px;border:none;border-radius:9px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;width:100%}
  .btn.gh{background:transparent;border:1px solid var(--line);color:var(--ink2)}
  .btn.sm{padding:8px 12px;font-size:12px}
  .dim{color:var(--mut)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 5px;text-align:center}
  .kpi b{display:block;font-size:17px;font-family:Fraunces,serif}
  .kpi span{font-size:9.5px;color:var(--mut);letter-spacing:.04em}
  .nom{font-family:Fraunces,serif;font-size:26px;font-weight:600;line-height:1.15}
  .tel{font-size:30px;font-weight:700;letter-spacing:1px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .llamar{display:block;text-align:center;text-decoration:none;background:var(--ok);color:#fff;
    border-radius:11px;padding:16px;font-weight:700;font-size:19px;margin:12px 0 4px}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
  .res button{border:none;border-radius:10px;padding:15px 8px;font-weight:700;font-size:14px;
    color:#fff;cursor:pointer;font-family:inherit;line-height:1.25}
  .b-int{background:var(--ok)} .b-no{background:var(--bad)} .b-hab{background:#6b5f52}
  .b-sin{background:var(--mut)}
  /* segmentación rápida: lo que más se repite en una jornada de llamadas */
  .b-nc{background:#8a93a6} .b-like{background:var(--acc)} .b-flyer{background:#5b7c99}
  .res .fila3{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .hist{border-top:1px solid var(--line2);margin-top:12px;padding-top:10px}
  .hrow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line2)}
  .hrow:last-child{border:none}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--paper);border:1px solid var(--line);color:var(--ink2)}
  .pill.ok{background:var(--okbg);border-color:#c3ddbb;color:var(--ok)}
  .pill.no{background:var(--badbg);border-color:#eec9c1;color:var(--bad)}
  .pill.tibio{background:#fdf1e3;border-color:#f0d4ae;color:var(--acc)}
  .pill.gris{background:#eef0f2;border-color:#dfe3e8;color:#6b7280}
  .pill.flyer{background:#e8f0f6;border-color:#c5d8e6;color:#40607a}
  .empty{text-align:center;color:var(--mut);padding:38px 12px;font-size:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--paper);
    padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:var(--sh)}
  .barra{height:7px;background:var(--line2);border-radius:5px;overflow:hidden;margin-top:9px}
  .barra i{display:block;height:100%;background:var(--acc)}
</style>

<header><div class="hd">
  <div class="brand">kruh<b>.</b><small>marcador</small></div>
  <div class="quien" id="quien">campaña de julio</div>
</div></header>

<div class="wrap" id="app"><div class="empty">Cargando clientes…</div></div>
<div id="toast-host"></div>

<script>
const SB='https://fnayedgvamxktxfvywwl.supabase.co';
const K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function GET(p){ const r=await fetch(SB+'/rest/v1/'+p,{headers:H}); return r.ok?r.json():[]; }
async function POST(t,b){ const r=await fetch(SB+'/rest/v1/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(b)}); return r.ok?(await r.json())[0]:null; }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; $('toast-host').appendChild(d); setTimeout(()=>d.remove(),1800); }

/* las campañas salen de la base (kruh_campanas). Se crean desde el app de Kruh. */

/* hace cuánto fue: "hoy", "hace 3 días", "hace 2 meses" */
function hace(iso){
  if(!iso) return null;
  const d=new Date(iso), ahora=new Date();
  const dias=Math.floor((ahora-d)/86400000);
  if(dias<=0) return 'hoy';
  if(dias===1) return 'ayer';
  if(dias<30) return 'hace '+dias+' días';
  const m=Math.floor(dias/30);
  return m===1?'hace 1 mes':'hace '+m+' meses';
}
const soloTel=s=>String(s||'').replace(/\D/g,'');

const M={
  lista:[], idx:0, marc:[], camps:[], campana:'', filtro:'',

  async init(){
    const [leads,marc,camps]=await Promise.all([
      GET('kruh_leads?select=id,nombre,telefono,tipo,etapa&order=nombre&limit=3000'),
      GET('kruh_marcaciones?select=*&order=creado_en.desc&limit=5000'),
      GET('kruh_campanas?select=*&activa=eq.true&order=creado_en.desc&limit=100')
    ]);
    this.camps=camps||[];
    if(!this.camps.length){
      $('app').innerHTML=`<div class="card"><div class="empty">No hay ninguna campaña activa.<br><br>
        <span class="dim" style="font-size:12.5px">Créala desde Kruh → 📞 Marcador.<br>
        Si nunca has corrido el SQL de <b>kruh_campanas</b>, ese es el primer paso.</span></div></div>`;
      return;
    }
    this.campana=this.camps[0].nombre;
    this.marc=marc||[];
    // ultima marcacion de cada cliente (vienen ordenadas de mas nueva a mas vieja)
    this.ultima={};
    this.marc.forEach(m=>{ if(m.lead_id && !this.ultima[m.lead_id]) this.ultima[m.lead_id]=m; });
    // quien pidio habeas data no se vuelve a llamar, nunca
    this.bloq={}; this.marc.forEach(m=>{ if(m.resultado==='habeas'&&m.lead_id) this.bloq[m.lead_id]=true; });

    this.todos=(leads||[]).filter(l=>soloTel(l.telefono).length>=7 && !this.bloq[l.id]);
    this.armar();
    this.pintar();
  },

  /* orden: primero los que nunca se han llamado, despues los mas antiguos */
  armar(){
    const q=this.filtro.trim().toLowerCase();
    let l=this.todos.slice();
    if(q) l=l.filter(x=>String(x.nombre||'').toLowerCase().includes(q)||soloTel(x.telefono).includes(q.replace(/\D/g,'')));
    // los ya marcados en esta campaña quedan de ultimos
    l.sort((a,b)=>{
      const ma=this.ultima[a.id], mb=this.ultima[b.id];
      const ca=ma&&ma.campana===this.campana?1:0, cb=mb&&mb.campana===this.campana?1:0;
      if(ca!==cb) return ca-cb;
      const fa=ma?ma.creado_en:'', fb=mb?mb.creado_en:'';
      return String(fa).localeCompare(String(fb));
    });
    this.lista=l; if(this.idx>=l.length) this.idx=0;
  },

  hoyCuenta(){
    const hoy=new Date().toISOString().slice(0,10);
    const h=this.marc.filter(m=>String(m.creado_en||'').slice(0,10)===hoy);
    return {t:h.length,
            i:h.filter(m=>m.resultado==='interesado').length,
            n:h.filter(m=>m.resultado==='no_interesado').length,
            b:h.filter(m=>m.resultado==='habeas').length};
  },

  pintar(){
    const c=this.hoyCuenta();
    const l=this.lista[this.idx];
    // cuantos de la lista ya se marcaron en esta campaña
    const hechos=this.lista.filter(x=>{ const m=this.ultima[x.id]; return m&&m.campana===this.campana; }).length;
    const pct=this.lista.length?Math.round(hechos/this.lista.length*100):0;

    let cuerpo;
    if(!this.lista.length){
      cuerpo=`<div class="card"><div class="empty">No hay clientes con teléfono que coincidan.</div></div>`;
    } else if(!l){
      cuerpo=`<div class="card"><div class="empty">✓ Ya pasaste por todos.<br><br>
        <button class="btn gh sm" onclick="M.idx=0;M.pintar()">Volver a empezar</button></div></div>`;
    } else {
      const u=this.ultima[l.id];
      const cuando=u?hace(u.creado_en):null;
      const yaEsta=u&&u.campana===this.campana;
      cuerpo=`
      <div class="card">
        <div class="dim" style="font-size:11.5px">${this.idx+1} de ${this.lista.length}${yaEsta?' · <b style="color:var(--ok)">ya marcado en esta campaña</b>':''}</div>
        <div class="nom">${esc(l.nombre||'—')}</div>
        <div class="tel">${esc(l.telefono)}</div>

        <div style="margin-top:6px">
          ${u?`<span class="pill ${this.clasePill(u.resultado)}">
                 Última vez: ${cuando}</span>
               <div class="dim" style="font-size:12px;margin-top:5px">
                 Campaña que se usó: <b>${esc(u.campana||'—')}</b> · resultado: <b>${esc(this.nombreRes(u.resultado))}</b></div>`
             :`<span class="pill">Nunca se ha llamado</span>`}
        </div>

        <a class="llamar" href="tel:${soloTel(l.telefono)}">📞 LLAMAR</a>

        <div class="res">
          <div class="fila3">
            <button class="b-nc"    onclick="M.marcar('no_contesta')">📵 No contesta</button>
            <button class="b-like"  onclick="M.marcar('like_promo')">👍 Like Promo</button>
            <button class="b-flyer" onclick="M.marcar('flyer')">📄 Flyer anuncio</button>
          </div>
          <button class="b-int" onclick="M.marcar('interesado')">🔥 Interesado</button>
          <button class="b-no"  onclick="M.marcar('no_interesado')">❌ No interesado</button>
          <button class="b-hab" onclick="M.marcar('habeas')">🚫 Habeas data</button>
          <button class="b-sin" onclick="M.saltar()">↷ Saltar</button>
        </div>
        <div class="dim" style="font-size:11px;text-align:center;margin-top:7px">
          <b>Flyer anuncio</b> = no se le escribe, se le manda el flyer · <b>Habeas data</b> lo saca para siempre.</div>
      </div>`;
    }

    $('app').innerHTML=`
      <div class="card" style="margin-top:12px">
        <label style="margin:0 0 4px">Campaña</label>
        <select onchange="M.campana=this.value;M.idx=0;M.armar();M.pintar()">
          ${this.camps.map(x=>`<option${x.nombre===this.campana?' selected':''}>${esc(x.nombre)}</option>`).join('')}
        </select>
        ${(()=>{ const c=this.camps.find(x=>x.nombre===this.campana);
          return c&&(c.objetivo||c.descripcion)?`<div style="margin-top:7px;font-size:12.5px;line-height:1.45">
            ${c.objetivo?`<div><b>Objetivo:</b> ${esc(c.objetivo)}</div>`:''}
            ${c.descripcion?`<div class="dim">${esc(c.descripcion)}</div>`:''}</div>`:''; })()}
        <div class="barra"><i style="width:${pct}%"></i></div>
        <div class="dim" style="font-size:11.5px;margin-top:5px">${hechos} de ${this.lista.length} llamados en «${esc(this.campana)}» · ${pct}%</div>
        <label style="margin-top:10px">Buscar</label>
        <input placeholder="Nombre o teléfono" value="${esc(this.filtro)}"
               oninput="M.filtro=this.value;M.idx=0;M.armar();M.pintar();const i=document.querySelectorAll('input')[0];i.focus();i.setSelectionRange(i.value.length,i.value.length)">
      </div>

      <div class="kpis">
        <div class="kpi"><b>${c.t}</b><span>hoy</span></div>
        <div class="kpi"><b style="color:var(--ok)">${c.i}</b><span>interesados</span></div>
        <div class="kpi"><b style="color:var(--bad)">${c.n}</b><span>no</span></div>
        <div class="kpi"><b>${c.b}</b><span>habeas</span></div>
      </div>

      ${cuerpo}

      <div class="card">
        <label style="margin:0 0 6px">Últimas llamadas</label>
        <div class="hist">
          ${this.marc.slice(0,8).map(m=>`<div class="hrow">
            <div><b>${esc(m.cliente||'—')}</b><div class="dim" style="font-size:11px">${esc(m.campana||'')} · ${hace(m.creado_en)||''}</div></div>
            <span class="pill ${this.clasePill(m.resultado)}">${esc(this.nombreRes(m.resultado))}</span>
          </div>`).join('')||'<div class="dim" style="font-size:12.5px">Todavía no hay llamadas.</div>'}
        </div>
      </div>`;
  },

  clasePill(r){ return ({interesado:'ok', no_interesado:'no', habeas:'no',
    like_promo:'tibio', no_contesta:'gris', flyer:'flyer'})[r] || ''; },
  nombreRes(r){ return ({interesado:'Interesado', no_interesado:'No interesado', habeas:'Habeas data',
    no_contesta:'No contesta', like_promo:'Like Promo', flyer:'Flyer anuncio'})[r] || r || '—'; },

  saltar(){ this.idx++; this.pintar(); window.scrollTo(0,0); },

  async marcar(res){
    const l=this.lista[this.idx]; if(!l)return;
    const fila=await POST('kruh_marcaciones',{
      lead_id:l.id, cliente:l.nombre||'', telefono:l.telefono||'',
      resultado:res, campana:this.campana});
    if(!fila){ toast('No se pudo guardar — ¿ya corriste el SQL?'); return; }
    this.marc.unshift(fila);
    this.ultima[l.id]=fila;
    if(res==='habeas'){
      this.bloq[l.id]=true;
      this.todos=this.todos.filter(x=>x.id!==l.id);
      this.armar();
      toast('Sacado de la lista para siempre');
    } else {
      this.idx++;
      toast(res==='interesado'?'🔥 Interesado':'Anotado');
    }
    this.pintar(); window.scrollTo(0,0);
  }
};
M.init();
</script>
