<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>kruh · reservar</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5efe4; --card:#fffdf8; --ink:#2a1f16; --ink2:#5b4d3f; --mut:#9a8b78;
    --line:#e7ddc9; --line2:#f0e9da; --acc:#b5651d; --acc2:#d98b3f; --gold:#caa23c;
    --ok:#4f7a4a; --okbg:#e6f1e2; --warn:#b4622e; --bad:#a8392c;
    --sh:0 1px 2px rgba(40,25,10,.05),0 12px 30px -18px rgba(40,25,10,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  header{background:var(--ink);color:var(--paper);padding:13px 0}
  .hd{max-width:1000px;margin:0 auto;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:600;line-height:1}
  .brand b{color:var(--acc2)}
  .brand small{display:block;font-family:'IBM Plex Sans';font-size:9px;letter-spacing:.3em;color:var(--gold);margin-top:3px;text-transform:uppercase}
  .h72{font-size:10.5px;color:#b6a894;text-align:right;line-height:1.3}
  .wrap{max-width:1000px;margin:0 auto;padding:0 15px 40px}

  .aviso{background:#fff6e6;border:1px solid #ecd9b0;border-radius:11px;padding:11px 14px;margin-top:12px;font-size:13px}
  .aviso b{color:var(--acc)}

  .cols{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
  @media(min-width:840px){ .cols{grid-template-columns:1fr 330px;align-items:start} .panel{position:sticky;top:14px} }

  .cat{font-family:Fraunces,serif;font-size:17px;font-weight:600;margin:14px 0 7px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .p{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;
     box-shadow:var(--sh);position:relative;transition:border-color .12s,transform .08s;text-align:left}
  .p:active{transform:scale(.97)}
  .p.on{border-color:var(--acc);border-width:2px}
  .p .im{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line2)}
  .p .noim{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    background:var(--line2);font-family:Fraunces,serif;font-size:24px;color:var(--mut)}
  .p .tx{padding:6px 7px 7px}
  .p .nm{font-size:11px;font-weight:600;line-height:1.25}
  .p .pr{font-size:11px;color:var(--acc);font-weight:700;margin-top:1px}
  .p .qty{position:absolute;top:5px;right:5px;background:var(--acc);color:#fff;min-width:23px;height:23px;
    border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    box-shadow:0 1px 5px rgba(0,0,0,.3)}

  .panel .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:var(--sh)}
  .ttl{font-family:Fraunces,serif;font-size:18px;font-weight:600;margin-bottom:3px}
  .lin{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2)}
  .lin:last-of-type{border-bottom:none}
  .lin .n{flex:1;font-size:13px;font-weight:600;line-height:1.25}
  .lin .n small{display:block;font-weight:400;color:var(--mut);font-size:11px}
  .mas,.menos{width:27px;height:27px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;flex:none;font-family:inherit;line-height:1}
  .cn{min-width:20px;text-align:center;font-weight:700;font-size:14px}
  label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:11px 0 4px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--acc);color:#fff;
    font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:12px}
  .btn[disabled]{background:var(--mut);cursor:default}
  .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);
    margin-top:9px;padding-top:9px}
  .tot b{font-size:20px;font-family:Fraunces,serif}
  .vacio{color:var(--mut);font-size:13px;padding:14px 0;text-align:center}
  .ok{text-align:center;padding:34px 16px}
  .ok .big{font-family:Fraunces,serif;font-size:26px;font-weight:600;margin:10px 0 4px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--paper);
    padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:var(--sh)}
</style>

<header><div class="hd">
  <div class="brand">kruh<b>.</b><small>reservar</small></div>
  <div class="h72">el pan se hornea de encargo<br><b style="color:var(--gold)">72 horas de anticipación</b></div>
</div></header>

<div class="wrap" id="app"><div class="vacio" style="padding:40px">Cargando…</div></div>
<div id="toast-host"></div>

<script>
const SB='https://fnayedgvamxktxfvywwl.supabase.co';
const K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const soloTel=s=>String(s||'').replace(/\D/g,'');

async function GET(p){ const r=await fetch(SB+'/rest/v1/'+p,{headers:H}); return r.ok?r.json():[]; }
async function POST(t,b){ const r=await fetch(SB+'/rest/v1/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(b)}); return r.ok?(await r.json())[0]:null; }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; $('toast-host').appendChild(d); setTimeout(()=>d.remove(),1900); }

/* 72 horas: lo más pronto que se puede recoger */
function minFecha(){ const d=new Date(); d.setDate(d.getDate()+3); return d.toISOString().slice(0,10); }
const HORAS=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];

const R={
  prods:[], cart:{}, telMap:{}, listo:false,
  fecha:minFecha(), hora:'10:00', nom:'', tel:'', nota:'',

  async init(){
    const [prods,leads]=await Promise.all([
      GET('kruh_productos?select=id,nombre,categoria,precio,foto_url,activo&order=categoria,nombre&limit=500'),
      GET('kruh_leads?select=nombre,telefono&limit=3000')]);
    this.prods=(prods||[]).filter(p=>p.activo!==false);
    (leads||[]).forEach(l=>{ const t=soloTel(l.telefono); if(t.length>=7&&!this.telMap[t]) this.telMap[t]=l.nombre||''; });
    this.pintar();
  },

  total(){ let t=0; for(const id in this.cart){ const p=this.prods.find(x=>x.id===id); if(p)t+=(+p.precio||0)*this.cart[id]; } return t; },
  nItems(){ let n=0; for(const id in this.cart)n+=this.cart[id]; return n; },

  set(id,d){ const q=(this.cart[id]||0)+d; if(q<=0)delete this.cart[id]; else this.cart[id]=q; this.pintar(); },
  toca(id){ this.set(id,1); },

  /* al escribir el teléfono, si ya es cliente se saluda por su nombre */
  telIn(v){ this.tel=v; const t=soloTel(v);
    if(t.length>=7 && this.telMap[t] && !this.nom){ this.nom=this.telMap[t];
      const e=$('r_nom'); if(e)e.value=this.nom; toast('¡Hola de nuevo, '+this.nom+'!'); } },

  pintar(){
    if(this.listo){ $('app').innerHTML=this.pantallaOk(); return; }
    const cats={}; this.prods.forEach(p=>{ const c=p.categoria||'Otros'; (cats[c]=cats[c]||[]).push(p); });
    const orden=['Panadería','Repostería','Conservas','Productos Eventos','Servicio'];
    const claves=Object.keys(cats).sort((a,b)=>{
      const ia=orden.indexOf(a), ib=orden.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b); });

    const grillas=claves.map(c=>`<div class="cat">${esc(c)}</div><div class="grid">${
      cats[c].map(p=>{ const q=this.cart[p.id]||0;
        return `<button class="p${q?' on':''}" onclick="R.toca('${p.id}')">
          ${p.foto_url?`<img class="im" src="${esc(p.foto_url)}" alt="${esc(p.nombre)}" loading="lazy">`
                      :`<div class="noim">${esc((p.nombre||'?').slice(0,1))}</div>`}
          ${q?`<div class="qty">${q}</div>`:''}
          <div class="tx"><div class="nm">${esc(p.nombre)}</div><div class="pr">${money(p.precio)}</div></div>
        </button>`; }).join('')}</div>`).join('');

    const lineas=Object.keys(this.cart).map(id=>{ const p=this.prods.find(x=>x.id===id); if(!p)return '';
      return `<div class="lin">
        <div class="n">${esc(p.nombre)}<small>${money(p.precio)} c/u · ${money((+p.precio||0)*this.cart[id])}</small></div>
        <button class="menos" onclick="R.set('${id}',-1)">−</button>
        <span class="cn">${this.cart[id]}</span>
        <button class="mas" onclick="R.set('${id}',1)">+</button>
      </div>`; }).join('');

    const hay=this.nItems()>0, puede=hay&&soloTel(this.tel).length>=7&&this.nom.trim();

    $('app').innerHTML=`
      <div class="aviso">Esto es <b>solo una reserva</b>, no se paga ahora. Toca las fotos de lo que quieras y abajo dinos <b>para qué día y hora</b>. Recuerda: necesitamos <b>72 horas</b> para hornear.</div>
      <div class="cols">
        <div>${grillas}</div>
        <div class="panel"><div class="card">
          <div class="ttl">Estás reservando</div>
          ${hay?lineas:'<div class="vacio">Todavía no has escogido nada.<br>Toca una foto para empezar.</div>'}
          ${hay?`<div class="tot"><span>${this.nItems()} producto${this.nItems()===1?'':'s'}</span><b>${money(this.total())}</b></div>`:''}

          <label>¿Para qué día?</label>
          <input type="date" id="r_fec" min="${minFecha()}" value="${this.fecha}" onchange="R.fecha=this.value">
          <label>¿A qué hora?</label>
          <select id="r_hor" onchange="R.hora=this.value">
            ${HORAS.map(h=>`<option${h===this.hora?' selected':''}>${h}</option>`).join('')}
          </select>

          <label>Tus datos</label>
          <div class="g2">
            <input id="r_tel" inputmode="numeric" placeholder="Celular" value="${esc(this.tel)}" oninput="R.telIn(this.value)">
            <input id="r_nom" placeholder="Tu nombre" value="${esc(this.nom)}" oninput="R.nom=this.value">
          </div>
          <input style="margin-top:8px" id="r_not" placeholder="Alguna nota (opcional)" value="${esc(this.nota)}" oninput="R.nota=this.value">

          <button class="btn" ${puede?'':'disabled'} onclick="R.enviar()">
            ${!hay?'Escoge algo primero':(puede?'Confirmar reserva':'Falta tu celular y tu nombre')}</button>
          <div class="vacio" style="padding:8px 0 0;font-size:11.5px">Te confirmamos por WhatsApp.</div>
        </div></div>
      </div>`;
  },

  pantallaOk(){
    const l=this.okDatos||{};
    return `<div class="card" style="background:var(--card);border:1px solid var(--line);border-radius:13px;margin-top:14px;box-shadow:var(--sh)">
      <div class="ok">
        <div style="font-size:40px">🥖</div>
        <div class="big">¡Reserva tomada!</div>
        <div style="color:var(--ink2);font-size:14px">Gracias, ${esc(l.nom||'')}.</div>
        <div style="background:var(--okbg);border:1px solid #c3ddbb;border-radius:11px;padding:13px;margin-top:15px;text-align:left">
          <div style="font-size:12.5px;color:var(--ok);font-weight:700;text-transform:uppercase;letter-spacing:.06em">Tu reserva</div>
          ${(l.items||[]).map(i=>`<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0">
            <span>${esc(i.nombre)} <b>×${i.qty}</b></span><span>${money(i.precio*i.qty)}</span></div>`).join('')}
          <div style="display:flex;justify-content:space-between;border-top:1px solid #c3ddbb;margin-top:6px;padding-top:6px;font-weight:700">
            <span>Total</span><span>${money(l.total||0)}</span></div>
          <div style="margin-top:10px;font-size:13.5px"><b>Para el ${esc(l.fecha||'')} a las ${esc(l.hora||'')}</b></div>
        </div>
        <div style="color:var(--mut);font-size:12.5px;margin-top:14px">Te escribimos por WhatsApp para confirmar.<br>Se paga al recoger.</div>
        <button class="btn" style="margin-top:16px" onclick="R.otra()">Hacer otra reserva</button>
      </div></div>`;
  },

  otra(){ this.cart={}; this.listo=false; this.nota=''; this.pintar(); window.scrollTo(0,0); },

  async enviar(){
    const items=Object.keys(this.cart).map(id=>{ const p=this.prods.find(x=>x.id===id);
      return {producto_id:id,nombre:p.nombre,precio:+p.precio||0,qty:this.cart[id]}; });
    if(!items.length)return;
    const tel=soloTel(this.tel);
    if(tel.length<7){ toast('Falta tu celular'); return; }
    if(!this.nom.trim()){ toast('Falta tu nombre'); return; }
    const b={cliente:this.nom.trim(), telefono:this.tel.trim(), items, total:this.total(),
             estado:'reserva', reserva_fecha:this.fecha, reserva_hora:this.hora,
             domicilio:0, forma_pago:'Por definir'};
    if(this.nota.trim()) b.reserva_hora=this.hora+' · '+this.nota.trim();
    let r=await POST('kruh_pedidos',b);
    if(!r){ // por si faltan las columnas de reserva
      delete b.reserva_fecha; delete b.reserva_hora;
      b.cliente=this.nom.trim()+' · RESERVA '+this.fecha+' '+this.hora;
      r=await POST('kruh_pedidos',b);
    }
    if(!r){ toast('No se pudo guardar, intenta de nuevo'); return; }
    this.okDatos={nom:this.nom.trim(),items,total:this.total(),fecha:this.fecha,hora:this.hora};
    this.listo=true; this.pintar(); window.scrollTo(0,0);
  }
};
R.init();
</script>
