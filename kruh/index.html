<style>
  :root{
    --paper:#f5efe4; --card:#fffdf8; --ink:#2a1f16; --ink2:#5b4d3f; --mut:#9a8b78;
    --line:#e7ddc9; --line2:#f0e9da; --acc:#b5651d; --acc2:#d98b3f; --gold:#caa23c;
    --ok:#4f7a4a; --okbg:#e6f1e2; --warn:#b4622e; --bad:#a8392c; --badbg:#f7e2dd;
    --sh:0 1px 2px rgba(40,25,10,.05),0 12px 30px -18px rgba(40,25,10,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:slashed-zero;font-feature-settings:'zero' 1}
  .wrap{max-width:920px;margin:0 auto;padding:0 15px 96px}
  header{background:var(--ink);color:var(--paper);padding:15px 0}
  .hd{max-width:920px;margin:0 auto;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:600;letter-spacing:.01em;line-height:1}
  .brand b{color:var(--acc2)}
  .brand small{display:block;font-family:'IBM Plex Sans';font-size:9.5px;letter-spacing:.32em;color:var(--gold);margin-top:3px;text-transform:uppercase}

  nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .nv{max-width:920px;margin:0 auto;display:flex;gap:1px;padding:0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}

  .nv2{border-top:1px solid var(--line2)}
  .nv2 button{padding:10px 12px;font-size:12px}
  nav button{flex:0 0 auto;background:none;border:none;padding:13px 12px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
  nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
  h1{font-family:Fraunces,serif;font-size:25px;font-weight:600;margin:20px 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
  label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:9px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  textarea{min-height:60px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .btn{padding:12px 17px;border:none;border-radius:9px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.acc{background:var(--acc)} .btn.gh{background:transparent;border:1px solid var(--line);color:var(--ink2)}
  .btn.full{width:100%;margin-top:10px} .btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--sh)}
  .item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .nm{font-weight:700;font-size:15px} .mt{font-size:12.5px;color:var(--mut);margin-top:2px}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--line2);color:var(--ink2)}
  .tag.pe{background:#fdeede;color:var(--warn)} .tag.np{background:#e7f1e6;color:var(--ok)}
  .empty{text-align:center;color:var(--mut);padding:34px 12px;font-size:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--sh)}
  .kpi b{display:block;font-size:22px;font-family:Fraunces,serif;font-weight:600}
  .kpi span{font-size:11px;color:var(--mut)}
  .kpi.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)} .kpi.dark b{color:var(--acc2)} .kpi.dark span{color:#b6a894}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bar{height:9px;background:var(--line2);border-radius:6px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;border-radius:6px;background:var(--acc)}
  .circ{width:19px;height:19px;border-radius:50%;border:2px solid var(--ok);flex:none;cursor:pointer;display:inline-block}
  .circ.on{background:var(--ok)}
  .circ.wa{border-color:#25a35a} .circ.wa.on{background:#25a35a}
  .et{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--mut)}
  .et.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
  .hint{font-size:12px;color:var(--mut);margin-top:5px}
  .modal{position:fixed;inset:0;background:rgba(30,20,8,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .modal .box{background:var(--card);border-radius:16px 16px 0 0;padding:17px;width:100%;max-width:920px;max-height:90vh;overflow:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;z-index:80;font-size:13px}
  small.dim{color:var(--mut)}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
  .pimg{aspect-ratio:16/9;background:#efe6d5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px}
  .pin{padding:8px 10px}
  .pn{font-weight:700;font-size:13px;line-height:1.2;min-height:31px}
  .pp{color:var(--acc);font-weight:800;font-size:14px;margin:2px 0 6px}
  .stp{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .stp button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
  .stp b{font-size:15px;min-width:20px;text-align:center}
  .cajon{flex:1;min-width:130px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:center;box-shadow:var(--sh)}
  .cajon.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .cajon b{display:block;font-size:22px;font-family:Fraunces,serif}
  .tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);background:var(--card)}
  .tb{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
  .tb th,.tb td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
  .tb thead th{background:var(--paper);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);white-space:nowrap;position:sticky;top:0}
  .tb tbody tr:hover{background:#fffaf0}
  .tb tfoot td{background:var(--paper);font-weight:700;border-bottom:none;border-top:2px solid var(--line);font-size:12.5px}
  .tb input,.tb select{padding:6px 7px;font-size:13px;border-radius:7px;border:1px solid transparent;background:transparent;width:100%}
  .tb input:hover,.tb select:hover{border-color:var(--line);background:#fff}
  .tb input:focus,.tb select:focus{border-color:var(--acc);background:#fff}
  .tb input:disabled,.tb select:disabled{color:var(--ink2);opacity:1;-webkit-text-fill-color:var(--ink2)}
  .tb input[type=number]{text-align:right;font-weight:700}
  .tb .del{color:var(--bad);cursor:pointer;font-weight:700;padding:0 4px}
  @media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
</style>

</div></header>

<div class="wrap"><div id="main" class="spin" style="text-align:center;padding:40px;color:var(--mut)">Cargando…</div></div>

<script>
const SB='https://fnayedgvamxktxfvywwl.supabase.co', K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const num=n=>Math.round(+n||0).toLocaleString('es-CO');
async function GET(p){ const r=await fetch(SB+'/rest/v1/'+p,{headers:H}); return r.ok?r.json():[]; }
/* OJO: el servidor NUNCA devuelve más de 1000 filas, aunque se le pida limit=20000.
   Lo hace en silencio, sin error. Con más de 1000 ventas la app empezaba a perder
   las más nuevas y los totales salían por debajo de la realidad. GETALL pide de a
   1000 hasta que se acaban, así ninguna pantalla vuelve a quedarse corta. */
async function GETALL(p){
  const base=p.replace(/[?&](limit|offset)=\d+/g,'');
  const sep=base.includes('?')?'&':'?';
  const out=[]; let off=0;
  for(let i=0;i<60;i++){
    const r=await fetch(SB+'/rest/v1/'+base+sep+'limit=1000&offset='+off,{headers:H});
    if(!r.ok) break;
    const b=await r.json();
    if(!Array.isArray(b)||!b.length) break;
    out.push(...b);
    if(b.length<1000) break;
    off+=1000;
  }
  return out;
}
async function POST(t,b){ const r=await fetch(SB+'/rest/v1/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(b)}); return r.ok?(await r.json())[0]:null; }
async function PATCH(t,b){ return fetch(SB+'/rest/v1/'+t,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(b)}); }
async function DEL(t){ return fetch(SB+'/rest/v1/'+t,{method:'DELETE',headers:H}); }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1900); }
function modal(html){ $('modal-host').innerHTML='<div class="modal" onclick="if(event.target===this)App.cerrar()"><div class="box">'+html+'</div></div>'; }
function cerrar(){ $('modal-host').innerHTML=''; }

const App={
  cerrar,
  TABS:[['dashboard','📊 Dashboard'],['recetas','🥖 Recetas'],['proveedores','🚚 Proveedores'],['materiaprima','🛒 Compras'],['inventario','📦 Inventario'],['crm','📇 CRM'],['pedidos','📋 Pedidos'],['marketing','📣 Marketing'],['presupuestos','🎯 Presupuestos'],['ventas','💰 Ventas'],['gastos','🧾 Gastos'],['usuarios','👤 Usuarios'],['precios','💲 Precios']],
  view:'dashboard',
  _savingPedido:false,
  MESNOM:['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],
  PASS:{admin:'kruhadmin2026', gerencia:'kruhgerencia2026'},
  ROLES:['admin','gerencia','cajera','panadero','bodeguero','chef'],
  get esAdmin(){ return this.rol==='admin'; },
  get puedeGestionar(){ return this.rol==='admin'||this.rol==='gerencia'; },
  _tabsRol(){ if(this.rol==='admin') return this.TABS.map(t=>t[0]);
    if(this.rol==='gerencia') return this.TABS.map(t=>t[0]).filter(v=>v!=='usuarios');   // gerencia ve todo menos Usuarios
    return ((this._permisos||{})[this.rol]||['recetas']).filter(v=>v!=='usuarios'&&v!=='dashboard'); },
  _primeraTab(){ const t=this._tabsRol(); return t.includes('dashboard')?'dashboard':(t[0]||'recetas'); },
  async init(){ /* localStorage y no sessionStorage: así no vuelve a pedir la clave en cada pestaña nueva */
    this.rol=localStorage.getItem('kruh_rol')||sessionStorage.getItem('kruh_rol')||'';
    try{ const [us,pm]=await Promise.all([GET('kruh_usuarios?select=nombre,rol,clave,activo&limit=200'),GET('kruh_permisos?limit=50')]); this._usuarios=us; this._permisos={}; pm.forEach(p=>this._permisos[p.rol]=p.tabs||[]); }catch(e){ this._usuarios=[]; this._permisos={}; }
    if(!this.ROLES.includes(this.rol)){this.rol='';} if(!this.rol) return this.vLogin(); this.paintHeader(); this.nav(); this.go(this._primeraTab()); },
  vLogin(){ $('nav').innerHTML=''; if($('nav2'))$('nav2').innerHTML=''; $('main').className='';
    $('main').innerHTML=`<div style="max-width:340px;margin:44px auto 0"><div class="card" style="text-align:center">
      <div style="font-family:Fraunces,serif;font-size:38px;color:var(--ink)">kruh<b style="color:var(--acc)">.</b></div>
      <div class="sub" style="margin:4px 0 16px">Ingresa tu clave</div>
      <input id="lg_pass" type="password" placeholder="Clave" style="text-align:center" onkeydown="if(event.key==='Enter')App.login()">
      <button class="btn acc full" onclick="App.login()">Entrar</button>
      <div class="hint" id="lg_err" style="color:var(--bad);display:none;margin-top:8px">Clave incorrecta</div></div></div>`;
    setTimeout(()=>{const e=$('lg_pass');if(e)e.focus();},60); },
  login(){ const p=($('lg_pass').value||'').trim(); let rol=''; for(const k in this.PASS){ if(p===this.PASS[k])rol=k; }
    if(!rol){ const u=(this._usuarios||[]).find(x=>x.clave===p&&x.activo!==false); if(u)rol=u.rol; }
    if(!rol){ const e=$('lg_err'); if(e)e.style.display='block'; return; } this.rol=rol; localStorage.setItem('kruh_rol',rol); this.init(); },
  logout(){ localStorage.removeItem('kruh_rol'); sessionStorage.removeItem('kruh_rol'); this.rol=''; this.vLogin(); },
  _okBorrar(){ const p=prompt('🔒 Clave para BORRAR:'); if(p===null)return false; if(p===this.PASS.admin||p===this.PASS.gerencia)return true; alert('Clave incorrecta'); return false; },
  /* pide clave de admin o gerencia para acciones que corrigen datos ya guardados */
  _okGerencia(que){ const p=prompt('🔒 Clave de admin o gerencia para '+que+':'); if(p===null)return false;
    if(p===this.PASS.admin||p===this.PASS.gerencia)return true; alert('Clave incorrecta'); return false; },
  paintHeader(){ const q=document.querySelector('.quien'); if(q){ const r=(this.rol||'').charAt(0).toUpperCase()+(this.rol||'').slice(1); q.innerHTML=`${r} · <a onclick="App.logout()" style="cursor:pointer;text-decoration:underline">salir</a>`; } },

  /* ===================== DASHBOARD ===================== */
  async vDashboard(){
    this.loading();
    const [meses,leads,ventas,peds,recs,gastos]=await Promise.all([GET('kruh_dashboard?order=orden&limit=24'),GET('kruh_leads?select=creado_en&limit=5000'),GETALL('kruh_ventas?select=monto,creado_en,producto&limit=8000'),GETALL('kruh_pedidos?select=items,creado_en&limit=3000'),GET('kruh_recetas?select=producto_id,cantidad,costo_unit&limit=5000'),GET('kruh_gastos?select=monto,fecha,creado_en&limit=5000')]);
    const now=new Date(), cm=now.getMonth()+1, mesIni=new Date(now.getFullYear(),now.getMonth(),1), mesNom=this.MESNOM[cm]||'';
    // del mes en curso hacia atrás; los meses futuros quedan de últimas
    const rango=m=>{ const o=+m.orden||99; return o<=cm?o:o-1000; };
    meses.sort((a,b)=>rango(b)-rango(a));
    this._dash=meses;
    const costoProd={}; recs.forEach(r=>{costoProd[r.producto_id]=(costoProd[r.producto_id]||0)+(+r.cantidad||0)*(+r.costo_unit||0);});
    // ventas reales de CADA mes del año en curso: el Dashboard nunca queda desactualizado
    const ventasPorMes={};
    ventas.forEach(v=>{ const d=new Date(v.creado_en); if(isNaN(d)||d.getFullYear()!==now.getFullYear())return;
      ventasPorMes[d.getMonth()+1]=(ventasPorMes[d.getMonth()+1]||0)+(+v.monto||0); });
    const ventasReales=m=>{ const i=this.MESNOM.findIndex(x=>x&&m&&x.toLowerCase()===String(m).toLowerCase()); return i>0?(ventasPorMes[i]||0):0; };
    const liveVentas=ventas.filter(v=>new Date(v.creado_en)>=mesIni).reduce((a,v)=>a+(+v.monto||0),0);
    let liveCosto=0; peds.forEach(p=>{ if(new Date(p.creado_en)<mesIni)return; (p.items||[]).forEach(it=>{liveCosto+=(+it.qty||0)*(costoProd[it.producto_id]||0);}); });
    const manual=meses.find(m=>m.mes&&m.mes.toLowerCase()===mesNom.toLowerCase())||{ventas:0,costo:0,meta:40000000};
    const auto=liveVentas>0;
    const ventasM=auto?liveVentas:(+manual.ventas||0), costo=liveCosto>0?liveCosto:(+manual.costo||0);
    const ubruta=ventasM-costo;
    /* META DEL MES (el trato con NC): se suman los meses con ventas, se saca el
       promedio y se pone el doble. Hoy: abril a julio. */
    const kMeses=Object.keys(ventasPorMes).filter(k=>(+ventasPorMes[k]||0)>0);
    const promNC=kMeses.length?kMeses.reduce((a,k)=>a+(+ventasPorMes[k]||0),0)/kMeses.length:0;
    const meta=promNC>0?promNC*2:(+manual.meta||40000000);
    const mesesUsados=kMeses.map(k=>this.MESNOM[+k]).filter(Boolean);
    const ymAct=now.getFullYear()+'-'+String(cm).padStart(2,'0');
    const gastoLive=gastos.filter(g=>(g.fecha||g.creado_en||'').slice(0,7)===ymAct).reduce((a,g)=>a+(+g.monto||0),0);
    const gastosM=manual.cerrado?(+manual.gastos||0):(gastoLive||(+manual.gastos||0));
    const uneta=ubruta-gastosM;
    const vMes=m=>{const es=m.mes&&m.mes.toLowerCase()===mesNom.toLowerCase(); if(es)return ventasM; const r=ventasReales(m.mes); return r>0?r:(+m.ventas||0);};
    const registrados=leads.length, nuevosMes=leads.filter(l=>new Date(l.creado_en)>=mesIni).length;
    this._dashCtx={meses,mesNom,auto,costo,gastosM,meta,ventasReales,vMes,ventas};
    this.set(`<h1>Dashboard</h1><div class="sub">${esc(mesNom)} ${auto?'· <span style="color:var(--ok);font-weight:700">automático con las ventas del mes</span>':'· simulado (al ingresar pedidos se calcula solo)'} · meta ${money(meta)}</div>
      <div class="kpis">
        <div class="kpi dark"><b>${money(ventasM)}</b><span>Ventas del mes</span></div>
        <div class="kpi"><b>${money(costo)}</b><span>Costo</span></div>
        <div class="kpi"><b style="color:var(--ok)">${money(ubruta)}</b><span>Utilidad bruta</span></div>
        <div class="kpi"><b style="color:var(--warn)">${money(gastosM)}</b><span>Gastos del mes${manual.cerrado?' 🔒':''}</span></div>
        <div class="kpi"><b style="color:${uneta>=0?'var(--ok)':'var(--bad)'}">${money(uneta)}</b><span>Utilidad neta</span></div>
        <div class="kpi"><b>${registrados}</b><span>Clientes registrados</span></div>
        <div class="kpi"><b style="color:var(--acc)">${nuevosMes}</b><span>Clientes nuevos (mes)</span></div>
      </div>
      <div class="card" style="border-color:${ventasM>=meta&&meta>0?'var(--ok)':'var(--acc)'};border-width:2px">
        <div class="row" style="justify-content:space-between"><b>Meta del mes (NC)</b><span>${money(ventasM)} / ${money(meta)}</span></div>
        <div class="bar" style="height:12px"><i style="width:${Math.min(100,meta>0?ventasM/meta*100:0)}%;background:${ventasM>=meta&&meta>0?'var(--ok)':'var(--acc)'}"></i></div>
        <div class="hint">${meta>ventasM?('Faltan '+money(meta-ventasM)+' para la meta'):'¡Meta cumplida! 🎉'}</div>
        ${promNC>0?`<div class="hint" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">
          Promedio de ${mesesUsados.length} ${mesesUsados.length===1?'mes':'meses'} (${esc(mesesUsados.join(', ').toLowerCase())}): <b>${money(promNC)}</b> · la meta es <b>el doble</b>.</div>`:''}
        ${ventasM>=meta&&meta>0?`<div style="margin-top:8px;background:var(--okbg);border:1px solid #c3ddbb;border-radius:9px;padding:10px 12px">
          <b style="color:var(--ok)">✅ Se duplicó el promedio</b>
          <div style="font-size:12.5px;margin-top:2px">Ya se puede cobrar la instalación del motor de ventas.</div></div>`:''}</div>
      <h1 style="font-size:18px;margin-top:20px">Mes a mes vs meta</h1>
      <div class="sub" style="margin-bottom:8px">Toca un mes para ver la venta de cada día.</div>
      <div id="dashLista">${this._dashLista()}</div>
      ${this.esAdmin?`<button class="btn acc full" onclick="App.dashModal()">＋ Agregar mes</button>`:''}

  _findLeadMatch(tel,nom,excludeId){
    this._matchPor='';

    const phone=(phone0===this.TEL_ANONIMO)?'':phone0;   // el 123 no identifica a nadie

      const sinTel=cand.filter(l=>!this._telKey(l.telefono)&&idem(l));

  async pedGuardar(){ if(this._savingPedido) return; const cart=this._cart||{}, prods=this._prods||[], items=[]; const fp=this._cartFP||'Efectivo', esTar=/tarjeta/i.test(fp); let sub=0, iva=0, bruto=0;

  /* si el cliente del pedido no está en el CRM, se registra solo */
  async _guardarClientePedido(cli,tel){
    const nom=String(cli||'').trim(), k=this._telKey(tel);
    /* Devuelve {nuevo} si lo registro, o {falta} diciendo por que no pudo.
       Antes devolvia '' en los dos casos y la cajera nunca se enteraba de que
       el cliente no habia quedado guardado. */
    if(!nom) return {falta:'el nombre del cliente'};
    /* Cliente anónimo: el que no quiere dejar sus datos se registra con el 123.
       Es a propósito, no un error, así que ni se avisa ni se crea ficha nueva. */
    if(k===this.TEL_ANONIMO) return {};
    const dir=(this._cartDir||'').trim(), promo=!!this._cartPromo, tipo=this._cartTipo||'comunidad';
    const ex=this._findLeadMatch(tel,cli);
    if(ex){ // ya está en el CRM: solo se actualiza lo que cambió
      const b={};
      /* La dirección solo se toca si la ficha no tenía, o si al cliente lo
         identificamos por el CELULAR (ahí sí sabemos que es él). Pisarla desde
         un match por nombre es lo que le metía la dirección de uno a otro. */
      const dirVieja=String(ex.direccion||'').trim();
      if(dir && this._matchPor==='tel' && dir!==dirVieja) b.direccion=dir;
      if(promo!==!!ex.infopromos)b.infopromos=promo;
      if(tipo!==ex.tipo)b.tipo=tipo;
      if(!this._telKey(ex.telefono)&&k.length>=10) b.telefono=String(tel||'').trim();
      if(Object.keys(b).length){ const r=await PATCH('kruh_leads?id=eq.'+ex.id,b);
        if(r&&!r.ok) toast('⚠️ El pedido quedó, pero el CRM no se actualizó'); else Object.assign(ex,b); }
      return {};
    }
    if(k.length<10) return {falta: k.length? 'el celular completo (van '+k.length+' de 10 dígitos)' : 'el celular'};
    /* Antes de abrir ficha nueva: ¿ya hay alguien que se llama igual con OTRO
       celular? Casi siempre es un dígito mal escrito, y así fue como se llenó
       de duplicados. No se bloquea (puede haber dos personas con el mismo
       nombre), pero queda avisado. */
    const igual=(this._leads||[]).filter(l=>this._normLeadName(l.nombre||'')===this._normLeadName(nom)

    return {nuevo:nom}; },

  /* ===================== CRM (cajones: Comunidad / Nuevos → canal) ===================== */
  ETAPAS:['contactado','interesado','pedido','cliente'],
  CATCOMPRA:['Panadería','Conservas','Repostería'],
  CANALES:[['todos','Todos'],['local','🏪 Local'],['digital','📱 Digital'],['organico','🌱 Orgánico'],['empleados','👷 Empleados']],
  async vCrm(){

      if(t&&(!lastTel[t]||d>lastTel[t]))lastTel[t]=d; if(n&&(!lastNom[n]||d>lastNom[n]))lastNom[n]=d; });

  /* misma llave para pedidos y para leads: el telefono manda, y si no hay, el nombre */

    const tendHTML = ventas.length? `

        <div style="display:flex;align-items:flex-end;gap:2px;height:110px">${byDom.map((t,i)=>{const day=i+1;const pd=pagoDays.includes(day);const h=Math.round(t/maxDom*100);return `<div title="día ${day}: ${money(t)}" style="flex:1;height:${Math.max(h,t?3:0)}%;background:${pd?'var(--acc)':'var(--line)'};border-radius:2px 2px 0 0"></div>`;}).join('')}</div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin-top:3px"><span>1</span><span>15</span><span>31</span></div>
        <div class="hint" style="margin-top:4px">🟧 = días de pago (1, 2, 15, 16).</div></div>
      <div class="card"><div style="font-family:Fraunces,serif;font-size:16px;margin-bottom:6px">Efecto quincena de pago</div>
        <div class="row" style="justify-content:space-between"><span class="dim">Promedio días de pago</span><b>${money(promPago)}</b></div>
        <div class="row" style="justify-content:space-between"><span class="dim">Promedio otros días</span><b>${money(promNormal)}</b></div>
        <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);margin-top:5px;padding-top:5px"><span>Diferencia</span><b style="color:${dif>=0?'var(--ok)':'var(--bad)'}">${dif>0?'+':''}${dif.toFixed(0)}%</b></div>
        <div class="hint" style="margin-top:6px">${(pago.n+normal.n)<20?'⏳ Aún con pocos datos — la tendencia se afina a medida que se registran pedidos.':(dif>15?'📈 Sí se ve efecto: los días de pago venden más.':(dif<-15?'📉 Los días de pago venden menos que el resto.':'➖ No se ve un efecto claro de la quincena todavía.'))}</div></div>
      ${this._invSemana()}
      <div class="card"><div style="font-family:Fraunces,serif;font-size:16px;margin-bottom:6px">Por día de la semana <small class="dim" style="font-size:11px;font-weight:400">— en plata</small></div>
        ${DOW.map((nm,i)=>`<div class="row" style="align-items:center;gap:8px;margin-bottom:3px"><span style="width:74px;font-size:12px" class="dim">${nm}</span><div class="bar" style="flex:1"><i style="width:${Math.round(byDow[i]/maxDow*100)}%;background:var(--acc2)"></i></div><b style="font-size:11px;width:72px;text-align:right">${money(byDow[i])}</b></div>`).join('')}</div>
      ${topProd.length?`<div class="card"><div style="font-family:Fraunces,serif;font-size:16px;margin-bottom:6px">Más pedidos</div>${topProd.map(t=>`<div class="row" style="justify-content:space-between;padding:3px 0"><span>${esc(t.p.nombre)}</span><b>${num(t.q)}</b></div>`).join('')}</div>`:''}`
      : '<div class="empty">Aún sin ventas para analizar. Genera pedidos y aquí verás el patrón por día y el efecto de la quincena.</div>';
    this.set(`<h1>Inventario</h1><div class="sub">Sube producción; los pedidos descuentan solo. Se puede vender en negativo, pero acá te avisa.</div>
      ${negativos.length?`<div class="card" style="border-left:4px solid var(--bad);background:var(--badbg)"><b style="color:var(--bad)">🔴 ${negativos.length} producto(s) en NEGATIVO — se vendió más de lo que había</b><div style="font-size:12.5px;margin-top:4px">${negativos.map(p=>esc(p.nombre)+' ('+num(p.existencias)+')').join(' · ')}</div></div>`:''}
      ${bajoMin.length?`<div class="card" style="border-left:4px solid var(--warn);background:var(--badbg)"><b style="color:var(--warn)">⚠️ ${bajoMin.length} producto(s) en o bajo el mínimo</b><div style="font-size:12.5px;margin-top:4px">${bajoMin.map(p=>esc(p.nombre)+' ('+num(p.existencias)+'/'+num(p.inv_min)+')').join(' · ')}</div></div>`:''}
      <div class="kpis"><div class="kpi"><b style="color:${negativos.length?'var(--bad)':'var(--ink)'}">${prods.length}</b><span>Productos</span></div>
        <div class="kpi"><b style="color:${bajoMin.length?'var(--bad)':'var(--ok)'}">${bajoMin.length}</b><span>Bajo mínimo</span></div>
        <div class="kpi" style="border:1.5px solid var(--ok)"><b style="color:var(--ok)"><span id="kpi_musd">${num(musTotD)}</span> <small style="font-size:15px;font-weight:400">(<span id="kpi_mus">${num(musTot)}</span>)</small></b><span>🎁 Muestras · hoy (mes)</span></div>
        <div class="kpi" style="border:1.5px solid var(--bad)"><b style="color:var(--bad)"><span id="kpi_perd">${num(perTotD)}</span> <small style="font-size:15px;font-weight:400">(<span id="kpi_per">${num(perTot)}</span>)</small></b><span>❌ V. perdidas · hoy (mes)</span></div>
        <div class="kpi dark"><b>${money(prods.reduce((a,p)=>a+(+p.existencias||0)*(+p.precio||0),0))}</b><span>Valor en existencias</span></div></div>
      <div class="row" style="gap:6px;margin-bottom:10px"><button class="et ${tab==='exist'?'on':''}" onclick="App._invTab='exist';App.vInventario()">Existencias</button>
        <button class="et ${tab==='cuadre'?'on':''}" onclick="App._invTab='cuadre';App.vInventario()">Cuadre del día</button>
        <button class="et ${tab==='mov'?'on':''}" onclick="App._invTab='mov';App.vInventario()">Movimientos</button>
        <button class="et ${tab==='tend'?'on':''}" onclick="App._invTab='tend';App.vInventario()">Tendencias</button></div>
      ${tab==='exist'?
        this._panelMov(prods,movs)+
        (prods.length?`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${cobRows.map(({p,cons,dias})=>{ const bm=(+p.inv_min||0)>0&&(+p.existencias||0)<=(+p.inv_min||0); const pct=dias===null?0:Math.min(100,dias/7*100); const col=bm?'var(--bad)':(dias===null?'var(--mut)':(dias<3?'var(--bad)':(dias<7?'var(--warn)':'var(--ok)')));
          return `<div class="card" style="padding:11px 12px;margin:0;${bm?'border:1px solid var(--bad)':''}"><div style="font-weight:700;font-size:13px;line-height:1.2">${esc(p.nombre)}</div>
            <div class="row" style="justify-content:space-between;margin-top:3px"><b style="font-size:18px;color:${bm?'var(--bad)':'var(--ink)'}"><span id="ex_${p.id}">${num(p.existencias)}</span> <small class="dim" style="font-size:11px;font-weight:400">${esc(p.unidad||'')}</small></b><span style="font-size:11px;color:${col};font-weight:700">${dias===null?'':dias.toFixed(0)+'d'}</span></div>
            <div style="font-size:10.5px;color:var(--ink);font-weight:600">Stock mínimo: ${num(p.inv_min)}${bm?' · <b style="color:var(--bad)">BAJO</b>':''}</div>
            <div class="bar" style="margin-top:4px"><i style="width:${pct}%;background:${col}"></i></div>
            <div id="mu_${p.id}" style="font-size:10.5px;color:var(--ok);font-weight:700;margin-top:4px;${musBy[p.id]?'':'display:none'}">${this._txtMus(p.id)}</div>
            <div id="pe_${p.id}" style="font-size:10.5px;color:var(--bad);font-weight:700;margin-top:2px;${perBy[p.id]?'':'display:none'}">${this._txtPer(p.id)}</div>
            </div>`;}).join('')}</div>`:'<div class="empty">Sin productos.</div>')
        : tab==='cuadre'? this._invCuadre(prods,movs)
        : tab==='mov'?(movs.length?this._invMovLista(prods,movs):'<div class="empty">Sin movimientos.</div>')
        : tab==='__viejo'?(movs.length?movs.slice(0,300).map(m=>{const p=prods.find(x=>x.id===m.producto_id);
            const q=+m.cantidad||0, corr=(m.tipo==='muestra'&&q<0);   // muestras devueltas por el ✏️
            const cvn=m.tipo==='conv_menos', cvp=m.tipo==='conv_mas';
            const ic=corr?'↩️':(cvn||cvp?'🔄':(m.tipo==='entrada'?'⬆️':(m.tipo==='muestra'?'🎁':(m.tipo==='perdida'?'❌':'⬇️'))));
            const cl=(corr||cvp||m.tipo==='entrada'||m.tipo==='muestra')?'var(--ok)':(cvn?'var(--gold)':'var(--bad)');
            const sg=(corr||cvp||m.tipo==='entrada')?'+':(m.tipo==='perdida'?'':'−');   // la perdida no suma ni resta inventario
            const tg=corr?' <span class="tag pe">corrección de muestras · vuelve al inventario</span>':(cvn?' <span class="tag pe">conversión · se partió</span>':(cvp?' <span class="tag pe">conversión · salió de otro producto</span>':(m.tipo==='muestra'?' <span class="tag pe">muestra gratis</span>':(m.tipo==='perdida'?' <span class="tag pe">venta perdida · no toca inventario</span>':(m.tipo==='baja'?' <span class="tag pe">baja · merma o daño</span>':'')))));
            return `<div class="item"><div class="top"><div><div class="nm">${ic} ${esc(p?p.nombre:'—')}${tg}</div><div class="mt">${esc(m.motivo||'')} · 📅 ${new Date(m.creado_en).toLocaleString('es-CO',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div><div class="nm" style="color:${cl}">${sg}${num(Math.abs(q))}</div></div></div>`;}).join(''):'<div class="empty">Sin movimientos.</div>')
        : tendHTML}`);
  },
  /* ===== CUADRE DEL DÍA =====
     La pregunta que responde: ¿con cuánto arrancó el día, cuánto se produjo,
     cuánto se vendió y con cuánto cerró? Si esa cuenta no da, el inventario
     está mal y acá se ve exactamente en qué producto y qué día. */
  _invCuadre(prods,movs){
    const nom={}; prods.forEach(p=>nom[p.id]=p.nombre);
    /* saldo acumulado por producto hasta cada día: el final de un día es el
       inicial del siguiente, que es como debería comportarse en la vida real */
    const ord=(movs||[]).slice().sort((a,b)=>String(a.creado_en).localeCompare(String(b.creado_en)));
    const dias={};
    ord.forEach(m=>{ const k=this._diaKey(m.creado_en); if(!k)return;
      const d=dias[k]=dias[k]||{}; const r=d[m.producto_id]=d[m.producto_id]||{ini:0,prod:0,vta:0,mue:0,baja:0,otro:0};
      const q=+m.cantidad||0, t=m.tipo;
      if(t==='inicial') r.ini+=q; else if(t==='entrada') r.prod+=q;
      else if(t==='salida') r.vta+=q; else if(t==='muestra') r.mue+=q;
      else if(t==='baja') r.baja+=q; else if(t==='perdida') {} else r.otro+=q*this._sgn(t); });
    const fechas=Object.keys(dias).sort().reverse();
    if(!fechas.length) return '<div class="empty">Sin movimientos todavía.</div>';
    const sel=(this._cuaDia&&dias[this._cuaDia])?this._cuaDia:fechas[0];
    /* arrastre: se recorre desde el principio para saber con qué abrió el día */
    const saldo={};
    fechas.slice().reverse().forEach(k=>{ const d=dias[k];
      Object.keys(d).forEach(pid=>{ const r=d[pid]; r.abre=saldo[pid]||0;
        r.cierra=r.abre+r.ini+r.prod-r.vta-r.mue-r.baja+r.otro; saldo[pid]=r.cierra; }); });
    const dd=dias[sel], pids=Object.keys(dd).sort((a,b)=>String(nom[a]||'').localeCompare(String(nom[b]||'')));
    const T=pids.reduce((a,pid)=>{const r=dd[pid];
      return {abre:a.abre+r.abre,ini:a.ini+r.ini,prod:a.prod+r.prod,vta:a.vta+r.vta,
              otr:a.otr+r.mue+r.baja,cierra:a.cierra+r.cierra};},{abre:0,ini:0,prod:0,vta:0,otr:0,cierra:0});
    const neg=pids.filter(pid=>dd[pid].cierra<0);
    const f=new Date(sel+'T12:00:00'), DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    return `<div class="row" style="gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap">
        <span class="dim" style="font-size:12px">Día:</span>
        <select onchange="App._cuaDia=this.value;App.vInventario()" style="width:auto">
          ${fechas.map(k=>{const x=new Date(k+'T12:00:00');
            return `<option value="${k}" ${k===sel?'selected':''}>${String(x.getDate()).padStart(2,'0')}/${String(x.getMonth()+1).padStart(2,'0')} ${DIA[x.getDay()].slice(0,3)}</option>`;}).join('')}</select>
        <button class="btn gh sm" onclick="App.invInicialModal()">📋 Cargar inventario inicial</button>
        <span class="dim" style="font-size:12px;margin-left:auto">${DIA[f.getDay()]} ${String(f.getDate()).padStart(2,'0')}</span></div>
      ${neg.length?`<div class="card" style="border-left:4px solid var(--bad);padding:10px 13px;margin-bottom:10px">
        <b style="color:var(--bad)">${neg.length} producto${neg.length===1?'':'s'} cierra${neg.length===1?'':'n'} en negativo</b>
        <div style="font-size:12.5px;margin-top:4px">Se vendió más de lo que el sistema sabía que había. Casi siempre es porque
        <b>había producto en el estante antes de arrancar el inventario</b> y ese conteo inicial nunca se cargó.
        Con <b>📋 Cargar inventario inicial</b> se pone el conteo real y la cuenta cierra.</div></div>`:''}
      <div class="card" style="padding:10px 12px;overflow-x:auto">
        <div style="min-width:520px">
          <div style="display:flex;gap:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:6px">
            <span style="flex:1">Producto</span><span style="width:58px;text-align:right">Abrió</span>
            <span style="width:58px;text-align:right">+Inic.</span><span style="width:62px;text-align:right">+Prod.</span>
            <span style="width:62px;text-align:right">−Venta</span><span style="width:62px;text-align:right">−Otros</span>
            <span style="width:58px;text-align:right">Cerró</span></div>
          ${pids.map(pid=>{const r=dd[pid], mal=r.cierra<0;
            return `<div style="display:flex;gap:6px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line2);${mal?'background:var(--badbg)':''}">
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nom[pid]||'—')}</span>
              <span style="width:58px;text-align:right;color:var(--mut)">${r.abre||''}</span>
              <span style="width:58px;text-align:right;color:var(--acc)">${r.ini?(r.ini>0?'+':'')+r.ini:''}</span>
              <span style="width:62px;text-align:right;color:var(--ok)">${r.prod?'+'+r.prod:''}</span>
              <span style="width:62px;text-align:right;color:var(--bad)">${r.vta?'−'+r.vta:''}</span>
              <span style="width:62px;text-align:right;color:var(--warn)">${(r.mue+r.baja)?'−'+(r.mue+r.baja):''}</span>
              <span style="width:58px;text-align:right;font-weight:800;color:${mal?'var(--bad)':'var(--ink)'}">${r.cierra}</span></div>`;}).join('')}
          <div style="display:flex;gap:6px;font-size:13px;padding:7px 0 0;font-weight:800;border-top:2px solid var(--ink);margin-top:4px">
            <span style="flex:1">TOTAL</span><span style="width:58px;text-align:right">${T.abre}</span>
            <span style="width:58px;text-align:right">${T.ini?'+'+T.ini:''}</span><span style="width:62px;text-align:right">+${T.prod}</span>
            <span style="width:62px;text-align:right">−${T.vta}</span><span style="width:62px;text-align:right">${T.otr?'−'+T.otr:''}</span>
            <span style="width:58px;text-align:right">${T.cierra}</span></div></div></div>
      <div class="hint" style="margin-top:7px">Abrió + Inicial + Producción − Venta − Otros = Cerró.
        Y lo que cerró hoy es lo que abre mañana. Si un número no cuadra, el error está en ese día y ese producto.</div>`;
  },
  /* ===== MOVIMIENTOS: producción una por una, ventas consolidadas del día ===== */
  _invMovLista(prods,movs){
    const nom={}; prods.forEach(p=>nom[p.id]=p.nombre);
    const dias={};
    (movs||[]).forEach(m=>{ const k=this._diaKey(m.creado_en); if(!k)return;
      const d=dias[k]=dias[k]||{ent:[],vta:{},otr:[]};
      if(m.tipo==='entrada'||m.tipo==='inicial') d.ent.push(m);
      else if(m.tipo==='salida'){ d.vta[m.producto_id]=(d.vta[m.producto_id]||0)+(+m.cantidad||0); }
      else d.otr.push(m); });
    const fechas=Object.keys(dias).sort().reverse().slice(0,31);
    const DIA=['dom','lun','mar','mié','jue','vie','sáb'];
    return fechas.map(k=>{ const d=dias[k], f=new Date(k+'T12:00:00');
      const tp=d.ent.reduce((a,m)=>a+(+m.cantidad||0),0);
      const pv=Object.keys(d.vta).sort((a,b)=>d.vta[b]-d.vta[a]);
      const tv=pv.reduce((a,pid)=>a+d.vta[pid],0);
      const to=d.otr.reduce((a,m)=>a+(m.tipo==='perdida'?0:(+m.cantidad||0)),0);
      return `<div class="card" style="padding:11px 13px">
        <div class="row" style="justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px">
          <b style="font-family:Fraunces,serif;font-size:15px">${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')} ${DIA[f.getDay()]}</b>
          <span style="font-size:12px;color:var(--mut)"><b style="color:var(--ok)">+${tp}</b> producción · <b style="color:var(--bad)">−${tv}</b> venta${to?' · <b style="color:var(--warn)">−'+to+'</b> otros':''}</span></div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:8px 0 3px">⬆️ Producción que entró</div>
        ${d.ent.length?d.ent.map(m=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:2.5px 0;align-items:baseline">
            <span style="width:44px;flex:0 0 auto;color:var(--mut)">${new Date(m.creado_en).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</span>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nom[m.producto_id]||'—')}${m.tipo==='inicial'?' <span class="tag pe">conteo inicial</span>':''}</span>
            <span style="flex:0 0 auto;font-weight:700;color:${(+m.cantidad||0)<0?'var(--warn)':'var(--ok)'}">${(+m.cantidad||0)<0?'':'+'}${num(m.cantidad)}</span></div>`).join('')
          :'<div class="hint">Sin producción registrada este día.</div>'}
        <div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:9px 0 3px;border-top:1px dashed var(--line);padding-top:7px">⬇️ Venta del día (consolidada)</div>
        ${pv.length?pv.map(pid=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:2.5px 0">
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nom[pid]||'—')}</span>
            <span style="flex:0 0 auto;font-weight:700;color:var(--bad)">−${d.vta[pid]}</span></div>`).join('')
          :'<div class="hint">Sin ventas este día.</div>'}
        ${d.otr.length?`<div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:9px 0 3px;border-top:1px dashed var(--line);padding-top:7px">Otros movimientos</div>
          ${d.otr.map(m=>{const t=m.tipo, ic=t==='muestra'?'🎁':(t==='perdida'?'❌':(t==='baja'?'⬇️':'🔄'));
            return `<div style="display:flex;gap:8px;font-size:12.5px;padding:2.5px 0">
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ic} ${esc(nom[m.producto_id]||'—')} <span class="dim" style="font-size:11px">${esc(m.motivo||t)}</span></span>
              <span style="flex:0 0 auto;font-weight:700;color:${t==='perdida'?'var(--mut)':'var(--warn)'}">${t==='perdida'?'(no toca stock)':'−'+num(Math.abs(+m.cantidad||0))}</span></div>`;}).join('')}`:''}
      </div>`;}).join('');
  },
  /* Cargar el conteo físico. Es la pieza que faltaba: el inventario arrancó en
     cero el 27 de julio aunque el estante tenía producto, y por eso hay negativos. */
  invInicialModal(){
    const prods=(this._prods||[]).filter(p=>String(p.categoria||'').toLowerCase()!=='servicio');
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:4px">Cargar inventario inicial</h3>
      <div class="hint" style="margin-bottom:9px">Cuenta lo que hay <b>en el estante ahora</b> y escríbelo. Se suma al inventario
      como conteo inicial, no como producción, así que no daña las cifras de producción del día.
      Deja en blanco lo que no quieras tocar.</div>
      <div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px">
      ${prods.map(p=>`<div style="display:flex;gap:8px;align-items:center;padding:3px 0">
        <span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nombre)}</span>
        <span style="width:62px;text-align:right;font-size:11.5px;color:${(+p.existencias||0)<0?'var(--bad)':'var(--mut)'}">hoy ${num(p.existencias)}</span>
        <input id="ini_${p.id}" type="number" placeholder="—" style="width:74px;margin:0"></div>`).join('')}
      </div>
      <button class="btn acc full" onclick="App.invInicialSave()">Guardar conteo</button>`);
  },
  async invInicialSave(){
    const prods=(this._prods||[]).filter(p=>String(p.categoria||'').toLowerCase()!=='servicio');
    const cambios=[];

  /* ---- Conversión: un entero se parte en varias porciones ----

  _convTxt(p,prods,dest,fac,n){
    const d=(prods||[]).find(x=>x.id===dest);
    if(!p||!d) return 'Escoge en qué producto se convierte.';
    const q=Math.max(1,Math.round(+n||1)), f=Math.max(1,Math.round(+fac||1)), sale=q*f;
    const vIn=q*(+p.precio||0), vOut=sale*(+d.precio||0), dif=vOut-vIn;
    return `<b>${num(q)} ${esc(p.nombre)}</b> → <b>${num(sale)} ${esc(d.nombre)}</b>`

      +(dif?` · <span style="color:${dif<0?'var(--bad)':'var(--ok)'}">${dif<0?'pierde':'gana'} ${money(Math.abs(dif))} de valor de lista</span>`:'');
  },
  convPrevia(){ const e=$('cv_prev'); if(!e)return;

  async convGuardar(){
    const p=(this._prods||[]).find(x=>x.id===this._invProd); if(!p){alert('Escoge un producto');return;}
    const dest=($('cv_d')||{}).value||'', d=(this._prods||[]).find(x=>x.id===dest);
    if(!d){alert('Escoge en qué producto se convierte');return;}
    const q=Math.round(+($('cv_n')||{}).value||0), f=Math.round(+($('cv_f')||{}).value||0);
    if(q<=0){alert('¿Cuántos vas a convertir?');return;}
    if(f<=0){alert('¿En cuántas partes rinde cada uno?');return;}
    const sale=q*f, quedan=(+p.existencias||0)-q;
    if(quedan<0 && !confirm('Solo hay '+num(p.existencias)+' de '+p.nombre+'. Quedaría en '+num(quedan)+'. ¿Sigo?'))return;
    const mot='Conversión: '+q+' '+p.nombre+' → '+sale+' '+d.nombre;
    const a=await POST('kruh_movimientos',{producto_id:p.id,tipo:'conv_menos',cantidad:q,motivo:mot});
    if(!a){ toast('⚠️ NO se guardó la conversión'); return; }
    // el id del primero se guarda en el motivo del segundo: asi se sabe cual va con cual
    // y al borrar uno se puede borrar el otro, sin dejar media conversion suelta
    const b=await POST('kruh_movimientos',{producto_id:d.id,tipo:'conv_mas',cantidad:sale,motivo:mot+' [par:'+a.id+']'});
    if(!b){ await DEL('kruh_movimientos?id=eq.'+a.id);   // se deshace, si no queda a medias
      toast('⚠️ NO se guardó la conversión — nada quedó a medias'); return; }
    const u1=await PATCH('kruh_productos?id=eq.'+p.id,{existencias:quedan});
    const u2=await PATCH('kruh_productos?id=eq.'+d.id,{existencias:(+d.existencias||0)+sale});
    toast((u1&&!u1.ok)||(u2&&!u2.ok)?'⚠️ Conversión guardada, pero el inventario NO — revisa'
      :'🔄 '+num(q)+' '+p.nombre+' → '+num(sale)+' '+d.nombre);
    this._convDest=''; this._convFac=0; this.vInventario(); },
  /* uno=1 -> registra 1 de una vez sin leer los campos (el clic rapido) */
  async movRapido(uno){ const pid=this._invProd, acc=this._invAcc||'entrada';
    const p=(this._prods||[]).find(x=>x.id===pid); if(!p){alert('Escoge un producto');return;}

  movEditar(id){ const m=(this._movs||[]).find(x=>x.id===id);

  async movEditarSave(id){ const m=(this._movs||[]).find(x=>x.id===id); if(!m)return;
    const p=(this._prods||[]).find(x=>x.id===m.producto_id), sg=this._sgn(m.tipo), q0=+m.cantidad||0;
    const n=Math.max(0,Math.round(+$('me_n').value||0)), mot=$('me_m').value.trim();

  /* Borrar = como si la operación nunca hubiera pasado: se va la fila y se deshace
     su efecto. Si es una conversión se borran LAS DOS filas, porque borrar una sola
     dejaba la mitad suelta sumando o restando por su cuenta. */
  _paresDe(m){ const todos=this._movs||[], out=[m];
    if(m.tipo==='conv_menos'){ const o=todos.find(x=>x.tipo==='conv_mas'&&String(x.motivo||'').includes('[par:'+m.id+']')); if(o)out.push(o); }
    else if(m.tipo==='conv_mas'){ const g=String(m.motivo||'').match(/\[par:([^\]]+)\]/);
      if(g){ const o=todos.find(x=>x.id===g[1]); if(o)out.push(o); } }
    return out; },
  async movBorrar(id){ const m=(this._movs||[]).find(x=>x.id===id);
    if(!m){ toast('No encontré ese movimiento — recarga'); return; }
    const filas=this._paresDe(m), prods=this._prods||[];
    const detalle=filas.map(x=>{ const p=prods.find(y=>y.id===x.producto_id)||{};
      const s=this._sgn(x.tipo), n=+x.cantidad||0;
      return '· '+(s>0?'+':(s<0?'−':''))+num(n)+' '+(p.nombre||'—')+(s?' → quedaría en '+num((+p.existencias||0)-s*n):' (no toca inventario)');
    }).join('\n');
    const esPedido=/^Pedido /.test(String(m.motivo||''));
    if(!confirm('Se borra de la base y se deshace su efecto:\n\n'+detalle
      +(filas.length>1?'\n\n(es una conversión: se borran las dos partes)':'')
      +(esPedido?'\n\n⚠️ OJO: este movimiento viene de un pedido. Se devuelve el inventario, pero el PEDIDO y la VENTA siguen registrados. Bórralos desde Pedidos si el pedido fue un error.':'')
      +'\n\n¿Continuo?')) return;
    if(!this._okGerencia('BORRAR este movimiento')){ toast('Cancelado — no se borró nada'); return; }
    for(const x of filas){
      const r=await DEL('kruh_movimientos?id=eq.'+x.id);
      if(r&&!r.ok){ toast('⚠️ No se pudo borrar — revisa'); this.vInventario(); return; }
      const p=prods.find(y=>y.id===x.producto_id), s=this._sgn(x.tipo), n=+x.cantidad||0;
      if(s&&p){ const nueva=(+p.existencias||0)-s*n;      // se deshace el efecto que tuvo
        const up=await PATCH('kruh_productos?id=eq.'+p.id,{existencias:nueva});
        if(up&&!up.ok){ toast('⚠️ Borrado, pero el inventario NO se devolvió — revisa'); this.vInventario(); return; }
        p.existencias=nueva; } }
    toast(filas.length>1?'Conversión borrada completa':'Borrado · inventario devuelto');
    this.vInventario(); },

  /* ✏️ corregir el TOTAL de muestras del mes de una vez (atajo del panel).

      <div class="hint" style="margin-bottom:6px">Hoy van <b>${num(dia)}</b> · este mes <b>${num(act)}</b>. Esto corrige el total del mes de un solo golpe; para arreglar un registro puntual usa el ✏️ de la lista de hoy.</div>
      <label>Muestras de este mes</label><input id="ms_n" type="number" min="0" value="${act}" autofocus>
      <div class="hint">Existencias hoy: <b>${num(p.existencias)}</b> → quedarían <b id="ms_q">${num(p.existencias)}</b></div>

      const e=$('ms_q'); if(e){ e.textContent=num(q); e.style.color=q<0?'var(--bad)':''; } }; },
  async musGuardar(id){ const p=(this._prods||[]).find(x=>x.id===id); if(!p)return;

  /* ===================== PROVEEDORES ===================== */
  async vProveedores(){
    this.loading();
    const [provs,pp,comp,mov,mp,rec]=await Promise.all([GET('kruh_proveedores?order=categoria,nombre&limit=2000'),GET('kruh_prov_productos?order=nombre&limit=5000'),GET('kruh_gastos?order=fecha&limit=5000'),GETALL('kruh_compras?order=fecha.desc,creado_en.desc&limit=5000'),GET('kruh_materiaprima?order=nombre&limit=2000'),GET('kruh_recetas?select=id,ingrediente&limit=5000')]);
    this._provs=provs; this._pp=pp; this._gastos=comp; this._mov=mov; this._mp=mp; this._recsAll=rec;
    const ppBy={}; pp.forEach(x=>{(ppBy[x.proveedor_id]=ppBy[x.proveedor_id]||[]).push(x);});
    const caj=this._provTab||'';
    const mes=this._gasMes||this._mesActual(); this._gasMes=mes;
    const compras=comp.filter(g=>this._esCompra(g));
    const meses=[...new Set(compras.map(g=>this._gasFecha(g).slice(0,7)).filter(Boolean).concat([mes,this._mesActual()]))].sort().reverse();
    const delMes=compras.filter(g=>this._gasFecha(g).slice(0,7)===mes)
      .sort((a,b)=>(this._gasFecha(a)+(a.creado_en||'')).localeCompare(this._gasFecha(b)+(b.creado_en||'')));
    const tc={}; this.CATCOMPRAS.forEach(c=>tc[c]={n:0,t:0});
    delMes.forEach(g=>{ const k=this._catCompra(g); if(tc[k]){tc[k].n++; tc[k].t+=+g.monto||0;} });
    const totMes=delMes.reduce((a,g)=>a+(+g.monto||0),0);
    const filas=this.CATCOMPRAS.includes(caj)?delMes.filter(g=>this._catCompra(g)===caj):[];
    const sum=f=>filas.reduce((a,g)=>a+(+g[f]||0),0);
    const total=sum('monto'), tBase=sum('base'), tIva=sum('iva');
    const pagado=filas.filter(g=>g.pagado!==false).reduce((a,g)=>a+(+g.monto||0),0), pend=total-pagado;
    const nom=this._ymNom(mes);
    this.set(`<h1>Proveedores</h1><div class="sub">Compras del mes por categoría · toca un cajón para ver sus facturas y sus proveedores</div>
      <div class="row" style="gap:8px;margin-bottom:12px;align-items:center"><span class="dim" style="font-size:12px">Mes:</span>
        <select onchange="App._gasMes=this.value;App.vProveedores()" style="width:auto">${meses.map(m=>`<option value="${esc(m)}" ${m===mes?'selected':''}>${esc(this._ymNom(m))} ${esc(m.slice(0,4))}</option>`).join('')}</select>
        <span class="dim" style="font-size:12px;margin-left:auto">${delMes.length} compra(s) · ${money(totMes)} en ${esc(nom)}</span></div>
      <div class="row" style="gap:10px;margin-bottom:14px;flex-wrap:wrap">
        ${this.CATCOMPRAS.map(c=>{const n=provs.filter(p=>this._catProv(p)===c).length;
          return `<div class="cajon ${caj===c?'on':''}" onclick="App._provTab=App._provTab==='${esc(c)}'?'':'${esc(c)}';App.vProveedores()">
            <b>${money(tc[c].t)}</b>${esc(c)}<div style="font-size:11px;opacity:.75">${tc[c].n} compra(s) · ${n} proveedor(es)</div></div>`;}).join('')}
        <div class="cajon ${caj==='compra'?'on':''}" onclick="App._provTab='compra';App.vProveedores()">🛒 Registrar compra</div>
        <div class="cajon ${caj==='mov'?'on':''}" onclick="App._provTab=App._provTab==='mov'?'':'mov';App.vProveedores()">
          <b>${mov.filter(c=>(+c.cantidad||0)>0).length+comp.filter(g=>this._esCompra(g)).length}</b>📈 Movimientos<div style="font-size:11px;opacity:.75">precios y fluctuación</div></div></div>
      ${caj==='mov'?this._movHTML():(caj==='compra'?this._provCompraHTML(provs):(!caj?'<div class="empty">👆 Toca un cajón para ver sus compras y sus proveedores.</div>':`
      <h1 style="font-size:17px">Compras de ${esc(caj)} · ${esc(nom)}</h1>
      <div class="row" style="gap:8px;margin-bottom:10px"><button class="btn acc sm" onclick="App.compraNueva('${esc(caj)}')">＋ Nueva compra</button></div>
      ${this._tbFacturas(filas,{rubros:this.CATCOMPRAS,colRubro:'Categoría',phConcepto:'Qué se compró',
        vacio:`Sin compras de ${esc(caj)} en ${esc(nom)}. Dale a <b>＋ Nueva compra</b>.`,
        titulo:'TOTALES DE '+esc(caj).toUpperCase(),tBase,tIva,total,pagado,pend})}
      <h1 style="font-size:17px;margin-top:20px">Proveedores de ${esc(caj)}</h1>
      ${this._provDirHTML(provs,ppBy,caj)}`))}`);
  },
  /* ---- Movimientos: cómo se ha movido el precio de cada insumo ----
     Se puede mirar por insumo (¿subió la harina?) o por proveedor
     (¿quién me está subiendo los precios?). */
  /* Junta las dos fuentes de compra que tiene la app:
       - kruh_compras: la compra detallada (cantidad + precio unitario) → sirve para fluctuación
       - kruh_gastos:  la factura (solo el monto) → sirve para saber en qué se gastó
     Las facturas viejas no traen cantidad, así que no entran al cálculo de %. */
  _movDatos(){
    const out=[];
    (this._mov||[]).forEach(c=>out.push({
      fecha:String(c.fecha||'').slice(0,10), prov:String(c.proveedor||'').trim()||'— sin proveedor —',
      item:String(c.insumo||'').trim()||'—', cant:+c.cantidad||0, pu:+c.precio_unit||0,
      total:+c.total||0, uni:c.unidad||'', prom:+c.costo_promedio||0,
      tipo:(+c.cantidad||0)>0?'compra':'arranque' }));
    (this._gastos||[]).filter(g=>this._esCompra(g)).forEach(g=>{
      const fe=this._gasFecha(g); const con=String(g.concepto||'').trim();
      if(!fe||(!con&&!(+g.monto||0))) return;
      out.push({ fecha:fe, prov:String(g.proveedor||'').trim()||'— sin proveedor —',
        item:con||'(sin concepto)', cant:0, pu:0, total:+g.monto||0, uni:'', prom:0, tipo:'factura' }); });
    return out;
  },
  _movHTML(){
    const todo=this._movDatos();
    if(!todo.length) return `<div class="card" style="border-left:4px solid var(--acc)">
      <b>Todavía no hay movimientos</b>
      <div style="font-size:13.5px;margin-top:6px">Cada compra que registres en <b>🛒 Registrar compra</b> queda acá con su precio,
      y desde la segunda compra del mismo insumo ya se ve si subió o bajó.</div></div>`;
    const modo=this._movModo||'insumo', q=(this._movQ||'').trim().toLowerCase();
    const mesesM=[...new Set(todo.map(c=>c.fecha.slice(0,7)).filter(Boolean))].sort().reverse();
    const mm=(this._movMes===undefined)?'':this._movMes;
    const datos=mm?todo.filter(c=>c.fecha.slice(0,7)===mm):todo;
    const grupos={};
    if(modo!=='comp') datos.forEach(c=>{ const k=modo==='insumo'?c.item:c.prov; (grupos[k]=grupos[k]||[]).push(c); });
    let claves=Object.keys(grupos).sort((a,b)=>a.localeCompare(b));
    if(q) claves=claves.filter(k=>k.toLowerCase().includes(q));
    const tot=datos.reduce((a,c)=>a+c.total,0);
    const nReal=datos.filter(c=>c.tipo!=='arranque').length, nDet=datos.filter(c=>c.tipo==='compra').length;
    const cab=`<div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
        <button class="btn ${modo==='insumo'?'acc':'gh'} sm" onclick="App._movModo='insumo';App._movOpen='';App.vProveedores()">Por insumo</button>
        <button class="btn ${modo==='prov'?'acc':'gh'} sm" onclick="App._movModo='prov';App._movOpen='';App.vProveedores()">Por proveedor</button>
        <button class="btn ${modo==='comp'?'acc':'gh'} sm" onclick="App._movModo='comp';App._movOpen='';App.vProveedores()">Comparar</button>
        <select onchange="App._movMes=this.value;App._movOpen='';App.vProveedores()" style="width:auto">
          <option value="" ${mm?'':'selected'}>Todos los meses</option>
          ${mesesM.map(m=>`<option value="${esc(m)}" ${m===mm?'selected':''}>${esc(this._ymNom(m))} ${esc(m.slice(0,4))}</option>`).join('')}</select>
        <input placeholder="Buscar…" value="${esc(this._movQ||'')}" oninput="App._movQ=this.value;clearTimeout(App._movT);App._movT=setTimeout(()=>App.vProveedores(),350)" style="flex:1;min-width:120px;width:auto">
        <span class="dim" style="font-size:12px">${nReal} compra${nReal===1?'':'s'} · ${money(tot)}</span></div>
      ${nDet===0?`<div class="card" style="border-left:4px solid var(--acc);margin-bottom:10px;padding:10px 13px">
        <b style="font-size:13.5px">Las compras de antes son facturas, no traen precio por unidad</b>
        <div style="font-size:12.5px;margin-top:4px">Se ve <b>en qué se gastó y con quién</b>, pero no si el insumo subió o bajó: la factura
        guarda el monto, no la cantidad. Desde <b>🛒 Registrar compra</b> sí queda el precio por unidad y ahí arranca la fluctuación.</div></div>`:''}`;
    if(modo==='comp') return cab+this._movComparar(datos,q);
    return cab+`${claves.length?claves.map(k=>{
        const cs=grupos[k].slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
        const conPre=cs.filter(c=>c.pu>0).sort((a,b)=>b.fecha.localeCompare(a.fecha));
        const ult=conPre[0]||null, pre=conPre[1]||null;
        const dif=(ult&&pre&&pre.pu>0)?((ult.pu-pre.pu)/pre.pu*100):null;
        const precios=conPre.map(c=>c.pu);
        const mn=precios.length?Math.min(...precios):0, mx=precios.length?Math.max(...precios):0;
        const gastado=cs.reduce((a,c)=>a+c.total,0), nc=cs.filter(c=>c.tipo!=='arranque').length;
        const abierto=this._movOpen===k, kj=esc(k).replace(/'/g,"\\'");
        return `<div class="item">
          <div class="top" style="display:flex;justify-content:space-between;cursor:pointer;gap:8px" onclick="App._movOpen=App._movOpen==='${kj}'?'':'${kj}';App.vProveedores()">
            <div style="flex:1;min-width:0"><div class="nm">${abierto?'▾':'▸'} ${esc(k)}</div>
              <div class="mt">${nc?nc+' compra'+(nc===1?'':'s')+' · '+money(gastado):'sin compras en el periodo'}${mx>mn?` · entre ${money(mn)} y ${money(mx)}`:''}</div></div>
            <div style="text-align:right;flex:none">
              ${ult?`<div style="font-weight:800;font-size:15px">${money(ult.pu)}${ult.uni?'<span style="font-size:11px;color:var(--mut)">/'+esc(ult.uni)+'</span>':''}</div>`
                   :`<div style="font-weight:800;font-size:15px">${money(gastado)}</div>`}
              ${ult?(dif===null?'<div style="font-size:11.5px;color:var(--mut)">precio de arranque</div>'
                :`<div style="font-size:11.5px;font-weight:700;color:${dif>0.5?'var(--bad)':(dif<-0.5?'var(--ok)':'var(--mut)')}">${dif>0.5?'▲ +':(dif<-0.5?'▼ ':'= ')}${Math.abs(dif)<0.5?'igual':Math.abs(dif).toFixed(0)+'%'}</div>`)
                :'<div style="font-size:11.5px;color:var(--mut)">solo factura</div>'}</div></div>
          ${abierto?this._movDetalle(cs,modo):''}</div>`;}).join('')
      :`<div class="empty">Nada que coincida${q?' con “'+esc(this._movQ||'')+'”':''}${mm?' en '+esc(this._ymNom(mm)):''}.</div>`}`;
  },
  /* Comparar: el mismo insumo comprado a varios proveedores. Responde
     "¿quién me lo vende más barato?" que es lo que sirve para negociar. */
  _movComparar(datos,q){
    const porIns={};
    datos.filter(c=>c.pu>0&&c.tipo==='compra').forEach(c=>{
      const k=c.item; const g=porIns[k]=porIns[k]||{};
      const p=g[c.prov]=g[c.prov]||{n:0,sum:0,ult:null,uni:c.uni};
      p.n++; p.sum+=c.pu; if(!p.ult||c.fecha>p.ult.fecha)p.ult=c; });
    let claves=Object.keys(porIns).filter(k=>Object.keys(porIns[k]).length>1);
    if(q) claves=claves.filter(k=>k.toLowerCase().includes(q));
    claves.sort((a,b)=>a.localeCompare(b));
    if(!claves.length) return `<div class="card" style="border-left:4px solid var(--acc)">
      <b>Todavía no hay con qué comparar</b>
      <div style="font-size:13.5px;margin-top:5px">Acá salen los insumos que le has comprado a <b>más de un proveedor</b>,
      para ver quién lo tiene más barato. Necesita al menos dos proveedores del mismo insumo, registrados
      desde <b>🛒 Registrar compra</b> (con cantidad y precio).</div>
      <div class="hint" style="margin-top:6px">Las facturas de julio no sirven acá: no traen precio por unidad.</div></div>`;
    return claves.map(k=>{
      const provs=Object.entries(porIns[k]).map(([n,p])=>({n,prom:p.sum/p.n,n_:p.n,ult:p.ult,uni:p.uni}))
        .sort((a,b)=>a.prom-b.prom);
      const barato=provs[0], caro=provs[provs.length-1];
      const dif=barato.prom>0?((caro.prom-barato.prom)/barato.prom*100):0;
      const mx=caro.prom||1;
      return `<div class="item"><div class="nm">${esc(k)}</div>
        <div class="mt">${provs.length} proveedores${dif>0.5?` · el más caro cobra <b style="color:var(--bad)">${dif.toFixed(0)}% más</b>`:' · todos al mismo precio'}</div>
        <div style="margin-top:7px">
        ${provs.map((p,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0">
          <span style="width:150px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i===0?'🏆 ':''}${esc(p.n)}</span>
          <span style="flex:1;height:7px;background:var(--line2);border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${p.prom/mx*100}%;background:${i===0?'var(--ok)':(i===provs.length-1?'var(--bad)':'var(--acc2)')}"></i></span>
          <span style="width:84px;text-align:right;font-weight:${i===0?'800':'600'};flex:0 0 auto">${money(Math.round(p.prom))}${p.uni?'<span style="font-size:10.5px;color:var(--mut)">/'+esc(p.uni)+'</span>':''}</span>
          <span style="width:70px;text-align:right;flex:0 0 auto;color:var(--mut);font-size:11.5px">${p.n_} compra${p.n_===1?'':'s'}</span>
          <span style="width:52px;text-align:right;flex:0 0 auto;color:var(--mut);font-size:11.5px">${esc(String(p.ult.fecha).slice(5))}</span>
        </div>`).join('')}</div>
        ${dif>0.5?`<div class="hint" style="margin-top:6px;border-top:1px solid var(--line2);padding-top:6px">
          Comprándole a <b>${esc(barato.n)}</b> en vez de a ${esc(caro.n)} te ahorras
          <b>${money(Math.round(caro.prom-barato.prom))}</b> por ${esc(barato.uni||'unidad')}.</div>`:''}</div>`;}).join('');
  },
  _movDetalle(cs,modo){
    const ord=cs.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const precios=ord.filter(c=>c.pu>0).map(c=>c.pu), mxp=precios.length?Math.max(...precios):0;
    const montos=ord.filter(c=>!c.pu).map(c=>c.total), mxm=montos.length?Math.max(...montos):0;
    let antPu=null;
    return `<div style="margin-top:9px;border-top:1px dashed var(--line);padding-top:8px">
      ${ord.map(c=>{ let d=null;
        if(c.pu>0){ if(antPu&&antPu>0) d=(c.pu-antPu)/antPu*100; antPu=c.pu; }
        const col=d===null?'var(--acc2)':(d>0.5?'var(--bad)':(d<-0.5?'var(--ok)':'var(--acc2)'));
        const anch=c.pu>0?(mxp?c.pu/mxp*100:0):(mxm?c.total/mxm*100:0);
        return `<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--line2)">
          <span style="width:52px;flex:0 0 auto;color:var(--mut)">${esc(c.fecha.slice(5))}</span>
          <span style="flex:1;min-width:30px;height:6px;background:var(--line2);border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${anch}%;background:${c.pu>0?col:'var(--line)'}"></i></span>
          <span style="width:84px;text-align:right;font-weight:700;flex:0 0 auto">${c.pu>0?money(c.pu)+(c.uni?'<span style="font-size:10.5px;color:var(--mut)">/'+esc(c.uni)+'</span>':''):'<span style="color:var(--mut);font-weight:400">—</span>'}</span>
          <span style="width:46px;text-align:right;flex:0 0 auto;font-size:11.5px;color:${d===null?'var(--mut)':(d>0.5?'var(--bad)':(d<-0.5?'var(--ok)':'var(--mut)'))}">${d===null?'':(Math.abs(d)<0.5?'=':(d>0?'+':'')+d.toFixed(0)+'%')}</span>
          <span style="width:112px;text-align:right;flex:0 0 auto;color:var(--mut);font-size:11.5px">${c.tipo==='arranque'?'<i>arranque</i>':(c.cant>0?num(c.cant)+' '+esc(c.uni||'')+' · '+money(c.total):'factura · '+money(c.total))}${(c.prom>0&&Math.abs(c.prom-c.pu)>0.009)?'<br><span style="color:var(--acc)">costeó a '+money(Math.round(c.prom))+'</span>':''}</span>
          <span style="width:112px;text-align:right;flex:0 0 auto;color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(modo==='insumo'?c.prov:c.item)}</span>
        </div>`;}).join('')}</div>`;
  },
  _catCompra(g){ const c=String(g.rubro||'').toLowerCase();
    if(/empaq|envase|frasco|desechab|bandeja/.test(c))return 'Empaques';
    if(/aseo|limpiez|consumib/.test(c))return 'Consumibles aseo';
    if(/etiqueta|sticker|rotul|publicid/.test(c))return 'Etiquetas';
    return 'Materia prima'; },
  async compraNueva(cat){ const mes=this._gasMes||this._mesActual();
    const n=await POST('kruh_gastos',{concepto:'',proveedor:'',factura:'',rubro:cat,tiene_iva:false,base:0,iva:0,monto:0,fecha:this._diaDef(mes),forma_pago:'Efectivo',pagado:false});
    if(!n){ toast('⚠️ No se pudo crear la compra'); return; }
    await this.vProveedores();
    const f=document.querySelectorAll('#main .tb tbody tr'), u=f[f.length-1];
    if(u){ const i=u.querySelectorAll('input')[1]; if(i){i.focus(); i.scrollIntoView({block:'center'});} } },
  _catProv(p){ const c=String(p.categoria||'').toLowerCase();
    if(/empaq|envase|frasco|desechab|bandeja/.test(c))return 'Empaques';
    if(/aseo|limpiez|consumib/.test(c))return 'Consumibles aseo';
    if(/etiqueta|sticker|rotul|publicid/.test(c))return 'Etiquetas';
    return 'Materia prima'; },

          ${prods.length?prods.map(x=>`<div class="row" style="justify-content:space-between;padding:2px 0"><span>• ${esc(x.nombre)} <small class="dim">${money(x.valor)}/${esc(x.unidad||'kg')}</small></span><span style="white-space:nowrap"><a onclick="App.provProdModal('${p.id}','${x.id}')" style="color:var(--acc);cursor:pointer;margin-right:6px">✎</a><a onclick="App.provProdDel('${x.id}')" style="color:var(--bad);cursor:pointer">✕</a></span></div>`).join(''):'<div class="hint">Sin productos aún.</div>'}
          <button class="btn gh sm full" onclick="App.provProdModal('${p.id}')">＋ Agregar producto</button>
          <button class="btn gh sm" style="margin-top:8px" onclick="App.provModal('${p.id}')">✎ Editar proveedor</button></div>`:''}</div>`;}).join('')}</div>`).join(''):`<div class="empty">Ningún proveedor en ${esc(caj)} todavía.</div>`}`;
  },
  _provCompraHTML(provs){

  },
  cpProds(){ const pid=$('cp_prov').value, prods=(this._pp||[]).filter(x=>x.proveedor_id===pid), w=$('cp_wrap'); if(!pid){w.style.display='none';return;} w.style.display='block';
    $('cp_prod').innerHTML=prods.length?prods.map(x=>`<option value="${x.id}" data-n="${esc(x.nombre)}" data-uni="${esc(x.unidad||'kg')}" data-val="${x.valor||0}">${esc(x.nombre)} · ${money(x.valor)}/${esc(x.unidad||'kg')}</option>`).join(''):'<option value="">— sin productos; agrégalos en el directorio del proveedor —</option>'; this.cpPre(); },
  cpPre(){ const s=$('cp_prod'), o=s&&s.options[s.selectedIndex];

  /* El insumo tal como está hoy en Compras, para poder comparar contra lo que
     se está digitando. Se busca por el producto del proveedor y, si no,
     por nombre (que es como quedaron enlazados los insumos viejos). */
  _cpInsumo(){ const s=$('cp_prod'), o=s&&s.options[s.selectedIndex]; if(!o||!o.value) return null;
    const mp=this._mp||[];
    return mp.find(m=>m.prov_producto_id===o.value)
        || mp.find(m=>String(m.nombre||'').trim().toLowerCase()===String(o.dataset.n||'').trim().toLowerCase())
        || null; },
  /* Espejo en vivo: antes de grabar se ve el total, en cuánto queda el costo y
     un aviso si el salto es tan grande que huele a error de digitación
     (el clásico: poner el precio del bulto en la casilla del kilo). */
  cpCalc(){ const c=$('cp_esp'); if(!c) return;
    const cant=+($('cp_cant')||{}).value||0, precio=+($('cp_precio')||{}).value||0;
    if(cant<=0||precio<=0){ c.innerHTML=''; return; }
    const m=this._cpInsumo(), uni=(m&&m.unidad)|| (($('cp_prod')||{}).options?($('cp_prod').options[$('cp_prod').selectedIndex].dataset.uni||''):'') ||'unidad';
    const total=cant*precio;
    let html=`<div style="background:var(--paper);border-radius:9px;padding:9px 11px;margin:8px 0;font-size:12.5px">
      <div class="row" style="justify-content:space-between"><span class="dim">${num(cant)} ${esc(uni)} × ${money(precio)}</span><b>${money(total)}</b></div>`;
    if(m){
      const ant=+m.costo_unit||0, saldo=+m.existencias||0;

      const dif=ant>0?((precio-ant)/ant*100):null;
      html+=`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);margin-top:5px;padding-top:5px">
        <span class="dim">Venía en</span><span>${money(ant)}/${esc(uni)}${dif!==null?` <b style="color:${dif>0.5?'var(--bad)':(dif<-0.5?'var(--ok)':'var(--mut)')}">${dif>0?'+':''}${dif.toFixed(0)}%</b>`:''}</span></div>
      <div class="row" style="justify-content:space-between"><span class="dim">Queda${saldo>0?' (mezclado con '+num(saldo)+' '+esc(uni)+' en bodega)':''}</span>
        <b style="color:var(--acc)">${money(Math.round(prom))}/${esc(uni)}</b></div>`;
      const rec=(this._recsAll||[]).filter(r=>String(r.ingrediente||'').trim().toLowerCase()===String(m.nombre||'').trim().toLowerCase()).length;
      if(rec) html+=`<div class="hint" style="margin-top:4px">Va a recostear ${rec} receta${rec===1?'':'s'}.</div>`;
      if(dif!==null&&dif>=80) html+=`<div style="background:var(--badbg);border-radius:7px;padding:7px 9px;margin-top:7px;font-size:12px;color:var(--bad)">
        <b>⚠️ Ojo con este precio</b><br>Subió ${dif.toFixed(0)}% de un tirón. ¿No estarás poniendo lo que costó
        <b>todo el bulto</b> en la casilla del precio por ${esc(uni)}? Ahí va el precio de <b>un solo ${esc(uni)}</b>.</div>`;
      else if(dif!==null&&dif<=-50) html+=`<div style="background:var(--okbg);border-radius:7px;padding:7px 9px;margin-top:7px;font-size:12px;color:var(--ok)">

      html+=`<div class="hint" style="margin-top:5px">Insumo nuevo: queda costeado a ${money(precio)}/${esc(uni)}.</div>`;
    }
    c.innerHTML=html+'</div>'; },
  async cpSave(){ const s=$('cp_prod'), o=s.options[s.selectedIndex]; if(!o||!o.value){alert('Escoge un producto');return;}
    const cant=+$('cp_cant').value||0, precio=+$('cp_precio').value||0; if(cant<=0){alert('Pon la cantidad');return;}
    const pid=$('cp_prov').value, provNom=((this._provs||[]).find(x=>x.id===pid)||{}).nombre||'';
    const ex=(await GET('kruh_materiaprima?prov_producto_id=eq.'+o.value+'&select=id,existencias,nombre,costo_unit'))[0];
    let nom=o.dataset.n, mpId=null, antes=null, saldo=0, prom=precio;
    if(ex){ nom=ex.nombre||nom; mpId=ex.id; antes=+ex.costo_unit||0; saldo=+ex.existencias||0;
      /* COSTO PROMEDIO PONDERADO: lo que queda en bodega al precio viejo pesa
         junto con lo que entra al precio nuevo. Así el costo nuevo no golpea de
         una: entra de a poco y termina de mandar cuando se acaba lo viejo. */
      prom=(saldo>0&&antes>0)?((saldo*antes+cant*precio)/(saldo+cant)):precio;
      await PATCH('kruh_materiaprima?id=eq.'+ex.id,{existencias:saldo+cant,costo_unit:prom,proveedor:provNom}); }
    else await POST('kruh_materiaprima',{nombre:nom,unidad:o.dataset.uni,existencias:cant,costo_unit:precio,proveedor_id:pid,proveedor:provNom,prov_producto_id:o.value});
    /* queda el rastro: sin esto el precio viejo se perdía y no había forma de
       ver si el insumo subió o bajó. precio_unit es lo que se pagó de verdad;
       costo_promedio es a cuánto quedó costeada la receta. */
    await POST('kruh_compras',{proveedor_id:pid,proveedor:provNom,mp_id:mpId,insumo:nom,
      unidad:o.dataset.uni||'',cantidad:cant,precio_unit:precio,precio_anterior:antes,
      costo_promedio:prom,existencias_antes:saldo});
    /* el costo promedio baja solo a todas las recetas que usan este insumo */
    const n=await this._propagarPrecio(nom,prom);
    const dif=(antes!==null&&antes>0)?((precio-antes)/antes*100):null;
    const mez=(saldo>0&&antes>0&&Math.abs(prom-precio)>0.009);
    toast('Compra registrada'+(dif!==null&&Math.abs(dif)>=0.5?' · pagaste '+(dif>0?'+':'')+dif.toFixed(0)+'%':'')
      +(mez?' · costo queda en '+money(prom):'')
      +(n?' · '+n+(n===1?' receta':' recetas'):'')); this.go('proveedores'); },
  /* Deja el precio del insumo hasta que llegue una compra nueva. Cuando llega,
     ese valor pasa a ser el costo en TODAS las recetas que lo usan. */
  async _propagarPrecio(nombre,cu){
    const k=String(nombre||'').trim().toLowerCase(); if(!k) return 0;
    const rs=await GET('kruh_recetas?select=id,ingrediente,costo_unit&limit=5000');
    const pend=(rs||[]).filter(r=>String(r.ingrediente||'').trim().toLowerCase()===k
      && Math.abs((+r.costo_unit||0)-(+cu||0))>0.009);
    if(!pend.length) return 0;
    await PATCH('kruh_recetas?id=in.('+pend.map(r=>r.id).join(',')+')',{costo_unit:+cu||0});
    return pend.length; },
