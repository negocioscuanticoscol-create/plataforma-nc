<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>kruh · club del pan</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5efe4; --card:#fffdf8; --ink:#2a1f16; --ink2:#5b4d3f; --mut:#9a8b78;
    --line:#e7ddc9; --line2:#f0e9da; --acc:#b5651d; --acc2:#d98b3f; --gold:#caa23c;
    --ok:#4f7a4a; --okbg:#e6f1e2; --warn:#b4622e; --bad:#a8392c; --badbg:#f7e2dd;
    --sh:0 1px 2px rgba(40,25,10,.05),0 12px 30px -18px rgba(40,25,10,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:slashed-zero;font-feature-settings:'zero' 1}
  .wrap{max-width:920px;margin:0 auto;padding:0 15px 96px}
  header{background:var(--ink);color:var(--paper);padding:15px 0}
  .hd{max-width:920px;margin:0 auto;padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:600;letter-spacing:.01em;line-height:1}
  .brand b{color:var(--acc2)}
  .brand small{display:block;font-family:'IBM Plex Sans';font-size:9.5px;letter-spacing:.32em;color:var(--gold);margin-top:3px;text-transform:uppercase}
  .quien{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#b6a894;text-align:right}
  nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;overflow-x:auto}
  .nv{max-width:920px;margin:0 auto;display:flex;gap:1px;padding:0 8px}
  nav button{flex:0 0 auto;background:none;border:none;padding:13px 12px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
  nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
  h1{font-family:Fraunces,serif;font-size:25px;font-weight:600;margin:20px 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
  label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:9px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
  textarea{min-height:60px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .btn{padding:12px 17px;border:none;border-radius:9px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.acc{background:var(--acc)} .btn.gh{background:transparent;border:1px solid var(--line);color:var(--ink2)}
  .btn.full{width:100%;margin-top:10px} .btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--sh)}
  .item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .nm{font-weight:700;font-size:15px} .mt{font-size:12.5px;color:var(--mut);margin-top:2px}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--line2);color:var(--ink2)}
  .tag.pe{background:#fdeede;color:var(--warn)} .tag.np{background:#e7f1e6;color:var(--ok)}
  .empty{text-align:center;color:var(--mut);padding:34px 12px;font-size:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--sh)}
  .kpi b{display:block;font-size:22px;font-family:Fraunces,serif;font-weight:600}
  .kpi span{font-size:11px;color:var(--mut)}
  .kpi.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)} .kpi.dark b{color:var(--acc2)} .kpi.dark span{color:#b6a894}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bar{height:9px;background:var(--line2);border-radius:6px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;border-radius:6px;background:var(--acc)}
  .circ{width:19px;height:19px;border-radius:50%;border:2px solid var(--ok);flex:none;cursor:pointer;display:inline-block}
  .circ.on{background:var(--ok)}
  .circ.wa{border-color:#25a35a} .circ.wa.on{background:#25a35a}
  .et{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--mut)}
  .et.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
  .hint{font-size:12px;color:var(--mut);margin-top:5px}
  .modal{position:fixed;inset:0;background:rgba(30,20,8,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .modal .box{background:var(--card);border-radius:16px 16px 0 0;padding:17px;width:100%;max-width:920px;max-height:90vh;overflow:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;z-index:80;font-size:13px}
  small.dim{color:var(--mut)}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
  .pimg{aspect-ratio:1/1;background:#efe6d5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px}
  .pin{padding:8px 10px}
  .pn{font-weight:700;font-size:13px;line-height:1.2;min-height:31px}
  .pp{color:var(--acc);font-weight:800;font-size:14px;margin:2px 0 6px}
  .stp{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .stp button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
  .stp b{font-size:15px;min-width:20px;text-align:center}
  .cajon{flex:1;min-width:130px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:center;box-shadow:var(--sh)}
  .cajon.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .cajon b{display:block;font-size:22px;font-family:Fraunces,serif}
  .tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);background:var(--card)}
  .tb{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
  .tb th,.tb td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
  .tb thead th{background:var(--paper);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);white-space:nowrap;position:sticky;top:0}
  .tb tbody tr:hover{background:#fffaf0}
  .tb tfoot td{background:var(--paper);font-weight:700;border-bottom:none;border-top:2px solid var(--line);font-size:12.5px}
  .tb input,.tb select{padding:6px 7px;font-size:13px;border-radius:7px;border:1px solid transparent;background:transparent;width:100%}
  .tb input:hover,.tb select:hover{border-color:var(--line);background:#fff}
  .tb input:focus,.tb select:focus{border-color:var(--acc);background:#fff}
  .tb input:disabled,.tb select:disabled{color:var(--ink2);opacity:1;-webkit-text-fill-color:var(--ink2)}
  .tb input[type=number]{text-align:right;font-weight:700}
  .tb .del{color:var(--bad);cursor:pointer;font-weight:700;padding:0 4px}
  @media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
</style>

<header><div class="hd">
  <div class="brand">kruh<b>.</b><small>Club del Pan</small></div>
  <div class="quien">Gestión · por Negocios Cuánticos</div>
</div></header>
<nav><div class="nv" id="nav"></div></nav>
<div class="wrap"><div id="main" class="spin" style="text-align:center;padding:40px;color:var(--mut)">Cargando…</div></div>
<div id="modal-host"></div>

<script>
const SB='https://fnayedgvamxktxfvywwl.supabase.co', K='sb_publishable_NVTYNkJ0V6obLwgwjXza1g_3Ihp-xMv';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const num=n=>Math.round(+n||0).toLocaleString('es-CO');
async function GET(p){ const r=await fetch(SB+'/rest/v1/'+p,{headers:H}); return r.ok?r.json():[]; }
async function POST(t,b){ const r=await fetch(SB+'/rest/v1/'+t,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(b)}); return r.ok?(await r.json())[0]:null; }
async function PATCH(t,b){ return fetch(SB+'/rest/v1/'+t,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(b)}); }
async function DEL(t){ return fetch(SB+'/rest/v1/'+t,{method:'DELETE',headers:H}); }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1900); }
function modal(html){ $('modal-host').innerHTML='<div class="modal" onclick="if(event.target===this)App.cerrar()"><div class="box">'+html+'</div></div>'; }
function cerrar(){ $('modal-host').innerHTML=''; }

const App={
  cerrar,
  TABS:[['dashboard','📊 Dashboard'],['recetas','🥖 Recetas'],['proveedores','🚚 Proveedores'],['materiaprima','🛒 Compras'],['inventario','📦 Inventario'],['crm','📇 CRM'],['pedidos','📋 Pedidos'],['presupuestos','🎯 Presupuestos'],['ventas','💰 Ventas'],['gastos','🧾 Gastos'],['usuarios','👤 Usuarios'],['precios','💲 Precios']],
  view:'dashboard',
  MESNOM:['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],
  PASS:{admin:'kruhadmin2026', gerencia:'kruhgerencia2026'},
  ROLES:['admin','gerencia','cajera','panadero','bodeguero','chef'],
  get esAdmin(){ return this.rol==='admin'; },
  get puedeGestionar(){ return this.rol==='admin'||this.rol==='gerencia'; },
  _tabsRol(){ if(this.rol==='admin') return this.TABS.map(t=>t[0]);
    if(this.rol==='gerencia') return this.TABS.map(t=>t[0]).filter(v=>v!=='usuarios');   // gerencia ve todo menos Usuarios
    return ((this._permisos||{})[this.rol]||['recetas']).filter(v=>v!=='usuarios'&&v!=='dashboard'); },
  _primeraTab(){ const t=this._tabsRol(); return t.includes('dashboard')?'dashboard':(t[0]||'recetas'); },
  async init(){ this.rol=sessionStorage.getItem('kruh_rol')||'';
    try{ const [us,pm]=await Promise.all([GET('kruh_usuarios?select=nombre,rol,clave,activo&limit=200'),GET('kruh_permisos?limit=50')]); this._usuarios=us; this._permisos={}; pm.forEach(p=>this._permisos[p.rol]=p.tabs||[]); }catch(e){ this._usuarios=[]; this._permisos={}; }
    if(!this.ROLES.includes(this.rol)){this.rol='';} if(!this.rol) return this.vLogin(); this.paintHeader(); this.nav(); this.go(this._primeraTab()); },
  vLogin(){ $('nav').innerHTML=''; $('main').className='';
    $('main').innerHTML=`<div style="max-width:340px;margin:44px auto 0"><div class="card" style="text-align:center">
      <div style="font-family:Fraunces,serif;font-size:38px;color:var(--ink)">kruh<b style="color:var(--acc)">.</b></div>
      <div class="sub" style="margin:4px 0 16px">Ingresa tu clave</div>
      <input id="lg_pass" type="password" placeholder="Clave" style="text-align:center" onkeydown="if(event.key==='Enter')App.login()">
      <button class="btn acc full" onclick="App.login()">Entrar</button>
      <div class="hint" id="lg_err" style="color:var(--bad);display:none;margin-top:8px">Clave incorrecta</div></div></div>`;
    setTimeout(()=>{const e=$('lg_pass');if(e)e.focus();},60); },
  login(){ const p=($('lg_pass').value||'').trim(); let rol=''; for(const k in this.PASS){ if(p===this.PASS[k])rol=k; }
    if(!rol){ const u=(this._usuarios||[]).find(x=>x.clave===p&&x.activo!==false); if(u)rol=u.rol; }
    if(!rol){ const e=$('lg_err'); if(e)e.style.display='block'; return; } this.rol=rol; sessionStorage.setItem('kruh_rol',rol); this.init(); },
  logout(){ sessionStorage.removeItem('kruh_rol'); this.rol=''; this.vLogin(); },
  _okBorrar(){ const p=prompt('🔒 Clave para BORRAR:'); if(p===null)return false; if(p===this.PASS.admin||p===this.PASS.gerencia)return true; alert('Clave incorrecta'); return false; },
  paintHeader(){ const q=document.querySelector('.quien'); if(q){ const r=(this.rol||'').charAt(0).toUpperCase()+(this.rol||'').slice(1); q.innerHTML=`${r} · <a onclick="App.logout()" style="cursor:pointer;text-decoration:underline">salir</a>`; } },

  /* ===================== DASHBOARD ===================== */
  async vDashboard(){
    this.loading();
    const [meses,leads,ventas,peds,recs,gastos]=await Promise.all([GET('kruh_dashboard?order=orden&limit=24'),GET('kruh_leads?select=creado_en&limit=5000'),GET('kruh_ventas?select=monto,creado_en&limit=8000'),GET('kruh_pedidos?select=items,creado_en&limit=3000'),GET('kruh_recetas?select=producto_id,cantidad,costo_unit&limit=5000'),GET('kruh_gastos?select=monto,fecha,creado_en&limit=5000')]);
    const now=new Date(), cm=now.getMonth()+1, mesIni=new Date(now.getFullYear(),now.getMonth(),1), mesNom=this.MESNOM[cm]||'';
    // del mes en curso hacia atrás; los meses futuros quedan de últimas
    const rango=m=>{ const o=+m.orden||99; return o<=cm?o:o-1000; };
    meses.sort((a,b)=>rango(b)-rango(a));
    this._dash=meses;
    const costoProd={}; recs.forEach(r=>{costoProd[r.producto_id]=(costoProd[r.producto_id]||0)+(+r.cantidad||0)*(+r.costo_unit||0);});
    // ventas reales de CADA mes del año en curso: el Dashboard nunca queda desactualizado
    const ventasPorMes={};
    ventas.forEach(v=>{ const d=new Date(v.creado_en); if(isNaN(d)||d.getFullYear()!==now.getFullYear())return;
      ventasPorMes[d.getMonth()+1]=(ventasPorMes[d.getMonth()+1]||0)+(+v.monto||0); });
    const ventasReales=m=>{ const i=this.MESNOM.findIndex(x=>x&&m&&x.toLowerCase()===String(m).toLowerCase()); return i>0?(ventasPorMes[i]||0):0; };
    const liveVentas=ventas.filter(v=>new Date(v.creado_en)>=mesIni).reduce((a,v)=>a+(+v.monto||0),0);
    let liveCosto=0; peds.forEach(p=>{ if(new Date(p.creado_en)<mesIni)return; (p.items||[]).forEach(it=>{liveCosto+=(+it.qty||0)*(costoProd[it.producto_id]||0);}); });
    const manual=meses.find(m=>m.mes&&m.mes.toLowerCase()===mesNom.toLowerCase())||{ventas:0,costo:0,meta:40000000};
    const auto=liveVentas>0;
    const ventasM=auto?liveVentas:(+manual.ventas||0), costo=liveCosto>0?liveCosto:(+manual.costo||0);
    const ubruta=ventasM-costo, margen=ventasM>0?ubruta/ventasM*100:0, meta=+manual.meta||40000000;
    const ymAct=now.getFullYear()+'-'+String(cm).padStart(2,'0');
    const gastoLive=gastos.filter(g=>(g.fecha||g.creado_en||'').slice(0,7)===ymAct).reduce((a,g)=>a+(+g.monto||0),0);
    const gastosM=manual.cerrado?(+manual.gastos||0):(gastoLive||(+manual.gastos||0));
    const uneta=ubruta-gastosM;
    const vMes=m=>{const es=m.mes&&m.mes.toLowerCase()===mesNom.toLowerCase(); if(es)return ventasM; const r=ventasReales(m.mes); return r>0?r:(+m.ventas||0);};
    const acumMC=meses.reduce((a,m)=>{const es=m.mes&&m.mes.toLowerCase()===mesNom.toLowerCase();return a+(vMes(m)-(es?costo:(+m.costo||0)));},0);
    const acumGas=meses.reduce((a,m)=>{const es=m.mes&&m.mes.toLowerCase()===mesNom.toLowerCase();return a+(es?gastosM:(+m.gastos||0));},0);
    const registrados=leads.length, nuevosMes=leads.filter(l=>new Date(l.creado_en)>=mesIni).length;
    this.set(`<h1>Dashboard</h1><div class="sub">${esc(mesNom)} ${auto?'· <span style="color:var(--ok);font-weight:700">automático con las ventas del mes</span>':'· simulado (al ingresar pedidos se calcula solo)'} · meta ${money(meta)}</div>
      <div class="kpis">
        <div class="kpi dark"><b>${money(ventasM)}</b><span>Ventas del mes</span></div>
        <div class="kpi"><b>${money(costo)}</b><span>Costo</span></div>
        <div class="kpi"><b style="color:var(--ok)">${money(ubruta)}</b><span>Utilidad bruta</span></div>
        <div class="kpi"><b style="color:var(--warn)">${money(gastosM)}</b><span>Gastos del mes${manual.cerrado?' 🔒':''}</span></div>
        <div class="kpi"><b style="color:${uneta>=0?'var(--ok)':'var(--bad)'}">${money(uneta)}</b><span>Utilidad neta</span></div>
        <div class="kpi"><b>${margen.toFixed(0)}%</b><span>Margen contribución</span></div>
        <div class="kpi"><b>${registrados}</b><span>Clientes registrados</span></div>
        <div class="kpi"><b style="color:var(--acc)">${nuevosMes}</b><span>Clientes nuevos (mes)</span></div>
      </div>
      <div class="card"><div class="row" style="justify-content:space-between"><b>Meta del mes (NC)</b><span>${money(ventasM)} / ${money(meta)}</span></div>
        <div class="bar" style="height:12px"><i style="width:${Math.min(100,meta>0?ventasM/meta*100:0)}%;background:var(--acc)"></i></div>
        <div class="hint">${meta>ventasM?('Faltan '+money(meta-ventasM)+' para la meta'):'¡Meta cumplida! 🎉'}</div></div>
      <div class="card"><div style="font-family:Fraunces,serif;font-size:16px">Margen de contribución acumulado</div>
        <b style="font-size:24px;color:var(--acc);font-family:Fraunces,serif">${money(acumMC)}</b>
        <div class="hint">Suma de (ventas − costo) de todos los meses. Al cambiar precios de items, este acumulado se mueve.</div>
        <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><span class="dim">Gastos acumulados</span><b style="color:var(--warn)">${money(acumGas)}</b></div>
        <div class="row" style="justify-content:space-between"><span>Utilidad neta acumulada</span><b style="color:${acumMC-acumGas>=0?'var(--ok)':'var(--bad)'}">${money(acumMC-acumGas)}</b></div></div>
      <h1 style="font-size:18px;margin-top:20px">Mes a mes vs meta</h1>
      ${meses.map(m=>{const es=m.mes&&m.mes.toLowerCase()===mesNom.toLowerCase();const v=vMes(m),cc=es?costo:(+m.costo||0),gg=es?gastosM:(+m.gastos||0),nn=v-cc-gg,mt=+m.meta||meta,pct=mt>0?Math.min(100,v/mt*100):0;return `<div class="item"><div class="top"><div><div class="nm">${esc(m.mes)} ${es&&auto?'<span class="tag np">en vivo</span>':(ventasReales(m.mes)>0?'<span class="tag np">real</span>':'')}${m.cerrado?'<span class="tag">🔒 gastos cerrados</span>':''}</div>
        <div class="mt">Ventas ${money(v)}${cc?' · costo '+money(cc):''}${gg?' · gastos '+money(gg):''} · meta ${money(mt)}${es?` · <a onclick="App.dashDetalleMes()" style="color:var(--acc);cursor:pointer;font-weight:700">ver detalle →</a>`:''}</div>
        <div class="mt">Utilidad neta <b style="color:${nn>=0?'var(--ok)':'var(--bad)'}">${money(nn)}</b></div></div>
        ${this.esAdmin?`<button class="btn gh sm" onclick="App.dashModal('${esc(m.mes)}')">✎</button>`:''}</div>
        <div class="bar"><i style="width:${pct}%;background:${pct>=100?'var(--ok)':'var(--acc)'}"></i></div></div>`;}).join('')}
      ${this.esAdmin?`<button class="btn acc full" onclick="App.dashModal()">＋ Agregar mes</button>`:''}`);
  },
  dashModal(mes){ const m=(this._dash||[]).find(x=>x.mes===mes)||{};
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:8px">${mes?'Editar '+esc(mes):'Nuevo mes'}</h3>
      <label>Mes</label><input id="d_mes" value="${esc(m.mes||'')}" ${mes?'readonly':''} placeholder="Agosto">
      <div class="g3"><div><label>Ventas</label><input id="d_ven" type="number" value="${m.ventas||0}"></div>
      <div><label>Costo</label><input id="d_cos" type="number" value="${m.costo||0}"></div>
      <div><label>Meta</label><input id="d_meta" type="number" value="${m.meta||40000000}"></div></div>

  async dashDetalleMes(){
    const now=new Date(), mesIni=new Date(now.getFullYear(),now.getMonth(),1);
    const [movs,prods,recs,ventas,peds]=await Promise.all([
      GET('kruh_movimientos?select=producto_id,tipo,cantidad,creado_en&limit=10000'),
      GET('kruh_productos?select=id,nombre&limit=1000'),
      GET('kruh_recetas?select=producto_id,cantidad,costo_unit&limit=5000'),
      GET('kruh_ventas?select=monto,creado_en&limit=8000'),
      GET('kruh_pedidos?select=creado_en&limit=3000')]);
    const nombre={}; prods.forEach(p=>nombre[p.id]=p.nombre);
    const costoU={}; recs.forEach(r=>costoU[r.producto_id]=(costoU[r.producto_id]||0)+(+r.cantidad||0)*(+r.costo_unit||0));
    const prodBy={}; movs.forEach(m=>{ if(m.tipo==='entrada' && new Date(m.creado_en)>=mesIni) prodBy[m.producto_id]=(prodBy[m.producto_id]||0)+(+m.cantidad||0); });
    const filas=Object.entries(prodBy).map(([id,q])=>({nombre:nombre[id]||'—',q,costo:q*(costoU[id]||0),sinCosto:!(costoU[id]>0)})).sort((a,b)=>b.q-a.q);
    const totCosto=filas.reduce((a,f)=>a+f.costo,0), sinCosto=filas.filter(f=>f.sinCosto).length;
    const ventaMes=ventas.filter(v=>new Date(v.creado_en)>=mesIni).reduce((a,v)=>a+(+v.monto||0),0);

    const util=ventaMes-totCosto;
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:2px">Detalle del mes</h3><div class="dim" style="font-size:12px;margin-bottom:10px">${esc(this.MESNOM[now.getMonth()+1]||'')}</div>

      <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);margin-top:5px;padding-top:5px"><b>Costo de producción</b><b>${money(totCosto)}</b></div>
      ${sinCosto?`<div class="hint" style="color:var(--warn)">${sinCosto} producto(s) sin costo de receta — el costo mostrado es parcial.</div>`:''}
      <div style="font-weight:700;margin:12px 0 4px">💰 Vendido (pedidos generados)</div>
      <div class="row" style="justify-content:space-between"><span class="dim">Pedidos del mes</span><b>${nPed}</b></div>
      <div class="row" style="justify-content:space-between"><span>Venta del mes</span><b style="color:var(--acc)">${money(ventaMes)}</b></div>
      <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><b>Utilidad (venta − costo)</b><b style="color:${util>=0?'var(--ok)':'var(--bad)'}">${money(util)}</b></div>

  },

              <div class="stp"><button onclick="App.cartSet('${p.id}',-1)">−</button><b>${q}</b><button onclick="App.cartSet('${p.id}',1)">＋</button></div></div>
          </div>`;}).join(''):'<div class="empty">No hay productos. Créalos en Recetas.</div>'}

  DOWC:['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],
  _diaKey(d){ const x=new Date(d); return isNaN(x)?'':x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); },
  _ventaDia(mesV){

    const hoyK=this._diaKey(new Date()), hoy=por[hoyK]||{t:0,n:0};
    const dias=Object.keys(por).sort().reverse();
    const max=Math.max(1,...dias.map(k=>por[k].t));
    const conVenta=dias.filter(k=>por[k].t>0);
    const prom=conVenta.length?conVenta.reduce((a,k)=>a+por[k].t,0)/conVenta.length:0;
    const dif=prom>0?((hoy.t-prom)/prom*100):0;
    const f=new Date();
    return `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start">

        <b style="font-size:27px;font-family:Fraunces,serif;color:var(--acc);line-height:1">${money(hoy.t)}</b></div>

      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:9px">
        <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px">Venta día por día</div>
        ${dias.length?dias.map(k=>{const o=por[k], es=k===hoyK, d=new Date(k+'T12:00:00');
          return `<div class="row" style="align-items:center;gap:8px;margin-bottom:4px">
            <span style="width:74px;font-size:12px;${es?'font-weight:700;color:var(--acc)':'color:var(--mut)'}">${esc(this.DOWC[d.getDay()])} ${d.getDate()}${es?' · hoy':''}</span>
            <div class="bar" style="flex:1"><i style="width:${Math.round(o.t/max*100)}%;background:${es?'var(--acc)':'var(--acc2)'}"></i></div>

          :'<div class="hint">Todavía no hay ventas este mes.</div>'}
      </div></div>`;
  },
  _clientesPeriodo(ventas,caj,segSet){
    const hoyK=this._diaKey(new Date()), mesK=hoyK.slice(0,7), anoK=hoyK.slice(0,4);
    const enP=v=>{ const k=this._diaKey(v.creado_en); if(!k)return false;
      return caj==='dia'?k===hoyK:(caj==='mes'?k.slice(0,7)===mesK:k.slice(0,4)===anoK); };
    const by={};
    (ventas||[]).filter(enP).forEach(v=>{ const k=(v.cliente||'—').trim();
      const o=by[k]=by[k]||{cliente:k,tel:v.telefono||'',compras:0,monto:0,ultima:v.creado_en};

    return `<h1 style="font-size:17px;margin-top:18px">Clientes · ${arr.length} · ${money(tot)}</h1>
      ${arr.length?arr.map(o=>{const on=(segSet||{})[o.cliente];return `<div class="item"><div class="top">

  },
  _resumenProductos(peds,ventas,segSet){
    const f=new Date(), hoyK=this._diaKey(f), mesK=hoyK.slice(0,7), anoK=hoyK.slice(0,4);
    const cli={dia:new Set(),mes:new Set(),ano:new Set()};
    (ventas||[]).forEach(v=>{ const k=this._diaKey(v.creado_en); if(!k)return; const n=(v.cliente||'—').trim();
      if(k===hoyK)cli.dia.add(n); if(k.slice(0,7)===mesK)cli.mes.add(n); if(k.slice(0,4)===anoK)cli.ano.add(n); });
    const B={dia:{},mes:{},ano:{}};
    (peds||[]).forEach(p=>{ const k=this._diaKey(p.creado_en); if(!k)return; const fp=(p.forma_pago||'—').trim()||'—';
      (p.items||[]).forEach(it=>{ const n=it.nombre||'—', q=+it.qty||0, v=q*(+it.precio||0);
        // el Día separa por forma de pago; Mes y Año acumulan por producto
        const add=(b,key,f)=>{const o=B[b][key]=B[b][key]||{n,fp:f,q:0,v:0}; o.q+=q; o.v+=v;};
        if(k===hoyK)add('dia',n+' ||'+fp,fp);
        if(k.slice(0,7)===mesK)add('mes',n,'');
        if(k.slice(0,4)===anoK)add('ano',n,''); }); });
    const tot=b=>Object.values(B[b]).reduce((a,o)=>a+o.v,0);

      ${!caj?`<div class="empty">👆 Toca un cajón para abrirlo y ver sus gastos.</div>`:`

      ${filas.length?`<h1 style="font-size:17px;margin-top:20px">Resumen por rubro</h1>

      <div class="hint">Cada casilla se guarda sola al salir de ella. Si pones <b>¿IVA? = Sí</b> y dejas el IVA vacío, lo calcula al ${this.IVAPCT}% y suma el Total; el Total lo puedes sobrescribir a mano cuando la factura traiga algo no gravado. Al cerrar el mes, el total pasa al Dashboard y la tabla se bloquea.</div>`);

  },
  gasSuma(){ const s=f=>{let t=0;document.querySelectorAll('#main [data-f="'+f+'"]').forEach(i=>t+=+i.value||0);return t;};
    if($('g_base'))$('g_base').textContent=money(s('base'));
    if($('g_iva'))$('g_iva').textContent=money(s('iva'));
    if($('g_total'))$('g_total').textContent=money(s('monto')); },
  async gasCell(id,campo,val){ const g=(this._gastos||[]).find(x=>x.id===id); if(!g)return; let v;
    if(campo==='pagado'&&val==='borrar') return this.gasDel(id);
    if(campo==='monto'||campo==='base'||campo==='iva')v=+val||0;
    else if(campo==='pagado'||campo==='tiene_iva')v=(val==='true');
    else if(campo==='fecha'||campo==='fecha_pago')v=val||null;
    else v=String(val||'').trim();
    g[campo]=v; const patch={[campo]:v};
    if(campo==='tiene_iva'||campo==='base'||campo==='iva'){
      if(campo==='tiene_iva'&&!v){ g.iva=0; patch.iva=0; }
      if(campo==='base'&&g.tiene_iva&&!(+g.iva>0)){ g.iva=Math.round((+g.base||0)*this.IVAPCT/100); patch.iva=g.iva; }
      g.monto=(+g.base||0)+(+g.iva||0); patch.monto=g.monto;
      const tr=document.querySelector('#main tr[data-id="'+id+'"]');
      if(tr){ const iv=tr.querySelector('[data-f="iva"]'), tt=tr.querySelector('[data-f="monto"]');
        if(iv)iv.value=g.iva||''; if(tt)tt.value=g.monto||''; } }
    const rp=await PATCH('kruh_gastos?id=eq.'+id,patch);
    if(rp&&!rp.ok){ toast('⚠️ NO se guardó ese dato — avísale a José'); }
    if(campo==='fecha'&&v&&String(v).slice(0,7)!==this._gasMes){ toast('Se movió a '+this._ymNom(String(v).slice(0,7))); return this._repintar(); }
    if(campo==='rubro'&&(this._esCompra(g)!==(this.view==='proveedores'))) return this._repintar();
    this.gasSuma(); },
  _repintar(){ return this.view==='proveedores'?this.vProveedores():this.vGastos(); },
  gasNueva(){ const mes=this._gasMes||this._mesActual(), hoy=this._diaDef(mes);
    const rub=this.CATGASTO.includes(this._gasCajon)?this._gasCajon:'';
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:8px">Nuevo gasto</h3>
      <div class="g2"><div><label>Fecha</label><input id="n_fecha" type="date" value="${esc(hoy)}"></div>
      <div><label>Rubro</label><select id="n_rubro"><option value="">— escoge el rubro —</option>${this.CATGASTO.map(c=>`<option ${c===rub?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
      <div class="g2"><div><label>Proveedor / entidad</label><input id="n_prov" placeholder="Enel, Vanti, arrendador…"></div>
      <div><label>N° factura</label><input id="n_fact" placeholder="Opcional"></div></div>
      <label>Descripción</label><input id="n_desc" placeholder="Qué se pagó">
      <div class="g3"><div><label>¿Tiene IVA?</label><select id="n_iva" onchange="App.gasNuevoCalc()"><option value="false">No</option><option value="true">Sí</option></select></div>
      <div><label>Valor sin IVA</label><input id="n_base" type="number" placeholder="0" oninput="App.gasNuevoCalc()"></div>
      <div><label>IVA</label><input id="n_ivav" type="number" placeholder="0" oninput="App.gasNuevoCalc()"></div></div>
      <label>Total</label><input id="n_total" type="number" placeholder="0" style="font-weight:700;color:var(--acc)">
      <div class="hint">El total se calcula solo (base + IVA); si la factura trae algo no gravado, lo puedes cambiar a mano.</div>
      <div class="g3"><div><label>Método de pago</label><select id="n_fp">${this.FPAGO.map(f=>`<option>${f}</option>`).join('')}</select></div>
      <div><label>Estado</label><select id="n_pag"><option value="true">✔ Pagado</option><option value="false">⏳ Pendiente</option></select></div>
      <div><label>Fecha de pago</label><input id="n_fpago" type="date" value="${esc(hoy)}"></div></div>
      <label>Notas</label><input id="n_nota">
      <button class="btn acc full" onclick="App.gasNuevoSave()">Guardar gasto</button>`);
    setTimeout(()=>{const e=$('n_prov'); if(e)e.focus();},60); },
  gasNuevoCalc(){ const b=+($('n_base')||{}).value||0; let i=+($('n_ivav')||{}).value||0;
    const con=($('n_iva')||{}).value==='true';
    if(!con){ i=0; if($('n_ivav'))$('n_ivav').value=''; }
    else if(!i&&b){ i=Math.round(b*this.IVAPCT/100); if($('n_ivav'))$('n_ivav').value=i; }
    if($('n_total'))$('n_total').value=b+i; },
  async gasNuevoSave(){ const rubro=$('n_rubro').value;
    if(!rubro){ alert('Escoge el rubro para saber en qué cajón va'); return; }
    const b={fecha:$('n_fecha').value||null,rubro,proveedor:$('n_prov').value.trim(),factura:$('n_fact').value.trim(),
      concepto:$('n_desc').value.trim(),tiene_iva:$('n_iva').value==='true',base:+$('n_base').value||0,iva:+$('n_ivav').value||0,
      monto:+$('n_total').value||((+$('n_base').value||0)+(+$('n_ivav').value||0)),
      forma_pago:$('n_fp').value,pagado:$('n_pag').value==='true',fecha_pago:$('n_fpago').value||null,nota:$('n_nota').value.trim()};
    if(!b.monto){ alert('Pon el valor del gasto'); return; }
    const n=await POST('kruh_gastos',b);
    if(!n){ toast('⚠️ No se pudo guardar el gasto'); return; }
    if(b.fecha)this._gasMes=b.fecha.slice(0,7);
    this._gasCajon=this._cajonDe(b);            // abre el cajón donde cayó
    cerrar(); toast('Gasto guardado en '+((this.CAJONES.find(c=>c[0]===this._gasCajon)||[])[1]||'')); this.vGastos(); },
  async gasFijos(){ const mes=this._gasMes||this._mesActual(), f=this._diaDef(mes);
    const ya=(this._gastos||[]).filter(g=>this._gasFecha(g).slice(0,7)===mes).map(g=>(g.concepto||'').toLowerCase());
    const faltan=this.GASFIJOS.filter(c=>!ya.includes(c.toLowerCase()));
    if(!faltan.length){ toast('Los fijos ya están'); return; }
    for(const c of faltan) await POST('kruh_gastos',{concepto:c,proveedor:'',factura:'',categoria:'Servicios',tiene_iva:false,base:0,iva:0,monto:0,fecha:f,forma_pago:'Efectivo',pagado:false});
    toast(faltan.length+' renglones creados'); this.vGastos(); },
  async gasDel(id){ const g=(this._gastos||[]).find(x=>x.id===id)||{};
    if((+g.monto||0)>0 && !this._okBorrar()) return this._repintar();
    await DEL('kruh_gastos?id=eq.'+id); this._gastos=(this._gastos||[]).filter(x=>x.id!==id); this._repintar(); },
  async _dashSet(mesNom,campos){ const ex=(await GET('kruh_dashboard?mes=eq.'+encodeURIComponent(mesNom)+'&select=mes'))[0];
    if(ex) return PATCH('kruh_dashboard?mes=eq.'+encodeURIComponent(mesNom),campos);
    const o=this.MESNOM.indexOf(mesNom); return POST('kruh_dashboard',Object.assign({mes:mesNom,orden:o>0?o:99},campos)); },
  async gasCerrar(){ if(!this.puedeGestionar){ alert('Solo Admin o Gerencia cierran el mes'); return; }
    const mes=this._gasMes, nom=this._ymNom(mes); if(!nom){ alert('Mes inválido'); return; }
    const filas=(this._gastos||[]).filter(g=>this._gasFecha(g).slice(0,7)===mes);
    const total=filas.reduce((a,g)=>a+(+g.monto||0),0), sin=filas.filter(g=>g.pagado===false).length;
    if(!confirm('Cerrar '+nom+' con '+money(total)+' en gastos'+(sin?' ('+sin+' sin pagar)':'')+'.\n\nLa tabla queda de solo lectura y el total pasa al Dashboard. ¿Seguro?'))return;
    await this._dashSet(nom,{gastos:total,cerrado:true}); toast(nom+' cerrado · ya está en el Dashboard'); this.vGastos(); },
  async gasReabrir(){ if(!this.puedeGestionar)return; const nom=this._ymNom(this._gasMes);
    if(!confirm('¿Reabrir '+nom+' para volver a editarlo?'))return;
    await this._dashSet(nom,{cerrado:false}); toast(nom+' reabierto'); this.vGastos(); },
  async gastosExcel(){ toast('Generando Excel…');
    const g=await GET('kruh_gastos?order=fecha.desc&limit=20000');
    const cols=['Mes','Fecha','Proveedor','N° factura','Rubro','Descripción','¿Tiene IVA?','Valor sin IVA','IVA','Valor total','Método de pago','Estado','Fecha de pago','Notas'];
    const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const rows=g.map(r=>[this._gasFecha(r).slice(0,7),this._gasFecha(r),r.proveedor||'',r.factura||'',r.rubro||'',r.concepto||'',(r.tiene_iva?'Sí':'No'),(+r.base||0),(+r.iva||0),(+r.monto||0),r.forma_pago||'',(r.pagado===false?'Pendiente':'Pagado'),r.fecha_pago||'',r.nota||''].map(q).join(';'));
    const csv='﻿'+cols.map(q).join(';')+'\r\n'+rows.join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='kruh-gastos.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
    toast('Excel descargado ('+g.length+' gastos)'); },

  /* ===================== SEGUIMIENTO DE PRECIOS (competencia) ===================== */
  _mesActual(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); },
  async vPrecios(){
    this.loading();
    const [prods,comp]=await Promise.all([GET('kruh_productos?order=categoria,nombre&limit=1000'),GET('kruh_competencia?order=creado_en.desc&limit=20000')]);
    this._prods=prods; this._comp=comp;
    const mes=this._precMes||this._mesActual(); this._precMes=mes;
    const meses=[...new Set(comp.map(c=>c.mes).filter(Boolean))].sort().reverse(); if(!meses.includes(mes))meses.unshift(mes);
    const byProd={}; comp.filter(c=>c.mes===mes).forEach(c=>{(byProd[c.producto_id]=byProd[c.producto_id]||[]).push(c);});
    const lista=prods.filter(p=>(+p.precio||0)>0 || byProd[p.id]);
    this.set(`<h1>Seguimiento de precios</h1><div class="sub">Compara tu precio con hasta 6 competidores por artículo · se guarda por mes</div>
      <div class="row" style="gap:8px;margin-bottom:12px;align-items:center"><span class="dim" style="font-size:12px">Mes:</span>
        <select onchange="App._precMes=this.value;App.vPrecios()" style="width:auto">${meses.map(m=>`<option ${m===mes?'selected':''}>${m}</option>`).join('')}</select></div>
      ${lista.length?lista.map(p=>{
        const cs=(byProd[p.id]||[]).slice(0,6); const precios=cs.map(c=>+c.precio||0).filter(x=>x>0);
        const min=precios.length?Math.min(...precios):0, max=precios.length?Math.max(...precios):0, prom=precios.length?precios.reduce((a,b)=>a+b,0)/precios.length:0;
        const mio=+p.precio||0; let estado='', col='var(--mut)';
        if(precios.length){ if(mio<min){estado='el más barato';col='var(--ok)';} else if(mio>max){estado='el más caro';col='var(--bad)';} else {estado='dentro del rango';col='var(--ok)';} }
        return `<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start">
          <div><div style="font-weight:700">${esc(p.nombre)}</div><div class="dim" style="font-size:12px">Tu precio: <b style="color:var(--ink)">${money(mio)}</b>${precios.length?` · <span style="color:${col};font-weight:700">${estado}</span>`:''}</div></div>
          ${cs.length>=6?'<span class="dim" style="font-size:11px">6/6</span>':`<button class="btn gh sm" onclick="App.compModal('${p.id}','')">＋ competidor</button>`}</div>
          ${precios.length?`<div class="row" style="gap:12px;font-size:11.5px;color:var(--mut);margin-top:6px"><span>mín ${money(min)}</span><span>prom ${money(prom)}</span><span>máx ${money(max)}</span></div>`:''}
          <div style="margin-top:8px">${cs.length?cs.map(c=>`<div class="row" style="justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--line2)">
            <div style="font-size:13px">${esc(c.competidor||'—')}${c.url?` · <a href="${esc(c.url)}" target="_blank" style="color:var(--acc)">🔗 web</a>`:''}</div>
            <div class="row" style="gap:8px;align-items:center"><b>${money(c.precio)}</b><a onclick="App.compModal('${p.id}','${c.id}')" style="cursor:pointer;color:var(--mut)">✎</a><a onclick="App.compDel('${c.id}')" style="cursor:pointer;color:var(--bad)">✕</a></div></div>`).join(''):'<div class="dim" style="font-size:12px;padding:4px 0">Sin competidores registrados este mes.</div>'}</div>
        </div>`;}).join(''):'<div class="empty">No hay productos con precio. Ponles precio en Recetas.</div>'}`);
  },
  compModal(prodId,id){ const c=(this._comp||[]).find(x=>x.id===id)||{};
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:8px">${id?'Editar':'Agregar'} competidor</h3>
      <label>Competidor</label><input id="cp_nom" value="${esc(c.competidor||'')}" placeholder="Nombre del competidor">
      <label>Página web (de donde se saca el precio)</label><input id="cp_url" value="${esc(c.url||'')}" placeholder="https://...">
      <label>Precio</label><input id="cp_pre" type="number" value="${c.precio||''}">
      <button class="btn acc full" onclick="App.compSave('${prodId}','${id||''}')">Guardar</button>`); },
  async compSave(prodId,id){ const b={producto_id:prodId,competidor:$('cp_nom').value.trim(),url:$('cp_url').value.trim(),precio:+$('cp_pre').value||0,mes:this._precMes||this._mesActual()};
    if(!b.competidor){alert('Nombre del competidor');return;} if(id)await PATCH('kruh_competencia?id=eq.'+id,b); else await POST('kruh_competencia',b); cerrar(); toast('Guardado'); this.vPrecios(); },
  async compDel(id){ if(!this._okBorrar())return; await DEL('kruh_competencia?id=eq.'+id); this.vPrecios(); },

  /* ===================== USUARIOS Y ATRIBUCIONES (solo admin) ===================== */
  async vUsuarios(){
    if(!this.esAdmin) return this.set('<h1>Usuarios</h1><div class="empty">Solo el Admin gestiona usuarios.</div>');
    this.loading();
    const [us,pm]=await Promise.all([GET('kruh_usuarios?order=creado_en&limit=200'),GET('kruh_permisos?limit=50')]);
    this._us=us; this._permisos={}; pm.forEach(p=>this._permisos[p.rol]=p.tabs||[]);
    const MODS=[['dashboard','📊 Dashboard'],['recetas','🥖 Recetas'],['pedidos','📋 Pedidos'],['crm','📇 CRM'],['proveedores','🚚 Proveedores'],['materiaprima','🛒 Compras'],['inventario','📦 Inventario'],['presupuestos','🎯 Presupuestos'],['ventas','💰 Ventas'],['gastos','🧾 Gastos']];
    const RMAT=['cajera','panadero','bodeguero','chef'];
    this.set(`<h1>Usuarios y permisos</h1><div class="sub">Cada persona con su clave y rol · y qué pestaña ve cada rol</div>
      <button class="btn acc" onclick="App.usModal()">＋ Nuevo usuario</button>
      <div class="card" style="background:var(--paper);font-size:12.5px"><b>Claves base:</b> Admin → <code>kruhadmin2026</code> (ve todo) · Gerencia → <code>kruhgerencia2026</code> (ve todo).</div>
      <div>${us.length?us.map(u=>`<div class="item"><div class="top"><div><div class="nm">${esc(u.nombre)} <span class="tag ${u.rol==='admin'||u.rol==='gerencia'?'np':'pe'}" style="text-transform:capitalize">${esc(u.rol)}</span> ${u.activo===false?'<span class="tag">inactivo</span>':''}</div>
        <div class="mt">🔑 ${esc(u.clave||'—')}${u.atribuciones?' · '+esc(u.atribuciones):''}</div></div>
        <button class="btn gh sm" onclick="App.usModal('${u.id}')">✎</button></div></div>`).join(''):'<div class="empty">Sin usuarios adicionales aún.</div>'}</div>
      <h1 style="font-size:18px;margin-top:22px">Permisos por rol</h1>
      <div class="sub">Admin y Gerencia ven todo. Marca qué pestaña ve cada rol operativo.</div>
      ${RMAT.map(r=>`<div class="card"><b style="text-transform:capitalize;font-size:15px">${r}</b>
        <div style="margin-top:6px">${MODS.map(([mk,mn])=>`<label style="display:flex;align-items:center;gap:9px;padding:4px 0;font-size:13.5px;cursor:pointer"><input type="checkbox" data-rol="${r}" data-mod="${mk}" ${(this._permisos[r]||[]).includes(mk)?'checked':''} style="width:18px;height:18px;accent-color:var(--acc)">${mn}</label>`).join('')}</div></div>`).join('')}
      <button class="btn acc full" onclick="App.permGuardar()">Guardar permisos</button>`);
  },
  async permGuardar(){ const RMAT=['cajera','panadero','bodeguero','chef'], nuevo={}; RMAT.forEach(r=>nuevo[r]=[]);
    document.querySelectorAll('#main input[data-rol]').forEach(i=>{ if(i.checked)nuevo[i.dataset.rol].push(i.dataset.mod); });
    for(const r of RMAT){ await fetch(SB+'/rest/v1/kruh_permisos?on_conflict=rol',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({rol:r,tabs:nuevo[r],actualizado:new Date().toISOString()})}); }
    this._permisos=Object.assign(this._permisos||{},nuevo); toast('Permisos guardados'); },
  usModal(id){ const u=(this._us||[]).find(x=>x.id===id)||{};
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:8px">${id?'Editar':'Nuevo'} usuario</h3>
      <div class="g2"><div><label>Nombre</label><input id="u_nom" value="${esc(u.nombre||'')}"></div>
      <div><label>Rol</label><select id="u_rol">${this.ROLES.map(r=>`<option value="${r}" ${u.rol===r?'selected':''}>${r.charAt(0).toUpperCase()+r.slice(1)}</option>`).join('')}</select></div></div>
      <label>Clave de acceso</label><input id="u_clave" value="${esc(u.clave||'')}">
      <label>Atribuciones (qué puede hacer)</label><textarea id="u_atr" placeholder="Ej: maneja pedidos e inventario, no borra">${esc(u.atribuciones||'')}</textarea>
      <label>¿Activo?</label><select id="u_act"><option value="true" ${u.activo!==false?'selected':''}>Sí</option><option value="false" ${u.activo===false?'selected':''}>No</option></select>
      <button class="btn acc full" onclick="App.usSave('${id||''}')">Guardar</button>
      ${id?`<button class="btn gh full" style="color:var(--bad)" onclick="App.usDel('${id}')">Eliminar</button>`:''}`); },
  async usSave(id){ const b={nombre:$('u_nom').value.trim(),rol:$('u_rol').value,clave:$('u_clave').value.trim(),atribuciones:$('u_atr').value.trim(),activo:$('u_act').value==='true'};
    if(!b.nombre||!b.clave){alert('Nombre y clave son obligatorios');return;} if(id)await PATCH('kruh_usuarios?id=eq.'+id,b); else await POST('kruh_usuarios',b); cerrar(); toast('Usuario guardado'); this.vUsuarios(); },
  async usDel(id){ if(!this._okBorrar())return; await DEL('kruh_usuarios?id=eq.'+id); cerrar(); this.vUsuarios(); },
};
window.addEventListener('DOMContentLoaded',()=>App.init());
</script>
