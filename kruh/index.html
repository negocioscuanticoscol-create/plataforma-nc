      ${id?`<button class="btn gh full" style="color:var(--bad)" onclick="App.mpDel('${id}')">Eliminar</button>`:''}`); },
  async mpSave(id){ const s=$('mp_prov'), o=s.options[s.selectedIndex], b={nombre:$('mp_nom').value.trim(),categoria:$('mp_cat').value.trim(),unidad:$('mp_uni').value.trim()||'kg',costo_unit:+$('mp_cu').value||0,stock_min:+$('mp_min').value||0,proveedor_id:s.value||null,proveedor:s.value?o.dataset.n:null};
    if(!b.nombre){alert('Nombre');return;} if(id)await PATCH('kruh_materiaprima?id=eq.'+id,b); else await POST('kruh_materiaprima',b);
    const n=await this._propagarPrecio(b.nombre,b.costo_unit);
    cerrar(); toast('Guardado'+(n?' · '+n+(n===1?' receta recosteada':' recetas recosteadas'):'')); this._mpTab='lista'; this.vMateriaPrima(); },
  async mpDel(id){ if(!this._okBorrar())return; await DEL('kruh_materiaprima?id=eq.'+id); cerrar(); this.vMateriaPrima(); },
  mpMov(id,tipo){ const m=(this._mp||[]).find(x=>x.id===id)||{}; const v=prompt((tipo==='entrada'?'Cantidad que ENTRA':'Cantidad que se CONSUME')+' ('+(m.unidad||'kg')+'):'); if(v===null)return; const q=+v||0; if(q<=0)return;
    const nueva=(+m.existencias||0)+(tipo==='entrada'?q:-q); PATCH('kruh_materiaprima?id=eq.'+id,{existencias:nueva}).then(()=>{toast('Stock actualizado');this.vMateriaPrima();}); },

  /* ===================== MARKETING · cuatro frentes ===================== */
  async vMarketing(){
    const v=this._mkView||'';
    if(v==='marcador')      return this.vMkMarcador();
    if(v==='institucional') return this.vMkInstitucional();
    if(v==='digital'||v==='organico') return this.vMkPorHacer(v);
    this.loading();
    const marc=await GET('kruh_marcaciones?select=resultado,creado_en&limit=5000');
    const mesIni=new Date(); const ini=new Date(mesIni.getFullYear(),mesIni.getMonth(),1);
    const delMes=(marc||[]).filter(m=>new Date(m.creado_en)>=ini);
    const inte=delMes.filter(m=>m.resultado==='interesado').length;
    const caj=(id,ic,tit,des,der)=>`<div class="item" style="cursor:pointer" onclick="App._mkView='${id}';App.vMarketing()">
      <div class="top"><div style="display:flex;gap:11px;align-items:flex-start">
        <div style="font-size:24px;line-height:1">${ic}</div>
        <div><div class="nm">${tit}</div><div class="mt">${des}</div></div></div>
        <div style="text-align:right;white-space:nowrap">${der||''}<div class="dim" style="font-size:16px">›</div></div>
      </div></div>`;
    this.set(`<h1>Marketing</h1><div class="sub">Los cuatro frentes por donde entran clientes. Cada cajón se abre y trabaja aparte.</div>
      ${caj('marcador','📞','Marcador','Llamadas a la base de clientes que ya tenemos',
            `<b style="font-size:15px">${num(delMes.length)}</b><div class="dim" style="font-size:10px">llamadas · ${num(inte)} interesados</div>`)}
      ${caj('institucional','🏛️','Institucional','Restaurantes y hoteles — venta al por mayor',
            `<span class="tag">2 frentes</span>`)}
      ${caj('digital','💻','Digital','Pauta, redes y todo lo que se paga',`<span class="tag">por armar</span>`)}
      ${caj('organico','🌱','Orgánico','Voz a voz, referidos y lo que llega solo',`<span class="tag">por armar</span>`)}`);
  },
  _mkVolver(){ return `<a onclick="App._mkView='';App.vMarketing()" style="color:var(--acc);cursor:pointer;font-weight:700;font-size:13px">← Marketing</a>`; },
  /* ===== INSTITUCIONAL · prospectos por capitulo =====
     Cada capitulo (hoteles, kermes, clubes, embajadas) se trabaja aparte: son
     discursos distintos y quien llama no deberia mezclarlos. Se marca el
     circulo al llamar y se escribe el resultado, igual que el marcador. */
  async vMkInstitucional(){
    this.loading();
    const [pros, usus] = await Promise.all([
      GETALL('kruh_prospectos?order=categoria,nombre&limit=2000'),
      GET('kruh_usuarios?select=nombre&activo=is.true&order=nombre&limit=50')]);
    this._pros = pros || [];
    /* Quien prospecta para Kruh es el equipo de Negocios Cuanticos, no el
       personal de la panaderia. Por eso el equipo va primero y fijo; los
       usuarios de Kruh se suman despues por si alguno tambien llama. */
    const EQUIPO = ['Sandra', 'José', 'Boso'];
    const extra = (usus || []).map(u => u.nombre).filter(Boolean)
                    .filter(n => !EQUIPO.some(e => e.toLowerCase() === String(n).toLowerCase()));
    this._vends = [...EQUIPO, ...extra];
    this._mkInstPaint();
  },
  _mkInstPaint(){
    const P = this._pros || [];
    if (!P.length) {
      this.set(`${this._mkVolver()}<h1 style="margin-top:8px">Institucional</h1>
        <div class="card"><div class="empty">Todavia no hay prospectos cargados.</div></div>`);
      return;
    }
    const cats = [...new Set(P.map(x => x.categoria))];
    const cat = (this._proCat && cats.includes(this._proCat)) ? this._proCat : cats[0];
    this._proCat = cat;
    const lista = P.filter(x => x.categoria === cat);
    const hechos = lista.filter(x => x.llamado).length;
    const tot = P.length, hechosTot = P.filter(x => x.llamado).length;
    const ICO = {'Hoteles boutique':'🏨','Kermés · bazares':'🎪','Clubes':'⛳','Embajadas europeas':'🏛️'};

    this.set(`${this._mkVolver()}<h1 style="margin-top:8px">Institucional</h1>
      <div class="sub">Pan de 72 horas · ${tot} prospectos en ${cats.length} frentes · ${hechosTot} ya contactados</div>

      <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
        ${cats.map(c => {
          const l = P.filter(x => x.categoria === c), h = l.filter(x => x.llamado).length;
          return `<div class="cajon ${c === cat ? 'on' : ''}" style="cursor:pointer;min-width:150px"
            onclick="App._proCat=${JSON.stringify(c).replace(/"/g, '&quot;')};App._mkInstPaint()">
            <b>${h}/${l.length}</b>${ICO[c] || '•'} ${esc(c)}
            <div style="font-size:11px;opacity:.75">${l.length - h} por llamar</div></div>`;
        }).join('')}
      </div>

      <div class="bar" style="margin-bottom:12px"><i style="width:${lista.length ? hechos / lista.length * 100 : 0}%;background:var(--ok)"></i></div>

      ${lista.map(x => {
        const t = String(x.telefono || '').replace(/\D/g, '');
        const enc = String(x.encaje || '').toLowerCase();
        const colEnc = enc.startsWith('máx') || enc.startsWith('max') ? 'var(--ok)' : (enc.startsWith('alt') ? 'var(--acc)' : 'var(--mut)');
        return `<div class="item" style="${x.llamado ? 'opacity:.62' : ''}">
          <div class="top">
            <div style="flex:1;min-width:0">
              <div class="nm">${esc(x.nombre)}
                ${x.encaje ? `<span class="tag" style="color:${colEnc};border-color:${colEnc}">${esc(x.encaje)}</span>` : ''}</div>
              <div class="mt">${x.zona ? esc(x.zona) + ' · ' : ''}${esc(x.direccion || '')}${x.rating ? ' · ⭐ ' + esc(x.rating) : ''}</div>
              ${x.perfil ? `<div class="mt">${esc(x.perfil)}</div>` : ''}
              ${x.porque ? `<div class="mt" style="color:var(--ink2);font-style:italic;margin-top:3px">${esc(x.porque)}</div>` : ''}
              <div class="row" style="gap:8px;margin-top:7px;flex-wrap:wrap">
                ${t ? `<a class="btn gh sm" style="text-decoration:none" href="tel:${t}">📞 ${esc(x.telefono)}</a>
                       <a class="btn gh sm" style="text-decoration:none" href="https://wa.me/${t.length > 10 ? t : '57' + t}" target="_blank">💬 WhatsApp</a>` : ''}
              </div>
              <div style="margin-top:8px">
                <input id="nt_${x.id}" value="${esc(x.notas || '')}" placeholder="Notas: qué dijeron, con quién hablaste, cuándo volver…"
                  onchange="App.proNota('${x.id}', this.value)" style="font-size:12.5px">
              </div>
            </div>
            <div style="text-align:center;flex:none;margin-left:8px">
              <span class="circ ${x.llamado ? 'on' : ''}" title="${x.llamado ? 'Ya lo llamé' : 'Marcar como llamado'}"
                    style="cursor:pointer" onclick="App.proLlamado('${x.id}')"></span>
              <div style="font-size:9.5px;color:var(--mut);margin-top:3px">${x.llamado ? 'llamado' : 'llamar'}</div>
            </div>
          </div>
          ${this._proVend(x)}
        </div>`;
      }).join('')}`);
  },
  /* Quien hizo el trabajo y cuando. Antes solo quedaba el circulito de
     "llamado" y la fecha: no habia forma de saber quien lo hizo, que es lo
     primero que se pregunta cuando hay que retomar un prospecto. */
  _fechaCorta(f) {
    if (!f) return '';
    const d = new Date(f); if (isNaN(d)) return String(f).slice(0, 10);
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' });
  },
  _proVend(x) {
    const V = this._vends || [];
    const hecho = x.vendedor || '';
    const fecha = x.fecha_contacto ? this._fechaCorta(x.fecha_contacto) : '';
    if (hecho) {
      return `<div class="mt" style="color:var(--ok);font-weight:700;margin-top:6px">
        ✓ Lo trabajó ${esc(hecho)}${fecha ? ' · ' + esc(fecha) : ''}
        <a onclick="App.proVendedor('${x.id}','')" style="color:var(--mut);cursor:pointer;font-weight:400;margin-left:6px">quitar</a></div>`;
    }
    if (!V.length) {
      return `${fecha ? `<div class="mt" style="color:var(--ok)">✓ contactado ${esc(fecha)}</div>` : ''}
        <div class="hint" style="margin-top:5px">Agrega los vendedores en 👤 <b>Usuarios</b> para poder marcar quién lo trabajó.</div>`;
    }
    return `<div class="row" style="gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px">
      <span style="font-size:10.5px;color:var(--mut);font-weight:700">¿QUIÉN LO TRABAJÓ?</span>
      ${V.map(n => `<button class="btn gh sm" style="padding:4px 10px;font-size:11px"
        onclick="App.proVendedor('${x.id}','${esc(n).replace(/'/g, "&#39;")}')">${esc(n)}</button>`).join('')}
      ${fecha ? `<span style="font-size:11px;color:var(--ok)">· contactado ${esc(fecha)}</span>` : ''}
    </div>`;
  },
  /* Marcar el vendedor cuenta como haber hecho el trabajo: deja el prospecto
     como llamado y le pone la fecha si aun no la tenia. */
  async proVendedor(id, quien) {
    const x = (this._pros || []).find(p => p.id === id); if (!x) return;
    const body = { vendedor: quien || null };
    if (quien) { if (!x.llamado) body.llamado = true;
                 if (!x.fecha_contacto) body.fecha_contacto = new Date().toISOString(); }
    Object.assign(x, body);
    this._mkInstPaint();
    const r = await PATCH('kruh_prospectos?id=eq.' + id, body);
    toast(r && r.ok ? (quien ? 'Marcado: ' + quien : 'Sin vendedor') : '⚠️ No se guardó');
  },
  async proLlamado(id) {
    const x = (this._pros || []).find(p => p.id === id); if (!x) return;
    const nv = !x.llamado;
    x.llamado = nv; x.fecha_contacto = nv ? new Date().toISOString() : null;
    this._mkInstPaint();
    const r = await PATCH('kruh_prospectos?id=eq.' + id, { llamado: nv, fecha_contacto: x.fecha_contacto });
    if (r && !r.ok) { toast('⚠️ No se guardó, revisa'); }
  },
  async proNota(id, txt) {
    const x = (this._pros || []).find(p => p.id === id); if (!x) return;
    x.notas = txt;
    const r = await PATCH('kruh_prospectos?id=eq.' + id, { notas: txt });
    toast(r && r.ok ? 'Nota guardada' : '⚠️ No se guardó');
  },
  vMkPorHacer(cual){
    const t=cual==='digital'
      ?{ic:'💻',tit:'Digital',des:'Pauta, redes y todo lo que se paga para que lleguen.',
         idea:'Acá irían la pauta de Meta, el alcance, cuánto costó cada cliente y qué campaña trajo más.'}
      :{ic:'🌱',tit:'Orgánico',des:'Voz a voz, referidos y lo que llega sin pagar.',
         idea:'Acá iría de dónde llegó cada cliente nuevo: referido, pasó por el local, Instagram, Google.'};
    this.set(`${this._mkVolver()}<h1 style="margin-top:8px">${t.ic} ${t.tit}</h1><div class="sub">${t.des}</div>
      <div class="card" style="border-color:var(--acc)">
        <div style="font-family:Fraunces,serif;font-size:16px">Por armar</div>
        <div class="hint" style="margin-top:4px">${t.idea}</div>
        <div class="hint" style="margin-top:6px">Dime qué quieres medir acá y lo construyo.</div></div>`);
  },

  /* ===================== MARCADOR · resultados (el marcador vive en marcador.html) ===================== */
  async vMkMarcador(){
    this.loading();
    const [marc,leads,camps]=await Promise.all([
      GET('kruh_marcaciones?select=*&order=creado_en.desc&limit=5000'),
      GET('kruh_leads?select=id,telefono&limit=3000'),
      GET('kruh_campanas?select=*&order=creado_en.desc&limit=100')]);
    this._camps=camps||[];
    const conTel=(leads||[]).filter(l=>String(l.telefono||'').replace(/\D/g,'').length>=7).length;
    const nomRes=r=>({interesado:'Interesado',no_interesado:'No interesado',habeas:'Habeas data',
      no_contesta:'No contesta',like_promo:'Like Promo',flyer:'Flyer anuncio'})[r]||r||'—';
    const hoy=new Date().toISOString().slice(0,10);
    const mesIni=new Date(); mesIni.setDate(1);
    const delMes=(marc||[]).filter(m=>new Date(m.creado_en)>=new Date(mesIni.getFullYear(),mesIni.getMonth(),1));
    const nHoy=(marc||[]).filter(m=>String(m.creado_en||'').slice(0,10)===hoy).length;
    const cuenta=r=>delMes.filter(m=>m.resultado===r).length;
    const int=cuenta('interesado'), no=cuenta('no_interesado'), hab=cuenta('habeas');
    /* segmentacion nueva del marcador: quedan aparte de interesado/no interesado */
    const nc=cuenta('no_contesta'), lk=cuenta('like_promo'), fl=cuenta('flyer');
    const tot=delMes.length, pct=tot?(int/tot*100):0;
    // llamados unicos del mes, para saber cuanto falta de la base
    const unicos=new Set(delMes.map(m=>m.lead_id)).size;
    // por campaña
    const porCamp={}; delMes.forEach(m=>{ const c=m.campana||'—';
      const o=porCamp[c]=porCamp[c]||{t:0,i:0}; o.t++; if(m.resultado==='interesado')o.i++; });

    this.set(`${this._mkVolver()}<h1 style="margin-top:8px">Marcador</h1><div class="sub">Los resultados de las llamadas. El marcador se abre aparte, con su propio link, para quien esté llamando.</div>
      <a class="btn acc" href="marcador.html" target="_blank" style="text-decoration:none;display:inline-block">📞 Abrir el marcador</a>
      <button class="btn gh" style="margin-left:6px" onclick="App.campModal()">＋ Nueva campaña</button>

      <div class="card" style="margin-top:14px"><div class="nm" style="margin-bottom:8px">Campañas</div>
        ${(camps||[]).length?camps.map(c=>{
          const llam=(marc||[]).filter(m=>m.campana===c.nombre);
          const ci=llam.filter(m=>m.resultado==='interesado').length;
          const ult=llam[0]?String(llam[0].creado_en).slice(0,10):null;
          return `<div style="padding:9px 0;border-bottom:1px solid var(--line2)">
            <div class="row" style="justify-content:space-between;gap:8px">
              <div><b style="font-size:14px">${esc(c.nombre)}</b>
                ${c.activa?'<span class="pill" style="background:var(--okbg);color:var(--ok);border:1px solid #c3ddbb;font-size:10px;padding:2px 8px;border-radius:20px;margin-left:6px">activa</span>'
                          :'<span class="dim" style="font-size:10.5px;margin-left:6px">cerrada</span>'}
                ${c.objetivo?`<div class="dim" style="font-size:12px;margin-top:2px"><b>Objetivo:</b> ${esc(c.objetivo)}</div>`:''}
                ${c.descripcion?`<div class="dim" style="font-size:11.5px">${esc(c.descripcion)}</div>`:''}
                <div class="dim" style="font-size:11px;margin-top:3px">${num(llam.length)} llamadas · <b style="color:var(--ok)">${num(ci)}</b> interesados${ult?' · última '+ult:''}</div>
              </div>
              <button class="btn gh sm" onclick="App.campActiva(${c.id},${c.activa?'false':'true'})">${c.activa?'Cerrar':'Reabrir'}</button>
            </div></div>`;}).join('')
        :'<div class="dim" style="font-size:12.5px">No hay campañas. Crea la primera para que el marcador funcione.</div>'}
        <div class="hint" style="margin-top:9px">Al crear una campaña nueva todos los clientes vuelven a cero en ella — el historial de las anteriores no se toca.</div>
      </div>

      <div class="row" style="gap:10px;margin:14px 0;flex-wrap:wrap">
        <div class="card" style="flex:1;min-width:110px"><div class="dim" style="font-size:10.5px">LLAMADAS DEL MES</div><b style="font-size:19px">${num(tot)}</b><div class="dim" style="font-size:10px">${nHoy} hoy</div></div>
        <div class="card" style="flex:1;min-width:110px"><div class="dim" style="font-size:10.5px">INTERESADOS</div><b style="font-size:19px;color:var(--ok)">${num(int)}</b><div class="dim" style="font-size:10px">${pct.toFixed(0)}% de las llamadas</div></div>
        <div class="card" style="flex:1;min-width:110px"><div class="dim" style="font-size:10.5px">NO INTERESADOS</div><b style="font-size:19px;color:var(--bad)">${num(no)}</b><div class="dim" style="font-size:10px">habeas: ${num(hab)}</div></div>
        <div class="card" style="flex:1;min-width:110px"><div class="dim" style="font-size:10.5px">SEGMENTACIÓN</div><b style="font-size:19px;color:var(--acc)">${num(lk+fl)}</b><div class="dim" style="font-size:10px">👍 ${num(lk)} · 📄 ${num(fl)} flyer · 📵 ${num(nc)}</div></div>
        <div class="card" style="flex:1;min-width:110px"><div class="dim" style="font-size:10.5px">BASE CUBIERTA</div><b style="font-size:19px">${num(unicos)}/${num(conTel)}</b><div class="dim" style="font-size:10px">clientes con teléfono</div></div>
      </div>

      <div class="card"><div class="nm" style="margin-bottom:8px">Por campaña · este mes</div>
        ${Object.keys(porCamp).length?Object.entries(porCamp).map(([c,o])=>{
          const p=o.t?o.i/o.t*100:0;
          return `<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b style="font-size:13.5px">${esc(c)}</b>
            <span class="dim" style="font-size:12px">${num(o.t)} llamadas · <b style="color:var(--ok)">${num(o.i)}</b> interesados</span></div>
            <div class="bar" style="margin-top:4px"><i style="width:${Math.min(100,p)}%;background:var(--ok)"></i></div></div>`;
          }).join(''):'<div class="dim" style="font-size:12.5px">Todavía no hay llamadas este mes.</div>'}
      </div>

      <div class="nm" style="margin:16px 0 8px">Últimas llamadas</div>
      ${(marc||[]).length?`<div class="tbwrap"><table class="tb" style="min-width:520px">
        <thead><tr><th style="min-width:150px">Cliente</th><th>Teléfono</th><th>Campaña</th><th>Resultado</th><th>Cuándo</th></tr></thead>
        <tbody>${marc.slice(0,60).map(m=>{
          const col=m.resultado==='interesado'?'var(--ok)':(m.resultado==='no_interesado'?'var(--bad)':'var(--mut)');
          return `<tr><td style="font-weight:600">${esc(m.cliente||'—')}</td>

            <td style="font-weight:700;color:${col}">${esc(nomRes(m.resultado))}</td>

        </tbody></table></div>`
       :`<div class="empty">Aún no hay llamadas registradas.<br><span class="dim" style="font-size:12px">Si el marcador dice que no puede guardar, falta correr el SQL de <b>kruh_marcaciones</b>.</span></div>`}`);
  },
  campModal(){
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:4px">Nueva campaña</h3>
      <div class="dim" style="font-size:12.5px;margin-bottom:6px">Los clientes arrancan en cero en esta campaña. Lo de las anteriores queda guardado.</div>
      <label>Nombre</label><input id="cm_nom" placeholder="Ej: Reservar pan de agosto">
      <label>Objetivo</label><input id="cm_obj" placeholder="Qué se busca con estas llamadas">
      <label>Descripción</label><textarea id="cm_desc" placeholder="Qué se le dice al cliente"></textarea>
      <button class="btn acc full" onclick="App.campSave()">Crear campaña</button>`); },
  async campSave(){
    const nom=$('cm_nom').value.trim();
    if(!nom){ alert('Ponle nombre a la campaña'); return; }
    if((this._camps||[]).some(c=>c.nombre.toLowerCase()===nom.toLowerCase())){ alert('Ya existe una campaña con ese nombre'); return; }
    const r=await POST('kruh_campanas',{nombre:nom,objetivo:$('cm_obj').value.trim(),descripcion:$('cm_desc').value.trim(),activa:true});
    if(!r){ alert('No se pudo crear — ¿ya corriste el SQL de kruh_campanas?'); return; }
    cerrar(); toast('Campaña «'+nom+'» creada · todos en cero'); this.vMkMarcador(); },
  async campActiva(id,val){

    this._pres=pres; this._prods=prods;
    /* META DEL MES (el trato con NC): se suman TODOS los meses con ventas,

    const porMes={}; (vts||[]).forEach(r=>{ const k=String(r.creado_en||'').slice(0,7); if(!k)return; porMes[k]=(porMes[k]||0)+(+r.monto||0); });

    // lo vendido del mes, repartido en las 4 semanas

    const vc={}, vm={};
    peds.forEach(p=>{ const d=new Date(p.creado_en); if(d<mesIni)return; const s=Math.min(3,Math.floor((d.getDate()-1)/7)); (p.items||[]).forEach(it=>{ const k=it.producto_id; (vc[k]=vc[k]||[0,0,0,0])[s]+=(+it.qty||0); (vm[k]=vm[k]||[0,0,0,0])[s]+=(+it.qty||0)*(+it.precio||0); }); });

          ${metaCant>0&&faltaC<=0?'<div class="dim" style="font-size:10px">cumplida</div>':''}</td>
      </tr>`;}).join('');
    const nc=this._nc||{prom:0,meta:0,vend:0,meses:0,porMes:{}};

  /* guarda la meta del mes de un producto: si ya existe la actualiza, si no la crea */
  async presMeta(pid,v){
    const cant=Math.max(0,+v||0), prod=(this._prods||[]).find(x=>x.id===pid); if(!prod)return;
    const precio=+prod.precio||0, pr=(this._pres||[]).find(x=>x.producto_id===pid);
    if(pr){ await PATCH('kruh_presupuestos?id=eq.'+pr.id,{meta_cant:cant,meta:cant*precio});
      pr.meta_cant=cant; pr.meta=cant*precio; }
    else { const nuevo=await POST('kruh_presupuestos',{producto_id:pid,producto:prod.nombre,meta_cant:cant,meta:cant*precio,periodo:'mes'});
      if(nuevo)(this._pres=this._pres||[]).push(nuevo);
      else { toast('No se pudo guardar'); return; } }
    toast('Meta de '+prod.nombre+': '+num(cant)); this._presPaint(); },

  /* Cada forma de pago por separado. OJO: la base trae los nombres de la importación,
     no los del formulario: "Aplicación" es Nequi/Daviplata y "Transferencia débito"
     también es transferencia. Por eso se agrupa por lo que dice el texto, no por
     igualdad exacta, y lo que no cuadre con nada cae en "Otros" a la vista. */
  FPGRUPOS:[['tar','💳 Tarjeta crédito',/tarjeta|credito|débito credito/],
            ['efe','💵 Efectivo',/efectivo|contado/],
            ['neq','📱 Nequi / Aplicación',/nequi|aplicaci|daviplata|app/],
            ['tra','🏦 Transferencia',/transferencia|transfer|consignaci/],
            ['nde','❔ No especificado',/no especificado|sin especificar|^$/]],
  _grupoFP(fp){ const t=this._norm(fp||'');
    for(const [k,,re] of this.FPGRUPOS) if(re.test(t))return k;
    return 'otr'; },
  _norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); },
  _formasPago(mesV,tarBase,tarIva){
    const t={}, n={}; let tot=0;
    (mesV||[]).forEach(v=>{ const k=this._grupoFP(v.forma_pago), m=+v.monto||0;
      t[k]=(t[k]||0)+m; n[k]=(n[k]||0)+1; tot+=m; });
    const filas=this.FPGRUPOS.concat([['otr','❔ Otros',null]])
      .filter(([k])=>t[k])
      .map(([k,nom])=>`<div class="row" style="justify-content:space-between;margin-top:4px">
        <span>${nom} <small class="dim" style="font-size:11px">${n[k]} venta(s)</small></span>
        <b>${money(t[k])} <small class="dim" style="font-size:11px;font-weight:400">${tot>0?Math.round(t[k]/tot*100):0}%</small></b></div>`
        +(k==='tar'&&tarBase?`<div class="row" style="justify-content:space-between;font-size:11.5px;color:var(--mut)"><span>↳ base ${money(tarBase)} + IVA ${money(tarIva)}</span></div>`:''))
      .join('');
    return `<div class="card"><div style="font-family:Fraunces,serif;font-size:16px;margin-bottom:2px">Formas de pago (mes)</div>
      ${filas||'<div class="hint">Sin ventas este mes.</div>'}
      <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><span>Total juntos</span><b style="color:var(--acc)">${money(tot)}</b></div></div>`;
  },
  DOWC:['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],
  _diaKey(d){ const x=new Date(d); return isNaN(x)?'':x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); },
  _ventaDia(mesV){

    const hoyK=this._diaKey(new Date()), hoy=por[hoyK]||{t:0,n:0};
    const dias=Object.keys(por).sort().reverse();
    const max=Math.max(1,...dias.map(k=>por[k].t));

      ${prom>0?`<div class="hint" style="margin-top:6px">Promedio de los días con venta del mes: <b>${money(prom)}</b> · hoy va <b style="color:${dif>=0?'var(--ok)':'var(--bad)'}">${dif>0?'+':''}${dif.toFixed(0)}%</b></div>`:''}

        ${dias.length?dias.map(k=>{const o=por[k], es=k===hoyK, d=new Date(k+'T12:00:00');
          return `<div class="row" style="align-items:center;gap:8px;margin-bottom:4px">
            <span style="width:74px;font-size:12px;${es?'font-weight:700;color:var(--acc)':'color:var(--mut)'}">${esc(this.DOWC[d.getDay()])} ${d.getDate()}${es?' · hoy':''}</span>

  /* Muestras y ventas perdidas salen de kruh_movimientos. La muestra SI descuenta inventario;
     la venta perdida NO. El corte del mes es solo de lectura: el historico nunca se borra */
  _mmAgrupa(movs,prods,filtro){
    const pre={}; (prods||[]).forEach(p=>pre[p.id]={nom:p.nombre,precio:+p.precio||0});
    const R={mus:{n:0,v:0},per:{n:0,v:0},prod:{}};
    (movs||[]).forEach(m=>{ const k=this._diaKey(m.creado_en); if(!k||!filtro(k))return;
      const q=+m.cantidad||0, inf=pre[m.producto_id]||{nom:'—',precio:0}, val=q*inf.precio;
      const c=m.tipo==='muestra'?'mus':'per'; R[c].n+=q; R[c].v+=val;
      const o=R.prod[m.producto_id]=R.prod[m.producto_id]||{nom:inf.nom,mus:0,musV:0,per:0,perV:0};
      if(c==='mus'){ o.mus+=q; o.musV+=val; } else { o.per+=q; o.perV+=val; } });
    return R;
  },
  /* descuentos dados en los pedidos del periodo: n = cuantos pedidos, v = cuanta plata */
  _descAgrupa(peds,filtro){ const R={n:0,v:0,lista:[]};

  /* ===== ANULAR UNA VENTA =====
     Una venta mal registrada deja rastro en CUATRO sitios: kruh_ventas,
     kruh_pedidos, los movimientos de inventario y las existencias del producto.
     Borrar solo la venta deja el inventario descuadrado — que es justo como
     aparecieron los negativos que tocaba arreglar con el lápiz.
     Acá se revierte todo junto, o no se toca nada. */
  async ventaAnular(id){
    const v=(this._ventas||[]).find(x=>String(x.id)===String(id));
    if(!v) return alert('No encontré esa venta. Recarga la pantalla.');

    /* el pedido gemelo: mismo cliente, mismo monto, dentro de 3 minutos */
    const t=new Date(v.creado_en).getTime(), cerca=x=>Math.abs(new Date(x.creado_en)-t)<=180000;
    const nom=s=>String(s||'').trim().toLowerCase();
    const peds=await GETALL('kruh_pedidos?select=id,cliente,total,items,creado_en&limit=3000');
    const ped=(peds||[]).find(p=>cerca(p) && (+p.total||0)===(+v.monto||0) && nom(p.cliente)===nom(v.cliente));

    /* los movimientos de inventario de ese pedido */
    const movs=await GETALL('kruh_movimientos?tipo=eq.salida&select=id,producto_id,cantidad,creado_en,motivo&limit=20000');
    const mios=(movs||[]).filter(m=>cerca(m) && String(m.motivo||'').startsWith('Pedido'));

    const prods=this._prods&&this._prods.length?this._prods:await GET('kruh_productos?select=id,nombre,existencias&limit=1000');
    const nomProd=i=>{const p=prods.find(x=>x.id===i);return p?p.nombre:'?';};

    const resumen=[
      '¿ANULAR esta venta?','',
      (v.cliente||'—')+' · '+money(v.monto),
      v.producto||'', '',
      'Se va a borrar:',
      '· la venta',
      ped?'· el pedido':'· (no encontré el pedido)',
      mios.length?('· '+mios.length+' movimiento(s) de inventario'):'· (no encontré movimientos)',
      mios.length?'\nSe DEVUELVE al inventario:':'',
      ...mios.map(m=>'   +'+m.cantidad+'  '+nomProd(m.producto_id)),
      '','Esto no se puede deshacer.',
    ].filter(x=>x!=='').join('\n');
    if(!confirm(resumen)) return;
    if(!this._okBorrar()) return;

    try{
      /* 1) devolver existencias, 2) borrar movimientos */
      for(const m of mios){
        const p=prods.find(x=>x.id===m.producto_id);
        if(p) await PATCH('kruh_productos?id=eq.'+m.producto_id,{existencias:(+p.existencias||0)+(+m.cantidad||0)});
        await DEL('kruh_movimientos?id=eq.'+m.id);
      }
      /* 3) el pedido y 4) la venta */
      if(ped) await DEL('kruh_pedidos?id=eq.'+ped.id);
      await DEL('kruh_ventas?id=eq.'+id);
      toast('Venta anulada · inventario devuelto');
    }catch(e){
      alert('Algo falló a mitad de camino: '+(e.message||e)+'\nRevisa el inventario antes de seguir.');
    }
    this.vVentas();
  },

  _resumenProductos(peds,ventas,segSet,movsV,prodsV){

    (ventas||[]).forEach(v=>{ const k=this._diaKey(v.creado_en); if(!k)return; const n=(v.cliente||'—').trim();
      if(k===hoyK)cli.dia.add(n); if(k.slice(0,7)===mesK)cli.mes.add(n); if(k.slice(0,4)===anoK)cli.ano.add(n); });
    const B={dia:{},mes:{},ano:{}};
    /* COBRADO es la plata de verdad (bruto − descuento + domicilio, el total del pedido).
       B guarda el bruto por producto, que NO es lo mismo: un pedido con descuento suma
       en B lo que valen los productos aunque no se haya cobrado. Antes el cajón mostraba
       ese bruto y no cuadraba con la tabla de venta día por día, que sí usa lo cobrado. */
    /* El TOTAL del cajón sale de kruh_ventas, la MISMA fuente que la tabla de
       venta día por día. Antes salía de kruh_pedidos y por eso no cuadraban:
       las ventas cargadas a mano (importaciones, ajustes de cierre) están en
       ventas pero no tienen pedido, así que el cajón las ignoraba. Cada pedido
       de la app genera su venta, así que sumar ventas no duplica nada. */
    const COBRADO={dia:0,mes:0,ano:0}, DESC={dia:0,mes:0,ano:0}, DEPED={dia:0,mes:0,ano:0};
    (ventas||[]).forEach(v=>{ const k=this._diaKey(v.creado_en); if(!k)return; const tt=+v.monto||0;
      if(k===hoyK)COBRADO.dia+=tt;
      if(k.slice(0,7)===mesK)COBRADO.mes+=tt;
      if(k.slice(0,4)===anoK)COBRADO.ano+=tt; });
    (peds||[]).forEach(p=>{ const k=this._diaKey(p.creado_en); if(!k)return; const fp=(p.forma_pago||'—').trim()||'—';
      const tt=+p.total||0, dd=+p.descuento||0;
      if(k===hoyK){ DEPED.dia+=tt; DESC.dia+=dd; }
      if(k.slice(0,7)===mesK){ DEPED.mes+=tt; DESC.mes+=dd; }
      if(k.slice(0,4)===anoK){ DEPED.ano+=tt; DESC.ano+=dd; }
      // el descuento del pedido se reparte entre sus productos, a prorrata del valor de
      // cada uno. Así la columna "cobrado" de la tabla cuadra con la plata que entró.
      const bru=(p.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.precio||0),0);
      const fac=bru>0?Math.min(1,dd/bru):0;
      (p.items||[]).forEach(it=>{ const n=it.nombre||'—', q=+it.qty||0, v=q*(+it.precio||0), ds=v*fac;
        // el Día separa por forma de pago; Mes y Año acumulan por producto
        const add=(b,key,f)=>{const o=B[b][key]=B[b][key]||{n,fp:f,q:0,v:0,d:0}; o.q+=q; o.v+=v; o.d+=ds;};
        if(k===hoyK)add('dia',n+' ||'+fp,fp);
        if(k.slice(0,7)===mesK)add('mes',n,'');

    /* Lo que se vendió sin pasar por un pedido de la app (importaciones, ajustes

    const tot=b=>COBRADO[b]||0;
    const CJ=[['dia','📅 Día','hoy '+f.getDate()+' de '+(this.MESNOM[f.getMonth()+1]||'').toLowerCase(),'👥 '+cli.dia.size+' cliente(s)'],
              ['mes','🗓️ Mes',(this.MESNOM[f.getMonth()+1]||'')+' '+anoK,'👥 '+cli.mes.size+' cliente(s)'],
              ['ano','📆 Año',anoK,'']];
    const caj=this._resProd||'';
    const sel=caj?B[caj]:{};
    const filas=Object.values(sel).map(o=>({k:o.n,fp:o.fp,q:o.q,v:o.v,d:o.d||0})).sort((a,b)=>b.v-a.v);
    const tQ=filas.reduce((a,x)=>a+x.q,0), tV=filas.reduce((a,x)=>a+x.v,0);
    const tD=filas.reduce((a,x)=>a+x.d,0), tC=tV-tD;          // lista, descuento, cobrado
    const hayDesc=tD>0.5;                                     // la columna solo sale si hubo
    const dom=(peds||[]).reduce((a,p)=>{ const k=this._diaKey(p.creado_en);
      const en=caj==='dia'?k===hoyK:(caj==='mes'?k.slice(0,7)===mesK:k.slice(0,4)===anoK);
      return a+(en?(+p.domicilio||0):0); },0);
    const nomCaj=((CJ.find(c=>c[0]===caj)||[])[2]||''), conFP=caj==='dia';
    return `<h1 style="font-size:18px;margin-top:24px">Clientes y productos</h1>
      <div class="sub">Día y Mes muestran clientes y productos · Año muestra solo productos</div>
      <div class="row" style="gap:10px;margin-bottom:12px;flex-wrap:wrap">${CJ.map(([k,t,sub,cl])=>`
        <div class="cajon ${caj===k?'on':''}" onclick="App._resProd=App._resProd==='${k}'?'':'${k}';App.vVentas()">
          <b>${money(tot(k))}</b>${t}<div style="font-size:11px;opacity:.75">${esc(sub)}</div>
          ${cl?`<div style="font-size:11.5px;font-weight:700;margin-top:2px">${esc(cl)}</div>`:''}</div>`).join('')}</div>
      ${!caj?'<div class="empty">👆 Toca Día o Mes para ver clientes y productos · Año muestra solo productos.</div>'
        :(caj==='ano'?'':this._clientesPeriodo(ventas,caj,segSet))+
        `<h1 style="font-size:17px;margin-top:20px">Productos · ${esc(nomCaj)}</h1>`+
        (filas.length?`<div class="tbwrap"><table class="tb" style="min-width:460px">
        <thead><tr><th style="min-width:190px">Producto</th>${conFP?'<th style="min-width:165px">Forma de pago</th>':''}<th style="text-align:right">Unidades</th><th style="text-align:right">Lista</th>${hayDesc?'<th style="text-align:right">Descuento</th>':''}<th style="text-align:right">Cobrado</th><th style="text-align:right">%</th></tr></thead>

      ${!caj?`<div class="empty">👆 Toca un cajón para abrirlo y ver sus gastos.</div>`:`
      ${this._tbFacturas(filas,{ro,cerrado,rubros:this.CATGASTO,vacio:`Este cajón no tiene gastos en ${esc(nom)}. Dale a <b>＋ Nuevo gasto</b> y escoge su rubro.`,
        titulo:caj==='todos'?'TOTALES DEL MES':'TOTALES DE '+esc(nomCaj).toUpperCase(),tBase,tIva,total,pagado,pend})}
      ${filas.length?`<h1 style="font-size:17px;margin-top:20px">Resumen por rubro</h1>

      <div class="hint">Cada casilla se guarda sola al salir de ella. Si pones <b>¿IVA? = Sí</b> y dejas el IVA vacío, lo calcula al ${this.IVAPCT}% y suma el Total; el Total lo puedes sobrescribir a mano cuando la factura traiga algo no gravado. Al cerrar el mes, el total pasa al Dashboard y la tabla se bloquea.</div>`);
  },

  gasSuma(){ const s=f=>{let t=0;document.querySelectorAll('#main [data-f="'+f+'"]').forEach(i=>t+=+i.value||0);return t;};

  async gasCell(id,campo,val){ const g=(this._gastos||[]).find(x=>x.id===id); if(!g)return; let v;
    if(campo==='pagado'&&val==='borrar') return this.gasDel(id);
    if(campo==='monto'||campo==='base'||campo==='iva')v=+val||0;
    else if(campo==='pagado'||campo==='tiene_iva')v=(val==='true');
    else if(campo==='fecha'||campo==='fecha_pago')v=val||null;
    else v=String(val||'').trim();
    g[campo]=v; const patch={[campo]:v};
    if(campo==='tiene_iva'||campo==='base'||campo==='iva'){
      if(campo==='tiene_iva'&&!v){ g.iva=0; patch.iva=0; }

      ${dias.length?dias.map(k=>{const l=porDia[k].slice().sort((a,b)=>String(a.inicio).localeCompare(String(b.inicio)));
        const d=new Date(k+'T12:00:00');
        return `<div class="item"><div class="top"><div><div class="nm">${esc(this.DOWC[d.getDay()])} ${d.getDate()} de ${esc((this.MESNOM[d.getMonth()+1]||'').toLowerCase())}</div>
          <div class="mt">${l.length} sesión(es)</div></div>
          <div class="nm" style="color:var(--acc)">${this._hhmm(minDe(l))}</div></div>
          ${l.map((a,i)=>`<div class="row" style="justify-content:space-between;font-size:12.5px;padding:3px 0;border-top:1px solid var(--line2)">
            <span>${i+1}ª · ${a.tipo==='Virtual'?'💻':'🏠'} ${esc(a.cliente||'—')} <small class="dim">${esc(this._hora(a.inicio))} → ${esc(this._hora(a.fin))}</small></span>
            <span style="white-space:nowrap"><b>${this._hhmm(this._aseMin(a))}</b>
              <a onclick="App.aseManual('${a.id}')" style="color:var(--acc);cursor:pointer;margin-left:7px">✎</a>
              <a onclick="App.aseDel('${a.id}')" style="color:var(--bad);cursor:pointer;margin-left:3px">✕</a></span></div>`).join('')}
        </div>`;}).join(''):'<div class="empty">Todavía no hay asesorías registradas.</div>'}`;
  },
  copiarSQLAse(){ const s=this.SQLASE.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(()=>toast('SQL copiado'),()=>toast('Cópialo a mano'));
    else toast('Selecciónalo y cópialo'); },
  async aseIniciar(){ const cli=($('ase_cli')?$('ase_cli').value:'').trim(), tipo=$('ase_tipo')?$('ase_tipo').value:'Presencial';
    const r=await POST('kruh_asesorias',{cliente:cli,tipo,inicio:new Date().toISOString()});
    if(!r){ toast('⚠️ No se pudo iniciar'); return; }
    toast('▶ Asesoría iniciada'); this.vUsuarios(); },
  async aseTerminar(id){ const r=await PATCH('kruh_asesorias?id=eq.'+id,{fin:new Date().toISOString()});
    if(r&&!r.ok){ toast('⚠️ No se pudo cerrar la sesión'); return; }
    if(this._aseTick){clearInterval(this._aseTick);this._aseTick=null;}
    toast('⏹ Sesión guardada'); this.vUsuarios(); },
  async aseDel(id){ if(!this._okBorrar())return; await DEL('kruh_asesorias?id=eq.'+id); this.vUsuarios(); },
  aseManual(id){ const a=id?((this._ase||[]).find(x=>x.id===id)||{}):{};
    const f=a.inicio?this._diaKey(a.inicio):this._diaKey(new Date());
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:8px">${id?'Editar':'Registrar'} sesión de asesoría</h3>
      <div class="g2"><div><label>Cliente</label><input id="am_cli" value="${esc(a.cliente||'')}"></div>
      <div><label>Tipo</label><select id="am_tipo">${this.ASETIPO.map(t=>`<option ${a.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
      <label>Fecha</label><input id="am_fecha" type="date" value="${esc(f)}">
      <div class="g2"><div><label>Hora de inicio</label><input id="am_ini" type="time" value="${esc(a.inicio?this._hora(a.inicio):'')}"></div>
      <div><label>Hora de fin</label><input id="am_fin" type="time" value="${esc(a.fin?this._hora(a.fin):'')}"></div></div>
      <label>Nota</label><input id="am_nota" value="${esc(a.nota||'')}">
      <div class="hint">Ejemplo: de 11:20 a 14:40 son 3h 20m. Si la sesión pasa de medianoche, regístrala como dos.</div>
      <button class="btn acc full" onclick="App.aseManualSave('${id||''}')">Guardar sesión</button>`); },
  async aseManualSave(id){ const f=$('am_fecha').value, hi=$('am_ini').value, hf=$('am_fin').value;
    if(!f||!hi||!hf){ alert('Necesito la fecha y las dos horas'); return; }
    const ini=new Date(f+'T'+hi+':00'), fin=new Date(f+'T'+hf+':00');
    if(fin<=ini){ alert('La hora de fin debe ser posterior a la de inicio'); return; }
    const b={cliente:$('am_cli').value.trim(),tipo:$('am_tipo').value,inicio:ini.toISOString(),fin:fin.toISOString(),nota:$('am_nota').value.trim()};
    const r=id?await PATCH('kruh_asesorias?id=eq.'+id,b):await POST('kruh_asesorias',b);
    if(!r||(r.ok===false)){ toast('⚠️ No se pudo guardar'); return; }
    cerrar(); toast('Sesión guardada · '+this._hhmm((fin-ini)/60000)); this.vUsuarios(); },
  async permGuardar(){ const RMAT=['cajera','panadero','bodeguero','chef'], nuevo={}; RMAT.forEach(r=>nuevo[r]=[]);
    document.querySelectorAll('#main input[data-rol]').forEach(i=>{ if(i.checked)nuevo[i.dataset.rol].push(i.dataset.mod); });
    for(const r of RMAT){ await fetch(SB+'/rest/v1/kruh_permisos?on_conflict=rol',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({rol:r,tabs:nuevo[r],actualizado:new Date().toISOString()})}); }
    this._permisos=Object.assign(this._permisos||{},nuevo); toast('Permisos guardados'); },
  usModal(id){ const u=(this._us||[]).find(x=>x.id===id)||{};
    modal(`<h3 style="font-family:Fraunces,serif;margin-bottom:8px">${id?'Editar':'Nuevo'} usuario</h3>
      <div class="g2"><div><label>Nombre</label><input id="u_nom" value="${esc(u.nombre||'')}"></div>
      <div><label>Rol</label><select id="u_rol">${this.ROLES.map(r=>`<option value="${r}" ${u.rol===r?'selected':''}>${r.charAt(0).toUpperCase()+r.slice(1)}</option>`).join('')}</select></div></div>
      <label>Clave de acceso</label><input id="u_clave" value="${esc(u.clave||'')}">
      <label>Atribuciones (qué puede hacer)</label><textarea id="u_atr" placeholder="Ej: maneja pedidos e inventario, no borra">${esc(u.atribuciones||'')}</textarea>
      <label>¿Activo?</label><select id="u_act"><option value="true" ${u.activo!==false?'selected':''}>Sí</option><option value="false" ${u.activo===false?'selected':''}>No</option></select>
      <button class="btn acc full" onclick="App.usSave('${id||''}')">Guardar</button>
      ${id?`<button class="btn gh full" style="color:var(--bad)" onclick="App.usDel('${id}')">Eliminar</button>`:''}`); },
  async usSave(id){ const b={nombre:$('u_nom').value.trim(),rol:$('u_rol').value,clave:$('u_clave').value.trim(),atribuciones:$('u_atr').value.trim(),activo:$('u_act').value==='true'};
    if(!b.nombre||!b.clave){alert('Nombre y clave son obligatorios');return;} if(id)await PATCH('kruh_usuarios?id=eq.'+id,b); else await POST('kruh_usuarios',b); cerrar(); toast('Usuario guardado'); this.vUsuarios(); },
  async usDel(id){ if(!this._okBorrar())return; await DEL('kruh_usuarios?id=eq.'+id); cerrar(); this.vUsuarios(); },
};
window.addEventListener('DOMContentLoaded',()=>App.init());
</script>
